<svg xmlns="http://www.w3.org/2000/svg" width="860" height="680" viewBox="0 0 860 680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="arrow-feed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
  </defs>
  <rect width="860" height="680" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#e0e4f0">Cascades 优化器搜索流程</text>

  <!-- 输入 -->
  <rect x="60" y="66" width="130" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="125" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">QueryPlan</text>
  <text x="125" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">逻辑计划树</text>
  <path d="M125,114 L125,138" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="135" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">initMemo</text>

  <!-- Memo -->
  <rect x="40" y="142" width="260" height="118" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="170" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e0e4f0">Memo</text>
  <text x="170" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9aa3c7">Group: 等价表达式集合</text>
  <text x="170" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9aa3c7">GroupExpression: Step + 子 Group</text>
  <text x="170" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9aa3c7">lowest_cost_expressions (按 Property)</text>
  <text x="170" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9aa3c7">statistics · equivalences · rule_mask</text>

  <!-- TaskStack 循环 -->
  <text x="600" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#b388ff">TaskStack 循环（while 栈非空）</text>
  <rect x="380" y="172" width="150" height="52" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="455" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">OptimizeGroup</text>
  <text x="455" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">检查 cost 上下界</text>
  <rect x="560" y="172" width="150" height="52" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="635" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">OptimizeExpression</text>
  <text x="635" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">构造 valid rules</text>
  <rect x="740" y="172" width="100" height="52" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="790" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e4f0">ApplyRule</text>
  <text x="790" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">transform</text>

  <path d="M530,198 L560,198" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M710,198 L740,198" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ApplyRule -> 回写 Memo (插入新表达式) -->
  <path d="M790,224 L790,300 L170,300 L170,260" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="293" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">插入新 GroupExpression（去重）</text>

  <!-- OptimizeInput -->
  <rect x="560" y="330" width="280" height="56" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="700" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">OptimizeInput</text>
  <text x="700" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">算 cost · 匹配/enforce Property · 更新 Winner</text>
  <path d="M790,224 L790,330" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 代价/基数/Property 供给 -->
  <rect x="380" y="330" width="150" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="455" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e4f0">CostCalculator</text>
  <text x="455" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">CardinalityEstimator</text>
  <path d="M530,358 L560,358" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-feed)"/>
  <rect x="380" y="400" width="150" height="48" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="455" y="422" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e0e4f0">PropertyMatcher</text>
  <text x="455" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">PropertyEnforcer (Exchange)</text>
  <path d="M530,424 L620,386" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-feed)"/>

  <!-- 循环回 OptimizeGroup -->
  <path d="M700,386 L700,470 L455,470 L455,224" fill="none" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-loop)"/>
  <text x="578" y="486" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ff6b9d">pop 下一 task / 子 Group 优化</text>

  <!-- 产出 -->
  <path d="M170,260 L170,520" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="400" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">getBestExpression</text>
  <rect x="60" y="524" width="220" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="170" y="546" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">buildPlanNode(Winner)</text>
  <text x="170" y="565" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">递归提取最优物理计划</text>
  <path d="M170,580 L170,608" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="612" width="180" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="170" y="642" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">optimized QueryPlan</text>

  <!-- 注 -->
  <text x="340" y="640" font-family="system-ui, sans-serif" font-size="11" fill="#6a708f">上限：10000 个 Group / 100000 个 task；超时由 cascades_optimizer_timeout 控制；</text>
  <text x="340" y="658" font-family="system-ui, sans-serif" font-size="11" fill="#6a708f">enable_cbo=false 时 cost 恒 0，退化为规则驱动。</text>
</svg>
