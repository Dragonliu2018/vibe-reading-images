<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#0b0d14"/>
  <text x="470" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#e0e4f0">查询执行数据流（SELECT）</text>

  <!-- Client -->
  <rect x="20" y="88" width="116" height="104" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="78" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">Client</text>
  <text x="78" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">SQL</text>
  <text x="78" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">HTTP/MySQL</text>

  <!-- Server -->
  <rect x="168" y="88" width="156" height="104" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="246" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">Server (cnch_server)</text>
  <text x="246" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">parse → AST</text>
  <text x="246" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">PlanOptimizer</text>
  <text x="246" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">(Cascades CBO)</text>
  <text x="246" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">PlanSegmentSplitter</text>

  <!-- MPPScheduler -->
  <rect x="396" y="88" width="142" height="104" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="467" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">MPPScheduler</text>
  <text x="467" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">按 DAG 调度</text>
  <text x="467" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">brpc 异步下发</text>

  <!-- Worker -->
  <rect x="574" y="88" width="156" height="104" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="652" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">Worker</text>
  <text x="652" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">PlanSegmentExecutor</text>
  <text x="652" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">buildPipeline</text>
  <text x="652" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">多线程执行</text>
  <text x="652" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">StorageCloudMergeTree</text>

  <!-- Storage -->
  <rect x="778" y="88" width="142" height="104" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="849" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">共享存储 + 缓存</text>
  <text x="849" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">DiskByteS3 / HDFS</text>
  <text x="849" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">DiskCacheWrapper</text>

  <!-- Catalog 旁路 -->
  <rect x="300" y="260" width="300" height="44" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="450" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e4f0">Catalog (FoundationDB)</text>
  <text x="450" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c7">表 / part 元数据 · MVCC 可见性过滤</text>

  <!-- 正向箭头（水平，在框之间空隙走） -->
  <path d="M136,140 L168,140" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M324,140 L396,140" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3c7">PlanSegment</text>
  <path d="M538,140 L574,140" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3c7">brpc</text>
  <path d="M730,140 L778,140" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="754" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3c7">读 part</text>

  <!-- 旁路箭头: Server → Catalog -->
  <path d="M246,192 L246,282 L300,282" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-yellow)"/>
  <text x="254" y="234" font-family="system-ui, sans-serif" font-size="10" fill="#f9ca24">取元数据</text>
  <!-- 旁路箭头: Worker → Catalog -->
  <path d="M652,192 L652,282 L600,282" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-yellow)"/>
  <text x="660" y="234" font-family="system-ui, sans-serif" font-size="10" fill="#f9ca24">回访取 part</text>

  <!-- 回传箭头: Storage → Worker → ... → Client -->
  <path d="M849,192 L849,360 L78,360 L78,192" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrow-ret)"/>
  <text x="464" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4ecdc4">Block 流经 Exchange 回传 → Server final segment 本地聚合 → 返回 Client</text>

  <!-- 注释 -->
  <text x="20" y="395" font-family="system-ui, sans-serif" font-size="11" fill="#6a708f">注：final segment 在 server 本地执行（lazyExecutePlanSegmentLocally），并非全部下发 worker；worker 用 StorageCloudMergeTree 读 part。</text>
</svg>
