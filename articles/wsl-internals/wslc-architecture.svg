<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="system-ui, sans-serif">
  <rect width="780" height="420" fill="#0b0d14"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/></marker>
  </defs>
  <!-- Layer 1: CLI client -->
  <text x="40" y="40" fill="#4ecdc4" font-size="12">① CLI 客户端 wslc.exe（user）</text>
  <rect x="220" y="50" width="340" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="75" fill="#e6e6e6" font-size="13" text-anchor="middle">Command 树 / Task 链 / Service</text>

  <!-- Layer 2: wslservice -->
  <text x="40" y="140" fill="#6c8ef5" font-size="12">② SYSTEM 服务 wslservice.exe</text>
  <rect x="220" y="150" width="340" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="390" y="175" fill="#e6e6e6" font-size="13" text-anchor="middle">WSLCSessionManager（会话+安全）</text>

  <!-- Layer 3: wslcsession -->
  <text x="40" y="240" fill="#b388ff" font-size="12">③ 会话运行时 wslcsession.exe（per-user）</text>
  <rect x="120" y="250" width="220" height="40" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="230" y="275" fill="#e6e6e6" font-size="13" text-anchor="middle">WSLCSession（独立 VM）</text>
  <rect x="360" y="250" width="220" height="40" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="470" y="275" fill="#e6e6e6" font-size="13" text-anchor="middle">DockerHTTPClient + IORelay</text>

  <!-- Layer 4: dockerd -->
  <text x="40" y="340" fill="#ff6b9d" font-size="12">④ VM 内</text>
  <rect x="220" y="350" width="340" height="40" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="390" y="375" fill="#e6e6e6" font-size="13" text-anchor="middle">containerd + dockerd（Docker Engine REST API）</text>

  <path d="M390,90 L390,148" stroke="#6c8ef5" stroke-width="1.5" fill="none" marker-end="url(#ab)"/><text x="400" y="123" fill="#6c8ef5" font-size="11">COM IWSLCSessionManager</text>
  <path d="M390,190 L390,248" stroke="#b388ff" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="400" y="223" fill="#b388ff" font-size="11">COM per-user（CoCreateInstanceAsUser）</text>
  <path d="M390,290 L390,348" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#ap)"/><text x="400" y="323" fill="#ff6b9d" font-size="11">HTTP over AF_HYPERV</text>
  <text x="40" y="410" fill="#7a86b3" font-size="11">每会话独立 VM + 独立 dockerd：安全/故障/资源隔离</text>
</svg>
