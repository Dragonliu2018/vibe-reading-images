<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="system-ui, sans-serif">
  <rect width="780" height="380" fill="#0b0d14"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/></marker>
  </defs>
  <rect x="290" y="25" width="200" height="34" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="47" fill="#e6e6e6" font-size="13" text-anchor="middle">WslClient::Main（入口分发）</text>
  <rect x="290" y="85" width="200" height="34" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="107" fill="#e6e6e6" font-size="13" text-anchor="middle">SvcComm（COM 外观）</text>

  <!-- IO relay branch (left) -->
  <text x="60" y="150" fill="#4ecdc4" font-size="12">IO 中继层</text>
  <rect x="60" y="160" width="200" height="34" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="160" y="182" fill="#e6e6e6" font-size="13" text-anchor="middle">relay::StandardInputRelay</text>
  <rect x="60" y="215" width="200" height="34" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="160" y="237" fill="#e6e6e6" font-size="13" text-anchor="middle">io::MultiHandleWait</text>
  <rect x="60" y="270" width="200" height="34" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="160" y="292" fill="#e6e6e6" font-size="13" text-anchor="middle">HandleIO（IO 句柄层）</text>

  <!-- interop branch (right) -->
  <text x="520" y="150" fill="#ff6b9d" font-size="12">互操作层</text>
  <rect x="520" y="160" width="200" height="34" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="620" y="182" fill="#e6e6e6" font-size="13" text-anchor="middle">interop::VmModeWorker</text>
  <rect x="520" y="215" width="200" height="34" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="620" y="237" fill="#e6e6e6" font-size="13" text-anchor="middle">CreateProcessVmMode</text>
  <rect x="520" y="270" width="200" height="34" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="620" y="292" fill="#e6e6e6" font-size="13" text-anchor="middle">SpawnWslHost（接管）</text>

  <!-- support (bottom) -->
  <rect x="290" y="200" width="200" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="390" y="222" fill="#e6e6e6" font-size="13" text-anchor="middle">Config（.wslconfig）</text>
  <rect x="290" y="250" width="200" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="390" y="272" fill="#e6e6e6" font-size="13" text-anchor="middle">ExecutionContext</text>

  <path d="M390,59 L390,83" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M340,119 L160,160" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#ac)"/>
  <path d="M440,119 L620,160" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#ap)"/>
  <path d="M390,119 L390,200" stroke="#f9ca24" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>
  <text x="40" y="345" fill="#7a86b3" font-size="11">左：按句柄类型分流的 IO 中继 · 右：Linux↔Windows 进程互操作 · 下：配置与错误</text>
</svg>
