<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="system-ui, sans-serif">
  <rect width="760" height="380" fill="#0b0d14"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/></marker>
    <marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b388ff"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/></marker>
  </defs>

  <!-- shared protocol hub (top center) -->
  <rect x="300" y="30" width="160" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="380" y="53" fill="#e6e6e6" font-size="13" text-anchor="middle">shared/inc 协议层</text>

  <!-- clients + common (row 2) -->
  <rect x="40" y="120" width="120" height="34" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="100" y="142" fill="#e6e6e6" font-size="13" text-anchor="middle">wsl.exe</text>
  <rect x="180" y="120" width="140" height="34" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="250" y="142" fill="#e6e6e6" font-size="13" text-anchor="middle">wslc 容器 CLI</text>
  <rect x="440" y="120" width="160" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="520" y="142" fill="#e6e6e6" font-size="13" text-anchor="middle">common 公共运行库</text>

  <!-- modules (row 3) -->
  <rect x="40" y="250" width="170" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="125" y="273" fill="#e6e6e6" font-size="13" text-anchor="middle">WslService 服务核心</text>
  <rect x="300" y="250" width="180" height="36" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="390" y="273" fill="#e6e6e6" font-size="13" text-anchor="middle">Linux 初始化子系统</text>
  <rect x="540" y="250" width="160" height="36" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="620" y="273" fill="#e6e6e6" font-size="13" text-anchor="middle">Plan9 文件服务</text>

  <!-- arrows -->
  <!-- wsl.exe -> common -->
  <path d="M100,154 Q100,180 460,120" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <!-- wslc -> common -->
  <path d="M250,154 Q300,170 440,137" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <!-- common -> shared/inc -->
  <path d="M520,120 L460,66" stroke="#f9ca24" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>
  <!-- common -> WslService (SvcComm COM) -->
  <path d="M480,154 Q300,200 125,250" stroke="#6c8ef5" stroke-width="1.5" fill="none" marker-end="url(#ab)"/><text x="300" y="205" fill="#6c8ef5" font-size="11">COM（SvcComm）</text>
  <!-- clients -> WslService direct COM -->
  <path d="M100,154 L110,250" stroke="#6c8ef5" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <!-- WslService -> Linux init (hvsocket) -->
  <path d="M210,268 L300,268" stroke="#b388ff" stroke-width="1.5" fill="none" marker-end="url(#au)"/><text x="255" y="261" fill="#b388ff" font-size="11">hvsocket</text>
  <!-- Linux init -> Plan9 (fork+exec) -->
  <path d="M480,268 L540,268" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#ap)"/><text x="510" y="261" fill="#ff6b9d" font-size="11">fork</text>
  <!-- WslService -> shared/inc -->
  <path d="M125,250 Q125,90 300,48" stroke="#f9ca24" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>
  <!-- Linux init -> shared/inc -->
  <path d="M390,250 Q390,140 410,66" stroke="#f9ca24" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>

  <text x="40" y="345" fill="#7a86b3" font-size="11">箭头=使用/调用方向 · 黄=协议共享 · 蓝=COM · 紫=hvsocket · 粉=fork+exec</text>
</svg>
