<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="system-ui, sans-serif">
  <rect width="780" height="400" fill="#0b0d14"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/></marker>
    <marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b388ff"/></marker>
  </defs>
  <!-- start -->
  <rect x="60" y="30" width="180" height="34" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="150" y="52" fill="#e6e6e6" font-size="13" text-anchor="middle">init → plan9（启动）</text>

  <!-- dispatch + connection -->
  <text x="40" y="110" fill="#ff6b9d" font-size="12">派发与连接</text>
  <rect x="60" y="120" width="180" height="34" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="150" y="142" fill="#e6e6e6" font-size="13" text-anchor="middle">Handler（派发+fid表）</text>
  <rect x="60" y="170" width="180" height="34" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="150" y="192" fill="#e6e6e6" font-size="13" text-anchor="middle">HandleConnections / Run</text>

  <!-- filesystem abstraction -->
  <text x="290" y="110" fill="#f9ca24" font-size="12">文件抽象</text>
  <rect x="290" y="120" width="160" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="370" y="142" fill="#e6e6e6" font-size="13" text-anchor="middle">Fid（纯虚基类）</text>
  <rect x="290" y="170" width="160" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="370" y="192" fill="#e6e6e6" font-size="13" text-anchor="middle">File / XAttr</text>
  <rect x="290" y="220" width="160" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="370" y="242" fill="#e6e6e6" font-size="13" text-anchor="middle">Root / Share</text>

  <!-- async IO -->
  <text x="510" y="110" fill="#b388ff" font-size="12">异步基础设施</text>
  <rect x="510" y="120" width="200" height="34" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="610" y="142" fill="#e6e6e6" font-size="13" text-anchor="middle">Scheduler（C++20 协程）</text>
  <rect x="510" y="170" width="200" height="34" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="610" y="192" fill="#e6e6e6" font-size="13" text-anchor="middle">EpollWatcher + aio Issuer</text>
  <rect x="510" y="220" width="200" height="34" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="610" y="242" fill="#e6e6e6" font-size="13" text-anchor="middle">SpanReader / SpanWriter</text>

  <!-- syscall -->
  <rect x="290" y="300" width="420" height="34" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="500" y="322" fill="#e6e6e6" font-size="13" text-anchor="middle">Linux syscall（openat / fstatat / aio_read …）</text>

  <path d="M150,64 L150,118" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M150,154 L150,168" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#ap)"/>
  <path d="M240,187 L288,187" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M370,154 L370,168" stroke="#f9ca24" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>
  <path d="M370,204 L370,218" stroke="#f9ca24" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>
  <path d="M450,187 L508,142" stroke="#b388ff" stroke-width="1.5" fill="none" marker-end="url(#au)"/>
  <path d="M370,254 L450,300" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M610,254 L550,300" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="40" y="370" fill="#7a86b3" font-size="11">libplan9 静态库链接进 init · T-message 经 Handler dispatch 到 Fid/File 调 syscall</text>
</svg>
