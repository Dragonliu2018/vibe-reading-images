<text x="210.0" y="464.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">simpleCAllocator（C 分配器）</text>
<text x="210.0" y="480.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">绕开 Go GC 扫描压力</text>
<line x1="210" y1="410" x2="210" y2="430" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460" y="356" width="300" height="54" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="610.0" y="372.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e6e9f5" font-weight="600">proc.Mp()</text>
<text x="610.0" y="390.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">所有算子内存的唯一出口</text>
<text x="610.0" y="406.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">Pipeline.Cleanup 错误路径也归还</text>
<path d="M460,383 L380,383" fill="none" stroke="#b388ff" stroke-width="1.5" marker-end="url(#arrowp)"/>
<text x="400" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b93b8">Vector 是"无主内存"：谁创建谁 Free(mp)；ToSlice[T] 泛型零拷贝读列</text>
