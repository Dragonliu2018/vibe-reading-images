<rect width="800" height="600" fill="#0b0d14"/>
<text x="400.0" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#e6e9f5">Vector / Batch / mpool：自研列式容器与内存记账</text>
