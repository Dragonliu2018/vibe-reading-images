<rect x="40" y="222" width="300" height="44" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="190.0" y="241.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e6e9f5" font-weight="600">nsp / gsp</text>
<text x="190.0" y="259.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">null / grouping 位图</text>
<text x="610" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4ecdc4" font-weight="600">Batch</text>
