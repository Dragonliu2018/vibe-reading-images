<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arroww" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b388ff"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="520" fill="#0b0d14"/>
  <text x="460" y="30" text-anchor="middle" font-size="16" fill="#e8ecf5" font-weight="bold">Segment 列模型（写 / 读双路径）</text>

  <!-- DataSegment metadata -->
  <rect x="300" y="50" width="320" height="56" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="2"/>
  <text x="460" y="74" text-anchor="middle" font-size="13" fill="#e8ecf5">DataSegment（不可变元数据）</text>
  <text x="460" y="92" text-anchor="middle" font-size="9" fill="#9aa3c7">interval · version · shardSpec · loadSpec · Overshadowable</text>

  <!-- Write branch -->
  <rect x="40" y="136" width="400" height="44" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="240" y="163" text-anchor="middle" font-size="12" fill="#e8ecf5">写入：Appenderator.add → IncrementalIndex</text>

  <rect x="40" y="200" width="400" height="56" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="240" y="224" text-anchor="middle" font-size="12" fill="#e8ecf5">ConcurrentSkipListMap</text>
  <text x="240" y="246" text-anchor="middle" font-size="9" fill="#9aa3c7">key=时间+维度编码 · value=Aggregator[]</text>

  <rect x="40" y="280" width="400" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="240" y="307" text-anchor="middle" font-size="12" fill="#e8ecf5">IndexMerger.persist / merge → segment 文件</text>

  <!-- Read branch -->
  <rect x="480" y="136" width="400" height="44" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="680" y="163" text-anchor="middle" font-size="12" fill="#e8ecf5">读取：QueryableIndex → ColumnHolder[]</text>

  <rect x="480" y="200" width="400" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="680" y="224" text-anchor="middle" font-size="12" fill="#e8ecf5">BaseColumn（能力查询 as()）</text>
  <text x="680" y="246" text-anchor="middle" font-size="9" fill="#9aa3c7">Dictionary/Long/Nested · Capable 三态</text>

  <rect x="480" y="280" width="190" height="44" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="575" y="300" text-anchor="middle" font-size="11" fill="#e8ecf5">makeColumnValueSelector</text>
  <text x="575" y="316" text-anchor="middle" font-size="9" fill="#9aa3c7">逐行（DimensionSelector）</text>
  <rect x="690" y="280" width="190" height="44" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="785" y="300" text-anchor="middle" font-size="11" fill="#e8ecf5">makeVectorValueSelector</text>
  <text x="785" y="316" text-anchor="middle" font-size="9" fill="#9aa3c7">向量化（batch）</text>

  <!-- write side arrows -->
  <path d="M380,106 L240,136" stroke="#b388ff" stroke-width="1.5" marker-end="url(#arroww)"/>
  <path d="M240,180 L240,200" stroke="#b388ff" stroke-width="1.5" marker-end="url(#arroww)"/>
  <path d="M240,256 L240,280" stroke="#b388ff" stroke-width="1.5" marker-end="url(#arroww)"/>

  <!-- read side arrows -->
  <path d="M540,106 L680,136" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arrowr)"/>
  <path d="M680,180 L680,200" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arrowr)"/>
  <path d="M640,256 L575,280" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arrowr)"/>
  <path d="M720,256 L785,280" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arrowr)"/>

  <!-- SPI bar -->
  <rect x="40" y="360" width="840" height="48" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="460" y="382" text-anchor="middle" font-size="12" fill="#e8ecf5">SPI：DataSegmentPusher / Mover / Killer / Archiver · SegmentizerFactory · SegmentWriteOutMedium</text>
  <text x="460" y="398" text-anchor="middle" font-size="9" fill="#9aa3c7">@ExtensionPoint · 扩展模块（S3 / HDFS / Azure …）实现</text>

  <!-- write arrow to SPI -->
  <path d="M240,324 L240,360" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="430" font-size="9" fill="#6b7595">不可变 segment → mmap 高效读 · 版本覆盖（overshadow）替代原子删除</text>
</svg>
