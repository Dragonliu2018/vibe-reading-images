<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrows" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="560" fill="#0b0d14"/>
  <text x="460" y="30" text-anchor="middle" font-size="16" fill="#e8ecf5" font-weight="bold">查询执行数据流（Broker fan-out → Historical）</text>

  <!-- Client -->
  <rect x="165" y="46" width="160" height="42" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="245" y="72" text-anchor="middle" font-size="13" fill="#e8ecf5">Client（POST /druid/v2/）</text>

  <!-- Broker container -->
  <rect x="40" y="106" width="410" height="418" rx="8" fill="none" stroke="#6c8ef5" stroke-width="1" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="52" y="122" font-size="11" fill="#6c8ef5" font-weight="bold">Broker</text>

  <!-- Historical container -->
  <rect x="500" y="232" width="390" height="150" rx="8" fill="none" stroke="#b388ff" stroke-width="1" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="512" y="248" font-size="11" fill="#b388ff" font-weight="bold">Historical ×N</text>

  <!-- Broker nodes (40px tall, 26px gaps => arrows >=26px) -->
  <rect x="70" y="116" width="350" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="245" y="141" text-anchor="middle" font-size="12" fill="#e8ecf5">QueryResource.doPost</text>

  <rect x="70" y="182" width="350" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="245" y="200" text-anchor="middle" font-size="12" fill="#e8ecf5">QueryLifecycle</text>
  <text x="245" y="218" text-anchor="middle" font-size="9" fill="#9aa3c7">initialize → authorize → execute</text>

  <rect x="70" y="248" width="350" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="245" y="273" text-anchor="middle" font-size="12" fill="#e8ecf5">CachingClusteredClient</text>

  <rect x="70" y="404" width="350" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="245" y="420" text-anchor="middle" font-size="12" fill="#e8ecf5">merge</text>
  <text x="245" y="438" text-anchor="middle" font-size="9" fill="#9aa3c7">MergeSequence / CombiningSequence（惰性）</text>

  <rect x="70" y="470" width="350" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="245" y="495" text-anchor="middle" font-size="12" fill="#e8ecf5">QueryResultPusher（流式输出）</text>

  <!-- Historical box -->
  <rect x="520" y="255" width="350" height="120" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="695" y="283" text-anchor="middle" font-size="12" fill="#e8ecf5">ServerManager.getQueryRunnerForSegments</text>
  <text x="695" y="309" text-anchor="middle" font-size="12" fill="#e8ecf5">ChainedExecutionQueryRunner</text>
  <text x="695" y="335" text-anchor="middle" font-size="11" fill="#e8ecf5">Segment → Sequence&lt;T&gt;</text>
  <text x="695" y="361" text-anchor="middle" font-size="9" fill="#9aa3c7">per-segment 并行（QueryProcessingPool）</text>

  <!-- Broker internal arrows (all >=26px) -->
  <path d="M245,88 L245,116" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M245,156 L245,182" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M245,222 L245,248" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M245,444 L245,470" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- fan-out: CachingClusteredClient -> Historical -->
  <path d="M420,268 L520,268" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrows)"/>
  <text x="470" y="260" text-anchor="middle" font-size="9" fill="#4ecdc4">HTTP fan-out ×N</text>

  <!-- stream back: Historical -> merge (L-path) -->
  <path d="M520,330 L485,330 L485,424 L420,424" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrows)"/>
  <text x="492" y="385" font-size="9" fill="#4ecdc4">Sequence 流式回传</text>

  <!-- return to Client (L-path on left margin) -->
  <path d="M70,490 L30,490 L30,67 L165,67" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrows)"/>
  <text x="48" y="300" font-size="9" fill="#4ecdc4">流式响应</text>

  <text x="60" y="548" font-size="9" fill="#6b7595">全链路 Sequence&lt;T&gt; 惰性流 · 第一行触发 HTTP 200，逐行序列化写出</text>
</svg>
