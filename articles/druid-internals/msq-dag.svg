<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#80c7ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="500" fill="#0b0d14"/>
  <text x="460" y="30" text-anchor="middle" font-size="16" fill="#e8ecf5" font-weight="bold">MSQ 多阶段执行 DAG</text>

  <!-- top: SQL -> MSQSpec -> QueryDefinition -->
  <rect x="40" y="52" width="150" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="115" y="77" text-anchor="middle" font-size="12" fill="#e8ecf5">SQL</text>
  <rect x="230" y="52" width="170" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="315" y="77" text-anchor="middle" font-size="12" fill="#e8ecf5">MSQSpec</text>
  <rect x="440" y="52" width="200" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="540" y="77" text-anchor="middle" font-size="12" fill="#e8ecf5">QueryDefinition（DAG）</text>
  <path d="M190,72 L230,72" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400,72 L440,72" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Controller kernel -->
  <rect x="690" y="48" width="210" height="80" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="2"/>
  <text x="795" y="70" text-anchor="middle" font-size="12" fill="#e8ecf5">ControllerQueryKernel</text>
  <text x="795" y="88" text-anchor="middle" font-size="9" fill="#9aa3c7">纯状态机（不做 RPC / 不碰数据）</text>
  <text x="795" y="106" text-anchor="middle" font-size="9" fill="#9aa3c7">inflow / outflow / pending</text>
  <text x="795" y="124" text-anchor="middle" font-size="9" fill="#9aa3c7">StageGroup · 容错重试</text>

  <!-- stage DAG -->
  <rect x="40" y="170" width="220" height="70" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="#e8ecf5">Stage 0：scan</text>
  <text x="150" y="222" text-anchor="middle" font-size="9" fill="#9aa3c7">读 segment / 外部源 · worker ×2</text>

  <rect x="350" y="170" width="220" height="70" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="460" y="200" text-anchor="middle" font-size="12" fill="#e8ecf5">Stage 1：aggregate</text>
  <text x="460" y="222" text-anchor="middle" font-size="9" fill="#9aa3c7">HASH shuffle · worker ×3</text>

  <rect x="660" y="170" width="220" height="70" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="770" y="200" text-anchor="middle" font-size="12" fill="#e8ecf5">Stage 2：final merge</text>
  <text x="770" y="222" text-anchor="middle" font-size="9" fill="#9aa3c7">GLOBAL_SORT / sink · worker ×1</text>

  <!-- stage arrows -->
  <path d="M260,205 L350,205" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="197" text-anchor="middle" font-size="9" fill="#9aa3c7">frame</text>
  <path d="M570,205 L660,205" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="197" text-anchor="middle" font-size="9" fill="#9aa3c7">frame</text>

  <!-- sink -->
  <rect x="660" y="290" width="220" height="48" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="770" y="312" text-anchor="middle" font-size="12" fill="#e8ecf5">sink：segment / export</text>
  <text x="770" y="328" text-anchor="middle" font-size="9" fill="#9aa3c7">publish（REPLACE / APPEND）</text>
  <path d="M770,240 L770,290" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- control arrows (dashed) -->
  <path d="M795,128 L150,170" stroke="#80c7ff" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowc)" opacity="0.7"/>
  <path d="M795,128 L460,170" stroke="#80c7ff" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowc)" opacity="0.7"/>
  <path d="M795,128 L770,170" stroke="#80c7ff" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowc)" opacity="0.7"/>
  <text x="430" y="150" font-size="9" fill="#80c7ff">调度 / 状态推进</text>

  <text x="40" y="470" font-size="9" fill="#6b7595">ShuffleKind：MIX / HASH（可流水线）/ HASH_LOCAL_SORT / GLOBAL_SORT（需 key statistics）</text>
  <text x="40" y="486" font-size="9" fill="#6b7595">输出通道：MEMORY（背压流水线）/ DURABLE（容错 · 中间结果落盘）</text>
</svg>
