  <rect x="269" y="132" width="111" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="324" y="162" text-anchor="middle" font-size="12" fill="#e8ecf5">Broker</text>
  <rect x="388" y="132" width="111" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="443" y="162" text-anchor="middle" font-size="12" fill="#e8ecf5">Coordinator</text>
  <rect x="507" y="132" width="111" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="562" y="162" text-anchor="middle" font-size="12" fill="#e8ecf5">Overlord</text>
