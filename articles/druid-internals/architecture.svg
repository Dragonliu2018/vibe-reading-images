<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="540" fill="#0b0d14"/>
  <text x="440" y="30" text-anchor="middle" font-size="16" fill="#e8ecf5" font-weight="bold">Apache Druid 分层架构</text>

  <!-- L1 接入层 #4ecdc4 -->
  <rect x="20" y="48" width="120" height="52" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="2"/>
  <text x="80" y="70" text-anchor="middle" font-size="12" fill="#4ecdc4" font-weight="bold">接入层</text>
  <text x="80" y="86" text-anchor="middle" font-size="9" fill="#4ecdc4">Access</text>
  <rect x="150" y="48" width="228" height="52" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="264" y="78" text-anchor="middle" font-size="13" fill="#e8ecf5">Web Console</text>
