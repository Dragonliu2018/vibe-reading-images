  <text x="80" y="406" text-anchor="middle" font-size="12" fill="#80c7ff" font-weight="bold">协调层</text>
  <text x="80" y="422" text-anchor="middle" font-size="9" fill="#80c7ff">Coordination</text>
  <rect x="150" y="384" width="228" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="264" y="406" text-anchor="middle" font-size="13" fill="#e8ecf5">数据均衡</text>
  <text x="264" y="424" text-anchor="middle" font-size="10" fill="#9aa3c7">Rules · Cost 模型</text>
  <rect x="390" y="384" width="228" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="504" y="406" text-anchor="middle" font-size="13" fill="#e8ecf5">任务调度</text>
  <text x="504" y="424" text-anchor="middle" font-size="10" fill="#9aa3c7">TaskRunner · Supervisor</text>
  <rect x="630" y="384" width="228" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="744" y="406" text-anchor="middle" font-size="13" fill="#e8ecf5">服务发现</text>
  <text x="744" y="424" text-anchor="middle" font-size="10" fill="#9aa3c7">Leader 选举 · ZK</text>

