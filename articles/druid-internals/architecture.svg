  <text x="80" y="490" text-anchor="middle" font-size="12" fill="#ff6b9d" font-weight="bold">存储后端</text>
  <text x="80" y="506" text-anchor="middle" font-size="9" fill="#ff6b9d">Backends</text>
  <rect x="150" y="468" width="228" height="52" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="264" y="490" text-anchor="middle" font-size="13" fill="#e8ecf5">Deep Storage</text>
  <text x="264" y="508" text-anchor="middle" font-size="10" fill="#9aa3c7">S3 · HDFS · GCS</text>
  <rect x="390" y="468" width="228" height="52" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="504" y="490" text-anchor="middle" font-size="13" fill="#e8ecf5">Metadata Storage</text>
  <text x="504" y="508" text-anchor="middle" font-size="10" fill="#9aa3c7">MySQL · PostgreSQL</text>
  <rect x="630" y="468" width="228" height="52" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="744" y="490" text-anchor="middle" font-size="13" fill="#e8ecf5">ZooKeeper</text>
  <text x="744" y="508" text-anchor="middle" font-size="10" fill="#9aa3c7">集群协调</text>

  <!-- 依赖箭头（上层调用下层） -->
  <path d="M320,184 L320,216" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M800,184 L800,216" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M264,268 L264,300" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M504,268 L504,300" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="860" y="534" text-anchor="end" font-size="9" fill="#6b7595">↓ 上层依赖 / 调用下层</text>
</svg>
