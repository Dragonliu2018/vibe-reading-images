  <text x="264" y="322" text-anchor="middle" font-size="13" fill="#e8ecf5">Segment</text>
  <text x="264" y="340" text-anchor="middle" font-size="10" fill="#9aa3c7">列式格式</text>
  <rect x="390" y="300" width="228" height="52" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="504" y="322" text-anchor="middle" font-size="13" fill="#e8ecf5">Column 模型</text>
  <text x="504" y="340" text-anchor="middle" font-size="10" fill="#9aa3c7">选择器 · 向量化</text>
  <rect x="630" y="300" width="228" height="52" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="744" y="322" text-anchor="middle" font-size="13" fill="#e8ecf5">IncrementalIndex</text>
  <text x="744" y="340" text-anchor="middle" font-size="10" fill="#9aa3c7">实时增量索引</text>

