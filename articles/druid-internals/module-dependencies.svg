<svg xmlns="http://www.w3.org/2000/svg" width="940" height="370" viewBox="0 0 940 370" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="370" fill="#0b0d14"/>
  <text x="470" y="28" text-anchor="middle" font-size="16" fill="#e8ecf5" font-weight="bold">Druid 模块依赖关系</text>

  <!-- Band A: bootstrap -->
  <rect x="350" y="50" width="240" height="50" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="470" y="80" text-anchor="middle" font-size="13" fill="#e8ecf5">节点启动与服务发现</text>

  <!-- Band B: services -->
  <rect x="30" y="175" width="100" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="80" y="204" text-anchor="middle" font-size="11" fill="#e8ecf5">Druid SQL</text>
  <rect x="160" y="175" width="100" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="210" y="204" text-anchor="middle" font-size="11" fill="#e8ecf5">服务运行时</text>
  <rect x="290" y="175" width="100" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="340" y="204" text-anchor="middle" font-size="11" fill="#e8ecf5">MSQ</text>
  <rect x="420" y="175" width="100" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="470" y="204" text-anchor="middle" font-size="11" fill="#e8ecf5">摄入引擎</text>
  <rect x="550" y="175" width="100" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="600" y="204" text-anchor="middle" font-size="11" fill="#e8ecf5">Overlord</text>
  <rect x="680" y="175" width="100" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="730" y="204" text-anchor="middle" font-size="11" fill="#e8ecf5">Coordinator</text>
  <rect x="810" y="175" width="100" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="860" y="204" text-anchor="middle" font-size="11" fill="#e8ecf5">扩展系统</text>

  <!-- Band C: kernel -->
  <rect x="30" y="300" width="360" height="50" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="329" text-anchor="middle" font-size="13" fill="#e8ecf5">查询引擎</text>
  <rect x="420" y="300" width="490" height="50" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="665" y="329" text-anchor="middle" font-size="13" fill="#e8ecf5">数据内核（Segment / Column / IncrementalIndex）</text>

  <!-- bootstrap -> services -->
  <path d="M470,100 L470,175" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="140" font-size="10" fill="#9aa3c7">Guice 装配</text>

  <!-- services -> kernel (left group -> 查询引擎) -->
  <path d="M80,225 L80,300" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M210,225 L210,300" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340,225 L340,300" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- services -> kernel (right group -> 数据内核) -->
  <path d="M470,225 L470,300" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600,225 L600,300" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M730,225 L730,300" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M860,225 L860,300" stroke="#9aa3c7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowd)"/>
  <text x="868" y="266" font-size="9" fill="#9aa3c7">实现 SPI</text>

  <!-- intra-tier horizontals -->
  <path d="M390,200 L420,200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="192" text-anchor="middle" font-size="9" fill="#9aa3c7">task</text>
  <path d="M390,325 L420,325" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="317" text-anchor="middle" font-size="9" fill="#9aa3c7">读列</text>

  <text x="40" y="362" font-size="9" fill="#6b7595">实线 = 编译期依赖 · 虚线 = 运行时 SPI 实现</text>
</svg>
