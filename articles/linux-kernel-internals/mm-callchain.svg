<svg xmlns="http://www.w3.org/2000/svg" width="940" height="780" viewBox="0 0 940 780" font-family="system-ui, sans-serif">
  <rect width="940" height="780" fill="#0b0d14"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
    <marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
  </defs>

  <text x="470" y="26" fill="#e8eaf0" font-size="16" font-weight="bold" text-anchor="middle">mm/ 核心调用链路（v7.1）</text>

  <!-- Left: __alloc_pages chain -->
  <text x="220" y="56" fill="#6c8ef5" font-size="13" font-weight="bold" text-anchor="middle">物理页分配 __alloc_pages</text>

  <rect x="80" y="70" width="280" height="30" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="220" y="89" fill="#e8eaf0" font-size="11" text-anchor="middle">__alloc_pages_noprof(gfp, order, nid) → page</text>
  <line x1="220" y1="100" x2="220" y2="116" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="80" y="116" width="280" height="30" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="220" y="135" fill="#e8eaf0" font-size="11" text-anchor="middle">prepare_alloc_pages → alloc_context</text>
  <line x1="220" y1="146" x2="220" y2="162" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Fast path -->
  <rect x="80" y="162" width="280" height="36" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="220" y="180" fill="#4ecdc4" font-size="11" text-anchor="middle">Fast: get_page_from_freelist</text>
  <text x="220" y="193" fill="#9aa3c0" font-size="10" text-anchor="middle">WMARK_LOW · zone_watermark_fast → rmqueue</text>
  <line x1="220" y1="198" x2="220" y2="214" stroke="#4ecdc4" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="100" y="214" width="240" height="24" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="220" y="230" fill="#4ecdc4" font-size="10" text-anchor="middle">order-0: rmqueue_pcplist (PCP 无锁)</text>
  <line x1="220" y1="238" x2="220" y2="254" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="120" y="254" width="200" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="0.8"/>
  <text x="220" y="270" fill="#e8eaf0" font-size="10" text-anchor="middle">__rmqueue: NORMAL→CMA→CLAIM→STEAL</text>

  <!-- Success / Fail branch -->
  <path d="M 360 180 L 400 180 L 400 90 L 362 90" stroke="#4ecdc4" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <text x="378" y="175" fill="#4ecdc4" font-size="10" text-anchor="middle">OK</text>
  <text x="395" y="138" fill="#4ecdc4" font-size="10">return page</text>

  <line x1="220" y1="278" x2="220" y2="300" stroke="#ff6b9d" stroke-width="1.2" marker-end="url(#aR)"/>
  <text x="240" y="294" fill="#ff6b9d" font-size="10">fail</text>

  <!-- Slow path -->
  <rect x="80" y="300" width="280" height="30" rx="4" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="220" y="319" fill="#ff6b9d" font-size="11" text-anchor="middle">Slow: __alloc_pages_slowpath</text>
  <line x1="220" y1="330" x2="220" y2="346" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="80" y="346" width="280" height="24" rx="4" fill="#13162a" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="220" y="362" fill="#e8eaf0" font-size="10" text-anchor="middle">wake_all_kswapds → get_page(WMARK_MIN)</text>
  <line x1="220" y1="370" x2="220" y2="386" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="80" y="386" width="280" height="24" rx="4" fill="#13162a" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="220" y="402" fill="#e8eaf0" font-size="10" text-anchor="middle">__alloc_pages_direct_reclaim (shrink_folio_list)</text>
  <line x1="220" y1="410" x2="220" y2="426" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="80" y="426" width="280" height="24" rx="4" fill="#13162a" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="220" y="442" fill="#e8eaf0" font-size="10" text-anchor="middle">__alloc_pages_direct_compact (碎片整理)</text>
  <line x1="220" y1="450" x2="220" y2="466" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="80" y="466" width="280" height="24" rx="4" fill="#13162a" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="220" y="482" fill="#e8eaf0" font-size="10" text-anchor="middle">should_reclaim_retry → __alloc_pages_may_oom</text>
  <line x1="220" y1="490" x2="220" y2="506" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="100" y="506" width="240" height="24" rx="4" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="220" y="522" fill="#ff6b9d" font-size="10" text-anchor="middle">out_of_memory → nopage / __GFP_NOFAIL 重试</text>

  <!-- Right: handle_mm_fault chain -->
  <text x="700" y="56" fill="#f9ca24" font-size="13" font-weight="bold" text-anchor="middle">缺页处理 handle_mm_fault</text>

  <rect x="560" y="70" width="280" height="30" rx="4" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
  <text x="700" y="89" fill="#e8eaf0" font-size="11" text-anchor="middle">handle_mm_fault(vma, addr, flags) → vmf</text>
  <line x1="700" y1="100" x2="700" y2="116" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="560" y="116" width="280" height="30" rx="4" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
  <text x="700" y="135" fill="#e8eaf0" font-size="11" text-anchor="middle">__handle_mm_fault — 4 级页表遍历</text>
  <line x1="700" y1="146" x2="700" y2="162" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="580" y="162" width="240" height="50" rx="4" fill="#13162a" stroke="#f9ca24" stroke-width="0.8"/>
  <text x="700" y="180" fill="#9aa3c0" font-size="10" text-anchor="middle">pgd_offset → p4d_alloc</text>
  <text x="700" y="196" fill="#9aa3c0" font-size="10" text-anchor="middle">→ pud_alloc → pmd_alloc</text>
  <text x="700" y="210" fill="#f9ca24" font-size="9" text-anchor="middle">[PUD/PMD huge: create_huge_pud/pmd]</text>
  <line x1="700" y1="212" x2="700" y2="228" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="560" y="228" width="280" height="30" rx="4" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="700" y="247" fill="#e8eaf0" font-size="11" text-anchor="middle">handle_pte_fault — 按 PTE 状态分发</text>

  <!-- 4 branches from handle_pte_fault -->
  <line x1="620" y1="258" x2="620" y2="278" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="680" y1="258" x2="680" y2="278" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="740" y1="258" x2="740" y2="278" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="800" y1="258" x2="800" y2="278" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Branch 1: PTE missing -->
  <rect x="560" y="278" width="120" height="50" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="0.8"/>
  <text x="620" y="296" fill="#4ecdc4" font-size="10" text-anchor="middle">PTE 不存在</text>
  <text x="620" y="312" fill="#e8eaf0" font-size="9" text-anchor="middle">do_pte_missing</text>
  <text x="620" y="322" fill="#9aa3c0" font-size="8" text-anchor="middle">anon / file</text>

  <line x1="600" y1="328" x2="600" y2="348" stroke="#7a86b3" stroke-width="1" marker-end="url(#a)"/>
  <line x1="640" y1="328" x2="640" y2="348" stroke="#7a86b3" stroke-width="1" marker-end="url(#a)"/>

  <rect x="548" y="348" width="104" height="44" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="0.8"/>
  <text x="600" y="366" fill="#e8eaf0" font-size="9" text-anchor="middle">do_anonymous_page</text>
  <text x="600" y="378" fill="#9aa3c0" font-size="8" text-anchor="middle">zero_pfn /</text>
  <text x="600" y="387" fill="#9aa3c0" font-size="8" text-anchor="middle">alloc_anon_folio</text>

  <rect x="660" y="348" width="104" height="44" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="0.8"/>
  <text x="712" y="366" fill="#e8eaf0" font-size="9" text-anchor="middle">do_fault</text>
  <text x="712" y="378" fill="#9aa3c0" font-size="8" text-anchor="middle">read / cow /</text>
  <text x="712" y="387" fill="#9aa3c0" font-size="8" text-anchor="middle">shared</text>

  <!-- Branch 2: swap -->
  <rect x="684" y="278" width="60" height="50" rx="4" fill="#13162a" stroke="#b388ff" stroke-width="0.8"/>
  <text x="714" y="296" fill="#b388ff" font-size="9" text-anchor="middle">swap</text>
  <text x="714" y="312" fill="#e8eaf0" font-size="9" text-anchor="middle">do_swap_page</text>
  <text x="714" y="324" fill="#9aa3c0" font-size="8" text-anchor="middle">从 swap 读回</text>

  <!-- Branch 3: numa -->
  <rect x="744" y="278" width="60" height="50" rx="4" fill="#13162a" stroke="#b388ff" stroke-width="0.8"/>
  <text x="774" y="296" fill="#b388ff" font-size="9" text-anchor="middle">protnone</text>
  <text x="774" y="312" fill="#e8eaf0" font-size="9" text-anchor="middle">do_numa_page</text>
  <text x="774" y="324" fill="#9aa3c0" font-size="8" text-anchor="middle">NUMA 迁移</text>

  <!-- Branch 4: COW -->
  <rect x="804" y="278" width="60" height="50" rx="4" fill="#13162a" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="834" y="296" fill="#ff6b9d" font-size="9" text-anchor="middle">write</text>
  <text x="834" y="312" fill="#e8eaf0" font-size="9" text-anchor="middle">do_wp_page</text>
  <text x="834" y="324" fill="#9aa3c0" font-size="8" text-anchor="middle">COW</text>

  <!-- COW detail -->
  <line x1="834" y1="328" x2="834" y2="400" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="762" y="400" width="144" height="28" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="0.8"/>
  <text x="834" y="418" fill="#4ecdc4" font-size="9" text-anchor="middle">wp_can_reuse_anon_folio?</text>

  <line x1="810" y1="428" x2="760" y2="448" stroke="#4ecdc4" stroke-width="1" marker-end="url(#a)"/>
  <text x="772" y="442" fill="#4ecdc4" font-size="9">yes</text>
  <line x1="858" y1="428" x2="880" y2="448" stroke="#ff6b9d" stroke-width="1" marker-end="url(#a)"/>
  <text x="874" y="442" fill="#ff6b9d" font-size="9">no</text>

  <rect x="700" y="448" width="120" height="28" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="0.8"/>
  <text x="760" y="466" fill="#4ecdc4" font-size="9" text-anchor="middle">wp_page_reuse (ref==1)</text>

  <rect x="830" y="448" width="100" height="28" rx="4" fill="#13162a" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="880" y="466" fill="#ff6b9d" font-size="9" text-anchor="middle">wp_page_copy</text>

  <line x1="880" y1="476" x2="880" y2="496" stroke="#7a86b3" stroke-width="1" marker-end="url(#a)"/>

  <rect x="800" y="496" width="160" height="40" rx="4" fill="#13162a" stroke="#ff6b9d" stroke-width="0.8"/>
  <text x="880" y="514" fill="#e8eaf0" font-size="9" text-anchor="middle">TLB flush 顺序:</text>
  <text x="880" y="526" fill="#9aa3c0" font-size="8" text-anchor="middle">ptep_clear_flush → set_pte_at</text>

  <!-- do_fault detail -->
  <line x1="712" y1="392" x2="712" y2="410" stroke="#7a86b3" stroke-width="1" marker-end="url(#a)"/>

  <rect x="640" y="410" width="140" height="28" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="0.8"/>
  <text x="710" y="428" fill="#e8eaf0" font-size="9" text-anchor="middle">!write: do_read_fault</text>
  <text x="710" y="438" fill="#9aa3c0" font-size="8" text-anchor="middle">do_fault_around → __do_fault</text>

  <line x1="712" y1="438" x2="712" y2="456" stroke="#7a86b3" stroke-width="1" marker-end="url(#a)"/>

  <rect x="640" y="456" width="140" height="28" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="0.8"/>
  <text x="710" y="474" fill="#e8eaf0" font-size="9" text-anchor="middle">__do_fault → vm_ops->fault</text>
  <text x="710" y="484" fill="#9aa3c0" font-size="8" text-anchor="middle">filemap_fault</text>

  <!-- Legend -->
  <rect x="80" y="560" width="780" height="70" rx="6" fill="#13162a" stroke="#2a2d45" stroke-width="1"/>
  <text x="100" y="582" fill="#e8eaf0" font-size="11" font-weight="bold">图例</text>
  <rect x="100" y="592" width="14" height="14" rx="2" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="122" y="603" fill="#9aa3c0" font-size="10">Fast path / 成功路径</text>
  <rect x="280" y="592" width="14" height="14" rx="2" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="302" y="603" fill="#9aa3c0" font-size="10">Slow path / 降级</text>
  <rect x="440" y="592" width="14" height="14" rx="2" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="462" y="603" fill="#9aa3c0" font-size="10">OOM / COW 复制</text>
  <rect x="620" y="592" width="14" height="14" rx="2" fill="#13162a" stroke="#b388ff" stroke-width="1"/>
  <text x="642" y="603" fill="#9aa3c0" font-size="10">NUMA / Swap</text>
  <text x="100" y="622" fill="#7a86b3" font-size="10">实线箭头 = 同步调用 · 虚线箭头 = 异步/回调 · 数据类型标注在箭头旁</text>
</svg>
