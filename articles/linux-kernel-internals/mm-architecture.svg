<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="system-ui, sans-serif">
  <rect width="860" height="540" fill="#0b0d14"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
  </defs>

  <text x="430" y="28" fill="#e8eaf0" font-size="16" font-weight="bold" text-anchor="middle">mm/ 内存管理五大组件架构（v7.1）</text>

  <!-- mmap / VMA layer -->
  <rect x="50" y="50" width="760" height="80" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="80" y="76" fill="#f9ca24" font-size="13" font-weight="bold">mmap / VMA</text>
  <text x="80" y="94" fill="#e8eaf0" font-size="12">do_mmap() → vma_merge_new_range() → mm_mt (Maple Tree)</text>
  <text x="80" y="112" fill="#9aa3c0" font-size="11">vm_area_struct: vm_start/vm_end/vm_flags/vm_ops · munmap 两阶段提交</text>
  <text x="560" y="76" fill="#f9ca24" font-size="11" font-weight="bold">虚拟地址空间映射</text>
  <text x="560" y="94" fill="#9aa3c0" font-size="11">per-VMA lock (vm_refcnt)</text>
  <text x="560" y="112" fill="#9aa3c0" font-size="11">RCU 无锁读</text>

  <!-- Page Cache -->
  <rect x="50" y="160" width="340" height="90" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="80" y="186" fill="#4ecdc4" font-size="13" font-weight="bold">Page Cache</text>
  <text x="80" y="204" fill="#e8eaf0" font-size="12">address_space → xarray (folio index)</text>
  <text x="80" y="222" fill="#9aa3c0" font-size="11">filemap_fault() → do_fault_around() 预读</text>
  <text x="80" y="240" fill="#9aa3c0" font-size="11">filemap_map_pages() 批量映射</text>

  <!-- Slub -->
  <rect x="470" y="160" width="340" height="90" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="500" y="186" fill="#ff6b9d" font-size="13" font-weight="bold">Slub 分配器</text>
  <text x="500" y="204" fill="#e8eaf0" font-size="12">kmem_cache_alloc → alloc_from_pcs()</text>
  <text x="500" y="222" fill="#9aa3c0" font-size="11">三层: Per-CPU sheaves(main+spare)</text>
  <text x="500" y="240" fill="#9aa3c0" font-size="11">→ barn → partial list (list_lock)</text>

  <!-- Buddy -->
  <rect x="50" y="290" width="760" height="110" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="80" y="316" fill="#6c8ef5" font-size="13" font-weight="bold">Buddy 分配器</text>
  <text x="80" y="334" fill="#e8eaf0" font-size="12">__alloc_pages → get_page_from_freelist → rmqueue → __rmqueue</text>
  <text x="80" y="352" fill="#9aa3c0" font-size="11">zone: DMA / DMA32 / NORMAL / MOVABLE</text>
  <text x="80" y="370" fill="#9aa3c0" font-size="11">free_area[MAX_PAGE_ORDER=11] × migratetype[5]</text>
  <text x="80" y="388" fill="#9aa3c0" font-size="11">watermark: WMARK_MIN / LOW / HIGH · __rmqueue 状态机: NORMAL→CMA→CLAIM→STEAL</text>
  <text x="480" y="334" fill="#9aa3c0" font-size="11">PCP (per_cpu_pageset) order-0 无锁</text>
  <text x="480" y="352" fill="#9aa3c0" font-size="11">buddy_merge_likely tail 优化</text>
  <text x="480" y="370" fill="#9aa3c0" font-size="11">lowmem_reserve 跨 zone 保护</text>

  <!-- vmscan -->
  <rect x="50" y="430" width="760" height="90" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="80" y="456" fill="#ff6b9d" font-size="13" font-weight="bold">vmscan 内存回收</text>
  <text x="80" y="474" fill="#e8eaf0" font-size="12">shrink_lruvec → shrink_folio_list (回收决策树)</text>
  <text x="80" y="492" fill="#9aa3c0" font-size="11">kswapd (后台) / direct reclaim (同步) · MGLRU (lru_gen_shrink_lruvec)</text>
  <text x="80" y="510" fill="#9aa3c0" font-size="11">LRU: INACTIVE_ANON / ACTIVE_ANON / INACTIVE_FILE / ACTIVE_FILE</text>
  <text x="480" y="474" fill="#9aa3c0" font-size="11">folio_check_references 二次机会</text>
  <text x="480" y="492" fill="#9aa3c0" font-size="11">try_to_unmap 解除映射</text>
  <text x="480" y="510" fill="#9aa3c0" font-size="11">pageout → writepage 落盘</text>

  <!-- Arrows: mmap → page cache -->
  <line x1="220" y1="130" x2="220" y2="160" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="228" y="150" fill="#7a86b3" font-size="10">file fault</text>

  <!-- Arrows: mmap → buddy (anon alloc) — 走 Page Cache/Slub 间隙(390-470)直指 Buddy -->
  <line x1="420" y1="130" x2="420" y2="290" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="428" y="210" fill="#7a86b3" font-size="10">anon alloc</text>

  <!-- Arrow: page cache → buddy -->
  <line x1="220" y1="250" x2="220" y2="290" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="228" y="275" fill="#7a86b3" font-size="10">alloc folio</text>

  <!-- Arrow: slub → buddy -->
  <line x1="600" y1="250" x2="600" y2="290" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="608" y="275" fill="#7a86b3" font-size="10">alloc_slab_page</text>

  <!-- Arrow: vmscan → page cache (reclaim file pages) — 折线绕到左侧外缘避开 Buddy 框 -->
  <path d="M 200 430 L 30 430 L 30 250 L 200 250" stroke="#ff6b9d" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <text x="38" y="340" fill="#ff6b9d" font-size="10">reclaim</text>

  <!-- Arrow: vmscan → buddy (free pages) -->
  <line x1="400" y1="430" x2="400" y2="400" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  <text x="408" y="420" fill="#ff6b9d" font-size="10">free</text>

  <!-- Arrow: buddy watermark low → wake kswapd -->
  <line x1="600" y1="400" x2="600" y2="430" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrG)"/>
  <text x="608" y="420" fill="#6c8ef5" font-size="10">wakeup_kswapd</text>
</svg>
