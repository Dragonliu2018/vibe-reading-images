<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#0b0d14"/>

  <text x="450" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf2" text-anchor="middle">Agent.__init__ 检查点加载与设备降级链（agent.py）</text>

  <!-- Row 1 -->
  <rect x="40" y="70" width="170" height="56" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="125" y="92" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">Agent(model_id)</text>
  <text x="125" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">subfolder 可选</text>

  <rect x="250" y="70" width="180" height="56" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="340" y="92" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">snapshot_download</text>
  <text x="340" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">allow_patterns 只取 subfolder</text>

  <rect x="470" y="70" width="180" height="56" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="560" y="92" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">_fix_tokenizer_config</text>
  <text x="560" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">修复跨版本兼容字段</text>

  <rect x="690" y="70" width="170" height="56" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="775" y="92" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">rl_agent_config.json</text>
  <text x="775" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">+ model.safetensors</text>

  <line x1="210" y1="98" x2="246" y2="98" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="98" x2="466" y2="98" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="98" x2="686" y2="98" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- connector row1 -> row2 -->
  <path d="M775,126 L775,160 L125,160 L125,190" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="40" y="192" width="170" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="125" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">build_model</text>
  <text x="125" y="234" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">AutoModel + DecisionModel</text>

  <rect x="250" y="192" width="180" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="340" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">_verify_compatibility</text>
  <text x="340" y="234" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">前缀 / 形状 / 缺失键校验</text>

  <rect x="470" y="192" width="180" height="56" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="560" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">device 解析</text>
  <text x="560" y="234" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">cuda → mps → cpu</text>

  <rect x="690" y="192" width="170" height="56" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="775" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">.to(device) 失败？</text>
  <text x="775" y="234" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">OOM → CPU 降级 + 警告</text>

  <line x1="210" y1="220" x2="246" y2="220" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="220" x2="466" y2="220" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="220" x2="686" y2="220" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ready -->
  <rect x="690" y="290" width="170" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="775" y="319" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">eval() 就绪</text>
  <line x1="775" y1="248" x2="775" y2="286" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="300" font-family="system-ui, sans-serif" font-size="12" fill="#7a86b3">reference_compile=False：小批量下 torch.compile 反而亏损且部分平台挂起（agent.py）</text>
  <text x="40" y="322" font-family="system-ui, sans-serif" font-size="12" fill="#7a86b3">dtype：cuda 算力 &lt;8 强制 fp16；cpu/mps 用 fp32；推理期 OOM 在 system_one 内二次降级 CPU</text>
</svg>
