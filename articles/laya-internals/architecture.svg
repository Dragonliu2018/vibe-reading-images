<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="800" height="590" fill="#0b0d14"/>

  <!-- Band 1: 应用预设层 -->
  <rect x="40" y="30" width="720" height="90" rx="10" fill="none" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ff6b9d">应用预设层</text>
  <rect x="60" y="68" width="330" height="40" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="225" y="93" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">presets.py · 5 套问题模板</text>
  <rect x="410" y="68" width="330" height="40" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="575" y="93" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">email.py · 邮件清洗 email_state</text>

  <!-- Band 2: 路由决策层 -->
  <rect x="40" y="150" width="720" height="90" rx="10" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="60" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4ecdc4">路由决策层</text>
  <rect x="60" y="188" width="330" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="225" y="213" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">router.py · Router LRU 分派</text>
  <rect x="410" y="188" width="330" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="575" y="213" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">lang.py · script / 语言检测</text>

  <!-- Band 3: 推理运行时层 -->
  <rect x="40" y="270" width="720" height="90" rx="10" fill="none" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="60" y="295" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#80c7ff">推理运行时层</text>
  <rect x="60" y="308" width="680" height="40" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1"/>
  <text x="400" y="333" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">agent.py · Agent 加载 / 设备降级 / system_one 单次前向</text>

  <!-- Band 4: 模型核心层 -->
  <rect x="40" y="390" width="720" height="90" rx="10" fill="none" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="60" y="415" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#6c8ef5">模型核心层</text>
  <rect x="60" y="428" width="680" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="400" y="453" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">common.py · DecisionModel · build_sequence · proper_reward</text>

  <!-- Band 5: 外部依赖 -->
  <rect x="40" y="510" width="720" height="60" rx="10" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="60" y="520" width="200" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
  <text x="160" y="543" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">Hugging Face Hub</text>
  <rect x="290" y="520" width="200" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
  <text x="390" y="543" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">PyTorch · transformers</text>
  <rect x="520" y="520" width="200" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
  <text x="620" y="543" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">safetensors · numpy</text>

  <!-- arrows: 路由 -> 运行时 -> 模型 -> 外部依赖 -->
  <line x1="400" y1="240" x2="400" y2="266" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="360" x2="400" y2="386" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="480" x2="400" y2="506" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- dashed: 应用预设层 questions 直达运行时层 -->
  <path d="M740,120 L760,120 L760,328 L744,328" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7" marker-end="url(#arrow)"/>
  <text x="712" y="222" font-family="system-ui, sans-serif" font-size="12" fill="#7a86b3" text-anchor="middle">state+questions</text>
</svg>
