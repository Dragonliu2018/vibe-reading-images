<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#0b0d14"/>

  <text x="440" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf2" text-anchor="middle">lang.py 语言 / 文字系统检测流程（analyse）</text>

  <!-- entry -->
  <rect x="60" y="58" width="180" height="52" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="150" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">state（str/dict/list）</text>
  <text x="150" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">嵌套 ≤6 层</text>

  <rect x="290" y="58" width="200" height="52" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">state_text</text>
  <text x="390" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">收集字符串叶子 · 截 4000 字符</text>

  <rect x="540" y="58" width="200" height="52" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="640" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">detect_script</text>
  <text x="640" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">26 组 Unicode 区块计数</text>

  <line x1="240" y1="84" x2="286" y2="84" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="84" x2="536" y2="84" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- script branch -->
  <rect x="60" y="180" width="180" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="150" y="202" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">unknown</text>
  <text x="150" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">无字母 → is_english=True</text>

  <rect x="290" y="180" width="200" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="390" y="202" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">非拉丁 script</text>
  <text x="390" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">han/kana/hangul/… → 非 English</text>

  <rect x="540" y="180" width="200" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="640" y="202" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">拉丁 script</text>
  <text x="640" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">进入语言启发式</text>

  <path d="M600,110 L600,150 L150,150 L150,176" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M640,110 L640,176" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M700,110 L700,150 L640,150" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- latin language guess -->
  <rect x="540" y="270" width="200" height="52" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="640" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">guess_latin_language</text>
  <text x="640" y="310" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">7 语停用词 + 变音符率</text>
  <line x1="640" y1="228" x2="640" y2="266" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- outcomes -->
  <rect x="60" y="360" width="230" height="44" rx="8" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="175" y="380" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">词数 &lt;4 或无信号 → None</text>
  <text x="175" y="396" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">视为英语（保守路由）</text>

  <rect x="330" y="360" width="230" height="44" rx="8" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="445" y="380" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">非英停用词 ≥ max(2, en+2)</text>
  <text x="445" y="396" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">或变音符率 ≥0.04 → 该语言</text>

  <rect x="600" y="360" width="230" height="44" rx="8" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="715" y="380" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">英语停用词占优 → en</text>
  <text x="715" y="396" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">路由 english 检查点</text>

  <path d="M560,322 L560,340 L175,340 L175,356" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M620,322 L620,356" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720,322 L720,340 L715,340 L715,356" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
