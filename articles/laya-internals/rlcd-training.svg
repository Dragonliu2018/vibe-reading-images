<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#0b0d14"/>

  <text x="450" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf2" text-anchor="middle">RLCD 微调循环（notebooks/train_ddp.py，GRPO 式策略梯度）</text>

  <!-- Row 1 -->
  <rect x="40" y="60" width="150" height="52" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="115" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">collate_train_batch</text>
  <text x="115" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">ids/markers/target</text>

  <rect x="230" y="60" width="150" height="52" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="305" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">DDP 前向</text>
  <text x="305" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">autocast fp16</text>

  <rect x="420" y="60" width="170" height="52" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="505" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">采样 G=4 噪声分布</text>
  <text x="505" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">σ 0.4→0.1 · 零均值投影</text>

  <rect x="630" y="60" width="200" height="52" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="730" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">proper_reward 打分</text>
  <text x="730" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">log + sph + RPS(score)</text>

  <line x1="190" y1="86" x2="226" y2="86" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="86" x2="416" y2="86" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="86" x2="626" y2="86" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <path d="M730,112 L730,150 L115,150 L115,182" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="184" width="150" height="52" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="115" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">组内归一化优势</text>
  <text x="115" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">adv = (r−μ)/σ</text>

  <rect x="230" y="184" width="170" height="52" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="315" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">loss = RL + 1.0·CE</text>
  <text x="315" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">软标签交叉熵全程引导</text>

  <rect x="440" y="184" width="170" height="52" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="525" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">GradScaler + 梯度累积</text>
  <text x="525" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">×4 → 有效批 64 序列</text>

  <rect x="650" y="184" width="180" height="52" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="740" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">AdamW 双学习率</text>
  <text x="740" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">encoder 2.5e-5 / head 1e-4</text>

  <line x1="190" y1="210" x2="226" y2="210" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="210" x2="436" y2="210" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="210" x2="646" y2="210" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- post-training -->
  <rect x="40" y="300" width="390" height="60" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="235" y="324" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">训练后：温度校准（rank 0）</text>
  <text x="235" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">LBFGS 拟合 log_t，每 qtype 一个温度，写入 rl_agent_config.json</text>

  <rect x="470" y="300" width="390" height="60" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="665" y="324" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">保存：fp16 safetensors + encoder 配置 + tokenizer</text>
  <text x="665" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">cfg["temperature"] = fitted_temps，供推理端 temp_bucket 使用</text>

  <path d="M740,236 L740,268 L235,268 L235,296" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="330" x2="466" y2="330" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
