<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#0b0d14"/>

  <text x="450" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf2" text-anchor="middle">DecisionModel.forward 内部流程（common.py）</text>

  <!-- main chain -->
  <rect x="40" y="60" width="130" height="52" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="105" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">input_ids</text>
  <text x="105" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">attention_mask</text>

  <rect x="210" y="60" width="170" height="52" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="295" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">encoder 前向</text>
  <text x="295" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">ModernBERT / mmBERT</text>

  <rect x="420" y="60" width="150" height="52" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="495" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">h + type_emb</text>
  <text x="495" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">按 qtype 加类型嵌入</text>

  <rect x="610" y="60" width="150" height="52" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="685" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">head ×2 层</text>
  <text x="685" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">TransformerEncoder</text>

  <rect x="610" y="170" width="150" height="52" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="685" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">gather markers</text>
  <text x="685" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">取 MASK 位隐状态</text>

  <rect x="400" y="170" width="160" height="52" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="480" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">scorer MLP</text>
  <text x="480" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">LayerNorm→Linear→GELU</text>

  <rect x="190" y="170" width="160" height="52" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="270" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">logits[N,k]</text>
  <text x="270" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">masked_fill(−1e4)</text>

  <line x1="170" y1="86" x2="206" y2="86" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="86" x2="416" y2="86" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="86" x2="606" y2="86" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M685,112 L685,166" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="606" y1="196" x2="564" y2="196" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="396" y1="196" x2="354" y2="196" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- act branch -->
  <rect x="210" y="290" width="180" height="56" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="300" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">act_head</text>
  <text x="300" y="330" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">CLS 池化 + 4 个分布特征</text>

  <rect x="450" y="290" width="150" height="56" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="525" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf2" text-anchor="middle">act_logits</text>
  <text x="525" y="330" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3" text-anchor="middle">softmax→act_probability</text>

  <line x1="390" y1="318" x2="446" y2="318" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- branch source: from head output h, down-left to act_head -->
  <path d="M295,112 L295,250 L300,250 L300,286" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7" marker-end="url(#arrow)"/>
  <text x="182" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#7a86b3">pooled = h[:,0] + top2/entropy/k 特征</text>
</svg>
