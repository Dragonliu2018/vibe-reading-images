<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .tag { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <!-- main.py -->
  <rect x="280" y="20" width="240" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="42" text-anchor="middle" class="label" fill="#6c8ef5">main.py</text>
  <text x="400" y="58" text-anchor="middle" class="mod">CliArgs dataclass · click入口</text>

  <path d="M 400 70 L 400 95" class="arrow" marker-end="url(#ah)"/>

  <!-- cli_runner.py -->
  <rect x="240" y="95" width="320" height="55" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="117" text-anchor="middle" class="label" fill="#6c8ef5">cli_runner.py</text>
  <text x="400" y="133" text-anchor="middle" class="mod">run_from_cli_args · DSN解析 · 密码候选链 · 模式分发</text>

  <!-- password_sources.py (side) -->
  <path d="M 560 122 L 600 122" class="arrow" marker-end="url(#ah)"/>
  <rect x="600" y="100" width="180" height="45" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="690" y="120" text-anchor="middle" class="label" fill="#ff6b9d">password_sources.py</text>
  <text x="690" y="136" text-anchor="middle" class="mod">PasswordCandidates</text>

  <path d="M 400 150 L 400 180" class="arrow" marker-end="url(#ah)"/>

  <!-- client.py -->
  <rect x="280" y="180" width="240" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="202" text-anchor="middle" class="label" fill="#4ecdc4">client.py</text>
  <text x="400" y="218" text-anchor="middle" class="mod">MyCli · 5 Mixin组合</text>

  <path d="M 400 230 L 400 265" class="arrow" marker-end="url(#ah)"/>

  <!-- main_modes/ container -->
  <rect x="20" y="265" width="760" height="110" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="40" y="285" class="tag" fill="#f9ca24">main_modes/</text>

  <!-- mode boxes -->
  <rect x="40" y="295" width="110" height="40" rx="6" fill="#0d1018" stroke="#f9ca24" stroke-width="1"/>
  <text x="95" y="320" text-anchor="middle" class="mod" fill="#f9ca24">repl.py</text>

  <rect x="162" y="295" width="110" height="40" rx="6" fill="#0d1018" stroke="#f9ca24" stroke-width="1"/>
  <text x="217" y="320" text-anchor="middle" class="mod" fill="#f9ca24">execute.py</text>

  <rect x="284" y="295" width="110" height="40" rx="6" fill="#0d1018" stroke="#f9ca24" stroke-width="1"/>
  <text x="339" y="320" text-anchor="middle" class="mod" fill="#f9ca24">batch.py</text>

  <rect x="406" y="295" width="110" height="40" rx="6" fill="#0d1018" stroke="#f9ca24" stroke-width="1"/>
  <text x="461" y="320" text-anchor="middle" class="mod" fill="#f9ca24">checkup.py</text>

  <rect x="528" y="295" width="110" height="40" rx="6" fill="#0d1018" stroke="#f9ca24" stroke-width="1"/>
  <text x="583" y="320" text-anchor="middle" class="mod" fill="#f9ca24">completions.py</text>

  <rect x="650" y="295" width="110" height="40" rx="6" fill="#0d1018" stroke="#f9ca24" stroke-width="1"/>
  <text x="705" y="320" text-anchor="middle" class="mod" fill="#f9ca24">list_dsn.py</text>

  <text x="40" y="362" class="tag">REPL · 批量执行 · 健康检查 · 补全生成 · DSN列表</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
