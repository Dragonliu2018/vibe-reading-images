<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <rect width="800" height="540" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .branch { font-family: system-ui, sans-serif; font-size: 11px; fill: #7a85a3; }
    path:hover, line:hover { stroke: #6c8ef5 !important; stroke-width: 3 !important; cursor: pointer; }
  </style>

  <!-- main() -->
  <rect x="300" y="20" width="200" height="45" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="40" text-anchor="middle" class="label" fill="#6c8ef5">main()</text>
  <text x="400" y="56" text-anchor="middle" class="mod">main.py</text>

  <path d="M 400 65 L 400 93" class="arrow" marker-end="url(#ah)"/>

  <!-- preprocess -->
  <rect x="300" y="95" width="200" height="45" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="115" text-anchor="middle" class="label">参数校验</text>
  <text x="400" y="131" text-anchor="middle" class="mod">preprocess_cli_args()</text>

  <path d="M 400 140 L 400 168" class="arrow" marker-end="url(#ah)"/>

  <!-- MyCli init -->
  <rect x="300" y="170" width="200" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="190" text-anchor="middle" class="label" fill="#4ecdc4">MyCli 实例化</text>
  <text x="400" y="206" text-anchor="middle" class="mod">加载配置 + 创建 completer</text>

  <path d="M 400 215 L 400 243" class="arrow" marker-end="url(#ah)"/>

  <!-- connect -->
  <rect x="280" y="245" width="240" height="55" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="267" text-anchor="middle" class="label" fill="#4ecdc4">建立连接</text>
  <text x="400" y="283" text-anchor="middle" class="mod">DSN解析 + 密码候选链</text>
  <text x="400" y="295" text-anchor="middle" class="mod">SQLExecute → pymysql.connect()</text>

  <path d="M 400 300 L 400 328" class="arrow" marker-end="url(#ah)"/>

  <!-- 模式分发 -->
  <rect x="250" y="330" width="300" height="45" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="350" text-anchor="middle" class="label" fill="#f9ca24">模式分发</text>
  <text x="400" y="366" text-anchor="middle" class="mod">策略模式短路</text>

  <!-- 分支箭头 -->
  <path d="M 300 375 L 130 415" class="arrow" marker-end="url(#ah)"/>
  <path d="M 350 375 L 290 415" class="arrow" marker-end="url(#ah)"/>
  <path d="M 450 375 L 510 415" class="arrow" marker-end="url(#ah)"/>
  <path d="M 500 375 L 670 415" class="arrow" marker-end="url(#ah)"/>

  <text x="130" y="405" text-anchor="middle" class="branch">--execute</text>
  <text x="290" y="405" text-anchor="middle" class="branch">--batch</text>
  <text x="510" y="405" text-anchor="middle" class="branch">stdin 管道</text>
  <text x="670" y="405" text-anchor="middle" class="branch">交互式</text>

  <!-- 模式框 -->
  <rect x="50" y="417" width="160" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
  <text x="130" y="442" text-anchor="middle" class="mod">execute.py</text>

  <rect x="210" y="417" width="160" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
  <text x="290" y="442" text-anchor="middle" class="mod">batch.py</text>

  <rect x="430" y="417" width="160" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
  <text x="510" y="442" text-anchor="middle" class="mod">batch.py (stdin)</text>

  <rect x="590" y="417" width="160" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="670" y="442" text-anchor="middle" class="label" fill="#f9ca24">REPL (fallback)</text>

  <!-- close -->
  <path d="M 400 457 L 400 485" class="arrow" marker-end="url(#ah)"/>
  <rect x="300" y="487" width="200" height="40" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="400" y="512" text-anchor="middle" class="label" fill="#ff6b9d">mycli.close()</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
