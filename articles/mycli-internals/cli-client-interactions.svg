<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390">
  <rect width="800" height="390" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .tag { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
    .edge-label { font-family: system-ui, sans-serif; font-size: 10px; fill: #5a6885; }
  </style>

  <!-- ===== Top row: core modules ===== -->

  <!-- main.py -->
  <rect x="20" y="25" width="150" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="95" y="47" text-anchor="middle" class="label" fill="#6c8ef5">main.py</text>
  <text x="95" y="63" text-anchor="middle" class="mod">click入口</text>

  <!-- cli_runner.py -->
  <rect x="240" y="20" width="200" height="55" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="340" y="42" text-anchor="middle" class="label" fill="#6c8ef5">cli_runner.py</text>
  <text x="340" y="60" text-anchor="middle" class="mod">run_from_cli_args</text>

  <!-- client.py -->
  <rect x="500" y="25" width="150" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="575" y="47" text-anchor="middle" class="label" fill="#4ecdc4">client.py</text>
  <text x="575" y="63" text-anchor="middle" class="mod">MyCli</text>

  <!-- client_commands -->
  <rect x="670" y="25" width="120" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="730" y="47" text-anchor="middle" class="label" fill="#4ecdc4">client_commands</text>
  <text x="730" y="63" text-anchor="middle" class="mod">titles注册</text>

  <!-- ===== Arrows between top modules ===== -->

  <!-- cli_runner → main (lazy import) -->
  <path d="M 240 48 L 170 48" class="arrow" marker-end="url(#ah)"/>
  <text x="206" y="42" text-anchor="middle" class="edge-label">延迟导入</text>

  <!-- cli_runner → client -->
  <path d="M 440 48 L 500 48" class="arrow" marker-end="url(#ah)"/>

  <!-- ===== Left group: cli_runner dependencies ===== -->
  <rect x="20" y="110" width="370" height="140" rx="8" fill="#0d1018" stroke="#6c8ef5" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="35" y="128" class="tag">cli_runner.py → imports</text>

  <!-- main_modes container (yellow) -->
  <rect x="35" y="140" width="340" height="95" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="55" y="158" class="tag" fill="#f9ca24">main_modes/</text>

  <!-- repl.py (highlighted, target of reverse ref) -->
  <rect x="50" y="168" width="100" height="42" rx="6" fill="#0d1018" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="100" y="193" text-anchor="middle" class="mod" fill="#f9ca24">repl.py ★</text>

  <rect x="160" y="168" width="100" height="42" rx="6" fill="#0d1018" stroke="#f9ca24" stroke-width="1"/>
  <text x="210" y="193" text-anchor="middle" class="mod" fill="#f9ca24">execute.py</text>

  <rect x="270" y="168" width="100" height="42" rx="6" fill="#0d1018" stroke="#f9ca24" stroke-width="1"/>
  <text x="320" y="193" text-anchor="middle" class="mod" fill="#f9ca24">batch.py</text>

  <text x="205" y="223" text-anchor="middle" class="tag">checkup · completions · list_dsn</text>

  <!-- cli_runner infra -->
  <rect x="35" y="260" width="100" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="85" y="284" text-anchor="middle" class="mod" fill="#ff6b9d">password_sources</text>

  <rect x="145" y="260" width="70" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="180" y="284" text-anchor="middle" class="mod" fill="#ff6b9d">vault</text>

  <rect x="225" y="260" width="120" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="285" y="284" text-anchor="middle" class="mod" fill="#ff6b9d">special/dsn_aliases</text>

  <!-- arrows from cli_runner to left group -->
  <path d="M 280 75 L 205 110" class="arrow" marker-end="url(#ah)" stroke-dasharray="4 2"/>
  <path d="M 400 75 L 400 255 L 85 255 L 85 260" class="arrow" marker-end="url(#ah)" stroke-dasharray="4 2"/>

  <!-- ===== Right group: client dependencies ===== -->
  <rect x="410" y="110" width="370" height="140" rx="8" fill="#0d1018" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="425" y="128" class="tag">client.py → imports</text>

  <!-- client dep row 1 -->
  <rect x="425" y="140" width="100" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="475" y="164" text-anchor="middle" class="mod" fill="#ff6b9d">sqlexecute</text>

  <rect x="535" y="140" width="105" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="587" y="164" text-anchor="middle" class="mod" fill="#ff6b9d">sqlcompleter</text>

  <rect x="650" y="140" width="120" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="710" y="164" text-anchor="middle" class="mod" fill="#ff6b9d">completion_refresher</text>

  <!-- client dep row 2 -->
  <rect x="425" y="190" width="80" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="465" y="214" text-anchor="middle" class="mod" fill="#ff6b9d">config</text>

  <rect x="515" y="190" width="100" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="565" y="214" text-anchor="middle" class="mod" fill="#ff6b9d">ssh_tunnel</text>

  <rect x="625" y="190" width="80" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="665" y="214" text-anchor="middle" class="mod" fill="#ff6b9d">special</text>

  <!-- arrow from client to right group -->
  <path d="M 575 75 L 575 110" class="arrow" marker-end="url(#ah)" stroke-dasharray="4 2"/>

  <!-- ===== Reverse reference: client_commands → repl.py ===== -->
  <path d="M 670 35 Q 580 5 100 5 L 100 168" class="arrow" marker-end="url(#ah)" stroke="#4ecdc4" stroke-dasharray="6 3"/>
  <text x="340" y="12" text-anchor="middle" class="edge-label" fill="#4ecdc4">反向引用: set_all_external_titles(repl.py)</text>

  <!-- ===== Legend ===== -->
  <rect x="20" y="320" width="760" height="3" fill="none"/>
  <text x="20" y="345" class="tag">图例</text>

  <rect x="20" y="355" width="16" height="16" rx="3" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="44" y="367" class="mod">入口层</text>

  <rect x="110" y="355" width="16" height="16" rx="3" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="134" y="367" class="mod">客户端层</text>

  <rect x="215" y="355" width="16" height="16" rx="3" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="239" y="367" class="mod">模式层</text>

  <rect x="305" y="355" width="16" height="16" rx="3" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="329" y="367" class="mod">基础设施</text>

  <line x1="400" y1="363" x2="440" y2="363" stroke="#363b62" stroke-width="1.5"/>
  <text x="448" y="367" class="mod">直接导入</text>

  <line x1="530" y1="363" x2="570" y2="363" stroke="#363b62" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="578" y="367" class="mod">延迟/反向导入</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
