<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <defs>
    <style>
      .path-label { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
      .node-title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #7c8090; }
      path:hover { stroke: #6c8ef5 !important; stroke-width: 3 !important; cursor: pointer; }
    </style>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6885"/>
    </marker>
  </defs>

  <rect width="800" height="620" fill="#0b0d14"/>

  <!-- ============ PATH A ============ -->
  <rect x="24" y="24" width="752" height="284" rx="10" fill="none" stroke="#f9ca24" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <text x="40" y="46" class="path-label" fill="#f9ca24">PATH A — get_completions() / 同步补全链路</text>

  <!-- Row 1 -->
  <rect x="40" y="64" width="150" height="54" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="115" y="86" text-anchor="middle" class="node-title" fill="#f9ca24">get_completions</text>
  <text x="115" y="104" text-anchor="middle" class="dtype">→ Document</text>

  <rect x="230" y="64" width="140" height="54" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="300" y="86" text-anchor="middle" class="node-title" fill="#f9ca24">suggest_type</text>
  <text x="300" y="104" text-anchor="middle" class="dtype">→ list[Suggestion]</text>

  <rect x="410" y="64" width="140" height="54" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="480" y="86" text-anchor="middle" class="node-title" fill="#f9ca24">sqlparse.parse</text>
  <text x="480" y="104" text-anchor="middle" class="dtype">→ Statement · cached</text>

  <rect x="570" y="64" width="200" height="54" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="670" y="82" text-anchor="middle" class="node-title" fill="#f9ca24" font-size="11px">suggest_based_on_last_token</text>
  <text x="670" y="104" text-anchor="middle" class="dtype">规则引擎 → Suggestion[]</text>

  <line x1="190" y1="91" x2="226" y2="91" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arrow-yellow)"/>
  <line x1="370" y1="91" x2="406" y2="91" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arrow-yellow)"/>
  <line x1="550" y1="91" x2="566" y2="91" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arrow-yellow)"/>

  <!-- loop back -->
  <path d="M670 118 C 670 142, 300 142, 300 118" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7" marker-end="url(#arrow-yellow)"/>
  <text x="480" y="138" text-anchor="middle" class="dtype" fill="#f9ca24">返回 Suggestion[]</text>

  <!-- Row 2 -->
  <rect x="120" y="160" width="150" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="195" y="182" text-anchor="middle" class="node-title" fill="#ff6b9d">find_matches</text>
  <text x="195" y="200" text-anchor="middle" class="dtype">→ list[tuple[str,int]]</text>

  <rect x="310" y="160" width="150" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="385" y="182" text-anchor="middle" class="node-title" fill="#ff6b9d">find_fuzzy_match</text>
  <text x="385" y="200" text-anchor="middle" class="dtype">→ Fuzziness 级别</text>

  <rect x="500" y="160" width="120" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="560" y="182" text-anchor="middle" class="node-title" fill="#ff6b9d">sort</text>
  <text x="560" y="200" text-anchor="middle" class="dtype">fuzziness→rank→len</text>

  <rect x="660" y="160" width="120" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="720" y="182" text-anchor="middle" class="node-title" fill="#ff6b9d" font-size="11px">list[Completion]</text>
  <text x="720" y="200" text-anchor="middle" class="dtype">输出</text>

  <line x1="270" y1="187" x2="306" y2="187" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
  <line x1="460" y1="187" x2="496" y2="187" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
  <line x1="620" y1="187" x2="656" y2="187" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arrow-pink)"/>

  <!-- cross-layer -->
  <path d="M300 118 C 300 135, 195 135, 195 160" fill="none" stroke="#5a6885" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.8" marker-end="url(#arrow-gray)"/>
  <text x="232" y="143" class="dtype" fill="#7a85a3">for each suggestion</text>

  <!-- ============ PATH B ============ -->
  <rect x="24" y="330" width="752" height="270" rx="10" fill="none" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <text x="40" y="352" class="path-label" fill="#4ecdc4">PATH B — CompletionRefresher.refresh() / 异步刷新链路</text>

  <!-- Row 1 -->
  <rect x="40" y="370" width="160" height="54" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="120" y="392" text-anchor="middle" class="node-title" fill="#4ecdc4">refresh()</text>
  <text x="120" y="410" text-anchor="middle" class="dtype">→ daemon Thread</text>

  <rect x="240" y="370" width="150" height="54" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="315" y="392" text-anchor="middle" class="node-title" fill="#4ecdc4">_bg_refresh</text>
  <text x="315" y="410" text-anchor="middle" class="dtype">后台执行</text>

  <rect x="430" y="370" width="150" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="505" y="392" text-anchor="middle" class="node-title" fill="#ff6b9d" font-size="11px">SQLCompleter(**opts)</text>
  <text x="505" y="410" text-anchor="middle" class="dtype">新建实例</text>

  <rect x="620" y="370" width="140" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="690" y="392" text-anchor="middle" class="node-title" fill="#ff6b9d" font-size="11px">SQLExecute(...)</text>
  <text x="690" y="410" text-anchor="middle" class="dtype">新建独立连接</text>

  <line x1="200" y1="397" x2="236" y2="397" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="390" y1="397" x2="426" y2="397" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="580" y1="397" x2="616" y2="397" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Row 2 -->
  <rect x="180" y="470" width="280" height="54" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="320" y="492" text-anchor="middle" class="node-title" fill="#4ecdc4">for refresher: refresh_*</text>
  <text x="320" y="510" text-anchor="middle" class="dtype">@refresher 注册表 · 遍历执行</text>

  <rect x="500" y="470" width="200" height="54" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="600" y="492" text-anchor="middle" class="node-title" fill="#4ecdc4">callback(completer)</text>
  <text x="600" y="510" text-anchor="middle" class="dtype">热替换 · 不阻塞 UI</text>

  <path d="M315 424 L315 470" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="460" y1="497" x2="496" y2="497" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- feeder arrows -->
  <path d="M690 424 C 690 445, 460 445, 460 470" fill="none" stroke="#5a6885" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.8" marker-end="url(#arrow-gray)"/>
  <text x="565" y="438" class="dtype" fill="#7a85a3">executor 传入</text>

  <path d="M505 424 C 505 440, 320 450, 320 470" fill="none" stroke="#5a6885" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.8" marker-end="url(#arrow-gray)"/>
  <text x="395" y="438" class="dtype" fill="#7a85a3">completer 目标</text>

  <!-- hot-swap cross-path -->
  <path d="M600 470 C 600 440, 770 440, 770 214" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7"/>
  <text x="760" y="330" class="dtype" fill="#4ecdc4" text-anchor="end">热替换</text>

</svg>
