<svg xmlns="http://www.w3.org/2000/svg" width="800" height="515" viewBox="0 0 800 515">
  <rect width="800" height="515" fill="#0b0d14"/>
  <style>
    .box { rx: 6; }
    .label { font-family: -apple-system, sans-serif; font-size: 13px; fill: #e2e8f0; font-weight: 600; }
    .desc { font-family: -apple-system, sans-serif; font-size: 11px; fill: #7a85a3; }
    .mod { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #4ecdc4; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .title { font-family: -apple-system, sans-serif; font-size: 16px; fill: #e2e8f0; font-weight: 700; }
  </style>

  <text x="400" y="30" text-anchor="middle" class="title">mycli 交互式 REPL 数据流</text>

  <!-- Step 1: User Input -->
  <rect x="250" y="50" width="300" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" class="box"/>
  <text x="400" y="72" text-anchor="middle" class="label">用户输入 SQL</text>
  <text x="400" y="88" text-anchor="middle" class="mod">prompt_session.prompt() → str</text>

  <path d="M 400 105 L 400 120" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Parse -->
  <rect x="200" y="125" width="400" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" class="box"/>
  <text x="400" y="148" text-anchor="middle" class="label">SQL 拆分 + 后缀处理</text>
  <text x="400" y="165" text-anchor="middle" class="mod">iocommands.split_queries() → \G/\g/\x 标记</text>
  <text x="400" y="178" text-anchor="middle" class="desc">repl.py _one_iteration()</text>

  <path d="M 400 190 L 400 205" class="arrow"/>

  <!-- Step 3: Special vs SQL -->
  <rect x="100" y="210" width="280" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5" class="box"/>
  <text x="240" y="233" text-anchor="middle" class="label">Special 命令?</text>
  <text x="240" y="250" text-anchor="middle" class="mod">special.execute(cur, sql)</text>
  <text x="240" y="263" text-anchor="middle" class="desc">@special_command 注册表查找</text>

  <rect x="420" y="210" width="280" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5" class="box"/>
  <text x="560" y="233" text-anchor="middle" class="label">普通 SQL 执行</text>
  <text x="560" y="250" text-anchor="middle" class="mod">cur.execute(sql)</text>
  <text x="560" y="263" text-anchor="middle" class="desc">CommandNotFound → 降级</text>

  <path d="M 280 275 L 280 290" class="arrow"/>
  <path d="M 520 275 L 520 290" class="arrow"/>

  <!-- Step 4: Result -->
  <rect x="200" y="295" width="400" height="55" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5" class="box"/>
  <text x="400" y="318" text-anchor="middle" class="label">SQLResult 流式 yield</text>
  <text x="400" y="335" text-anchor="middle" class="mod">Generator[SQLResult] · get_result(cursor)</text>

  <path d="M 400 355 L 400 370" class="arrow"/>

  <!-- Step 5: Format -->
  <rect x="200" y="375" width="400" height="55" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5" class="box"/>
  <text x="400" y="398" text-anchor="middle" class="label">格式化输出</text>
  <text x="400" y="415" text-anchor="middle" class="mod">OutputMixin.format_sqlresult() → itertools.chain[str]</text>

  <path d="M 400 435 L 400 450" class="arrow"/>

  <!-- Step 6: Terminal -->
  <rect x="150" y="455" width="200" height="45" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" class="box"/>
  <text x="250" y="475" text-anchor="middle" class="label">终端 / Pager</text>
  <text x="250" y="490" text-anchor="middle" class="mod">click.echo / echo_via_pager</text>

  <rect x="450" y="455" width="200" height="45" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" class="box"/>
  <text x="550" y="475" text-anchor="middle" class="label">Tee / Pipe / Once</text>
  <text x="550" y="490" text-anchor="middle" class="mod">iocommands.write_tee()</text>

  <path d="M 300 455 L 250 455" class="arrow"/>
  <path d="M 500 455 L 550 455" class="arrow"/>

  <!-- Background refresh annotation -->
  <rect x="560" y="125" width="220" height="70" rx="6" fill="#0d1117" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 2" class="box"/>
  <text x="670" y="148" text-anchor="middle" class="label" fill="#4ecdc4">后台补全刷新</text>
  <text x="670" y="165" text-anchor="middle" class="desc">daemon Thread · 独立连接</text>
  <text x="670" y="180" text-anchor="middle" class="mod">CompletionRefresher._bg_refresh()</text>

  <!-- Arrowhead -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>