<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <style>
    .bg { fill: #0b0d14; }
    .node-core { fill: #13162a; stroke: #f9ca24; stroke-width: 1.5; }
    .node-impl { fill: #13162a; stroke: #4ecdc4; stroke-width: 1.5; }
    .label-core { fill: #f9ca24; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .label-impl { fill: #4ecdc4; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .sub { fill: #7c8090; font-family: system-ui, sans-serif; font-size: 10px; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .legend-text { fill: #7c8090; font-family: system-ui, sans-serif; font-size: 10px; }
    path:hover { stroke: #6c8ef5 !important; stroke-width: 3 !important; cursor: pointer; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>

  <rect class="bg" width="600" height="400"/>

  <!-- Legend (bottom, left-aligned) -->
  <g transform="translate(30, 370)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
    <text x="20" y="11" class="legend-text">调度核心</text>
    <rect x="120" y="0" width="14" height="14" rx="2" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="140" y="11" class="legend-text">命令实现</text>
  </g>

  <!-- Hub: special/main.py (left, vertically centered) -->
  <rect x="30" y="145" width="200" height="100" rx="8" class="node-core"/>
  <text x="130" y="175" text-anchor="middle" class="label-core">special/main.py</text>
  <text x="130" y="195" text-anchor="middle" class="sub">COMMANDS 字典</text>
  <text x="130" y="212" text-anchor="middle" class="sub">execute() 调度</text>
  <text x="130" y="229" text-anchor="middle" class="sub">@special_command</text>

  <!-- 6 command modules (right, vertical stack) -->
  <rect x="380" y="30" width="180" height="44" rx="6" class="node-impl"/>
  <text x="470" y="50" text-anchor="middle" class="label-impl">dbcommands.py</text>
  <text x="470" y="66" text-anchor="middle" class="sub">表/列表操作</text>

  <rect x="380" y="86" width="180" height="44" rx="6" class="node-impl"/>
  <text x="470" y="106" text-anchor="middle" class="label-impl">iocommands.py</text>
  <text x="470" y="122" text-anchor="middle" class="sub">IO 路由控制</text>

  <rect x="380" y="142" width="180" height="44" rx="6" class="node-impl"/>
  <text x="470" y="162" text-anchor="middle" class="label-impl">favoritequeries.py</text>
  <text x="470" y="178" text-anchor="middle" class="sub">收藏查询存储</text>

  <rect x="380" y="198" width="180" height="44" rx="6" class="node-impl"/>
  <text x="470" y="218" text-anchor="middle" class="label-impl">dsn_aliases.py</text>
  <text x="470" y="234" text-anchor="middle" class="sub">别名映射</text>

  <rect x="380" y="254" width="180" height="44" rx="6" class="node-impl"/>
  <text x="470" y="274" text-anchor="middle" class="label-impl">llm.py</text>
  <text x="470" y="290" text-anchor="middle" class="sub">AI 助手</text>

  <rect x="380" y="310" width="180" height="44" rx="6" class="node-impl"/>
  <text x="470" y="330" text-anchor="middle" class="label-impl">delimitercommand.py</text>
  <text x="470" y="346" text-anchor="middle" class="sub">语句分隔符</text>

  <!-- Registration arrows (hub → modules) -->
  <path class="arrow" d="M 230 175 L 378 52" marker-end="url(#ah)"/>
  <path class="arrow" d="M 230 185 L 378 108" marker-end="url(#ah)"/>
  <path class="arrow" d="M 230 195 L 378 164" marker-end="url(#ah)"/>
  <path class="arrow" d="M 230 205 L 378 220" marker-end="url(#ah)"/>
  <path class="arrow" d="M 230 215 L 378 276" marker-end="url(#ah)"/>
  <path class="arrow" d="M 230 225 L 378 332" marker-end="url(#ah)"/>

  <text x="305" y="155" class="sub" fill="#7c8090">注册</text>

</svg>
