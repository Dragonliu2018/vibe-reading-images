<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <style>
    .bg { fill: #0b0d14; }
    .node-core { fill: rgba(249,202,36,0.12); stroke: #f9ca24; stroke-width: 1.5; }
    .node-impl { fill: rgba(78,205,196,0.12); stroke: #4ecdc4; stroke-width: 1.5; }
    .label-core { fill: #f9ca24; font-family: ui-monospace, monospace; font-size: 13px; font-weight: 600; }
    .label-impl { fill: #4ecdc4; font-family: ui-monospace, monospace; font-size: 13px; font-weight: 600; }
    .sub { fill: #8892a8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; }
    .arrow { stroke: #4a5568; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-label { fill: #636e8e; font-family: ui-monospace, monospace; font-size: 9px; }
    .title { fill: #c8d0dc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; }
    .legend-text { fill: #8892a8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5568"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="560"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" class="title">Special Commands — Module Architecture</text>

  <!-- Legend -->
  <g transform="translate(560, 12)">
    <rect x="0" y="0" width="14" height="14" rx="2" class="node-core"/>
    <text x="20" y="11" class="legend-text">Dispatch Core</text>
    <rect x="110" y="0" width="14" height="14" rx="2" class="node-impl"/>
    <text x="130" y="11" class="legend-text">Command Impl</text>
  </g>

  <!-- Central hub: special/main.py -->
  <g>
    <rect x="290" y="50" width="220" height="90" rx="10" class="node-core"/>
    <text x="400" y="75" text-anchor="middle" class="label-core">special/main.py</text>
    <text x="400" y="94" text-anchor="middle" class="sub">COMMANDS dict</text>
    <text x="400" y="108" text-anchor="middle" class="sub">execute() dispatcher</text>
    <text x="400" y="122" text-anchor="middle" class="sub">@special_command · ArgType enum</text>
  </g>

  <!-- 6 command modules -->
  <!-- dbcommands.py -->
  <g>
    <rect x="30" y="200" width="180" height="70" rx="10" class="node-impl"/>
    <text x="120" y="225" text-anchor="middle" class="label-impl">dbcommands.py</text>
    <text x="120" y="244" text-anchor="middle" class="sub">\dt \l status \u</text>
    <text x="120" y="258" text-anchor="middle" class="sub">table &amp; list ops</text>
  </g>

  <!-- iocommands.py -->
  <g>
    <rect x="240" y="200" width="180" height="70" rx="10" class="node-impl"/>
    <text x="330" y="225" text-anchor="middle" class="label-impl">iocommands.py</text>
    <text x="330" y="244" text-anchor="middle" class="sub">pager tee system \f</text>
    <text x="330" y="258" text-anchor="middle" class="sub">I/O routing</text>
  </g>

  <!-- favoritequeries.py -->
  <g>
    <rect x="450" y="200" width="180" height="70" rx="10" class="node-impl"/>
    <text x="540" y="225" text-anchor="middle" class="label-impl">favoritequeries.py</text>
    <text x="540" y="244" text-anchor="middle" class="sub">\fs \fd \f</text>
    <text x="540" y="258" text-anchor="middle" class="sub">saved query store</text>
  </g>

  <!-- dsn_aliases.py -->
  <g>
    <rect x="100" y="330" width="180" height="70" rx="10" class="node-impl"/>
    <text x="190" y="355" text-anchor="middle" class="label-impl">dsn_aliases.py</text>
    <text x="190" y="374" text-anchor="middle" class="sub">\ds \dl</text>
    <text x="190" y="388" text-anchor="middle" class="sub">alias mapping</text>
  </g>

  <!-- llm.py -->
  <g>
    <rect x="320" y="330" width="160" height="70" rx="10" class="node-impl"/>
    <text x="400" y="355" text-anchor="middle" class="label-impl">llm.py</text>
    <text x="400" y="374" text-anchor="middle" class="sub">\llm</text>
    <text x="400" y="388" text-anchor="middle" class="sub">AI assistant</text>
  </g>

  <!-- delimitercommand.py -->
  <g>
    <rect x="530" y="330" width="180" height="70" rx="10" class="node-impl"/>
    <text x="620" y="355" text-anchor="middle" class="label-impl">delimitercommand.py</text>
    <text x="620" y="374" text-anchor="middle" class="sub">delimiter</text>
    <text x="620" y="388" text-anchor="middle" class="sub">statement delim</text>
  </g>

  <!-- Registration arrows from main.py to each module -->
  <!-- to dbcommands -->
  <path class="arrow" d="M 350 140 C 250 160, 150 180, 120 200"/>
  <text x="200" y="172" class="arrow-label" transform="rotate(-12, 200, 172)">register</text>

  <!-- to iocommands -->
  <path class="arrow" d="M 400 140 L 330 200"/>
  <text x="355" y="172" class="arrow-label">register</text>

  <!-- to favoritequeries -->
  <path class="arrow" d="M 450 140 C 480 160, 520 180, 540 200"/>
  <text x="510" y="172" class="arrow-label">register</text>

  <!-- to dsn_aliases -->
  <path class="arrow" d="M 340 140 C 280 200, 240 260, 190 330"/>
  <text x="230" y="280" class="arrow-label" transform="rotate(20, 230, 280)">register</text>

  <!-- to llm -->
  <path class="arrow" d="M 400 140 C 400 220, 400 280, 400 330"/>
  <text x="410" y="260" class="arrow-label">register</text>

  <!-- to delimitercommand -->
  <path class="arrow" d="M 460 140 C 540 200, 600 260, 620 330"/>
  <text x="560" y="280" class="arrow-label" transform="rotate(-20, 560, 280)">register</text>

  <!-- Bottom note -->
  <text x="400" y="440" text-anchor="middle" class="sub">Each module uses @special_command decorator to register into COMMANDS dict</text>
  <text x="400" y="456" text-anchor="middle" class="sub">No reverse dependency — implementation modules never import special/main.py</text>
</svg>