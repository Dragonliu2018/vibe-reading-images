<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 12px; fill: #a0aec0; }
  </style>

  <!-- Layer 1: CLI / Entry -->
  <rect x="20" y="30" width="760" height="70" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="40" y="55" class="label" fill="#6c8ef5">CLI / 入口层</text>
  <text x="40" y="78" class="mod">main.py · cli_runner.py · main_modes/</text>

  <path d="M 400 105 L 400 120" stroke="#363b62" stroke-width="2"/>

  <!-- Layer 2: Client -->
  <rect x="20" y="125" width="760" height="70" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="40" y="150" class="label" fill="#4ecdc4">客户端层</text>
  <text x="40" y="173" class="mod">client.py · client_connection.py · client_query.py</text>

  <path d="M 400 200 L 400 215" stroke="#363b62" stroke-width="2"/>

  <!-- Layer 3: Execution -->
  <rect x="20" y="220" width="370" height="70" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="40" y="245" class="label" fill="#f9ca24">SQL 执行引擎</text>
  <text x="40" y="268" class="mod">sqlexecute.py</text>

  <rect x="410" y="220" width="370" height="70" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="430" y="245" class="label" fill="#f9ca24">特殊命令</text>
  <text x="430" y="268" class="mod">packages/special/</text>

  <path d="M 400 295 L 400 310" stroke="#363b62" stroke-width="2"/>

  <!-- Layer 4: Infrastructure -->
  <rect x="20" y="315" width="760" height="70" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="40" y="340" class="label" fill="#ff6b9d">基础设施层</text>
  <text x="40" y="363" class="mod">sqlcompleter.py · completion_engine.py · completion_refresher.py · output.py · config.py</text>
</svg>
