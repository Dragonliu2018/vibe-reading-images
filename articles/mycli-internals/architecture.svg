<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
  <rect width="800" height="430" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 12px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    path:hover, line:hover { stroke: #6c8ef5 !important; stroke-width: 3 !important; cursor: pointer; }
  </style>

  <!-- Layer 1: CLI / Entry -->
  <rect x="20" y="20" width="760" height="70" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="40" y="45" class="label" fill="#6c8ef5">CLI / 入口层</text>
  <text x="40" y="68" class="mod">main.py · cli_runner.py · main_modes/</text>

  <path d="M 400 90 L 400 123" class="arrow" marker-end="url(#ah)"/>

  <!-- Layer 2: Client -->
  <rect x="20" y="125" width="760" height="70" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="40" y="150" class="label" fill="#4ecdc4">客户端层</text>
  <text x="40" y="173" class="mod">client.py · client_connection.py · client_query.py</text>

  <path d="M 400 195 L 400 228" class="arrow" marker-end="url(#ah)"/>

  <!-- Layer 3: Execution -->
  <rect x="20" y="230" width="370" height="70" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="40" y="255" class="label" fill="#f9ca24">SQL 执行引擎</text>
  <text x="40" y="278" class="mod">sqlexecute.py</text>

  <rect x="410" y="230" width="370" height="70" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="430" y="255" class="label" fill="#f9ca24">特殊命令</text>
  <text x="430" y="278" class="mod">packages/special/</text>

  <path d="M 400 300 L 400 333" class="arrow" marker-end="url(#ah)"/>

  <!-- Layer 4: Infrastructure -->
  <rect x="20" y="335" width="760" height="70" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="40" y="360" class="label" fill="#ff6b9d">基础设施层</text>
  <text x="40" y="383" class="mod">sqlcompleter.py · completion_engine.py · completion_refresher.py · output.py · config.py</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
