<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <marker id="arrow-arch" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6075"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#0b0d14"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">SQL Execution Engine — Module Architecture</text>

  <!-- ClientConnectionMixin (cyan / client layer) -->
  <rect x="40" y="50" width="240" height="72" rx="8" fill="#151823" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="160" y="80" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">ClientConnectionMixin</text>
  <text x="160" y="100" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, -apple-system, sans-serif" font-size="11">connect · reconnect</text>

  <!-- ClientQueryMixin (cyan / client layer) -->
  <rect x="520" y="50" width="240" height="72" rx="8" fill="#151823" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="640" y="80" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">ClientQueryMixin</text>
  <text x="640" y="100" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, -apple-system, sans-serif" font-size="11">run_query · refresh</text>

  <!-- SQLExecute (yellow / execution layer) -->
  <rect x="290" y="200" width="220" height="72" rx="8" fill="#151823" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="230" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">SQLExecute</text>
  <text x="400" y="250" text-anchor="middle" fill="#f9ca24" font-family="system-ui, -apple-system, sans-serif" font-size="11">run · get_result</text>

  <!-- pymysql.Connection (pink / infrastructure) -->
  <rect x="80" y="350" width="220" height="72" rx="8" fill="#151823" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="190" y="380" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">pymysql.Connection</text>
  <text x="190" y="400" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, -apple-system, sans-serif" font-size="11">MySQL driver</text>

  <!-- ServerInfo / ServerSpecies (pink / infrastructure) -->
  <rect x="500" y="350" width="220" height="72" rx="8" fill="#151823" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="610" y="380" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">ServerInfo / Species</text>
  <text x="610" y="400" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, -apple-system, sans-serif" font-size="11">server detection</text>

  <!-- Arrows -->
  <!-- ClientConnectionMixin → SQLExecute -->
  <path d="M 160 122 L 160 165 L 340 165 L 340 200" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-arch)"/>
  <text x="210" y="158" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="10">creates</text>

  <!-- ClientQueryMixin → SQLExecute -->
  <path d="M 640 122 L 640 165 L 460 165 L 460 200" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-arch)"/>
  <text x="520" y="158" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="10">calls</text>

  <!-- SQLExecute → pymysql.Connection -->
  <path d="M 340 272 L 340 310 L 190 310 L 190 350" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-arch)"/>
  <text x="205" y="303" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="10">wraps</text>

  <!-- SQLExecute → ServerInfo -->
  <path d="M 460 272 L 460 310 L 610 310 L 610 350" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-arch)"/>
  <text x="500" y="303" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="10">detects</text>

  <!-- Legend -->
  <rect x="220" y="445" width="12" height="12" rx="2" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="240" y="455" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Client</text>
  <rect x="320" y="445" width="12" height="12" rx="2" fill="none" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="340" y="455" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Execution</text>
  <rect x="440" y="445" width="12" height="12" rx="2" fill="none" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="460" y="455" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Infrastructure</text>
</svg>