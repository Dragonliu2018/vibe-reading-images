<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <style>
    .bg { fill: #0b0d14; }
    .node-core { fill: rgba(249,202,36,0.12); stroke: #f9ca24; stroke-width: 1.5; }
    .node-impl { fill: rgba(78,205,196,0.12); stroke: #4ecdc4; stroke-width: 1.5; }
    .node-state { fill: rgba(255,107,157,0.12); stroke: #ff6b9d; stroke-width: 1.5; }
    .label-core { fill: #f9ca24; font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; }
    .label-impl { fill: #4ecdc4; font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; }
    .label-state { fill: #ff6b9d; font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; }
    .sub { fill: #8892a8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; }
    .arrow { stroke: #4a5568; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead2); }
    .arrow-data { stroke: #636e8e; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrowhead2); }
    .arrow-label { fill: #636e8e; font-family: ui-monospace, monospace; font-size: 9px; }
    .title { fill: #c8d0dc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; }
    .legend-text { fill: #8892a8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; }
    .path-label { fill: #c8d0dc; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5568"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="620"/>

  <!-- Title -->
  <text x="400" y="26" text-anchor="middle" class="title">Special Commands — Call Chain &amp; Data Flow</text>

  <!-- Legend -->
  <g transform="translate(490, 10)">
    <rect x="0" y="0" width="14" height="14" rx="2" class="node-core"/>
    <text x="20" y="11" class="legend-text">Dispatch</text>
    <rect x="80" y="0" width="14" height="14" rx="2" class="node-impl"/>
    <text x="100" y="11" class="legend-text">Implementation</text>
    <rect x="190" y="0" width="14" height="14" rx="2" class="node-state"/>
    <text x="210" y="11" class="legend-text">State</text>
  </g>

  <!-- Path A label -->
  <text x="200" y="58" class="path-label">Path A: execute(cur, sql)</text>
  <text x="200" y="73" class="sub" text-anchor="start">standard command dispatch</text>

  <!-- Path A nodes -->
  <g>
    <rect x="60" y="85" width="180" height="55" rx="10" class="node-core"/>
    <text x="150" y="106" text-anchor="middle" class="label-core">execute(cur, sql)</text>
    <text x="150" y="123" text-anchor="middle" class="sub">input: str</text>
  </g>

  <g>
    <rect x="60" y="160" width="180" height="55" rx="10" class="node-core"/>
    <text x="150" y="181" text-anchor="middle" class="label-core">parse_special_command()</text>
    <text x="150" y="198" text-anchor="middle" class="sub">→ command, arg, verbosity</text>
  </g>

  <g>
    <rect x="60" y="235" width="180" height="55" rx="10" class="node-core"/>
    <text x="150" y="256" text-anchor="middle" class="label-core">COMMANDS[command]</text>
    <text x="150" y="273" text-anchor="middle" class="sub">→ SpecialCommand, O(1)</text>
  </g>

  <!-- Branch: arg_type dispatch -->
  <g>
    <rect x="60" y="310" width="180" height="55" rx="10" class="node-core"/>
    <text x="150" y="331" text-anchor="middle" class="label-core">arg_type dispatch</text>
    <text x="150" y="348" text-anchor="middle" class="sub">NO_ARG / PARSED / RAW</text>
  </g>

  <!-- Three handler branches -->
  <g>
    <rect x="20" y="395" width="120" height="55" rx="10" class="node-impl"/>
    <text x="80" y="416" text-anchor="middle" class="label-impl">handler()</text>
    <text x="80" y="433" text-anchor="middle" class="sub">NO_ARGUMENT</text>
  </g>

  <g>
    <rect x="150" y="395" width="120" height="55" rx="10" class="node-impl"/>
    <text x="210" y="416" text-anchor="middle" class="label-impl">handler(cur, arg)</text>
    <text x="210" y="433" text-anchor="middle" class="sub">PARSED_QUERY</text>
  </g>

  <g>
    <rect x="280" y="395" width="120" height="55" rx="10" class="node-impl"/>
    <text x="340" y="416" text-anchor="middle" class="label-impl">handler(cur, query)</text>
    <text x="340" y="433" text-anchor="middle" class="sub">RAW_QUERY</text>
  </g>

  <!-- Result node -->
  <g>
    <rect x="130" y="475" width="200" height="50" rx="10" class="node-impl"/>
    <text x="230" y="496" text-anchor="middle" class="label-impl">→ list[SQLResult]</text>
    <text x="230" y="512" text-anchor="middle" class="sub">all paths return same type</text>
  </g>

  <!-- Path A arrows -->
  <path class="arrow" d="M 150 140 L 150 160"/>
  <path class="arrow" d="M 150 215 L 150 235"/>
  <path class="arrow" d="M 150 290 L 150 310"/>
  <path class="arrow" d="M 120 365 C 100 375, 80 385, 80 395"/>
  <path class="arrow" d="M 150 365 L 210 395"/>
  <path class="arrow" d="M 180 365 C 250 375, 320 385, 340 395"/>
  <path class="arrow" d="M 80 450 L 200 475"/>
  <path class="arrow" d="M 210 450 L 230 475"/>
  <path class="arrow" d="M 340 450 L 260 475"/>

  <!-- Path B label -->
  <text x="540" y="58" class="path-label">Path B: execute_favorite_query(cur, arg)</text>
  <text x="540" y="73" class="sub" text-anchor="start">\f command — template rendering</text>

  <!-- Path B nodes -->
  <g>
    <rect x="460" y="85" width="220" height="55" rx="10" class="node-core"/>
    <text x="570" y="106" text-anchor="middle" class="label-core">execute_favorite_query(cur, arg)</text>
    <text x="570" y="123" text-anchor="middle" class="sub">input: str (\f command)</text>
  </g>

  <g>
    <rect x="460" y="160" width="220" height="55" rx="10" class="node-impl"/>
    <text x="570" y="181" text-anchor="middle" class="label-impl">parse_favorite_query_args()</text>
    <text x="570" y="198" text-anchor="middle" class="sub">→ positional, template_values</text>
  </g>

  <g>
    <rect x="460" y="235" width="220" height="55" rx="10" class="node-state"/>
    <text x="570" y="256" text-anchor="middle" class="label-state">FavoriteQueries.get(name)</text>
    <text x="570" y="273" text-anchor="middle" class="sub">→ template SQL</text>
  </g>

  <g>
    <rect x="460" y="310" width="220" height="55" rx="10" class="node-impl"/>
    <text x="570" y="331" text-anchor="middle" class="label-impl">prepare_favorite_query_args()</text>
    <text x="570" y="348" text-anchor="middle" class="sub">→ marked_query, UUID marker for $1</text>
  </g>

  <g>
    <rect x="460" y="385" width="220" height="55" rx="10" class="node-impl"/>
    <text x="570" y="406" text-anchor="middle" class="label-impl">render_favorite_query()</text>
    <text x="570" y="423" text-anchor="middle" class="sub">→ rendered SQL (Jinja2)</text>
  </g>

  <g>
    <rect x="460" y="460" width="220" height="55" rx="10" class="node-impl"/>
    <text x="570" y="481" text-anchor="middle" class="label-impl">restore_favorite_query_args()</text>
    <text x="570" y="498" text-anchor="middle" class="sub">→ final SQL (marker restored)</text>
  </g>

  <g>
    <rect x="460" y="535" width="220" height="55" rx="10" class="node-impl"/>
    <text x="570" y="556" text-anchor="middle" class="label-impl">sqlparse.split()</text>
    <text x="570" y="573" text-anchor="middle" class="sub">→ execute() / cur.execute()</text>
  </g>

  <!-- Path B arrows -->
  <path class="arrow" d="M 570 140 L 570 160"/>
  <path class="arrow" d="M 570 215 L 570 235"/>
  <path class="arrow" d="M 570 290 L 570 310"/>
  <path class="arrow" d="M 570 365 L 570 385"/>
  <path class="arrow" d="M 570 440 L 570 460"/>
  <path class="arrow" d="M 570 515 L 570 535"/>

  <!-- Data flow labels on Path B -->
  <text x="580" y="155" class="arrow-label">raw args</text>
  <text x="580" y="230" class="arrow-label">name</text>
  <text x="580" y="305" class="arrow-label">template</text>
  <text x="580" y="380" class="arrow-label">marked</text>
  <text x="580" y="455" class="arrow-label">rendered</text>
  <text x="580" y="530" class="arrow-label">final SQL</text>

  <!-- Divider line between paths -->
  <line x1="420" y1="50" x2="420" y2="600" stroke="#2a2d3a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- Bottom note -->
  <text x="400" y="610" text-anchor="middle" class="sub">Path A: O(1) lookup → typed dispatch · Path B: template pipeline with UUID marker round-trip</text>
</svg>