<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <marker id="arrow-chain" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6075"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4055"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="#0b0d14"/>
<style>
  path:hover { stroke: #6c8ef5 !important; stroke-width: 3 !important; cursor: pointer; }
</style>
  <!-- Path titles -->
  <text x="210" y="38" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Path A — Query Execution</text>
  <text x="590" y="73" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Path B — Reconnection</text>

  <!-- Divider -->
  <line x1="400" y1="25" x2="400" y2="500" stroke="#1e2230" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== Path A nodes (left column, x=40, w=340) ===== -->

  <!-- 1. run_query (cyan) -->
  <rect x="40" y="55" width="340" height="55" rx="8" fill="#151823" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="210" y="78" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">run_query(query)</text>
  <text x="210" y="96" text-anchor="middle" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">input: str</text>

  <!-- 2. SQLExecute.run (yellow) -->
  <rect x="40" y="130" width="340" height="55" rx="8" fill="#151823" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="153" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">SQLExecute.run(statement)</text>
  <text x="210" y="171" text-anchor="middle" fill="#f9ca24" font-family="system-ui, -apple-system, sans-serif" font-size="11">Generator[SQLResult]</text>

  <!-- 3. split_queries (yellow) -->
  <rect x="40" y="205" width="340" height="55" rx="8" fill="#151823" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="228" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">split_queries()</text>
  <text x="210" y="246" text-anchor="middle" fill="#f9ca24" font-family="system-ui, -apple-system, sans-serif" font-size="11">list[str]</text>

  <!-- 4. execute (yellow) -->
  <rect x="40" y="280" width="340" height="55" rx="8" fill="#151823" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="303" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">special.execute / cur.execute</text>
  <text x="210" y="321" text-anchor="middle" fill="#f9ca24" font-family="system-ui, -apple-system, sans-serif" font-size="11">Cursor</text>

  <!-- 5. get_result (yellow) -->
  <rect x="40" y="355" width="340" height="55" rx="8" fill="#151823" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="378" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">get_result(cursor)</text>
  <text x="210" y="396" text-anchor="middle" fill="#f9ca24" font-family="system-ui, -apple-system, sans-serif" font-size="11">SQLResult</text>

  <!-- 6. nextset (yellow) -->
  <rect x="40" y="430" width="340" height="55" rx="8" fill="#151823" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="453" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">cur.nextset()</text>
  <text x="210" y="471" text-anchor="middle" fill="#f9ca24" font-family="system-ui, -apple-system, sans-serif" font-size="11">multi-result loop</text>

  <!-- Path A arrows -->
  <path d="M 210 110 L 210 130" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>
  <path d="M 210 185 L 210 205" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>
  <path d="M 210 260 L 210 280" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>
  <path d="M 210 335 L 210 355" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>
  <path d="M 210 410 L 210 430" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>

  <!-- Loop arrow: nextset → execute (left side) -->
  <path d="M 40 457 L 18 457 L 18 307 L 40 307" fill="none" stroke="#3a4055" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-loop)"/>
  <text x="6" y="382" fill="#5a6075" font-family="system-ui, -apple-system, sans-serif" font-size="10" transform="rotate(-90, 6, 382)">loop</text>

  <!-- ===== Path B nodes (right column, x=420, w=340) ===== -->

  <!-- 1. reconnect (cyan) -->
  <rect x="420" y="90" width="340" height="55" rx="8" fill="#151823" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="590" y="113" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">reconnect()</text>
  <text x="590" y="131" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, -apple-system, sans-serif" font-size="11">bool</text>

  <!-- 2. ping L1 (pink) -->
  <rect x="420" y="175" width="340" height="55" rx="8" fill="#151823" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="590" y="198" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">conn.ping(reconnect=False)</text>
  <text x="590" y="216" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, -apple-system, sans-serif" font-size="11">Level 1 — test only</text>

  <!-- 3. ping L2 (pink) -->
  <rect x="420" y="260" width="340" height="55" rx="8" fill="#151823" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="590" y="283" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">conn.ping(reconnect=True)</text>
  <text x="590" y="301" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, -apple-system, sans-serif" font-size="11">Level 2 — auto-reconnect</text>

  <!-- 4. connect L3 (pink) -->
  <rect x="420" y="345" width="340" height="55" rx="8" fill="#151823" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="590" y="368" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">sqlexecute.connect()</text>
  <text x="590" y="386" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, -apple-system, sans-serif" font-size="11">Level 3 — full reconnect</text>

  <!-- Path B arrows -->
  <path d="M 590 145 L 590 175" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>
  <path d="M 590 230 L 590 260" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>
  <path d="M 590 315 L 590 345" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>

  <!-- Fallback labels on Path B arrows -->
  <text x="600" y="163" fill="#5a6075" font-family="system-ui, -apple-system, sans-serif" font-size="10">fail →</text>
  <text x="600" y="248" fill="#5a6075" font-family="system-ui, -apple-system, sans-serif" font-size="10">fail →</text>
  <text x="600" y="333" fill="#5a6075" font-family="system-ui, -apple-system, sans-serif" font-size="10">fail →</text>

  <!-- Legend -->
  <rect x="200" y="510" width="12" height="12" rx="2" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="220" y="520" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Client</text>
  <rect x="300" y="510" width="12" height="12" rx="2" fill="none" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="320" y="520" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Execution</text>
  <rect x="420" y="510" width="12" height="12" rx="2" fill="none" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="440" y="520" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Infrastructure</text>
</svg>