<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <marker id="arrow-chain" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6075"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5,L0,10 z" fill="#3a4055"/>
    </marker>
  </defs>

  <rect width="800" height="560" fill="#0b0d14"/>
  <style>
    path:hover { stroke: #6c8ef5 !important; stroke-width: 3 !important; cursor: pointer; }
  </style>

  <text x="210" y="38" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">路径 A — 查询执行</text>
  <text x="590" y="38" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">路径 B — 重连</text>

  <line x1="400" y1="50" x2="400" y2="500" stroke="#1e2230" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== Path A (left, gap=27px → arrow=25px) ===== -->

  <rect x="40" y="55" width="340" height="55" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="210" y="78" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">run_query(query)</text>
  <text x="210" y="96" text-anchor="middle" fill="#8892a8" font-family="system-ui, sans-serif" font-size="11">input: str</text>

  <path d="M 210 110 L 210 135" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>

  <rect x="40" y="137" width="340" height="55" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="160" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SQLExecute.run(statement)</text>
  <text x="210" y="178" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="11">Generator[SQLResult]</text>

  <path d="M 210 192 L 210 217" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>

  <rect x="40" y="219" width="340" height="55" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="242" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">split_queries()</text>
  <text x="210" y="260" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="11">list[str]</text>

  <path d="M 210 274 L 210 299" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>

  <rect x="40" y="301" width="340" height="55" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="324" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">special.execute / cur.execute</text>
  <text x="210" y="342" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="11">Cursor</text>

  <path d="M 210 356 L 210 381" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>

  <rect x="40" y="383" width="340" height="55" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="406" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">get_result(cursor)</text>
  <text x="210" y="424" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="11">SQLResult</text>

  <path d="M 210 438 L 210 463" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>

  <rect x="40" y="465" width="340" height="55" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="210" y="488" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">cur.nextset()</text>
  <text x="210" y="506" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="11">多结果集循环</text>

  <!-- Loop arrow: nextset → execute -->
  <path d="M 40 492 L 18 492 L 18 328 L 40 328" fill="none" stroke="#3a4055" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-loop)"/>
  <text x="22" y="410" fill="#7a85a3" font-family="system-ui, sans-serif" font-size="10">loop</text>

  <!-- ===== Path B (right) ===== -->

  <rect x="420" y="90" width="340" height="55" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="590" y="113" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">reconnect()</text>
  <text x="590" y="131" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="11">bool</text>

  <path d="M 590 145 L 590 173" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>
  <text x="600" y="163" fill="#5a6075" font-family="system-ui, sans-serif" font-size="10">fail →</text>

  <rect x="420" y="175" width="340" height="55" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="590" y="198" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">conn.ping(reconnect=False)</text>
  <text x="590" y="216" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="11">第 1 级 — 轻量探测</text>

  <path d="M 590 230 L 590 258" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>
  <text x="600" y="248" fill="#5a6075" font-family="system-ui, sans-serif" font-size="10">fail →</text>

  <rect x="420" y="260" width="340" height="55" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="590" y="283" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">conn.ping(reconnect=True)</text>
  <text x="590" y="301" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="11">第 2 级 — 自动重连</text>

  <path d="M 590 315 L 590 343" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-chain)"/>
  <text x="600" y="333" fill="#5a6075" font-family="system-ui, sans-serif" font-size="10">fail →</text>

  <rect x="420" y="345" width="340" height="55" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="590" y="368" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">sqlexecute.connect()</text>
  <text x="590" y="386" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="11">第 3 级 — 全新连接</text>

  <!-- Legend (bottom-left) -->
  <rect x="30" y="525" width="12" height="12" rx="2" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="48" y="535" fill="#7c8090" font-family="system-ui, sans-serif" font-size="10">客户端</text>
  <rect x="110" y="525" width="12" height="12" rx="2" fill="none" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="128" y="535" fill="#7c8090" font-family="system-ui, sans-serif" font-size="10">执行层</text>
  <rect x="190" y="525" width="12" height="12" rx="2" fill="none" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="208" y="535" fill="#7c8090" font-family="system-ui, sans-serif" font-size="10">基础设施</text>

</svg>
