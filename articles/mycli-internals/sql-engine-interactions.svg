  <rect x="220" y="438" width="12" height="12" rx="2" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="240" y="448" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Client</text>
  <rect x="320" y="438" width="12" height="12" rx="2" fill="none" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="340" y="448" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Execution</text>
  <rect x="440" y="438" width="12" height="12" rx="2" fill="none" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="460" y="448" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Infrastructure</text>
</svg>