  <path d="M 490 135 L 530 135 L 530 70 L 570 70" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-int)"/>
  <path d="M 490 145 L 530 145 L 530 125 L 570 125" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-int)"/>
  <path d="M 490 155 L 530 155 L 530 180 L 570 180" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-int)"/>
  <path d="M 490 165 L 530 165 L 530 235 L 570 235" fill="none" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arrow-int)"/>

