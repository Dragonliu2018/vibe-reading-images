  <rect x="50" y="305" width="700" height="100" rx="10" fill="none" stroke="#2a3040" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="400" y="328" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">扇入 — 8 files (highest fan-in)</text>
