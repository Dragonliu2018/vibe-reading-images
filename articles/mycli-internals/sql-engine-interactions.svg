  <path d="M 400 305 L 400 180" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-fanin)"/>
  <text x="410" y="248" fill="#4ecdc4" font-family="system-ui, -apple-system, sans-serif" font-size="10">imported by</text>

