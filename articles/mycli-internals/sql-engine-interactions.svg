  <rect x="310" y="120" width="180" height="60" rx="8" fill="#1a1e2e" stroke="#f9ca24" stroke-width="2"/>
  <text x="400" y="145" text-anchor="middle" fill="#e8e8e8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">sqlexecute.py</text>
