  <!-- Title -->
  <text x="400" y="26" text-anchor="middle" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">SQL Execution Engine — Module Interactions</text>

  <!-- ===== Left: client_connection.py + its imports ===== -->

  <!-- client_connection.py (cyan) -->
  <rect x="30" y="55" width="210" height="55" rx="8" fill="#151823" stroke="#4ecdc4" stroke-width="1.5"/>
