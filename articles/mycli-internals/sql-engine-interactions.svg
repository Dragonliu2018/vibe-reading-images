  <text x="540" y="63" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="10">MySQL</text>
  <text x="540" y="118" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="10">split_queries</text>
  <text x="540" y="173" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="10">execute</text>
  <text x="540" y="228" fill="#8892a8" font-family="system-ui, -apple-system, sans-serif" font-size="10">SQLResult</text>

