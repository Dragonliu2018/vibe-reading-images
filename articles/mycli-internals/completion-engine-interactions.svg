<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <defs>
    <style>
      .mod-title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .mod-sub { font-family: system-ui, sans-serif; font-size: 10px; fill: #7c8090; }
      .ext-title { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #a0a4b8; }
      .edge-label { font-family: system-ui, sans-serif; font-size: 9px; fill: #5a6885; }
      .group-label { font-family: system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #8c90a0; }
      path:hover, line:hover { stroke: #6c8ef5 !important; stroke-width: 3 !important; cursor: pointer; }
    </style>
    <marker id="arr-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c90a0"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="#0b0d14"/>

  <!-- ============ LEFT COLUMN: External deps (grouped & centered on source module) ============ -->
  <text x="70" y="36" class="group-label">EXTERNAL DEPS</text>
  <line x1="70" y1="40" x2="220" y2="40" stroke="#8c90a0" stroke-width="0.5" opacity="0.6"/>

  <!-- Group 1: from completion_engine (centered on y=55-131, center=93) -->
  <rect x="70" y="54" width="150" height="36" rx="6" fill="#13162a" stroke="#6c7080" stroke-width="1"/>
  <text x="145" y="71" text-anchor="middle" class="ext-title">sqlparse</text>
  <text x="145" y="84" text-anchor="middle" class="mod-sub">SQL 解析</text>

  <rect x="70" y="96" width="150" height="36" rx="6" fill="#13162a" stroke="#6c7080" stroke-width="1"/>
  <text x="145" y="113" text-anchor="middle" class="ext-title">COMMANDS</text>
  <text x="145" y="126" text-anchor="middle" class="mod-sub">special.main</text>

  <!-- Group 2: from sqlcompleter (centered on y=205-285, center=245) -->
  <rect x="70" y="185" width="150" height="36" rx="6" fill="#13162a" stroke="#6c7080" stroke-width="1"/>
  <text x="145" y="202" text-anchor="middle" class="ext-title" font-size="10px">prompt_toolkit</text>
  <text x="145" y="215" text-anchor="middle" class="mod-sub">Completer 基类</text>

  <rect x="70" y="227" width="150" height="36" rx="6" fill="#13162a" stroke="#6c7080" stroke-width="1"/>
  <text x="145" y="244" text-anchor="middle" class="ext-title">rapidfuzz</text>
  <text x="145" y="257" text-anchor="middle" class="mod-sub">模糊匹配</text>

  <rect x="70" y="269" width="150" height="36" rx="6" fill="#13162a" stroke="#6c7080" stroke-width="1"/>
  <text x="145" y="286" text-anchor="middle" class="ext-title">pygments</text>
  <text x="145" y="299" text-anchor="middle" class="mod-sub">语法高亮</text>

  <!-- Group 3: from completion_refresher (centered on y=365-441, center=403) -->
  <rect x="70" y="385" width="150" height="36" rx="6" fill="#13162a" stroke="#6c7080" stroke-width="1"/>
  <text x="145" y="402" text-anchor="middle" class="ext-title">SQLExecute</text>
  <text x="145" y="415" text-anchor="middle" class="mod-sub">新建独立连接</text>

  <!-- ============ CENTER COLUMN: Internal modules ============ -->

  <rect x="290" y="55" width="200" height="76" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="390" y="79" text-anchor="middle" class="mod-title" fill="#f9ca24">completion_engine.py</text>
  <text x="390" y="99" text-anchor="middle" class="mod-sub">解析层 · suggest_type</text>
  <text x="390" y="115" text-anchor="middle" class="mod-sub">规则引擎 · 纯函数</text>

  <rect x="290" y="205" width="200" height="80" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="390" y="231" text-anchor="middle" class="mod-title" fill="#ff6b9d">sqlcompleter.py</text>
  <line x1="310" y1="239" x2="470" y2="239" stroke="#ff6b9d" stroke-width="0.5" opacity="0.6"/>
  <text x="390" y="257" text-anchor="middle" class="mod-sub">数据+匹配层 · 核心</text>
  <text x="390" y="273" text-anchor="middle" class="mod-sub">SQLCompleter · Fuzziness</text>

  <rect x="290" y="365" width="200" height="76" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="389" text-anchor="middle" class="mod-title" fill="#4ecdc4">completion_refresher.py</text>
  <text x="390" y="409" text-anchor="middle" class="mod-sub">异步刷新层 · daemon</text>
  <text x="390" y="425" text-anchor="middle" class="mod-sub">@refresher 注册表</text>

  <!-- ============ RIGHT COLUMN: Consumers ============ -->
  <text x="540" y="36" class="group-label">CONSUMERS</text>
  <line x1="540" y1="40" x2="760" y2="40" stroke="#8c90a0" stroke-width="0.5" opacity="0.6"/>

  <rect x="540" y="185" width="210" height="36" rx="6" fill="#13162a" stroke="#8c90a0" stroke-width="1"/>
  <text x="645" y="203" text-anchor="middle" class="ext-title" font-size="10px">client.py</text>
  <text x="645" y="215" text-anchor="middle" class="mod-sub" font-size="9px">主入口</text>

  <rect x="540" y="230" width="210" height="36" rx="6" fill="#13162a" stroke="#8c90a0" stroke-width="1"/>
  <text x="645" y="248" text-anchor="middle" class="ext-title" font-size="10px">client_query.py</text>
  <text x="645" y="260" text-anchor="middle" class="mod-sub" font-size="9px">查询交互</text>

  <rect x="540" y="275" width="210" height="36" rx="6" fill="#13162a" stroke="#8c90a0" stroke-width="1"/>
  <text x="645" y="293" text-anchor="middle" class="ext-title" font-size="10px">schema_prefetcher.py</text>
  <text x="645" y="305" text-anchor="middle" class="mod-sub" font-size="9px">schema 预取</text>

  <!-- ============ Edges ============ -->

  <!-- completion_engine → sqlcompleter (vertical) -->
  <path d="M390 131 L390 205" fill="none" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arr-yellow)"/>
  <text x="398" y="170" class="edge-label" fill="#f9ca24">imports suggest_type</text>

  <!-- completion_engine → sqlparse -->
  <path d="M290 72 L222 72" fill="none" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arr-yellow)"/>
  <text x="245" y="66" class="edge-label" fill="#f9ca24">imports</text>

  <!-- completion_engine → COMMANDS -->
  <path d="M290 114 L222 114" fill="none" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arr-yellow)"/>
  <text x="245" y="108" class="edge-label" fill="#f9ca24">imports</text>

  <!-- sqlcompleter → prompt_toolkit -->
  <path d="M290 220 L222 203" fill="none" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arr-pink)"/>
  <text x="245" y="195" class="edge-label" fill="#ff6b9d">imports</text>

  <!-- sqlcompleter → rapidfuzz -->
  <path d="M290 245 L222 245" fill="none" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arr-pink)"/>
  <text x="245" y="240" class="edge-label" fill="#ff6b9d">uses</text>

  <!-- sqlcompleter → pygments -->
  <path d="M290 270 L222 287" fill="none" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arr-pink)"/>
  <text x="245" y="300" class="edge-label" fill="#ff6b9d">uses</text>

  <!-- completion_refresher → sqlcompleter (vertical) -->
  <path d="M390 365 L390 285" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="398" y="330" class="edge-label" fill="#4ecdc4">imports SQLCompleter</text>

  <!-- completion_refresher → SQLExecute -->
  <path d="M290 403 L222 403" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="245" y="397" class="edge-label" fill="#4ecdc4">imports</text>

  <!-- consumers → sqlcompleter -->
  <path d="M540 203 L492 225" fill="none" stroke="#8c90a0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>
  <path d="M540 248 L492 248" fill="none" stroke="#8c90a0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>
  <path d="M540 293 L492 268" fill="none" stroke="#8c90a0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>
  <text x="538" y="200" class="edge-label" fill="#8c90a0" text-anchor="end">referenced by</text>

</svg>
