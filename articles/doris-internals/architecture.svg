  <rect x="380" y="96" width="200" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="480" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">JDBC / BI 工具</text>
