  <text x="260" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">Xnio NIO · 9030</text>
  <rect x="380" y="152" width="200" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
