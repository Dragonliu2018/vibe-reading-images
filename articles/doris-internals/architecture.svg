  <text x="440" y="243" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">两阶段 · Fragment 分发</text>
  <rect x="560" y="208" width="200" height="44" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
