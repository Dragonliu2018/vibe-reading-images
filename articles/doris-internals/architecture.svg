<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="660" fill="#0b0d14"/>

  <!-- 标题 -->
  <text x="440" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#e6e8f0" font-weight="bold">Apache Doris 4.1.3 分层架构</text>

  <!-- 层背景框（FE / BE） -->
  <rect x="16" y="50" width="848" height="262" rx="10" fill="none" stroke="#2a2e48" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="28" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#6c8ef5" font-weight="bold">FE (Java)</text>
  <rect x="16" y="338" width="848" height="276" rx="10" fill="none" stroke="#2a2e48" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="28" y="354" font-family="system-ui, sans-serif" font-size="11" fill="#6c8ef5" font-weight="bold">BE (C++)</text>

  <!-- L1 客户端 -->
  <text x="44" y="86" font-family="system-ui, sans-serif" font-size="13" fill="#4ecdc4" font-weight="bold">客户端</text>
  <rect x="160" y="96" width="200" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
