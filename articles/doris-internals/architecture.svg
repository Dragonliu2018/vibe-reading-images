  <text x="660" y="438" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">RuntimeFilter</text>
  <text x="660" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">build→scan 下推</text>
