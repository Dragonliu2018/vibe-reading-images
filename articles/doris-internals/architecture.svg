  <text x="700" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">HTTP API</text>
  <path d="M260,136 L260,150" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M480,136 L480,150" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M700,136 L700,150" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

