  <path d="M440,524 L440,538" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M660,524 L660,538" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

