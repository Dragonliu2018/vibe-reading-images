<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="720" fill="#0b0d14"/>

  <text x="440" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#e6e8f0" font-weight="bold">SELECT 查询端到端数据流</text>

  <!-- FE 区域 -->
  <rect x="40" y="44" width="800" height="340" rx="10" fill="none" stroke="#2a2e48" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="56" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#6c8ef5" font-weight="bold">FE (Java)</text>

  <!-- BE 区域 -->
  <rect x="40" y="396" width="800" height="252" rx="10" fill="none" stroke="#2a2e48" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="56" y="414" font-family="system-ui, sans-serif" font-size="11" fill="#6c8ef5" font-weight="bold">BE (C++)</text>

  <!-- FE 流程 -->
  <rect x="270" y="72" width="340" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="440" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">NereidsParser (ANTLR4 词法/语法解析)</text>
  <text x="440" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">SQL String → LogicalPlan</text>
  <path d="M440,112 L440,126" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="128" width="340" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="440" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">Analyzer 绑定 (BindRelation / BindExpression)</text>
  <text x="440" y="161" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">UnboundRelation → LogicalOlapScan</text>
  <path d="M440,168 L440,182" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="184" width="340" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="440" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">Rewriter 启发式重写 (13 组规则)</text>
  <text x="440" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">谓词下推 · 列裁剪 · 子查询解嵌</text>
  <path d="M440,224 L440,238" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="240" width="340" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="440" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">Optimizer — Cascades CBO</text>
  <text x="440" y="273" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">Memo/Group · 代价模型 → PhysicalPlan</text>
  <path d="M440,280 L440,294" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="296" width="340" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="440" y="314" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">PhysicalPlanTranslator + DistributePlanner</text>
  <text x="440" y="329" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">→ PlanFragment 树 → DistributedPlan</text>
  <path d="M440,336 L440,350" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="352" width="340" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="440" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">Coordinator.toThrift → TPipelineFragmentParams</text>
  <text x="440" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">两阶段调度 · 选 BE 副本</text>

  <!-- RPC 下发 (FE→BE) -->
  <path d="M610,372 L700,372 L700,440 L610,440" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#arrowPink)"/>
  <text x="710" y="402" font-family="system-ui, sans-serif" font-size="11" fill="#ff6b9d" font-weight="bold">gRPC</text>
  <text x="710" y="418" font-family="system-ui, sans-serif" font-size="11" fill="#ff6b9d">exec_plan_fragment</text>

  <!-- BE 流程 -->
  <rect x="120" y="424" width="490" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="365" y="442" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">FragmentMgr → PipelineFragmentContext</text>
  <text x="365" y="457" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">编译 TPlanNode 树 → Pipeline / Operator DAG → PipelineTask</text>
  <path d="M365,464 L365,478" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="480" width="490" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="365" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">OlapScanOperator → ScannerContext → BlockReader</text>
  <text x="365" y="513" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">读 Rowset/Segment 列存 → Block (列式 · 4096 行)</text>
  <path d="M365,520 L365,534" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="536" width="490" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="365" y="554" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">中间算子 Pull 模型 (Filter / Project / Agg / Join)</text>
  <text x="365" y="569" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">VExpr 向量化求值 · Block 流转</text>
  <path d="M365,576 L365,590" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="592" width="490" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="365" y="610" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">ResultSinkOperator → VMysqlResultWriter</text>
  <text x="365" y="625" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">→ ResultBlockBuffer 队列</text>

  <!-- RPC 回传 (BE→FE) -->
  <path d="M610,612 L760,612 L760,656 L610,656" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#arrowPink)"/>
  <text x="620" y="648" font-family="system-ui, sans-serif" font-size="11" fill="#ff6b9d" font-weight="bold">BRPC fetch_data</text>
  <text x="620" y="662" font-family="system-ui, sans-serif" font-size="11" fill="#ff6b9d">流式拉取 RowBatch</text>

  <!-- FE 结果返回 -->
  <rect x="120" y="648" width="490" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="365" y="666" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6e8f0">ResultReceiver → RowBatch → MySQL 行包 → 客户端</text>
  <text x="365" y="681" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">StmtExecutor.executeAndSendResult 循环 sendOnePacket</text>
  <path d="M365,632 L365,648" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 图例 -->
  <text x="56" y="704" font-family="system-ui, sans-serif" font-size="11" fill="#7a86b3">实线箭头：同进程调用</text>
  <text x="320" y="704" font-family="system-ui, sans-serif" font-size="11" fill="#ff6b9d">粉色虚线：FE↔BE 跨进程 RPC</text>

</svg>
