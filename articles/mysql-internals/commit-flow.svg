<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="550" fill="#0b0d14"/>

  <!-- 事务线程 -->
  <rect x="60" y="20" width="180" height="48" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="150" y="40" text-anchor="middle" fill="#e6edf3" font-size="13">事务线程 THD #1</text>
  <text x="150" y="58" text-anchor="middle" fill="#8892b0" font-size="11">COMMIT 请求</text>
  <rect x="280" y="20" width="180" height="48" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="370" y="40" text-anchor="middle" fill="#e6edf3" font-size="13">事务线程 THD #2</text>
  <text x="370" y="58" text-anchor="middle" fill="#8892b0" font-size="11">COMMIT 请求</text>
  <rect x="500" y="20" width="180" height="48" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="590" y="40" text-anchor="middle" fill="#e6edf3" font-size="13">事务线程 THD #3</text>
  <text x="590" y="58" text-anchor="middle" fill="#8892b0" font-size="11">COMMIT 请求</text>

  <!-- 汇聚箭头 -->
  <path d="M150,68 L116,196" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M370,68 L118,198" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M590,68 L120,200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="400" y="130" text-anchor="middle" fill="#8892b0" font-size="12" paint-order="stroke" stroke="#0b0d14" stroke-width="3">ha_commit_trans → tc_log（MYSQL_BIN_LOG）</text>
  <text x="400" y="152" text-anchor="middle" fill="#8892b0" font-size="12" paint-order="stroke" stroke="#0b0d14" stroke-width="3">leader 携带整个队列逐阶段推进，follower 挂起等待</text>

  <!-- 组提交四阶段 -->
  <rect x="30" y="200" width="168" height="84" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="114" y="224" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">① Flush 阶段</text>
  <text x="114" y="244" text-anchor="middle" fill="#8892b0" font-size="11">BINLOG_FLUSH_STAGE</text>
  <text x="114" y="262" text-anchor="middle" fill="#8892b0" font-size="11">write() 写入 binlog</text>
  <rect x="226" y="200" width="168" height="84" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="310" y="224" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">② Sync 阶段</text>
  <text x="310" y="244" text-anchor="middle" fill="#8892b0" font-size="11">SYNC_STAGE</text>
  <text x="310" y="262" text-anchor="middle" fill="#8892b0" font-size="11">fsync 刷盘（可合并）</text>
  <rect x="422" y="200" width="168" height="84" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="506" y="224" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">③ Commit 阶段</text>
  <text x="506" y="244" text-anchor="middle" fill="#8892b0" font-size="11">COMMIT_STAGE</text>
  <text x="506" y="262" text-anchor="middle" fill="#8892b0" font-size="11">ha_commit_low 引擎提交</text>
  <rect x="618" y="200" width="168" height="84" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="702" y="224" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">④ After Commit</text>
  <text x="702" y="244" text-anchor="middle" fill="#8892b0" font-size="11">AFTER_COMMIT_STAGE</text>
  <text x="702" y="262" text-anchor="middle" fill="#8892b0" font-size="11">半同步 ACK · 通知</text>

  <path d="M198,242 L224,242" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M394,242 L420,242" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M590,242 L616,242" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- InnoDB 提交 -->
  <path d="M506,284 L506,326" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="341" y="330" width="330" height="90" rx="6" fill="#13162a" stroke="#ff6b9d"/>
  <text x="506" y="354" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">InnoDB 提交</text>
  <text x="506" y="374" text-anchor="middle" fill="#8892b0" font-size="11">ha_commit_low → innobase_commit</text>
  <text x="506" y="392" text-anchor="middle" fill="#8892b0" font-size="11">trx_commit_for_mysql · 释放锁</text>
  <text x="506" y="410" text-anchor="middle" fill="#8892b0" font-size="11">GTID 按 commit 顺序写入 gtid_executed</text>

  <!-- 客户端返回 -->
  <path d="M702,284 L702,326" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="690" y="330" width="100" height="90" rx="6" fill="#13162a" stroke="#b388ff"/>
  <text x="740" y="370" text-anchor="middle" fill="#e6edf3" font-size="13">客户端</text>
  <text x="740" y="390" text-anchor="middle" fill="#8892b0" font-size="11">commit ack</text>

  <!-- redo 持久化 -->
  <path d="M506,420 L506,458" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="341" y="462" width="330" height="64" rx="6" fill="#13162a" stroke="#b388ff"/>
  <text x="506" y="486" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">redo 持久化</text>
  <text x="506" y="506" text-anchor="middle" fill="#8892b0" font-size="11">log_writer → log_flusher → fsync</text>

  <!-- 崩溃一致性注释 -->
  <rect x="30" y="330" width="280" height="90" rx="6" fill="#101425" stroke="#6c8ef5" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="170" y="354" text-anchor="middle" fill="#6c8ef5" font-size="13" font-weight="600">崩溃一致性（内部 2PC）</text>
  <text x="170" y="374" text-anchor="middle" fill="#8892b0" font-size="11">binlog 持久化先于引擎提交</text>
  <text x="170" y="392" text-anchor="middle" fill="#8892b0" font-size="11">宕机恢复按 binlog 决定重放 / 回滚</text>
</svg>
