<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="760" fill="#0b0d14"/>

  <!-- ===== 客户端层 ===== -->
  <rect x="10" y="20" width="780" height="86" rx="10" fill="#101425" stroke="#4ecdc4" stroke-opacity="0.45" stroke-dasharray="6 4"/>
  <text x="90" y="56" text-anchor="middle" fill="#4ecdc4" font-size="15" font-weight="600">客户端层</text>
  <text x="90" y="76" text-anchor="middle" fill="#8892b0" font-size="11">Clients</text>
  <rect x="170" y="36" width="140" height="54" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="240" y="60" text-anchor="middle" fill="#e6edf3" font-size="13">mysql 客户端</text>
  <text x="240" y="79" text-anchor="middle" fill="#8892b0" font-size="11">client/mysql.cc</text>
  <rect x="326" y="36" width="140" height="54" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="396" y="60" text-anchor="middle" fill="#e6edf3" font-size="13">备份 / binlog 工具</text>
  <text x="396" y="79" text-anchor="middle" fill="#8892b0" font-size="11">mysqldump 等</text>
  <rect x="482" y="36" width="140" height="54" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="552" y="60" text-anchor="middle" fill="#e6edf3" font-size="13">MySQL Router</text>
  <text x="552" y="79" text-anchor="middle" fill="#8892b0" font-size="11">router/</text>
  <rect x="638" y="36" width="140" height="54" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="708" y="60" text-anchor="middle" fill="#e6edf3" font-size="13">应用 / JDBC 驱动</text>
  <text x="708" y="79" text-anchor="middle" fill="#8892b0" font-size="11">Connector/J 等</text>

  <!-- ===== 连接层 ===== -->
  <rect x="10" y="140" width="780" height="86" rx="10" fill="#101425" stroke="#80c7ff" stroke-opacity="0.45" stroke-dasharray="6 4"/>
  <text x="90" y="176" text-anchor="middle" fill="#80c7ff" font-size="15" font-weight="600">连接层</text>
  <text x="90" y="196" text-anchor="middle" fill="#8892b0" font-size="11">Connection</text>
  <rect x="170" y="156" width="192" height="54" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="266" y="180" text-anchor="middle" fill="#e6edf3" font-size="13">Connection Handler</text>
  <text x="266" y="199" text-anchor="middle" fill="#8892b0" font-size="11">每连接一线程</text>
  <rect x="379" y="156" width="192" height="54" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="475" y="180" text-anchor="middle" fill="#e6edf3" font-size="13">THD 会话上下文</text>
  <text x="475" y="199" text-anchor="middle" fill="#8892b0" font-size="11">sql/sql_class.h</text>
  <rect x="588" y="156" width="192" height="54" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="684" y="180" text-anchor="middle" fill="#e6edf3" font-size="13">Protocol 协议层</text>
  <text x="684" y="199" text-anchor="middle" fill="#8892b0" font-size="11">text · binary · X</text>

  <!-- ===== SQL 层 ===== -->
  <rect x="10" y="260" width="780" height="86" rx="10" fill="#101425" stroke="#6c8ef5" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="90" y="296" text-anchor="middle" fill="#6c8ef5" font-size="15" font-weight="600">SQL 层</text>
  <text x="90" y="316" text-anchor="middle" fill="#8892b0" font-size="11">SQL Layer</text>
  <rect x="170" y="276" width="140" height="54" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="240" y="300" text-anchor="middle" fill="#e6edf3" font-size="13">Parser 解析器</text>
  <text x="240" y="319" text-anchor="middle" fill="#8892b0" font-size="11">sql_yacc.yy</text>
  <rect x="326" y="276" width="140" height="54" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="396" y="300" text-anchor="middle" fill="#e6edf3" font-size="13">Resolver / Item</text>
  <text x="396" y="319" text-anchor="middle" fill="#8892b0" font-size="11">语义解析 · 表达式</text>
  <rect x="482" y="276" width="140" height="54" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="552" y="300" text-anchor="middle" fill="#e6edf3" font-size="13">Optimizer 优化器</text>
  <text x="552" y="319" text-anchor="middle" fill="#8892b0" font-size="11">超图 DPhyp · Range</text>
  <rect x="638" y="276" width="140" height="54" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="708" y="300" text-anchor="middle" fill="#e6edf3" font-size="13">Executor 执行器</text>
  <text x="708" y="319" text-anchor="middle" fill="#8892b0" font-size="11">RowIterator 火山</text>

  <!-- ===== 服务基础设施（半宽）===== -->
  <rect x="10" y="380" width="460" height="124" rx="10" fill="#101425" stroke="#f9ca24" stroke-opacity="0.45" stroke-dasharray="6 4"/>
  <text x="90" y="424" text-anchor="middle" fill="#f9ca24" font-size="15" font-weight="600">服务基础设施</text>
  <text x="90" y="444" text-anchor="middle" fill="#8892b0" font-size="11">Infrastructure</text>
  <rect x="170" y="398" width="140" height="40" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="240" y="415" text-anchor="middle" fill="#e6edf3" font-size="12">Data Dictionary</text>
  <text x="240" y="431" text-anchor="middle" fill="#8892b0" font-size="10">sql/dd/</text>
  <rect x="326" y="398" width="132" height="40" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="392" y="415" text-anchor="middle" fill="#e6edf3" font-size="12">Binlog / 复制</text>
  <text x="392" y="431" text-anchor="middle" fill="#8892b0" font-size="10">sql/binlog · rpl_*</text>
  <rect x="170" y="446" width="140" height="40" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="240" y="463" text-anchor="middle" fill="#e6edf3" font-size="12">Perf. Schema</text>
  <text x="240" y="479" text-anchor="middle" fill="#8892b0" font-size="10">instrumentation</text>
  <rect x="326" y="446" width="132" height="40" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="392" y="463" text-anchor="middle" fill="#e6edf3" font-size="12">插件 / 组件框架</text>
  <text x="392" y="479" text-anchor="middle" fill="#8892b0" font-size="10">plugin · components</text>

  <!-- ===== 存储引擎层 ===== -->
  <rect x="10" y="532" width="780" height="86" rx="10" fill="#101425" stroke="#ff6b9d" stroke-opacity="0.5" stroke-dasharray="6 4"/>
  <text x="90" y="560" text-anchor="middle" fill="#ff6b9d" font-size="15" font-weight="600">存储引擎层</text>
  <text x="90" y="578" text-anchor="middle" fill="#8892b0" font-size="10">handler / handlerton</text>
  <rect x="170" y="548" width="140" height="54" rx="6" fill="#13162a" stroke="#ff6b9d"/>
  <text x="240" y="572" text-anchor="middle" fill="#e6edf3" font-size="13">InnoDB</text>
  <text x="240" y="591" text-anchor="middle" fill="#8892b0" font-size="11">事务 · 行锁 · MVCC</text>
  <rect x="326" y="548" width="140" height="54" rx="6" fill="#13162a" stroke="#ff6b9d"/>
  <text x="396" y="572" text-anchor="middle" fill="#e6edf3" font-size="13">MyISAM / TempTable</text>
  <text x="396" y="591" text-anchor="middle" fill="#8892b0" font-size="11">非事务 · 内存临时表</text>
  <rect x="482" y="548" width="140" height="54" rx="6" fill="#13162a" stroke="#ff6b9d"/>
  <text x="552" y="572" text-anchor="middle" fill="#e6edf3" font-size="13">PerfSchema 引擎</text>
  <text x="552" y="591" text-anchor="middle" fill="#8892b0" font-size="11">性能数据表</text>
  <rect x="638" y="548" width="140" height="54" rx="6" fill="#13162a" stroke="#ff6b9d"/>
  <text x="708" y="572" text-anchor="middle" fill="#e6edf3" font-size="13">NDB / CSV / 其他</text>
  <text x="708" y="591" text-anchor="middle" fill="#8892b0" font-size="11">可插拔引擎</text>

  <!-- ===== 文件层 ===== -->
  <rect x="10" y="652" width="780" height="86" rx="10" fill="#101425" stroke="#b388ff" stroke-opacity="0.45" stroke-dasharray="6 4"/>
  <text x="90" y="688" text-anchor="middle" fill="#b388ff" font-size="15" font-weight="600">文件层</text>
  <text x="90" y="708" text-anchor="middle" fill="#8892b0" font-size="11">Files</text>
  <rect x="170" y="668" width="192" height="54" rx="6" fill="#13162a" stroke="#b388ff"/>
  <text x="266" y="692" text-anchor="middle" fill="#e6edf3" font-size="13">表空间文件</text>
  <text x="266" y="711" text-anchor="middle" fill="#8892b0" font-size="11">.ibd · 系统表空间</text>
  <rect x="379" y="668" width="192" height="54" rx="6" fill="#13162a" stroke="#b388ff"/>
  <text x="475" y="692" text-anchor="middle" fill="#e6edf3" font-size="13">redo / undo log</text>
  <text x="475" y="711" text-anchor="middle" fill="#8892b0" font-size="11">#innodb_redo · undo</text>
  <rect x="588" y="668" width="192" height="54" rx="6" fill="#13162a" stroke="#b388ff"/>
  <text x="684" y="692" text-anchor="middle" fill="#e6edf3" font-size="13">binlog 文件</text>
  <text x="684" y="711" text-anchor="middle" fill="#8892b0" font-size="11">binlog.000001 · 索引</text>

  <!-- ===== 层间箭头 ===== -->
  <path d="M400,106 L400,138" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="400" y="127" text-anchor="middle" fill="#8892b0" font-size="11" paint-order="stroke" stroke="#0b0d14" stroke-width="3">TCP / socket</text>
  <path d="M400,226 L400,258" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="400" y="247" text-anchor="middle" fill="#8892b0" font-size="11" paint-order="stroke" stroke="#0b0d14" stroke-width="3">SQL 文本（COM_QUERY）</text>
  <path d="M310,346 L310,378" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="310" y="367" text-anchor="middle" fill="#8892b0" font-size="11" paint-order="stroke" stroke="#0b0d14" stroke-width="3">元数据 / 审计</text>
  <path d="M620,346 L620,530" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="632" y="443" text-anchor="start" fill="#8892b0" font-size="11" paint-order="stroke" stroke="#0b0d14" stroke-width="3">handler API 行操作</text>
  <path d="M310,504 L310,530" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="310" y="522" text-anchor="middle" fill="#8892b0" font-size="11" paint-order="stroke" stroke="#0b0d14" stroke-width="3">DD 系统表存储</text>
  <path d="M400,618 L400,650" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="400" y="639" text-anchor="middle" fill="#8892b0" font-size="11" paint-order="stroke" stroke="#0b0d14" stroke-width="3">页读写 / 日志追加</text>
</svg>
