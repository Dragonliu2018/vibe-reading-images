<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1270" viewBox="0 0 800 1270" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="1270" fill="#0b0d14"/>

  <!-- 阶段容器 -->
  <rect x="210" y="100" width="380" height="368" rx="10" fill="none" stroke="#80c7ff" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <text x="110" y="276" text-anchor="middle" fill="#80c7ff" font-size="14" font-weight="600">解析阶段</text>
  <text x="110" y="296" text-anchor="middle" fill="#8892b0" font-size="11">Parse</text>
  <rect x="210" y="458" width="380" height="354" rx="10" fill="none" stroke="#6c8ef5" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <text x="110" y="627" text-anchor="middle" fill="#6c8ef5" font-size="14" font-weight="600">计划阶段</text>
  <text x="110" y="647" text-anchor="middle" fill="#8892b0" font-size="11">Plan</text>
  <rect x="210" y="818" width="380" height="354" rx="10" fill="none" stroke="#4ecdc4" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <text x="110" y="987" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="600">执行阶段</text>
  <text x="110" y="1007" text-anchor="middle" fill="#8892b0" font-size="11">Execute</text>

  <!-- 节点 1：客户端 -->
  <rect x="230" y="24" width="340" height="52" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="400" y="47" text-anchor="middle" fill="#e6edf3" font-size="13">客户端发送 COM_QUERY</text>
  <text x="400" y="66" text-anchor="middle" fill="#8892b0" font-size="11">TCP / socket · SQL 文本</text>
  <text x="608" y="54" text-anchor="start" fill="#8892b0" font-size="11">SQL 文本</text>

  <path d="M400,76 L400,110" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- 解析阶段节点 -->
  <rect x="230" y="114" width="340" height="52" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="400" y="137" text-anchor="middle" fill="#e6edf3" font-size="13">do_command → dispatch_command</text>
  <text x="400" y="156" text-anchor="middle" fill="#8892b0" font-size="11">sql/sql_parse.cc:1347</text>
  <path d="M400,166 L400,200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="230" y="204" width="340" height="52" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="400" y="227" text-anchor="middle" fill="#e6edf3" font-size="13">dispatch_sql_command</text>
  <text x="400" y="246" text-anchor="middle" fill="#8892b0" font-size="11">解析前/后重写插件 · 查询日志</text>
  <path d="M400,256 L400,290" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="230" y="294" width="340" height="52" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="400" y="317" text-anchor="middle" fill="#e6edf3" font-size="13">THD::sql_parser</text>
  <text x="400" y="336" text-anchor="middle" fill="#8892b0" font-size="11">bison 语法分析（sql_yacc.yy）</text>
  <text x="608" y="324" text-anchor="start" fill="#8892b0" font-size="11">PT_* 语法树</text>
  <path d="M400,346 L400,380" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="230" y="384" width="340" height="52" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="400" y="407" text-anchor="middle" fill="#e6edf3" font-size="13">LEX::make_sql_cmd</text>
  <text x="400" y="426" text-anchor="middle" fill="#8892b0" font-size="11">Parse_tree_root → Sql_cmd 对象</text>
  <text x="608" y="414" text-anchor="start" fill="#8892b0" font-size="11">Sql_cmd_dml</text>
  <path d="M400,436 L400,470" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- 计划阶段节点 -->
  <rect x="230" y="474" width="340" height="52" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="400" y="497" text-anchor="middle" fill="#e6edf3" font-size="13">mysql_execute_command</text>
  <text x="400" y="516" text-anchor="middle" fill="#8892b0" font-size="11">命令分发（sql_parse.cc:3027）</text>
  <text x="608" y="504" text-anchor="start" fill="#8892b0" font-size="11">THD::lex</text>
  <path d="M400,526 L400,560" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="230" y="564" width="340" height="52" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="400" y="587" text-anchor="middle" fill="#e6edf3" font-size="13">Sql_cmd_dml::execute → prepare</text>
  <text x="400" y="606" text-anchor="middle" fill="#8892b0" font-size="11">Query_block::prepare · 开表 · 权限</text>
  <text x="608" y="594" text-anchor="start" fill="#8892b0" font-size="11">Query_block</text>
  <path d="M400,616 L400,650" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="230" y="654" width="340" height="52" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="400" y="677" text-anchor="middle" fill="#e6edf3" font-size="13">JOIN::optimize</text>
  <text x="400" y="696" text-anchor="middle" fill="#8892b0" font-size="11">FindBestQueryPlan · 超图 DPhyp 搜索</text>
  <text x="608" y="684" text-anchor="start" fill="#8892b0" font-size="11">JoinHypergraph</text>
  <path d="M400,706 L400,740" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="230" y="744" width="340" height="52" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="400" y="767" text-anchor="middle" fill="#e6edf3" font-size="13">FinalizePlanForQueryBlock</text>
  <text x="400" y="786" text-anchor="middle" fill="#8892b0" font-size="11">物理计划落地 · 附加 Filter/Sort</text>
  <text x="608" y="774" text-anchor="start" fill="#8892b0" font-size="11">AccessPath 树</text>
  <path d="M400,796 L400,830" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- 执行阶段节点 -->
  <rect x="230" y="834" width="340" height="52" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="400" y="857" text-anchor="middle" fill="#e6edf3" font-size="13">CreateIteratorFromAccessPath</text>
  <text x="400" y="876" text-anchor="middle" fill="#8892b0" font-size="11">access_path.cc:686 · 迭代式栈展开</text>
  <text x="608" y="864" text-anchor="start" fill="#8892b0" font-size="11">RowIterator 树</text>
  <path d="M400,886 L400,920" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="230" y="924" width="340" height="52" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="400" y="947" text-anchor="middle" fill="#e6edf3" font-size="13">ExecuteIteratorQuery</text>
  <text x="400" y="966" text-anchor="middle" fill="#8892b0" font-size="11">Init + Read 拉取循环（sql_union.cc:1068）</text>
  <path d="M400,976 L400,1010" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="230" y="1014" width="340" height="52" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="400" y="1037" text-anchor="middle" fill="#e6edf3" font-size="13">TableScanIterator::DoRead</text>
  <text x="400" y="1056" text-anchor="middle" fill="#8892b0" font-size="11">ha_rnd_next（handler API 封装）</text>
  <text x="608" y="1044" text-anchor="start" fill="#8892b0" font-size="11">uchar *record</text>
  <path d="M400,1066 L400,1100" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="230" y="1104" width="340" height="52" rx="6" fill="#13162a" stroke="#ff6b9d"/>
  <text x="400" y="1127" text-anchor="middle" fill="#e6edf3" font-size="13">InnoDB row_search_mvcc</text>
  <text x="400" y="1146" text-anchor="middle" fill="#8892b0" font-size="11">B-tree 游标 · MVCC 可见性判断</text>
  <text x="608" y="1134" text-anchor="start" fill="#8892b0" font-size="11">rec_t 页记录</text>
  <path d="M400,1156 L400,1190" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- 输出节点 -->
  <rect x="230" y="1194" width="340" height="52" rx="6" fill="#13162a" stroke="#b388ff"/>
  <text x="400" y="1217" text-anchor="middle" fill="#e6edf3" font-size="13">Query_result::send_data</text>
  <text x="400" y="1236" text-anchor="middle" fill="#8892b0" font-size="11">行结果编码 · 协议返回客户端</text>
  <text x="608" y="1224" text-anchor="start" fill="#8892b0" font-size="11">Protocol 行包</text>
</svg>
