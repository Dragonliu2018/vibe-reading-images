<text x="70" y="55" fill="#e8eaf2" font-size="14" font-weight="600">Wsrep_server_state 节点状态机（sql/wsrep_server_state.cc，状态机本体在 wsrep-lib）</text>
<text x="70" y="75" fill="#8a93b8" font-size="11">synced 是可服务查询的就绪门（wsrep_ready_set）；donor 是捐献 SST 时的旁路态；connected 由 wsrep_init 的 load_provider 驱动</text>
