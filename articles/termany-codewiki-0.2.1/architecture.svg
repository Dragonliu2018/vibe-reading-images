<svg xmlns="http://www.w3.org/2000/svg" width="820" height="670" viewBox="0 0 820 670" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="670" fill="#0b0d14"/>
  <text x="30" y="30" font-size="16" font-weight="600" fill="#e6e9f5">Termany v0.2.1 分层架构 · local-first, cloud-ready</text>

  <!-- L1 桌面壳层 -->
  <rect x="40" y="48" width="740" height="96" rx="10" fill="none" stroke="#80c7ff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="58" y="72" font-size="14" font-weight="600" fill="#80c7ff">桌面壳层 · apps/desktop（Tauri 2 · Rust ~1.4k 行）</text>
  <rect x="58" y="84" width="226" height="48" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1" opacity="0.85"/>
  <text x="171" y="113" font-size="12" fill="#e6e9f5" text-anchor="middle">窗口 / 托盘 / 全局快捷键 / 更新</text>
  <rect x="296" y="84" width="226" height="48" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1" opacity="0.85"/>
  <text x="409" y="113" font-size="12" fill="#e6e9f5" text-anchor="middle">spawn 并看护 Node server</text>
  <rect x="534" y="84" width="226" height="48" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1" opacity="0.85"/>
  <text x="647" y="113" font-size="12" fill="#e6e9f5" text-anchor="middle">多窗口 page 独占仲裁</text>

  <!-- L2 共享 UI 层 -->
  <rect x="40" y="168" width="740" height="96" rx="10" fill="none" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="58" y="192" font-size="14" font-weight="600" fill="#6c8ef5">共享 UI 层 · apps/web（React 18 + xterm.js · ~45k 行）</text>
  <rect x="58" y="204" width="226" height="48" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1" opacity="0.85"/>
  <text x="171" y="233" font-size="12" fill="#e6e9f5" text-anchor="middle">Workspace▸Page▸Tab▸Pane 布局</text>
  <rect x="296" y="204" width="226" height="48" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1" opacity="0.85"/>
  <text x="409" y="233" font-size="12" fill="#e6e9f5" text-anchor="middle">AgentPane 聊天与群聊</text>
  <rect x="534" y="204" width="226" height="48" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1" opacity="0.85"/>
  <text x="647" y="233" font-size="12" fill="#e6e9f5" text-anchor="middle">主题 · i18n · 工具组件</text>

  <!-- L3 核心接缝层 -->
  <rect x="40" y="288" width="740" height="96" rx="10" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="58" y="312" font-size="14" font-weight="600" fill="#f9ca24">核心接缝层 · packages/core（零依赖 TS · 322 行）</text>
  <rect x="58" y="324" width="226" height="48" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1" opacity="0.85"/>
  <text x="171" y="353" font-size="12" fill="#e6e9f5" text-anchor="middle">ITerminalBackend</text>
  <rect x="296" y="324" width="226" height="48" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1" opacity="0.85"/>
  <text x="409" y="353" font-size="12" fill="#e6e9f5" text-anchor="middle">WebSocketBackend</text>
  <rect x="534" y="324" width="226" height="48" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1" opacity="0.85"/>
  <text x="647" y="353" font-size="12" fill="#e6e9f5" text-anchor="middle">ShellExit · AgentRuntimeConfig</text>

  <!-- L4 本地服务层 -->
  <rect x="40" y="408" width="740" height="110" rx="10" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="58" y="432" font-size="14" font-weight="600" fill="#4ecdc4">本地服务层 · apps/server（Node 24 · node-pty + ws + SQLite）</text>
  <rect x="58" y="444" width="167" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1" opacity="0.85"/>
  <text x="141" y="468" font-size="12" fill="#e6e9f5" text-anchor="middle">PTY host</text>
  <text x="141" y="487" font-size="12" fill="#e6e9f5" text-anchor="middle">+ ~40 REST 端点</text>
  <rect x="237" y="444" width="167" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1" opacity="0.85"/>
  <text x="320" y="468" font-size="12" fill="#e6e9f5" text-anchor="middle">ACP 运行时</text>
  <text x="320" y="487" font-size="12" fill="#e6e9f5" text-anchor="middle">acpRuntime.ts</text>
  <rect x="416" y="444" width="167" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1" opacity="0.85"/>
  <text x="499" y="468" font-size="12" fill="#e6e9f5" text-anchor="middle">活动追踪</text>
  <text x="499" y="487" font-size="12" fill="#e6e9f5" text-anchor="middle">会话历史 / 用量</text>
  <rect x="595" y="444" width="167" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1" opacity="0.85"/>
  <text x="678" y="468" font-size="12" fill="#e6e9f5" text-anchor="middle">Git / SSH</text>
  <text x="678" y="487" font-size="12" fill="#e6e9f5" text-anchor="middle">端口转发 · trzsz</text>

  <!-- L5 外部进程 -->
  <rect x="40" y="546" width="740" height="96" rx="10" fill="none" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="58" y="570" font-size="14" font-weight="600" fill="#b388ff">外部进程（用户机器上已存在）</text>
  <rect x="58" y="582" width="167" height="48" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1" opacity="0.85"/>
  <text x="141" y="611" font-size="12" fill="#e6e9f5" text-anchor="middle">login shell（-l）</text>
  <rect x="237" y="582" width="167" height="48" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1" opacity="0.85"/>
  <text x="320" y="611" font-size="12" fill="#e6e9f5" text-anchor="middle">agent CLI</text>
  <rect x="416" y="582" width="167" height="48" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1" opacity="0.85"/>
  <text x="499" y="611" font-size="12" fill="#e6e9f5" text-anchor="middle">ACP bridge</text>
  <rect x="595" y="582" width="167" height="48" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1" opacity="0.85"/>
  <text x="678" y="611" font-size="12" fill="#e6e9f5" text-anchor="middle">ssh（ControlMaster）</text>

  <!-- 层间箭头 -->
  <path d="M 410 144 L 410 168" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="422" y="160" font-size="11" fill="#a8b2cf" paint-order="stroke" stroke="#0b0d14" stroke-width="3">webview 载入 web/dist · invoke / emit</text>
  <path d="M 410 264 L 410 288" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="422" y="280" font-size="11" fill="#a8b2cf" paint-order="stroke" stroke="#0b0d14" stroke-width="3">实现 ITerminalBackend（the ONE seam）</text>
  <path d="M 410 384 L 410 408" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="422" y="400" font-size="11" fill="#a8b2cf" paint-order="stroke" stroke="#0b0d14" stroke-width="3">WebSocket 文本帧 + CLOSE 4000 · REST / NDJSON</text>
  <path d="M 410 518 L 410 546" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="422" y="536" font-size="11" fill="#a8b2cf" paint-order="stroke" stroke="#0b0d14" stroke-width="3">PTY spawn · stdio JSON-RPC（ACP）· ssh argv</text>
</svg>
