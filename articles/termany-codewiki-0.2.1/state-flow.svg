<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="600" fill="#0b0d14"/>
  <text x="30" y="24" font-size="16" font-weight="600" fill="#e6e9f5">运行时状态流（四台状态机）</text>

  <!-- A. Agent 活动 -->
  <rect x="25" y="40" width="375" height="230" rx="10" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="35" y="64" font-size="13" font-weight="600" fill="#e6e9f5">Agent 活动（pane 任务状态机）</text>
  <rect x="45" y="90" width="85" height="36" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="87" y="112" font-size="12" fill="#e6e9f5" text-anchor="middle">无任务</text>
  <rect x="185" y="90" width="120" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="245" y="112" font-size="12" fill="#f9ca24" text-anchor="middle">working</text>
  <rect x="190" y="200" width="110" height="36" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="245" y="222" font-size="12" fill="#4ecdc4" text-anchor="middle">done</text>
  <rect x="55" y="200" width="110" height="36" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="110" y="222" font-size="12" fill="#ff6b9d" text-anchor="middle">needs attention</text>
  <rect x="325" y="200" width="65" height="36" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="357" y="222" font-size="12" fill="#a8b2cf" text-anchor="middle">已确认</text>
  <path d="M 130 108 L 185 108" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="157" y="100" font-size="10" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">startTask</text>
  <path d="M 245 126 L 245 200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="253" y="166" font-size="11" fill="#a8b2cf" paint-order="stroke" stroke="#0b0d14" stroke-width="3">静默 2s · 进程组归还</text>
  <path d="M 185 126 L 185 150 L 100 150 L 100 200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="142" y="144" font-size="11" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">确认菜单</text>
  <path d="M 300 218 L 312 218 L 312 160 L 268 160 L 268 126" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="290" y="154" font-size="11" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">同 epoch spinner 重绘</text>
  <path d="M 300 218 L 325 218" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="312" y="210" font-size="10" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">ack</text>
  <text x="110" y="262" font-size="11" fill="#8b93b8" text-anchor="middle">证据：输入行 · TUI 横幅 · OSC 778 · 前台进程组</text>

  <!-- B. WebSocketBackend 连接 -->
  <rect x="420" y="40" width="375" height="230" rx="10" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="430" y="64" font-size="13" font-weight="600" fill="#e6e9f5">WebSocketBackend 连接状态</text>
  <rect x="450" y="90" width="140" height="36" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="520" y="112" font-size="11" fill="#e6e9f5" text-anchor="middle">connecting（未连上）</text>
  <rect x="645" y="90" width="90" height="36" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="690" y="112" font-size="12" fill="#4ecdc4" text-anchor="middle">open</text>
  <rect x="450" y="200" width="140" height="36" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="520" y="222" font-size="11" fill="#ff6b9d" text-anchor="middle">failed · exitCb(reason)</text>
  <rect x="640" y="200" width="150" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="715" y="222" font-size="12" fill="#6c8ef5" text-anchor="middle">closed · 会话结束</text>
  <path d="M 590 108 L 645 108" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="617" y="100" font-size="10" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">onopen</text>
  <path d="M 470 126 L 470 148 L 505 148 L 505 126" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="455" y="162" font-size="11" fill="#a8b2cf" paint-order="stroke" stroke="#0b0d14" stroke-width="3">退避重试 ≤8</text>
  <path d="M 520 126 L 520 200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="528" y="166" font-size="11" fill="#a8b2cf" paint-order="stroke" stroke="#0b0d14" stroke-width="3">重试耗尽</text>
  <path d="M 690 126 L 690 200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="698" y="166" font-size="11" fill="#a8b2cf" paint-order="stroke" stroke="#0b0d14" stroke-width="3">CLOSE 4000</text>

  <!-- C. shell 退出处置 -->
  <rect x="25" y="300" width="375" height="260" rx="10" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="35" y="324" font-size="13" font-weight="600" fill="#e6e9f5">shell 退出处置（shellExitDisposition）</text>
  <rect x="40" y="350" width="100" height="36" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="90" y="372" font-size="12" fill="#e6e9f5" text-anchor="middle">onExit(exit)</text>
  <rect x="250" y="350" width="120" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="310" y="372" font-size="12" fill="#f9ca24" text-anchor="middle">restart（≤5 次）</text>
  <rect x="250" y="450" width="120" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="310" y="472" font-size="12" fill="#6c8ef5" text-anchor="middle">close pane</text>
  <path d="M 140 368 L 250 368" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="195" y="360" font-size="11" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">异常/未知退出</text>
  <path d="M 90 386 L 90 432 L 280 432 L 280 450" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="185" y="426" font-size="11" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">正常 exit（用户退出）</text>
  <path d="M 330 386 L 330 406 L 360 406 L 360 386" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="318" y="424" font-size="11" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">重新 spawn</text>
  <text x="35" y="528" font-size="11" fill="#8b93b8">重启上限 5 次（健康存活 3s 重置）；超限写 [session ended] 后保留 pane</text>

  <!-- D. ACP Runtime 生命周期 -->
  <rect x="420" y="300" width="375" height="260" rx="10" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="430" y="324" font-size="13" font-weight="600" fill="#e6e9f5">ACP Runtime 生命周期</text>
  <rect x="450" y="350" width="90" height="36" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="495" y="372" font-size="12" fill="#e6e9f5" text-anchor="middle">spawn</text>
  <rect x="570" y="350" width="120" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="630" y="372" font-size="12" fill="#f9ca24" text-anchor="middle">initialize（60s）</text>
  <rect x="450" y="450" width="90" height="36" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="495" y="472" font-size="12" fill="#4ecdc4" text-anchor="middle">ready</text>
  <rect x="570" y="450" width="120" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="630" y="472" font-size="12" fill="#6c8ef5" text-anchor="middle">prompting</text>
  <rect x="715" y="450" width="75" height="36" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="752" y="472" font-size="12" fill="#a8b2cf" text-anchor="middle">exited</text>
  <path d="M 540 368 L 570 368" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 630 386 L 630 420 L 495 420 L 495 450" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="560" y="414" font-size="11" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">能力协商</text>
  <path d="M 540 468 L 570 468" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 630 486 L 630 512 L 495 512 L 495 486" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="560" y="528" font-size="11" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">turn 结束</text>
  <path d="M 690 368 L 752 368 L 752 450" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="721" y="360" font-size="11" fill="#a8b2cf" text-anchor="middle" paint-order="stroke" stroke="#0b0d14" stroke-width="3">超时/崩溃</text>
  <path d="M 690 468 L 715 468" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="430" y="548" font-size="11" fill="#8b93b8">60s 启动超时；进程退出 → cancelPermissions + runtimes 摘除</text>
</svg>
