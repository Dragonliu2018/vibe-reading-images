<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e74c3c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="430" fill="#0b0d14"/>

  <!-- ===== 上区：事务状态机 ===== -->
  <text x="440" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">导入事务状态机</text>
  <text x="440" y="44" text-anchor="middle" fill="#9aa3c2" font-size="11">TransactionStatus · 两阶段提交</text>

  <rect x="70" y="80" width="110" height="40" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="125" y="105" text-anchor="middle" fill="#e6e8f0" font-size="13">PREPARE</text>

  <rect x="230" y="80" width="130" height="40" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="295" y="105" text-anchor="middle" fill="#e6e8f0" font-size="13">PRECOMMITTED</text>

  <rect x="410" y="80" width="120" height="40" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="470" y="105" text-anchor="middle" fill="#e6e8f0" font-size="13">COMMITTED</text>

  <rect x="580" y="80" width="110" height="40" rx="6" fill="#13162a" stroke="#7bed9f"/>
  <text x="635" y="105" text-anchor="middle" fill="#e6e8f0" font-size="13">VISIBLE</text>

  <rect x="300" y="170" width="120" height="40" rx="6" fill="#13162a" stroke="#e74c3c"/>
  <text x="360" y="195" text-anchor="middle" fill="#e6e8f0" font-size="13">ABORTED</text>

  <!-- 主链 -->
  <path d="M180,100 L230,100" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="93" text-anchor="middle" fill="#9aa3c2" font-size="10">precommit</text>
  <path d="M360,100 L410,100" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="93" text-anchor="middle" fill="#9aa3c2" font-size="10">commit</text>
  <path d="M530,100 L580,100" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="555" y="93" text-anchor="middle" fill="#9aa3c2" font-size="10">publish</text>

  <!-- PREPARE → ABORTED (左下绕) -->
  <path d="M125,120 L125,190 L300,190" stroke="#e74c3c" stroke-width="1.5" fill="none" marker-end="url(#arrowr)"/>
  <text x="140" y="158" fill="#e74c3c" font-size="10">abort</text>
  <!-- COMMITTED → ABORTED (右下绕) -->
  <path d="M470,120 L470,190 L420,190" stroke="#e74c3c" stroke-width="1.5" fill="none" marker-end="url(#arrowr)"/>
  <text x="480" y="158" fill="#e74c3c" font-size="10">rollback</text>

  <!-- ===== 分隔线 ===== -->
  <line x1="40" y1="235" x2="840" y2="235" stroke="#2a2e45" stroke-dasharray="4 4"/>

  <!-- ===== 下区：优化器回退状态 ===== -->
  <text x="440" y="258" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">优化器回退状态</text>
  <text x="440" y="276" text-anchor="middle" fill="#9aa3c2" font-size="11">StmtExecutor · Nereids 默认 + Legacy 回退</text>

  <rect x="60" y="305" width="110" height="40" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="115" y="330" text-anchor="middle" fill="#e6e8f0" font-size="13">SQL 入口</text>

  <rect x="230" y="305" width="150" height="40" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="305" y="330" text-anchor="middle" fill="#e6e8f0" font-size="13">executeByNereids</text>

  <rect x="460" y="285" width="160" height="40" rx="6" fill="#13162a" stroke="#7bed9f"/>
  <text x="540" y="310" text-anchor="middle" fill="#e6e8f0" font-size="13">PhysicalPlan 生成</text>

  <rect x="460" y="365" width="170" height="40" rx="6" fill="#13162a" stroke="#b388ff"/>
  <text x="545" y="390" text-anchor="middle" fill="#e6e8f0" font-size="13">executeByLegacy 回退</text>

  <!-- SQL→Nereids -->
  <path d="M170,325 L230,325" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Nereids→成功 (右上) -->
  <path d="M380,315 L425,315 L425,305 L460,305" stroke="#7bed9f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="430" y="298" fill="#7bed9f" font-size="10">成功</text>
  <!-- Nereids→回退 (下右) -->
  <path d="M305,345 L305,385 L460,385" stroke="#b388ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="315" y="372" fill="#b388ff" font-size="10">MustFallback / 不支持</text>

  <!-- 图例 -->
  <text x="690" y="330" fill="#9aa3c2" font-size="11">● 终态</text>
  <rect x="688" y="318" width="12" height="12" rx="2" fill="none" stroke="#7bed9f"/>
  <text x="690" y="358" fill="#9aa3c2" font-size="11">● 异常</text>
  <rect x="688" y="346" width="12" height="12" rx="2" fill="none" stroke="#e74c3c"/>
  <text x="690" y="386" fill="#9aa3c2" font-size="11">● 回退</text>
  <rect x="688" y="374" width="12" height="12" rx="2" fill="none" stroke="#b388ff"/>
</svg>
