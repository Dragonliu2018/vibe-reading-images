<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b388ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="460" fill="#0b0d14"/>

  <text x="380" y="28" text-anchor="middle" fill="#e6e8f0" font-size="17" font-weight="600">模块依赖关系</text>

  <!-- FE 规划层 -->
  <text x="40" y="62" fill="#6c8ef5" font-size="12">FE 规划</text>
  <rect x="120" y="50" width="150" height="44" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="195" y="76" text-anchor="middle" fill="#e6e8f0" font-size="13">Nereids 优化器</text>
  <rect x="300" y="50" width="150" height="44" rx="6" fill="#13162a" stroke="#b388ff" stroke-dasharray="5 3"/>
  <text x="375" y="76" text-anchor="middle" fill="#e6e8f0" font-size="13">旧版优化器（回退）</text>

  <!-- 中心 Catalog god class -->
  <rect x="120" y="160" width="330" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="285" y="183" text-anchor="middle" fill="#e6e8f0" font-size="14">Catalog / Env（元数据 + 高可用）</text>
  <text x="285" y="200" text-anchor="middle" fill="#9aa3c2" font-size="11">Table/Database/Replica · EditLog BDBJE</text>

  <!-- Coordinator -->
  <rect x="120" y="250" width="150" height="50" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="195" y="272" text-anchor="middle" fill="#e6e8f0" font-size="13">Coordinator</text>
  <text x="195" y="289" text-anchor="middle" fill="#9aa3c2" font-size="11">两阶段调度</text>

  <!-- Datasource -->
  <rect x="300" y="250" width="150" height="50" rx="6" fill="#13162a" stroke="#ff6b9d"/>
  <text x="375" y="272" text-anchor="middle" fill="#e6e8f0" font-size="13">联邦数据源</text>
  <text x="375" y="289" text-anchor="middle" fill="#9aa3c2" font-size="11">ExternalCatalog 懒加载</text>

  <!-- Load -->
  <rect x="120" y="340" width="150" height="50" rx="6" fill="#13162a" stroke="#ff6b9d"/>
  <text x="195" y="362" text-anchor="middle" fill="#e6e8f0" font-size="13">数据导入 Load</text>
  <text x="195" y="379" text-anchor="middle" fill="#9aa3c2" font-size="11">Stream/Broker + Txn</text>

  <!-- BE 执行层 -->
  <text x="560" y="40" fill="#4ecdc4" font-size="12">BE 执行</text>
  <rect x="560" y="50" width="150" height="44" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="635" y="76" text-anchor="middle" fill="#e6e8f0" font-size="13">Pipeline 引擎</text>
  <rect x="560" y="115" width="150" height="44" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="635" y="141" text-anchor="middle" fill="#e6e8f0" font-size="13">向量化与函数</text>
  <rect x="560" y="180" width="150" height="44" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="635" y="206" text-anchor="middle" fill="#e6e8f0" font-size="13">运行时基础</text>
  <rect x="560" y="245" width="150" height="44" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="635" y="271" text-anchor="middle" fill="#e6e8f0" font-size="13">存储引擎 olap</text>

  <!-- 箭头：Nereids→Coordinator, 旧版→Coordinator (fallback dashed) -->
  <path d="M195,94 L195,160" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M375,94 L375,160" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowp)"/>
  <!-- Coordinator ←→ Catalog -->
  <path d="M195,210 L195,250" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="234" fill="#9aa3c2" font-size="10">元数据</text>
  <!-- Datasource→Catalog -->
  <path d="M375,210 L375,250" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="234" fill="#9aa3c2" font-size="10">表元数据</text>
  <!-- Load→Catalog -->
  <path d="M195,300 L195,340" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="324" fill="#9aa3c2" font-size="10">事务/表</text>
  <!-- Load→Coordinator (导入走协调) -->
  <path d="M215,340 L215,300" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="324" fill="#9aa3c2" font-size="10">协调</text>
  <!-- Coordinator→Pipeline (gRPC，绕开 Catalog 框) -->
  <path d="M195,250 L195,230 L535,230 L535,72 L560,72" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#arrowg)"/>
  <text x="350" y="224" fill="#4ecdc4" font-size="11">gRPC 下发 Fragment</text>
  <!-- Pipeline→Vec -->
  <path d="M635,94 L635,115" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="645" y="108" fill="#9aa3c2" font-size="10">算子</text>
  <!-- Vec→Runtime -->
  <path d="M635,159 L635,180" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="645" y="173" fill="#9aa3c2" font-size="10">Block</text>
  <!-- Pipeline→Storage (scan，走 BE 列左侧间隙) -->
  <path d="M560,72 L540,72 L540,267 L560,267" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="546" y="170" fill="#9aa3c2" font-size="10">scan</text>
  <!-- Runtime←Storage -->
  <path d="M635,245 L635,224" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 图例 -->
  <rect x="40" y="400" width="700" height="46" rx="6" fill="#13162a" stroke="#2a2e45"/>
  <text x="54" y="422" fill="#9aa3c2" font-size="12">图例</text>
  <line x1="100" y1="418" x2="130" y2="418" stroke="#6c8ef5" stroke-width="1.5"/><text x="138" y="422" fill="#9aa3c2" font-size="11">Nereids 主路径</text>
  <line x1="260" y1="418" x2="290" y2="418" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="5 3"/><text x="298" y="422" fill="#9aa3c2" font-size="11">旧版回退路径</text>
  <line x1="420" y1="418" x2="450" y2="418" stroke="#4ecdc4" stroke-width="1.5"/><text x="458" y="422" fill="#9aa3c2" font-size="11">FE→BE gRPC</text>
  <text x="54" y="440" fill="#9aa3c2" font-size="11">Catalog/Env 是 FE 的 god class——元数据、副本、事务状态集中管理，被优化器/协调器/导入/联邦模块共同依赖。BE 侧 Pipeline 调用向量化算子、读写存储引擎，运行时基础（Block/Column/MemTracker）贯穿全链路。</text>
</svg>
