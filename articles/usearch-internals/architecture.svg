<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="600" fill="#0b0d14"/>

  <!-- 语言绑定层 -->
  <rect x="30" y="18" width="740" height="100" rx="8" fill="#13162a" stroke="#b388ff" stroke-opacity="0.55" stroke-dasharray="6 4"/>
  <text x="46" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#b388ff" font-weight="600">语言绑定层（10 种语言）</text>
  <rect x="46" y="56" width="108" height="34" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="100" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">Python</text>
  <rect x="164" y="56" width="108" height="34" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="218" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">Rust</text>
  <rect x="282" y="56" width="108" height="34" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="336" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">JavaScript</text>
  <rect x="400" y="56" width="108" height="34" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="454" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">Go / Swift</text>
  <rect x="518" y="56" width="108" height="34" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="572" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">Java / ObjC</text>
  <rect x="636" y="56" width="118" height="34" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="695" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">SQLite / WASM</text>

  <!-- 箭头：绑定层 → 接口层 -->
  <path d="M 250 118 L 250 148" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 550 118 L 550 148" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 接口双轨层 -->
  <rect x="30" y="150" width="356" height="76" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-opacity="0.7"/>
  <text x="208" y="176" font-family="system-ui, sans-serif" font-size="15" fill="#4ecdc4" font-weight="600" text-anchor="middle">C ABI — c/usearch.h</text>
  <text x="208" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5" text-anchor="middle">不透明句柄 · 错误输出参数 · Go/Swift/C#/WASM</text>

  <rect x="414" y="150" width="356" height="76" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-opacity="0.7"/>
  <text x="592" y="176" font-family="system-ui, sans-serif" font-size="15" fill="#4ecdc4" font-weight="600" text-anchor="middle">C++ 直连</text>
  <text x="592" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5" text-anchor="middle">pybind11 · CXX · N-API · JNI · ObjC++</text>

  <!-- 箭头：接口层 → 稠密索引层 -->
  <path d="M 250 226 L 250 268" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 550 226 L 550 268" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 稠密索引层 -->
  <rect x="30" y="270" width="740" height="86" rx="8" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.65"/>
  <text x="46" y="296" font-family="system-ui, sans-serif" font-size="15" fill="#f9ca24" font-weight="600">稠密索引层 — index_dense.hpp</text>
  <text x="46" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">key→slot 查找表 · 向量 tape 与精度转换 · .usearch 三段式序列化</text>
  <text x="46" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">删除/重命名/压缩 · 聚类 · Stable-Marriage join</text>

  <!-- 箭头：稠密索引层 → 核心图引擎（注入 allocator 与 punned metric） -->
  <path d="M 400 356 L 400 398" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 核心图引擎层 -->
  <rect x="30" y="400" width="740" height="86" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.75"/>
  <text x="46" y="426" font-family="system-ui, sans-serif" font-size="15" fill="#6c8ef5" font-weight="600">核心图引擎 — index.hpp · index_gt（HNSW）</text>
  <text x="46" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">多层邻近图 · 单 tape 节点布局 · add/search/update · refine_ 启发式选边</text>
  <text x="46" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">per-thread context · striped locks · mmap view 只读服务　（仅依赖 STL 与 OS 原语，可独立使用）</text>

  <!-- 箭头：稠密索引层 → 基础设施层（右侧绕行，注入 metric/cast/allocator） -->
  <path d="M 770 313 L 786 313 L 786 558 L 770 558" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 基础设施层 -->
  <rect x="30" y="530" width="740" height="56" rx="8" fill="#13162a" stroke="#80c7ff" stroke-opacity="0.6"/>
  <text x="46" y="552" font-family="system-ui, sans-serif" font-size="14" fill="#80c7ff" font-weight="600">基础设施 — index_plugins.hpp</text>
  <text x="46" y="572" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">f16/bf16/FP8 标量 · metric_punned 路由 · 执行器 · 分配器 · 哈希容器 ─ NumKong / StringZilla 子模块</text>
</svg>
