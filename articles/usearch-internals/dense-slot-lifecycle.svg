<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" fill="#0b0d14"/>

  <text x="30" y="34" font-family="system-ui, sans-serif" font-size="14" fill="#f9ca24" font-weight="600">slot 生命周期（惰性删除与回收）</text>

  <!-- 活跃 -->
  <rect x="60" y="120" width="180" height="60" rx="8" fill="#13162a" stroke="#7bed9f" stroke-opacity="0.8"/>
  <text x="150" y="146" font-family="system-ui, sans-serif" font-size="14" fill="#e8eaf6" text-anchor="middle">活跃</text>
  <text x="150" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">slot_lookup_ 有 key→slot 映射</text>

  <!-- remove -->
  <path d="M 240 150 L 310 150" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5" text-anchor="middle">remove(key)</text>

  <!-- 已删 -->
  <rect x="310" y="120" width="190" height="60" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-opacity="0.8"/>
  <text x="405" y="146" font-family="system-ui, sans-serif" font-size="14" fill="#e8eaf6" text-anchor="middle">已删（打标记）</text>
  <text x="405" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">key = free_key_ · 入 free_keys_ 环</text>

  <!-- 搜索时被过滤 -->
  <rect x="310" y="230" width="190" height="56" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <text x="405" y="253" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf" text-anchor="middle">搜索时被谓词过滤</text>
  <text x="405" y="273" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">图结构不动 · 出边保留（连通性）</text>
  <path d="M 405 180 L 405 230" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 复用 -->
  <path d="M 500 150 L 570 150" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="535" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5" text-anchor="middle">add 复用</text>

  <!-- 回到活跃 -->
  <path d="M 660 120 L 660 60 L 150 60 L 150 120" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5" text-anchor="middle">update() 在原节点重连边（老节点已有成熟邻居）</text>

  <rect x="570" y="120" width="180" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.8"/>
  <text x="660" y="146" font-family="system-ui, sans-serif" font-size="14" fill="#e8eaf6" text-anchor="middle">复用重连</text>
  <text x="660" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">free_keys_.try_pop → update()</text>

  <!-- compact -->
  <rect x="570" y="230" width="200" height="56" rx="8" fill="#13162a" stroke="#80c7ff" stroke-opacity="0.7"/>
  <text x="670" y="253" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">compact() 物理重排</text>
  <text x="670" y="273" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">按层/簇重排 slot · 搬迁向量 · 重建图</text>

  <path d="M 470 180 L 470 218 L 560 218 L 560 258 L 570 258" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="505" y="211" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">空间回收</text>

  <text x="30" y="308" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">load 后状态由 reindex_keys_ 从图上的 free_key_ 标记反推重建；isolate() 只剪指向被删节点的入边、不回收内存</text>
</svg>
