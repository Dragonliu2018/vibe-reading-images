<svg width="700" height="390" viewBox="0 0 700 390" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="390" fill="#0b0d14"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <text x="350" y="30" text-anchor="middle" fill="#e8e8f0" font-size="17" font-weight="bold" font-family="system-ui, sans-serif">Agent 生命周期状态流</text>

  <!-- live 运行态 group -->
  <rect x="40" y="55" width="610" height="180" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="50" y="74" fill="#6c8ef5" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">live 运行态（AgentManager 内存）</text>

  <rect x="60" y="90" width="130" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="125" y="117" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">initializing</text>
  <rect x="280" y="90" width="130" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="345" y="117" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">idle</text>
  <rect x="500" y="90" width="130" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="565" y="117" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">running</text>
  <rect x="500" y="180" width="130" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="565" y="207" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">error</text>

  <!-- persisted group -->
  <rect x="40" y="270" width="380" height="85" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="50" y="289" fill="#b388ff" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">持久记录态（磁盘 JSON）</text>
  <rect x="280" y="300" width="130" height="44" rx="5" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="345" y="327" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">closed</text>
  <rect x="60" y="300" width="130" height="44" rx="5" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="125" y="327" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">archived</text>

  <!-- transitions -->
  <path d="M190,112 L280,112" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="235" y="104" text-anchor="middle" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif">建档完成</text>

  <path d="M410,105 L500,105" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="455" y="97" text-anchor="middle" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif">startTurn</text>
  <path d="M500,125 L410,125" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="455" y="142" text-anchor="middle" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif">turn 结算</text>

  <path d="M565,134 L565,180" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="577" y="162" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif">turn_failed</text>

  <path d="M345,134 L345,300" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="357" y="225" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">closeAgentRuntime()</text>
  <path d="M315,300 L315,134" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="303" y="250" text-anchor="end" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">ensureAgentLoaded()</text>

  <path d="M500,202 L455,202 L455,262 L400,262 L400,300" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="462" y="240" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">close</text>

  <path d="M280,322 L190,322" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="235" y="313" text-anchor="middle" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif">archiveAgent()</text>
  <path d="M190,344 L280,344" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="235" y="362" text-anchor="middle" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif">unarchive</text>
</svg>
