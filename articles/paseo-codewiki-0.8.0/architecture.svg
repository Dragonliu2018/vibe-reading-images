<svg width="840" height="580" viewBox="0 0 840 580" xmlns="http://www.w3.org/2000/svg">
  <rect width="840" height="580" fill="#0b0d14"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <text x="420" y="30" text-anchor="middle" fill="#e8e8f0" font-size="17" font-weight="bold" font-family="system-ui, sans-serif">Paseo 系统分层</text>

  <!-- 客户端层 -->
  <rect x="26" y="50" width="788" height="68" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="44" y="80" fill="#4ecdc4" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">客户端层</text>
  <rect x="100" y="68" width="160" height="44" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="180" y="95" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">App（Expo 三端）</text>
  <rect x="282" y="68" width="160" height="44" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="362" y="95" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">CLI（Commander）</text>
  <rect x="464" y="68" width="160" height="44" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="544" y="95" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">Desktop（Electron）</text>
  <rect x="646" y="68" width="160" height="44" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="726" y="95" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">TypeScript SDK</text>

  <!-- 传输层 -->
  <rect x="26" y="145" width="788" height="72" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="44" y="175" fill="#80c7ff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">传输层</text>
  <rect x="100" y="163" width="215" height="44" rx="5" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="207" y="190" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">直连 WebSocket</text>
  <rect x="337" y="163" width="215" height="44" rx="5" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="444" y="190" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">Relay E2EE 中继</text>
  <rect x="574" y="163" width="215" height="44" rx="5" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="681" y="190" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">SSH 隧道</text>

  <!-- Daemon 层 -->
  <rect x="26" y="235" width="788" height="135" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="44" y="252" fill="#6c8ef5" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">Daemon 层（Node.js）</text>
  <rect x="120" y="258" width="205" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="222" y="276" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">会话与 RPC</text>
  <text x="222" y="292" text-anchor="middle" fill="#8b93b8" font-size="9.5" font-family="system-ui, sans-serif">websocket-server · Session</text>
  <rect x="345" y="258" width="205" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="447" y="276" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">Agent 生命周期</text>
  <text x="447" y="292" text-anchor="middle" fill="#8b93b8" font-size="9.5" font-family="system-ui, sans-serif">AgentManager · Timeline</text>
  <rect x="570" y="258" width="205" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="672" y="276" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">Provider 适配</text>
  <text x="672" y="292" text-anchor="middle" fill="#8b93b8" font-size="9.5" font-family="system-ui, sans-serif">claude · codex · acp · opencode · pi</text>
  <rect x="120" y="314" width="205" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="222" y="332" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">工具目录与 MCP</text>
  <text x="222" y="348" text-anchor="middle" fill="#8b93b8" font-size="9.5" font-family="system-ui, sans-serif">41 工具 · 插件运行时</text>
  <rect x="345" y="314" width="205" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="447" y="332" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">终端子系统</text>
  <text x="447" y="348" text-anchor="middle" fill="#8b93b8" font-size="9.5" font-family="system-ui, sans-serif">worker 进程 · node-pty</text>
  <rect x="570" y="314" width="205" height="44" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="672" y="332" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">Forge 与工作区</text>
  <text x="672" y="348" text-anchor="middle" fill="#8b93b8" font-size="9.5" font-family="system-ui, sans-serif">GitHub · Gitea · GitLab</text>

  <!-- Agent 进程层 -->
  <rect x="230" y="390" width="568" height="72" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="406" fill="#f9ca24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Agent 进程层（本机 CLI 子进程）</text>
  <rect x="250" y="414" width="100" height="44" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="300" y="441" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">Claude Code</text>
  <rect x="362" y="414" width="100" height="44" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="412" y="441" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">Codex</text>
  <rect x="474" y="414" width="100" height="44" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="524" y="441" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">Copilot ACP</text>
  <rect x="586" y="414" width="100" height="44" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="636" y="441" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">OpenCode</text>
  <rect x="698" y="414" width="100" height="44" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="748" y="441" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">Pi / OMP</text>

  <!-- 持久层 -->
  <rect x="40" y="505" width="190" height="50" rx="5" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="135" y="527" text-anchor="middle" fill="#e8e8f0" font-size="12" font-family="system-ui, sans-serif">持久层 $PASEO_HOME</text>
  <text x="135" y="545" text-anchor="middle" fill="#8b93b8" font-size="10" font-family="system-ui, sans-serif">agents JSON · 原子写</text>

  <text x="270" y="522" fill="#7a86b3" font-size="10" font-family="system-ui, sans-serif">生产 relay 为独立 Elixir 服务（getpaseo/paseo-relay）</text>
  <text x="270" y="540" fill="#7a86b3" font-size="10" font-family="system-ui, sans-serif">Hub（可选）：daemon 出站连接云端触发器</text>

  <!-- arrows: clients -> transport -->
  <path d="M180,118 L180,163" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M444,118 L444,163" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M681,118 L681,163" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- arrows: transport -> daemon -->
  <path d="M207,207 L207,258" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M444,207 L444,258" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="456" y="234" fill="#8b93b8" font-size="10.5" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">@getpaseo/protocol</text>
  <path d="M681,207 L681,258" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- arrows: daemon -> agent processes -->
  <path d="M300,370 L300,414" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M524,370 L524,414" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="536" y="396" fill="#8b93b8" font-size="10.5" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">spawn 子进程</text>
  <path d="M748,370 L748,414" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- arrow: daemon -> persistence -->
  <path d="M135,370 L135,505" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="147" y="445" fill="#8b93b8" font-size="10.5" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">原子写</text>
</svg>
