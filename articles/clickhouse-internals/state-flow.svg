<text x="320.0" y="26" text-anchor="middle" fill="#e8ebf5" font-size="16">IProcessor 状态机与调度流转</text><rect x="62" y="88" width="116" height="44" rx="6" fill="#1a1530" stroke="#80c7ff" stroke-width="1.5"/><text x="120" y="115" text-anchor="middle" fill="#e8ebf5" font-size="12">NeedData</text><rect x="292" y="68" width="116" height="44" rx="6" fill="#1a1530" stroke="#f9ca24" stroke-width="1.5"/><text x="350" y="95" text-anchor="middle" fill="#e8ebf5" font-size="12">Ready</text><rect x="292" y="398" width="116" height="44" rx="6" fill="#1a1530" stroke="#7bed9f" stroke-width="1.5"/><text x="350" y="425" text-anchor="middle" fill="#e8ebf5" font-size="12">Finished</text><rect x="62" y="188" width="116" height="44" rx="6" fill="#1a1530" stroke="#ff6b9d" stroke-width="1.5"/><text x="120" y="215" text-anchor="middle" fill="#e8ebf5" font-size="12">PortFull</text><rect x="62" y="298" width="116" height="44" rx="6" fill="#1a1530" stroke="#4ecdc4" stroke-width="1.5"/><text x="120" y="325" text-anchor="middle" fill="#e8ebf5" font-size="12">Async</text><rect x="412" y="228" width="116" height="44" rx="6" fill="#1a1530" stroke="#b388ff" stroke-width="1.5"/><text x="470" y="255" text-anchor="middle" fill="#e8ebf5" font-size="12">UpdatePipeline</text><path d="M178,110 L292,90" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="235.0" y="92.0" text-anchor="middle" fill="#9aa3c0" font-size="9">有数据</text><path d="M292,110 L178,130" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="235.0" y="128.0" text-anchor="middle" fill="#9aa3c0" font-size="9">work()完成</text><path d="M120,132 L120,188" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="120.0" y="160.0" text-anchor="middle" fill="#9aa3c0" font-size="9">下游满</text><path d="M120,210 L120,156" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="120.0" y="183.0" text-anchor="middle" fill="#9aa3c0" font-size="9">下游消费</text><path d="M350,112 L350,398" fill="none" stroke="#7bed9f" stroke-width="1.5" marker-end="url(#arrowg)"/><text x="350.0" y="247.0" text-anchor="middle" fill="#9aa3c0" font-size="9">work()完成</text><path d="M178,320 L292,300" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowc)"/><text x="235.0" y="302.0" text-anchor="middle" fill="#9aa3c0" font-size="9">I/O就绪</text><path d="M292,280 L178,310" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="235.0" y="303.0" text-anchor="middle" fill="#9aa3c0" font-size="9">需异步I/O</text><path d="M178,210 L292,410" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="235.0" y="302.0" text-anchor="middle" fill="#9aa3c0" font-size="9">完成</text><path d="M178,125 L292,410" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/><text x="235.0" y="267.5" text-anchor="middle" fill="#9aa3c0" font-size="9">上游结束</text><path d="M412,250 L350,112" fill="none" stroke="#b388ff" stroke-width="1.5" marker-end="url(#arrowp)"/><text x="381.0" y="181.0" text-anchor="middle" fill="#9aa3c0" font-size="9">改DAG后</text><text x="30" y="500" text-anchor="start" fill="#9aa3c0" font-size="11">prepare() 轻量检查端口状态决定下一步；Ready→work() CPU密集；Async→schedule() I/O等待；Finished→终止</text><text x="30" y="518" text-anchor="start" fill="#9aa3c0" font-size="11">端口版本号通知邻居重 prepare，避免忙等；线程空队列时 condition_variable 阻塞</text></svg>
