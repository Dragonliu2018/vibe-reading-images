<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 354" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5f7a"/>
    </marker>
  </defs>

  <rect width="760" height="354" fill="#0b0d14"/>

  <!-- Legend -->
  <g font-size="10.5" fill="#9aa0b4">
    <rect x="60" y="14" width="11" height="11" rx="2" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
    <text x="76" y="23">改动</text>
    <rect x="116" y="14" width="11" height="11" rx="2" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
    <text x="132" y="23">新增</text>
    <rect x="172" y="14" width="11" height="11" rx="2" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
    <text x="188" y="23">外部</text>
    <rect x="228" y="14" width="11" height="11" rx="2" fill="#13162a" stroke="#5a5f7a" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="244" y="23">绕过</text>
  </g>

  <!-- Layer 1: Entrypoints (yellow = modified/new) -->
  <rect x="60" y="44" width="200" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="160" y="69" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">CLI</text>

  <rect x="280" y="44" width="200" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="380" y="69" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">HTTP /v1/text/generations</text>

  <rect x="500" y="44" width="200" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="600" y="69" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">Python API</text>

  <line x1="380" y1="84" x2="380" y2="96" stroke="#5a5f7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Layer 2: Registry (yellow) -->
  <rect x="60" y="98" width="640" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="380" y="121" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">registry.py</text>

  <line x1="260" y1="134" x2="260" y2="146" stroke="#5a5f7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Layer 3: Pipeline (green) + bypassed (grey dashed) -->
  <rect x="60" y="148" width="410" height="44" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="265" y="175" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">ColaDLMPipeline</text>

  <rect x="490" y="148" width="210" height="44" rx="6" fill="#13162a" stroke="#5a5f7a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="595" y="175" text-anchor="middle" fill="#7a7f96" font-size="13">标准 stages</text>

  <line x1="160" y1="192" x2="160" y2="204" stroke="#5a5f7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="192" x2="560" y2="204" stroke="#5a5f7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Layer 4: Model wrappers (green) -->
  <rect x="60" y="206" width="310" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="215" y="231" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">ColaDiTWrapper</text>

  <rect x="390" y="206" width="310" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="545" y="231" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">ColaTextVAEWrapper</text>

  <line x1="380" y1="246" x2="380" y2="258" stroke="#5a5f7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Layer 5: Upstream cola_dlm (blue = external) -->
  <rect x="60" y="260" width="640" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="380" y="283" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">cola_dlm 包（上游）</text>

  <line x1="380" y1="296" x2="380" y2="308" stroke="#5a5f7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Layer 6: Output (yellow) -->
  <rect x="60" y="310" width="640" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="380" y="333" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">DataType.TEXT</text>
</svg>
