<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="system-ui, sans-serif">
  <rect width="860" height="560" fill="#0b0d14"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
  </defs>

  <text x="430" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">模块依赖关系（import 方向，libpod 为枢纽）</text>

  <!-- cmd/podman -->
  <rect x="355" y="44" width="150" height="46" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="430" y="64" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">cmd/podman</text>
  <text x="430" y="81" text-anchor="middle" fill="#9aa3c2" font-size="11">CLI + registry</text>

  <!-- pkg/domain -->
  <rect x="330" y="124" width="200" height="46" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="430" y="144" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">pkg/domain</text>
  <text x="430" y="161" text-anchor="middle" fill="#9aa3c2" font-size="11">entities 接口 + infra 双后端</text>

  <!-- libpod hub -->
  <rect x="355" y="270" width="150" height="58" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="2"/>
  <text x="430" y="293" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">libpod</text>
  <text x="430" y="311" text-anchor="middle" fill="#9aa3c2" font-size="11">核心运行时（枢纽）</text>

  <!-- pkg/specgen (left) -->
  <rect x="60" y="272" width="150" height="54" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="135" y="294" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">pkg/specgen</text>
  <text x="135" y="312" text-anchor="middle" fill="#9aa3c2" font-size="11">SpecGenerator→OCI spec</text>

  <!-- pkg/api (right top) -->
  <rect x="650" y="200" width="170" height="54" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="735" y="222" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">pkg/api</text>
  <text x="735" y="240" text-anchor="middle" fill="#9aa3c2" font-size="11">REST 服务端</text>

  <!-- pkg/bindings (right bottom) -->
  <rect x="650" y="346" width="170" height="54" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="735" y="368" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">pkg/bindings</text>
  <text x="735" y="386" text-anchor="middle" fill="#9aa3c2" font-size="11">Go HTTP 客户端</text>

  <!-- pkg/systemd (bottom left) -->
  <rect x="60" y="455" width="180" height="56" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="150" y="478" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">pkg/systemd</text>
  <text x="150" y="496" text-anchor="middle" fill="#9aa3c2" font-size="11">Quadlet 转译器</text>

  <!-- kube (bottom center) -->
  <rect x="335" y="455" width="190" height="56" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="430" y="478" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">kube 集成</text>
  <text x="430" y="496" text-anchor="middle" fill="#9aa3c2" font-size="11">infra/abi/play + libpod/kube</text>

  <!-- pkg/machine (bottom right) -->
  <rect x="620" y="455" width="200" height="56" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="720" y="478" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">pkg/machine</text>
  <text x="720" y="496" text-anchor="middle" fill="#9aa3c2" font-size="11">Mac/Win 虚拟机</text>

  <!-- edges -->
  <!-- cmd -> domain -->
  <path d="M430,90 L430,124" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- domain -> libpod (ABI) -->
  <path d="M415,170 L415,270" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="423" y="222" fill="#4ecdc4" font-size="11">ABI</text>
  <!-- domain -> bindings (Tunnel): route via far-right margin to avoid crossing api->libpod -->
  <path d="M530,147 L830,147 L830,373 L820,373" stroke="#f9ca24" stroke-width="1.5" fill="none" marker-end="url(#arrowYellow)"/>
  <text x="680" y="140" fill="#f9ca24" font-size="11">Tunnel</text>
  <!-- domain -> specgen: route left then down into specgen top-center -->
  <path d="M330,147 L135,147 L135,272" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="160" y="140" fill="#9aa3c2" font-size="11">SpecGenerator</text>
  <!-- specgen -> libpod (generate imports libpod) -->
  <path d="M210,299 L355,299" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="250" y="292" fill="#9aa3c2" font-size="10">generate import</text>
  <!-- api -> libpod (handlers via abi) -->
  <path d="M650,227 L560,227 L560,299 L505,299" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="566" y="220" fill="#9aa3c2" font-size="10">handler→abi</text>
  <!-- kube -> libpod -->
  <path d="M430,455 L430,328" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- machine -> bindings (VM-internal client) -->
  <path d="M720,455 L735,400" stroke="#80c7ff" stroke-width="1.5" fill="none" stroke-dasharray="5 3" opacity="0.8" marker-end="url(#arrow)"/>
  <text x="740" y="430" fill="#80c7ff" font-size="10">VM 内连接</text>
  <!-- systemd -> cmd (runtime exec podman): far-left route -->
  <path d="M150,455 L150,440 L30,440 L30,67 L355,67" stroke="#b388ff" stroke-width="1.5" fill="none" stroke-dasharray="5 3" opacity="0.75" marker-end="url(#arrow)"/>
  <text x="38" y="250" fill="#b388ff" font-size="10">运行时 exec podman run</text>
</svg>
