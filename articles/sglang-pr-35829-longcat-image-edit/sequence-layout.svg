<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8ef5"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#0b0d14"/>
  <text x="410" y="30" text-anchor="middle" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Edit 隐空间序列布局：[noisy | reference] 拼接与 RoPE 模态</text>
  <text x="410" y="52" text-anchor="middle" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="11">DiT 去噪每步的输入 / 输出序列（沿 seq dim）</text>
  <text x="410" y="80" text-anchor="middle" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="12">DiT 输入序列</text>
  <rect x="50" y="88" width="170" height="58" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" rx="6"/>
  <text x="135" y="112" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">text embeds</text>
  <text x="135" y="132" text-anchor="middle" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="11">mod 0 · offset 0</text>
  <rect x="220" y="88" width="250" height="58" fill="#13162a" stroke="#f9ca24" stroke-width="1.5" rx="6"/>
  <text x="345" y="112" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">noisy latents</text>
  <text x="345" y="132" text-anchor="middle" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="11">mod 1 · offset N</text>
  <rect x="470" y="88" width="250" height="58" fill="#13162a" stroke="#b388ff" stroke-width="1.5" rx="6"/>
  <text x="595" y="112" text-anchor="middle" fill="#b388ff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">reference latents</text>
  <text x="595" y="132" text-anchor="middle" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="11">mod 2 · offset N</text>
  <path d="M410 152 L410 183" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="172" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="11">DiT 去噪（50 步 · CFG 4.5）</text>
  <text x="410" y="200" text-anchor="middle" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="12">DiT 预测输出</text>
  <rect x="50" y="208" width="420" height="58" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" rx="6"/>
  <text x="260" y="232" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">noise_pred（保留）</text>
  <text x="260" y="252" text-anchor="middle" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="11">前 S_noise 个 token</text>
  <rect x="470" y="208" width="250" height="58" fill="#13162a" stroke="#606070" stroke-width="1.5" stroke-dasharray="4 3" rx="6"/>
  <text x="595" y="232" text-anchor="middle" fill="#606070" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">ref_pred</text>
  <text x="595" y="252" text-anchor="middle" fill="#606070" font-family="system-ui, sans-serif" font-size="11">slice 丢弃</text>
  <path d="M410 272 L410 303" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="292" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="11">slice_noise_pred(noise, latents)</text>
  <rect x="50" y="310" width="670" height="50" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" rx="6"/>
  <text x="385" y="340" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13">noise_pred → scheduler step（CFG renorm off · FlowMatchEuler）</text>
  <text x="50" y="384" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="11">N = prompt_embeds[0].shape[1]（VL image tokens + 512 body）· S_noise = S_ref = (H/16)×(W/16)×4 packed</text>
</svg>
