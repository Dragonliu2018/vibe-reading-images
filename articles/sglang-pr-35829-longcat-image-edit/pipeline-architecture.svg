<svg xmlns="http://www.w3.org/2000/svg" width="740" height="720" viewBox="0 0 740 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8ef5"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect width="740" height="720" fill="#0b0d14"/>
  <text x="370" y="30" text-anchor="middle" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">LongCat-Image-Edit Pipeline 架构（7 阶段）</text>
  <text x="370" y="56" text-anchor="middle" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="11">条件图 + 编辑 prompt + seed</text>
  <path d="M370 60 L370 87" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="89" width="340" height="54" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" rx="6"/>
  <text x="370" y="111" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">InputValidationStage</text>
  <text x="370" y="129" text-anchor="middle" fill="#a0a0b0" font-family="system-ui, sans-serif" font-size="11">标准 · 加载条件图，缩放到 ~1MP（ceil /16）</text>
  <path d="M370 143 L370 171" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow)"/>
