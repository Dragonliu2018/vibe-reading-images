<svg xmlns="http://www.w3.org/2000/svg" width="860" height="436" viewBox="0 0 860 436">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86a8"/>
    </marker>
    <style>
      .layer-bg { fill: #13162a; stroke: #232742; stroke-width: 1; }
      .sub-bg { fill: #181c34; stroke: #2a2f52; stroke-width: 1; }
      .mod-box { fill: #13162a; stroke: #3a4170; stroke-width: 1; }
      .layer-title { fill: #6c8ef5; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; }
      .sub-title { fill: #4ecdc4; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
      .mod-text { fill: #e6e8f0; font-family: system-ui, sans-serif; font-size: 12px; }
      .dir-text { fill: #7a86a8; font-family: system-ui, sans-serif; font-size: 11px; font-style: italic; }
    </style>
  </defs>

  <rect x="0" y="0" width="860" height="436" fill="#0b0d14"/>

  <!-- Interface Layer -->
  <rect class="layer-bg" x="20" y="18" width="820" height="78" rx="8"/>
  <text class="layer-title" x="34" y="38">Interface Layer · 接口层</text>
  <text class="dir-text" x="780" y="38" text-anchor="end">ui/ · cli/ · routes/</text>
  <rect class="mod-box" x="110" y="48" width="200" height="36" rx="5"/>
  <text class="mod-text" x="210" y="71" text-anchor="middle">React UI</text>
  <rect class="mod-box" x="330" y="48" width="200" height="36" rx="5"/>
  <text class="mod-text" x="430" y="71" text-anchor="middle">CLI (paperclipai)</text>
  <rect class="mod-box" x="550" y="48" width="200" height="36" rx="5"/>
  <text class="mod-text" x="650" y="71" text-anchor="middle">HTTP API + WebSocket</text>

  <path d="M430,96 L430,112" stroke="#7a86a8" stroke-width="1.5" fill="none" marker-end="url(#arch-arrow)"/>

  <!-- Orchestration Core -->
  <rect class="layer-bg" x="20" y="114" width="820" height="214" rx="8"/>
  <text class="layer-title" x="34" y="134">Orchestration Core · 编排核心</text>
  <text class="dir-text" x="806" y="134" text-anchor="end">server/src/services/</text>

  <!-- Subsystem 1: Work Execution Engine -->
  <rect class="sub-bg" x="30" y="144" width="185" height="176" rx="6"/>
  <text class="sub-title" x="122" y="162" text-anchor="middle">工作执行引擎</text>
  <rect class="mod-box" x="40" y="172" width="165" height="40" rx="5"/>
  <text class="mod-text" x="122" y="197" text-anchor="middle">Heartbeat Engine</text>
  <rect class="mod-box" x="40" y="220" width="165" height="40" rx="5"/>
  <text class="mod-text" x="122" y="245" text-anchor="middle">Work &amp; Task</text>
  <rect class="mod-box" x="40" y="268" width="165" height="40" rx="5"/>
  <text class="mod-text" x="122" y="293" text-anchor="middle">Routines</text>

  <!-- Subsystem 2: Organization & Governance -->
  <rect class="sub-bg" x="223" y="144" width="185" height="176" rx="6"/>
  <text class="sub-title" x="315" y="162" text-anchor="middle">组织与治理</text>
  <rect class="mod-box" x="233" y="172" width="165" height="40" rx="5"/>
  <text class="mod-text" x="315" y="197" text-anchor="middle">Agents &amp; Org Chart</text>
  <rect class="mod-box" x="233" y="220" width="165" height="40" rx="5"/>
  <text class="mod-text" x="315" y="245" text-anchor="middle">Identity &amp; Access</text>
  <rect class="mod-box" x="233" y="268" width="165" height="40" rx="5"/>
  <text class="mod-text" x="315" y="293" text-anchor="middle">Budget &amp; Governance</text>

  <!-- Subsystem 3: Workspace & Runtime -->
  <rect class="sub-bg" x="416" y="144" width="185" height="176" rx="6"/>
  <text class="sub-title" x="508" y="162" text-anchor="middle">工作区与运行时</text>
  <rect class="mod-box" x="426" y="172" width="165" height="40" rx="5"/>
  <text class="mod-text" x="508" y="197" text-anchor="middle">Workspace Runtime</text>
  <rect class="mod-box" x="426" y="220" width="165" height="40" rx="5"/>
  <text class="mod-text" x="508" y="245" text-anchor="middle">Environments &amp; Cloud</text>
  <rect class="mod-box" x="426" y="268" width="165" height="40" rx="5"/>
  <text class="mod-text" x="508" y="293" text-anchor="middle">Projects &amp; Documents</text>

  <!-- Subsystem 4: Platform & Portability -->
  <rect class="sub-bg" x="609" y="144" width="221" height="176" rx="6"/>
  <text class="sub-title" x="719" y="162" text-anchor="middle">平台扩展与可移植</text>
  <rect class="mod-box" x="619" y="172" width="201" height="40" rx="5"/>
  <text class="mod-text" x="719" y="197" text-anchor="middle">Plugin System</text>
  <rect class="mod-box" x="619" y="220" width="201" height="40" rx="5"/>
  <text class="mod-text" x="719" y="245" text-anchor="middle">Portability &amp; Skills</text>
  <rect class="mod-box" x="619" y="268" width="201" height="40" rx="5"/>
  <text class="mod-text" x="719" y="293" text-anchor="middle">Secrets · Storage · Activity</text>

  <path d="M430,328 L430,344" stroke="#7a86a8" stroke-width="1.5" fill="none" marker-end="url(#arch-arrow)"/>

  <!-- Foundation Layer -->
  <rect class="layer-bg" x="20" y="346" width="820" height="78" rx="8"/>
  <text class="layer-title" x="34" y="366">Foundation · 基础设施</text>
  <rect class="mod-box" x="40" y="376" width="180" height="36" rx="5"/>
  <text class="mod-text" x="130" y="399" text-anchor="middle">PostgreSQL (embedded)</text>
  <rect class="mod-box" x="230" y="376" width="180" height="36" rx="5"/>
  <text class="mod-text" x="320" y="399" text-anchor="middle">@paperclipai/shared</text>
  <rect class="mod-box" x="420" y="376" width="180" height="36" rx="5"/>
  <text class="mod-text" x="510" y="399" text-anchor="middle">Object Storage</text>
  <rect class="mod-box" x="610" y="376" width="200" height="36" rx="5"/>
  <text class="mod-text" x="710" y="399" text-anchor="middle">Agent Adapters</text>
</svg>
