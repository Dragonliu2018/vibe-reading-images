<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <marker id="sf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86a8"/>
    </marker>
    <marker id="sf-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
    <style>
      .state-box { fill: #13162a; stroke-width: 1.5; }
      .sb-blue { stroke: #6c8ef5; } .sb-cyan { stroke: #4ecdc4; }
      .sb-yellow { stroke: #f9ca24; } .sb-pink { stroke: #ff6b9d; }
      .sb-green { stroke: #4ecdc4; } .sb-red { stroke: #ff6b9d; }
      .state-text { fill: #e6e8f0; font-family: system-ui, sans-serif; font-size: 12px; }
      .section-label { fill: #6c8ef5; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
      .arrow-label { fill: #a0a8c0; font-family: system-ui, sans-serif; font-size: 10px; }
      .sf-line { stroke: #7a86a8; stroke-width: 1.5; fill: none; }
      .sf-loop { stroke: #f9ca24; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; }
    </style>
  </defs>

  <rect x="0" y="0" width="860" height="440" fill="#0b0d14"/>

  <!-- Section 1: heartbeat_runs state machine -->
  <text class="section-label" x="20" y="24">heartbeat_runs 状态机（heartbeat.ts:238-285）</text>

  <rect class="state-box sb-blue" x="30" y="50" width="110" height="38" rx="6"/>
  <text class="state-text" x="85" y="74" text-anchor="middle">queued</text>

  <rect class="state-box sb-yellow" x="230" y="50" width="110" height="38" rx="6"/>
  <text class="state-text" x="285" y="74" text-anchor="middle">running</text>

  <rect class="state-box sb-yellow" x="230" y="128" width="150" height="38" rx="6"/>
  <text class="state-text" x="305" y="152" text-anchor="middle">scheduled_retry</text>

  <!-- Terminal states -->
  <rect class="state-box sb-green" x="440" y="50" width="120" height="38" rx="6"/>
  <text class="state-text" x="500" y="74" text-anchor="middle">succeeded</text>
  <rect class="state-box sb-red" x="580" y="50" width="110" height="38" rx="6"/>
  <text class="state-text" x="635" y="74" text-anchor="middle">failed</text>
  <rect class="state-box sb-red" x="720" y="50" width="110" height="38" rx="6"/>
  <text class="state-text" x="775" y="74" text-anchor="middle">cancelled</text>
  <rect class="state-box sb-red" x="440" y="128" width="120" height="38" rx="6"/>
  <text class="state-text" x="500" y="152" text-anchor="middle">timed_out</text>

  <!-- Transitions -->
  <path class="sf-line" d="M140,69 L230,69" marker-end="url(#sf-arrow)"/>
  <text class="arrow-label" x="185" y="62" text-anchor="middle">claim</text>

  <path class="sf-line" d="M285,88 L285,128" marker-end="url(#sf-arrow)"/>
  <text class="arrow-label" x="345" y="112" text-anchor="start">transient fail</text>

  <path class="sf-loop" d="M230,147 L185,147 L185,108 L140,88" marker-end="url(#sf-arrow-cyan)"/>
  <text class="arrow-label" x="155" y="128" fill="#f9ca24">promote retry</text>

  <path class="sf-line" d="M340,69 L440,69" marker-end="url(#sf-arrow)"/>
  <text class="arrow-label" x="390" y="62" text-anchor="middle">setRunStatus</text>

  <path class="sf-line" d="M340,78 L580,69" marker-end="url(#sf-arrow)" opacity="0.6"/>
  <path class="sf-line" d="M340,80 L720,69" marker-end="url(#sf-arrow)" opacity="0.6"/>
  <path class="sf-line" d="M340,147 L440,147" marker-end="url(#sf-arrow)" opacity="0.6"/>

  <!-- Section 2: issues status machine -->
  <text class="section-label" x="20" y="220">issues 状态机（issues.ts:96-116）</text>

  <rect class="state-box sb-blue" x="20" y="246" width="100" height="38" rx="6"/>
  <text class="state-text" x="70" y="270" text-anchor="middle">backlog</text>

  <rect class="state-box sb-blue" x="150" y="246" width="90" height="38" rx="6"/>
  <text class="state-text" x="195" y="270" text-anchor="middle">todo</text>

  <rect class="state-box sb-yellow" x="270" y="246" width="110" height="38" rx="6"/>
  <text class="state-text" x="325" y="270" text-anchor="middle">in_progress</text>

  <rect class="state-box sb-pink" x="410" y="246" width="100" height="38" rx="6"/>
  <text class="state-text" x="460" y="270" text-anchor="middle">in_review</text>

  <rect class="state-box sb-green" x="540" y="246" width="90" height="38" rx="6"/>
  <text class="state-text" x="585" y="270" text-anchor="middle">done</text>

  <rect class="state-box sb-red" x="660" y="246" width="100" height="38" rx="6"/>
  <text class="state-text" x="710" y="270" text-anchor="middle">cancelled</text>

  <rect class="state-box sb-pink" x="270" y="330" width="110" height="38" rx="6"/>
  <text class="state-text" x="325" y="354" text-anchor="middle">blocked</text>

  <!-- Transitions -->
  <path class="sf-line" d="M120,265 L150,265" marker-end="url(#sf-arrow)"/>
  <path class="sf-line" d="M240,265 L270,265" marker-end="url(#sf-arrow)"/>
  <text class="arrow-label" x="255" y="258" text-anchor="middle">checkout</text>
  <path class="sf-line" d="M380,265 L410,265" marker-end="url(#sf-arrow)"/>
  <path class="sf-line" d="M510,265 L540,265" marker-end="url(#sf-arrow)"/>
  <text class="arrow-label" x="525" y="258" text-anchor="middle">approve</text>

  <path class="sf-loop" d="M325,284 L325,330" marker-end="url(#sf-arrow-cyan)"/>
  <text class="arrow-label" x="335" y="310" text-anchor="start" fill="#f9ca24">blocker</text>
  <path class="sf-loop" d="M270,349 L220,330 L195,284" marker-end="url(#sf-arrow-cyan)"/>
  <text class="arrow-label" x="245" y="345" fill="#f9ca24">resolve</text>

  <path class="sf-line" d="M195,246 L195,200 L710,200 L710,246" marker-end="url(#sf-arrow)" opacity="0.5"/>

  <text class="arrow-label" x="20" y="400" fill="#7a86a8">虚线 = 回环路径 · 黄色 = 重试/阻塞恢复 · 蓝/黄/绿/粉/红 = 初始/执行中/成功/评审/终态</text>
</svg>
