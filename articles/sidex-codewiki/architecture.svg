  <rect x="40" y="410" width="740" height="120" rx="10" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="56" y="430" fill="#f9ca24" font-size="13" font-weight="600">Rust 领域 crate (crates/)</text>
  <rect x="60" y="440" width="120" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="120" y="462" text-anchor="middle" fill="#e6e6e6" font-size="12">workspace</text>
  <rect x="188" y="440" width="120" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="248" y="462" text-anchor="middle" fill="#e6e6e6" font-size="12">text</text>
  <rect x="316" y="440" width="120" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="376" y="462" text-anchor="middle" fill="#e6e6e6" font-size="12">syntax</text>
  <rect x="444" y="440" width="120" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="504" y="462" text-anchor="middle" fill="#e6e6e6" font-size="12">textmate</text>
  <rect x="572" y="440" width="120" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="632" y="462" text-anchor="middle" fill="#e6e6e6" font-size="12">terminal</text>
  <rect x="60" y="484" width="120" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="120" y="506" text-anchor="middle" fill="#e6e6e6" font-size="12">git</text>
  <rect x="188" y="484" width="120" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="248" y="506" text-anchor="middle" fill="#e6e6e6" font-size="12">lsp</text>
  <rect x="316" y="484" width="120" height="34" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="376" y="506" text-anchor="middle" fill="#ff6b9d" font-size="12">extensions</text>
  <rect x="444" y="484" width="120" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="504" y="506" text-anchor="middle" fill="#e6e6e6" font-size="12">remote</text>
  <rect x="572" y="484" width="120" height="34" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="632" y="506" text-anchor="middle" fill="#e6e6e6" font-size="12">dap / db / settings</text>

  <!-- Arrow 4→5 -->
  <path d="M410,530 L410,558" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="418" y="548" fill="#9aa3c0" font-size="11">FFI / 系统调用</text>

  <!-- Layer 5: OS 原生能力 -->
  <rect x="40" y="558" width="740" height="62" rx="10" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="56" y="578" fill="#b388ff" font-size="13" font-weight="600">OS 原生能力</text>
  <text x="80" y="602" fill="#e6e6e6" font-size="12">portable-pty</text>
  <text x="190" y="602" fill="#e6e6e6" font-size="12">notify</text>
  <text x="260" y="602" fill="#e6e6e6" font-size="12">rusqlite</text>
  <text x="340" y="602" fill="#e6e6e6" font-size="12">git CLI</text>
  <text x="410" y="602" fill="#e6e6e6" font-size="12">russh</text>
  <text x="475" y="602" fill="#e6e6e6" font-size="12">bollard</text>
  <text x="550" y="602" fill="#e6e6e6" font-size="12">wasmtime</text>
  <text x="630" y="602" fill="#e6e6e6" font-size="12">tree-sitter</text>
