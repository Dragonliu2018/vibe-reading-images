<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="820" height="640" fill="#0b0d14"/>

  <!-- 标题 -->
  <text x="410" y="26" text-anchor="middle" fill="#e6e6e6" font-size="16" font-weight="600">SideX 分层架构</text>

  <!-- Layer 1: Webview 渲染层 -->
  <rect x="40" y="48" width="740" height="120" rx="10" fill="none" stroke="#80c7ff" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="56" y="68" fill="#80c7ff" font-size="13" font-weight="600">Webview 渲染层 (TypeScript)</text>
  <rect x="60" y="80" width="160" height="38" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="140" y="104" text-anchor="middle" fill="#e6e6e6" font-size="13">VSCode Workbench</text>
  <rect x="232" y="80" width="150" height="38" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="307" y="104" text-anchor="middle" fill="#e6e6e6" font-size="13">Monaco Editor</text>
  <rect x="394" y="80" width="150" height="38" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="469" y="104" text-anchor="middle" fill="#e6e6e6" font-size="13">Platform Services</text>
  <rect x="556" y="80" width="150" height="38" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="631" y="98" text-anchor="middle" fill="#e6e6e6" font-size="13">SideX Service</text>
  <text x="631" y="113" text-anchor="middle" fill="#80c7ff" font-size="11">sidex*.ts</text>
  <rect x="316" y="126" width="188" height="34" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="410" y="148" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="600">sidex-bridge.ts (invoke)</text>

  <!-- Arrow 1→2 -->
  <path d="M410,168 L410,196" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="418" y="186" fill="#9aa3c0" font-size="11">invoke(cmd, args)</text>

  <!-- Layer 2: Tauri IPC 边界 -->
  <rect x="40" y="196" width="740" height="62" rx="10" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="56" y="216" fill="#4ecdc4" font-size="13" font-weight="600">Tauri 2 IPC 边界</text>
  <text x="300" y="238" text-anchor="middle" fill="#e6e6e6" font-size="13">invoke() / emit() / listen()</text>
  <text x="560" y="238" text-anchor="middle" fill="#e6e6e6" font-size="13">sidex-asset:// 协议</text>

  <!-- Arrow 2→3 -->
  <path d="M410,258 L410,286" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="418" y="276" fill="#9aa3c0" font-size="11">generate_handler! 分发</text>

  <!-- Layer 3: Rust 命令层 -->
  <rect x="40" y="286" width="740" height="96" rx="10" fill="none" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="56" y="306" fill="#6c8ef5" font-size="13" font-weight="600">Rust 命令层 (src-tauri/src/commands)</text>
  <rect x="60" y="316" width="150" height="54" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="135" y="338" text-anchor="middle" fill="#e6e6e6" font-size="13">lib.rs</text>
  <text x="135" y="356" text-anchor="middle" fill="#6c8ef5" font-size="11">State 注册 + 命令</text>
  <rect x="220" y="316" width="150" height="54" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="295" y="338" text-anchor="middle" fill="#e6e6e6" font-size="13">fs / terminal</text>
  <text x="295" y="356" text-anchor="middle" fill="#6c8ef5" font-size="11">git / lsp / search</text>
  <rect x="380" y="316" width="150" height="54" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="455" y="338" text-anchor="middle" fill="#e6e6e6" font-size="13">extension_wasm</text>
  <text x="455" y="356" text-anchor="middle" fill="#6c8ef5" font-size="11">debug / remote</text>
  <rect x="540" y="316" width="220" height="54" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="650" y="338" text-anchor="middle" fill="#e6e6e6" font-size="13">mod.rs (glob re-export)</text>
  <text x="650" y="356" text-anchor="middle" fill="#6c8ef5" font-size="11">41 个命令文件</text>

  <!-- Arrow 3→4 -->
  <path d="M410,382 L410,410" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="418" y="400" fill="#9aa3c0" font-size="11">调用 crate 逻辑</text>

