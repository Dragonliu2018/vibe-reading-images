<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="520" fill="#0b0d14"/>

  <text x="40" y="34" font-family="system-ui, sans-serif" font-size="14" fill="#80c7ff" font-weight="600">Faiss SIMD 动态分派（FAISS_ENABLE_DD）</text>

  <!-- 编译期 -->
  <rect x="40" y="50" width="340" height="180" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-opacity="0.7"/>
  <text x="56" y="74" font-family="system-ui, sans-serif" font-size="13" fill="#4ecdc4" font-weight="600">编译期：每个 ISA 一份库</text>
  <rect x="56" y="88" width="308" height="30" rx="5" fill="#1a1d33" stroke="#4ecdc4" stroke-opacity="0.4"/>
  <text x="210" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">libfaiss（基线，SIMDLevel::NONE）</text>
  <rect x="56" y="124" width="308" height="30" rx="5" fill="#1a1d33" stroke="#4ecdc4" stroke-opacity="0.4"/>
  <text x="210" y="144" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">libfaiss_avx2（-mavx2 -mfma -mf16c -mpopcnt）</text>
  <rect x="56" y="160" width="308" height="30" rx="5" fill="#1a1d33" stroke="#4ecdc4" stroke-opacity="0.4"/>
  <text x="210" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">libfaiss_avx512 / _avx512_spr（VPOPCNT+BF16）</text>
  <rect x="56" y="196" width="308" height="26" rx="5" fill="#1a1d33" stroke="#4ecdc4" stroke-opacity="0.4"/>
  <text x="210" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">libfaiss_sve（ARM）/ 更多 ISA 各一份</text>

  <!-- 运行时 -->
  <rect x="420" y="50" width="340" height="180" rx="8" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.75"/>
  <text x="436" y="74" font-family="system-ui, sans-serif" font-size="13" fill="#f9ca24" font-weight="600">运行时：一次检测，循环外分派</text>
  <rect x="436" y="88" width="308" height="34" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.4"/>
  <text x="590" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">SIMDConfig::auto_detect_simd_level() 探测 CPU</text>
  <rect x="436" y="130" width="308" height="34" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.4"/>
  <text x="590" y="152" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">with_simd_level([&amp;]&lt;SL&gt;{ ... }) 模板 lambda</text>
  <rect x="436" y="172" width="308" height="44" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.4"/>
  <text x="590" y="190" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">dispatch_simd_level_or_lower 逐级回退</text>
  <text x="590" y="209" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">AVX512_SPR→AVX512→AVX2→NONE</text>

  <path d="M 380 140 L 420 140" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">链接</text>

  <!-- simdlib 类型体系 -->
  <rect x="40" y="250" width="720" height="150" rx="8" fill="#13162a" stroke="#80c7ff" stroke-opacity="0.7"/>
  <text x="56" y="274" font-family="system-ui, sans-serif" font-size="13" fill="#80c7ff" font-weight="600">simdlib：一套类型化 SIMD API（impl/simdlib/）</text>
  <rect x="56" y="288" width="220" height="34" rx="5" fill="#1a1d33" stroke="#80c7ff" stroke-opacity="0.4"/>
  <text x="166" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">simd256bit_tpl&lt;SL&gt; 主模板</text>
  <rect x="288" y="288" width="220" height="34" rx="5" fill="#1a1d33" stroke="#80c7ff" stroke-opacity="0.4"/>
  <text x="398" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">simd32uint8 / simd8float32 …</text>
  <rect x="520" y="288" width="220" height="34" rx="5" fill="#1a1d33" stroke="#80c7ff" stroke-opacity="0.4"/>
  <text x="630" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">运算符重载（+、&lt;&lt;、&amp;）</text>
  <rect x="56" y="330" width="684" height="56" rx="5" fill="#1a1d33" stroke="#80c7ff" stroke-opacity="0.25"/>
  <text x="398" y="352" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf" text-anchor="middle">每 ISA 一份特化：simdlib_avx2（29K 行）· avx512 · neon（49K）· ppc64 · emulated（31K，纯 C++ 兜底）</text>
  <text x="398" y="374" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf" text-anchor="middle">新代码用 SIMDLevel 模板参数写一份，5 个 ISA 自动获得实现；distances_dispatch.h 把全套距离核包进分派宏</text>

  <!-- 底注 -->
  <rect x="40" y="420" width="720" height="80" rx="8" fill="#13162a"/>
  <text x="56" y="445" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">CMake 默认开启动态分派：Python wheel 里同时带基线与 AVX2 版本，loader.py 运行时选择（无 AVX2 的老 CPU 自动回退）。</text>
  <text x="56" y="468" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">SIMDLevel 枚举（v1.15）：NONE / AVX2 / AVX512 / AVX512_SPR / ARM_NEON / ARM_SVE / RISCV_RVV / AVX512_VPOPCNT——新增按序追加保数值稳定。</text>
  <text x="56" y="490" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">avx512_split 标志识别 AMD Zen4 的分裂 512 数据通路，让 FastScan 优先选 256-bit 内核。</text>
</svg>
