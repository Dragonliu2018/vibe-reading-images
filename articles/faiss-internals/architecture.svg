<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="700" fill="#0b0d14"/>

  <!-- 绑定层 -->
  <rect x="30" y="18" width="760" height="86" rx="8" fill="#13162a" stroke="#b388ff" stroke-opacity="0.55" stroke-dasharray="6 4"/>
  <text x="46" y="42" font-family="system-ui, sans-serif" font-size="14" fill="#b388ff" font-weight="600">绑定与接口层</text>
  <rect x="46" y="54" width="170" height="38" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="131" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">Python（SWIG）</text>
  <rect x="228" y="54" width="130" height="38" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="293" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">C API</text>
  <rect x="370" y="54" width="200" height="38" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="470" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">factory DSL / AutoTune</text>
  <rect x="582" y="54" width="190" height="38" rx="5" fill="#1a1d33" stroke="#b388ff" stroke-opacity="0.6"/>
  <text x="677" y="78" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">tutorial / benchs</text>

  <path d="M 410 104 L 410 130" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 序列化与组合层 -->
  <rect x="30" y="132" width="760" height="96" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-opacity="0.7"/>
  <text x="46" y="156" font-family="system-ui, sans-serif" font-size="14" fill="#4ecdc4" font-weight="600">组合与序列化层</text>
  <text x="46" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">IndexPreTransform（PCA/OPQ 预变换）· IndexIDMap · IndexRefine（量化+精确重排）</text>
  <text x="46" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">IndexShards / IndexReplicas（分片/副本）· index_read/write（3.6K/1.4K 行手写序列化）</text>
  <text x="46" y="220" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">index_factory（字符串 DSL "IVF4096,PQ32x4"）· clone_index · IOHook 扩展点</text>

  <path d="M 410 228 L 410 254" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 索引骨架层 -->
  <rect x="30" y="256" width="760" height="150" rx="8" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.75"/>
  <text x="46" y="280" font-family="system-ui, sans-serif" font-size="14" fill="#f9ca24" font-weight="600">索引族层（struct Index 虚基类，运行时多态）</text>

  <rect x="46" y="294" width="160" height="52" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.6"/>
  <text x="126" y="315" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">IndexFlat 家族</text>
  <text x="126" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">暴力精确（BLAS）</text>

  <rect x="218" y="294" width="180" height="52" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.6"/>
  <text x="308" y="315" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">IndexIVF 家族</text>
  <text x="308" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">倒排 + 任意编码（主力）</text>

  <rect x="410" y="294" width="170" height="52" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.6"/>
  <text x="495" y="315" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">IndexHNSW/NSG</text>
  <text x="495" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">图遍历 ANN</text>

  <rect x="592" y="294" width="180" height="52" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.6"/>
  <text x="682" y="315" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle">FastScan 家族</text>
  <text x="682" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">4-bit SIMD 批扫</text>

  <rect x="46" y="354" width="160" height="42" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.6"/>
  <text x="126" y="380" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">IndexBinary*</text>
  <rect x="218" y="354" width="180" height="42" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.6"/>
  <text x="308" y="380" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">IndexLSH / Lattice</text>
  <rect x="410" y="354" width="170" height="42" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.6"/>
  <text x="495" y="380" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">IndexSVS*（外部库）</text>
  <rect x="592" y="354" width="180" height="42" rx="5" fill="#1a1d33" stroke="#f9ca24" stroke-opacity="0.6"/>
  <text x="682" y="380" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" text-anchor="middle">IndexEDEN / Panorama</text>

  <path d="M 410 406 L 410 432" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 核心抽象层 -->
  <rect x="30" y="434" width="760" height="96" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.8"/>
  <text x="46" y="458" font-family="system-ui, sans-serif" font-size="14" fill="#6c8ef5" font-weight="600">核心抽象层（impl/ + invlists/）</text>
  <text x="46" y="482" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">InvertedLists（Array/OnDisk/Block 存储）· InvertedListScanner（编码格式多态核心）· DirectMap</text>
  <text x="46" y="502" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">量化器：ProductQuantizer · ScalarQuantizer · ResidualQuantizer · LSQ · RaBitQ · EDEN · Clustering</text>
  <text x="46" y="522" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">图结构：HNSW · NNDescent · NSG　·　DistanceComputer · ResultHandler · IDSelector · CodePacker</text>

  <path d="M 410 530 L 410 556" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 基础设施层 -->
  <rect x="30" y="558" width="540" height="64" rx="8" fill="#13162a" stroke="#80c7ff" stroke-opacity="0.7"/>
  <text x="46" y="580" font-family="system-ui, sans-serif" font-size="14" fill="#80c7ff" font-weight="600">CPU 基础设施（utils/ + impl/simd*）</text>
  <text x="46" y="602" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">distances（BLAS/SIMD 双路径）· simdlib（5 ISA+emulated）· dispatch · Heap/partitioning · hamming</text>

  <!-- GPU 旁路 -->
  <rect x="590" y="558" width="200" height="64" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-opacity="0.7"/>
  <text x="690" y="580" font-family="system-ui, sans-serif" font-size="14" fill="#ff6b9d" font-weight="600" text-anchor="middle">GPU 后端</text>
  <text x="690" y="602" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf" text-anchor="middle">CUDA/ROCm/Metal · cuVS</text>

  <path d="M 300 434 L 300 558" stroke="#7a86b3" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrow)"/>
  <path d="M 690 434 L 690 558" stroke="#7a86b3" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrow)"/>

  <!-- 底注 -->
  <rect x="30" y="640" width="760" height="40" rx="8" fill="#13162a"/>
  <text x="46" y="665" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">GPU 侧（faiss/gpu/，~48K 行 CUDA）独立实现同名索引族（GpuIndexFlat/IVF/CAGRA），GpuCloner 负责 CPU↔GPU 迁移；SVS 集成经 IOHook 委托外部库</text>
</svg>
