<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect width="820" height="420" fill="#0b0d14"/>
  <text x="30" y="26" fill="#e6e8f0" font-size="16" font-weight="600">Capability Seam 三角色（以 shell 为例）</text>
  <text x="790" y="26" fill="#7a86b3" font-size="11" text-anchor="end">换一个 Provider，整个产品行为改变，Consumer 零修改</text>

  <!-- Consumer -->
  <rect x="30" y="70" width="220" height="150" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="2"/>
  <text x="140" y="94" fill="#80c7ff" font-size="14" font-weight="700" text-anchor="middle">Consumer</text>
  <text x="140" y="116" fill="#cdd0e0" font-size="12" text-anchor="middle">tool-bash</text>
  <text x="140" y="138" fill="#8a90a8" font-size="11" text-anchor="middle">ctx.tools.register(</text>
  <text x="140" y="154" fill="#8a90a8" font-size="11" text-anchor="middle">  defineTool({...}))</text>
  <text x="140" y="180" fill="#8a90a8" font-size="11" text-anchor="middle">dispatch 时：</text>
  <text x="140" y="198" fill="#cdd0e0" font-size="11" text-anchor="middle">ctx.shell.run(</text>
  <text x="140" y="214" fill="#cdd0e0" font-size="11" text-anchor="middle">  ctx.shell.resolve(req))</text>

  <!-- Service Definition -->
  <rect x="300" y="70" width="220" height="150" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="2"/>
  <text x="410" y="94" fill="#f9ca24" font-size="14" font-weight="700" text-anchor="middle">Service Definition</text>
  <text x="410" y="116" fill="#cdd0e0" font-size="12" text-anchor="middle">ShellExecutor extends Service</text>
  <text x="410" y="138" fill="#cdd0e0" font-size="12" text-anchor="middle">ctx.shell</text>
  <text x="410" y="164" fill="#8a90a8" font-size="11" text-anchor="middle">abstract resolve(req):Spec</text>
  <text x="410" y="182" fill="#8a90a8" font-size="11" text-anchor="middle">abstract run(spec):Result</text>
  <text x="410" y="200" fill="#8a90a8" font-size="11" text-anchor="middle">abstract start(spec):Process</text>
  <text x="410" y="216" fill="#8a90a8" font-size="10" text-anchor="middle">（contract，非 interface）</text>

  <!-- Provider -->
  <rect x="570" y="70" width="220" height="150" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="2"/>
  <text x="680" y="94" fill="#4ecdc4" font-size="14" font-weight="700" text-anchor="middle">Provider</text>
  <text x="680" y="118" fill="#cdd0e0" font-size="12" text-anchor="middle">bash-local</text>
  <text x="680" y="136" fill="#8a90a8" font-size="11" text-anchor="middle">LocalBashExecutor</text>
  <text x="680" y="158" fill="#cdd0e0" font-size="12" text-anchor="middle">bash-sandbox</text>
  <text x="680" y="176" fill="#8a90a8" font-size="11" text-anchor="middle">extends + ctx.sandbox.confine</text>
  <text x="680" y="198" fill="#cdd0e0" font-size="12" text-anchor="middle">pwsh-local</text>

  <!-- arrows Consumer -> Service -->
  <path d="M250,145 L300,145" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="138" fill="#7a86b3" font-size="11" text-anchor="middle">resolve</text>
  <text x="275" y="160" fill="#7a86b3" font-size="11" text-anchor="middle">/ run</text>

  <!-- arrows Provider -> Service (implements) -->
  <path d="M570,145 L520,145" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="138" fill="#7a86b3" font-size="11" text-anchor="middle">implements</text>

  <!-- execution world inset -->
  <rect x="30" y="250" width="760" height="130" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="50" y="276" fill="#6c8ef5" font-size="13" font-weight="700">共享 execution world —— 一次 swap 搬动整条链</text>
  <text x="50" y="302" fill="#cdd0e0" font-size="12">fs/subprocess/bash-local</text>
  <text x="50" y="320" fill="#8a90a8" font-size="11">本地进程 / 本地文件</text>
  <path d="M295,312 L410,312" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowc)"/>
  <text x="352" y="305" fill="#4ecdc4" font-size="11" text-anchor="middle">swap</text>
  <text x="430" y="302" fill="#4ecdc4" font-size="12">fs-e2b + subprocess-e2b + ctx.e2b</text>
  <text x="430" y="320" fill="#8a90a8" font-size="11">远程沙箱（Bash / PTY / LSP 全跟随）</text>
  <text x="50" y="356" fill="#8a90a8" font-size="11">三者都经 ctx.subprocess / ctx.fs，不各自持有进程或文件 → 无需 bash-e2b、lsp-e2b 等 per-capability remote fork</text>

  <text x="30" y="402" fill="#7a86b3" font-size="11">同一个模式复用于：llm / fs / shell / subprocess / sandbox / subagent / web / lsp / terminal / workflow / skill</text>
</svg>
