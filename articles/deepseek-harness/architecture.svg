<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="880" height="580" fill="#0b0d14"/>
  <text x="30" y="26" fill="#e6e8f0" font-size="16" font-weight="600">DeepSeek Harness 分层架构</text>
  <text x="850" y="26" fill="#7a86b3" font-size="12" text-anchor="end">依赖方向：上层 → 下层</text>

  <!-- L1 装配与入口 -->
  <rect x="30" y="48" width="600" height="74" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="2"/>
  <text x="48" y="74" fill="#80c7ff" font-size="14" font-weight="700">装配与入口层</text>
  <text x="48" y="98" fill="#cdd0e0" font-size="12">apps/cli · boot/app-boot · bundle(base/web-app/headless) · preset</text>
  <text x="48" y="114" fill="#8a90a8" font-size="11">profile / bundle / patch 分层组合，按层序 apply</text>
  <path d="M330,122 L330,152" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L2 应用面 -->
  <rect x="30" y="154" width="600" height="74" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="2"/>
  <text x="48" y="180" fill="#b388ff" font-size="14" font-weight="700">应用面层（host / client 两 face）</text>
  <text x="48" y="204" fill="#cdd0e0" font-size="12">apps/web · host/apiproxy · api/gateway · client(runtime/ui-*) · typert</text>
  <text x="48" y="220" fill="#8a90a8" font-size="11">Web GUI 双半：BFF + 浏览器 shell，Typert 类型图 RPC</text>
  <path d="M330,228 L330,258" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L3 核心引擎 -->
  <rect x="30" y="260" width="600" height="74" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="48" y="286" fill="#6c8ef5" font-size="14" font-weight="700">核心引擎层（产品 API 脊柱）</text>
  <text x="48" y="310" fill="#cdd0e0" font-size="12">core/agent-loop · core/agent · core/tools · core/session · system-prompt · scope</text>
  <text x="48" y="326" fill="#8a90a8" font-size="11">turn/step 驱动 · 工具管线 · session log 真相源</text>
  <path d="M330,334 L330,364" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L4 能力生态 -->
  <rect x="30" y="366" width="600" height="74" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="2"/>
  <text x="48" y="392" fill="#f9ca24" font-size="14" font-weight="700">能力生态层（capability seam providers）</text>
  <text x="48" y="416" fill="#cdd0e0" font-size="12">llm · fs · shell · subprocess · sandbox · terminal · lsp · web · subagent · workflow · skill</text>
  <text x="48" y="432" fill="#8a90a8" font-size="11">Service Definition / Provider / Consumer 三角色，一个 swap 搬动整个 execution world</text>
  <path d="M330,440 L330,470" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L5 Cordis 框架 -->
  <rect x="30" y="472" width="600" height="74" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="2"/>
  <text x="48" y="498" fill="#4ecdc4" font-size="14" font-weight="700">Cordis 插件内核层（vendored framework）</text>
  <text x="48" y="522" fill="#cdd0e0" font-size="12">vendor/cordis · loader · include · group · cosmokit · schemastery</text>
  <text x="48" y="538" fill="#8a90a8" font-size="11">ctx.effect / ctx.on / ctx.waterfall · reversible effects · typed events</text>

  <!-- Cross-cutting: 交互与护栏 (right column, spans L2-L4) -->
  <rect x="660" y="154" width="190" height="286" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="755" y="180" fill="#ff6b9d" font-size="14" font-weight="700" text-anchor="middle">交互与护栏</text>
  <text x="755" y="200" fill="#ff6b9d" font-size="11" text-anchor="middle">（横切，挂 agent/* 与 tools/* 事件）</text>
  <text x="676" y="228" fill="#cdd0e0" font-size="12">· interaction（approval /</text>
  <text x="676" y="252" fill="#cdd0e0" font-size="12">  permission / commands）</text>
  <text x="676" y="278" fill="#cdd0e0" font-size="12">· guard（timeout / repeat）</text>
  <text x="676" y="304" fill="#cdd0e0" font-size="12">· plan / todo</text>
  <text x="676" y="330" fill="#cdd0e0" font-size="12">· context（agent-instructions）</text>
  <text x="676" y="356" fill="#cdd0e0" font-size="12">· compaction / goal</text>
  <text x="676" y="382" fill="#cdd0e0" font-size="12">· hooks（CC / Codex bridge）</text>
  <text x="676" y="408" fill="#cdd0e0" font-size="12">· settings / credentials</text>

  <text x="30" y="566" fill="#7a86b3" font-size="11">实线框=主分层 · 虚线框=横切关注点 · 每层皆 Cordis 插件，无特权核心</text>
</svg>
