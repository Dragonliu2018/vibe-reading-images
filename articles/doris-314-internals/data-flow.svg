<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="540" fill="#0b0d14"/>

  <text x="430" y="28" text-anchor="middle" fill="#e6e8f0" font-size="17" font-weight="600">Doris 查询执行数据流</text>

  <!-- 列标签 -->
  <text x="190" y="56" text-anchor="middle" fill="#6c8ef5" font-size="13" font-weight="600">FE（Java）</text>
  <text x="670" y="56" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="600">BE（C++）</text>

  <!-- FE 列 -->
  <rect x="60" y="66" width="260" height="44" rx="6" fill="#13162a" stroke="#80c7ff"/>
  <text x="190" y="85" text-anchor="middle" fill="#e6e8f0" font-size="13">MySQL Client</text>
  <text x="190" y="101" text-anchor="middle" fill="#9aa3c2" font-size="11">String SQL</text>

  <path d="M190,110 L190,128" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="122" fill="#9aa3c2" font-size="10">连接</text>

  <rect x="60" y="128" width="260" height="44" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="190" y="147" text-anchor="middle" fill="#e6e8f0" font-size="13">ConnectProcessor</text>
  <text x="190" y="163" text-anchor="middle" fill="#9aa3c2" font-size="11">StmtExecutor.executeByNereids</text>

  <path d="M190,172 L190,190" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="184" fill="#9aa3c2" font-size="10">parse</text>

  <rect x="60" y="190" width="260" height="58" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="190" y="210" text-anchor="middle" fill="#e6e8f0" font-size="13">NereidsPlanner</text>
  <text x="190" y="227" text-anchor="middle" fill="#9aa3c2" font-size="11">analyze → rewrite → optimize</text>
  <text x="190" y="242" text-anchor="middle" fill="#9aa3c2" font-size="11">→ postProcess → distribute</text>

  <path d="M190,248 L190,266" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="260" fill="#9aa3c2" font-size="10">PhysicalPlan</text>

  <rect x="60" y="266" width="260" height="50" rx="6" fill="#13162a" stroke="#6c8ef5"/>
  <text x="190" y="287" text-anchor="middle" fill="#e6e8f0" font-size="13">Coordinator</text>
  <text x="190" y="304" text-anchor="middle" fill="#9aa3c2" font-size="11">两阶段：scanRange 分配 + 下发</text>

  <!-- BE 列 -->
  <rect x="540" y="266" width="260" height="50" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="670" y="287" text-anchor="middle" fill="#e6e8f0" font-size="13">FragmentMgr</text>
  <text x="670" y="304" text-anchor="middle" fill="#9aa3c2" font-size="11">exec_plan_fragment</text>

  <path d="M670,316 L670,334" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="328" fill="#9aa3c2" font-size="10">装配</text>

  <rect x="540" y="334" width="260" height="44" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="670" y="353" text-anchor="middle" fill="#e6e8f0" font-size="13">PipelineFragmentContext</text>
  <text x="670" y="369" text-anchor="middle" fill="#9aa3c2" font-size="11">Source → Operator → Sink</text>

  <path d="M670,378 L670,396" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="390" fill="#9aa3c2" font-size="10">调度</text>

  <rect x="540" y="396" width="260" height="50" rx="6" fill="#13162a" stroke="#4ecdc4"/>
  <text x="670" y="417" text-anchor="middle" fill="#e6e8f0" font-size="13">TaskScheduler + PipelineTask</text>
  <text x="670" y="434" text-anchor="middle" fill="#9aa3c2" font-size="11">MLFQ 拉模型 execute(eos)</text>

  <path d="M670,446 L670,464" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="458" fill="#9aa3c2" font-size="10">scan</text>

  <rect x="540" y="464" width="260" height="50" rx="6" fill="#13162a" stroke="#f9ca24"/>
  <text x="670" y="485" text-anchor="middle" fill="#e6e8f0" font-size="13">StorageEngine → Rowset/Segment</text>
  <text x="670" y="502" text-anchor="middle" fill="#9aa3c2" font-size="11">Tablet 不可变列存读取</text>

  <!-- 跨列：Coordinator → FragmentMgr (gRPC 下发) -->
  <path d="M320,283 L540,283" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowc)"/>
  <text x="430" y="276" text-anchor="middle" fill="#4ecdc4" font-size="11">gRPC 下发 Fragment</text>

  <!-- 跨列：FragmentMgr → Coordinator (结果返回) -->
  <path d="M540,300 L320,300" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="430" y="314" text-anchor="middle" fill="#9aa3c2" font-size="11">send_report 结果返回</text>

  <!-- FE 列返回到客户端的箭头 -->
  <path d="M60,290 L30,290 L30,88 L60,88" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="36" y="190" fill="#9aa3c2" font-size="10" transform="rotate(-90 36 190)">结果集回客户端</text>
</svg>
