<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480">
  <rect width="820" height="480" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <!-- ForwardBatch (top, data) -->
  <rect x="220" y="25" width="380" height="62" rx="8" fill="#1a1e2e" stroke="#f9ca24" stroke-width="2"/>
  <text x="410" y="48" text-anchor="middle" class="label" fill="#f9ca24">ForwardBatch（@dataclass, ~50 字段）</text>
  <text x="410" y="65" text-anchor="middle" class="mod">input_ids · positions · seq_lens · out_cache_loc · sampling_info</text>
  <text x="410" y="79" text-anchor="middle" class="mod">spec_info · capture_hidden_mode · (ForwardBatchDeepSeekMHAMixin)</text>

  <!-- ForwardContext (left) -->
  <rect x="20" y="115" width="180" height="80" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="110" y="138" text-anchor="middle" class="label" fill="#4ecdc4">ForwardContext</text>
  <text x="110" y="154" text-anchor="middle" class="mod">frozen dataclass 单例</text>
  <text x="110" y="168" text-anchor="middle" class="mod">get_attn_backend()</text>
  <text x="110" y="182" text-anchor="middle" class="mod">get_token_to_kv_pool()</text>

  <!-- ModelRunner (center core) -->
  <rect x="230" y="115" width="360" height="95" rx="8" fill="#1a1e2e" stroke="#f9ca24" stroke-width="2"/>
  <text x="410" y="138" text-anchor="middle" class="label" fill="#f9ca24">ModelRunner</text>
  <text x="410" y="155" text-anchor="middle" class="mod">model: nn.Module · attn_backend · sampler</text>
  <text x="410" y="169" text-anchor="middle" class="mod">req_to_token_pool · token_to_kv_pool_allocator</text>
  <text x="410" y="183" text-anchor="middle" class="mod">forward() · _forward_raw() · sample() · load_model()</text>
  <text x="410" y="197" text-anchor="middle" class="lbl">三路分发：cuda graph | prefill graph | eager</text>

  <path d="M 410 87 L 410 115" class="arrow" marker-end="url(#ah)"/>
  <text x="420" y="105" class="lbl">init_new</text>
  <path d="M 200 155 L 230 155" class="arrow" marker-end="url(#ah)"/>
  <text x="215" y="148" text-anchor="middle" class="lbl">访问</text>

  <!-- Runner hierarchy (right) -->
  <rect x="610" y="115" width="190" height="95" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="705" y="138" text-anchor="middle" class="label" fill="#9b7cf2">Runner 体系</text>
  <text x="705" y="155" text-anchor="middle" class="mod">BaseRunner(ABC)</text>
  <text x="705" y="169" text-anchor="middle" class="mod">├ EagerRunner</text>
  <text x="705" y="183" text-anchor="middle" class="mod">└ BaseCudaGraphRunner</text>
  <text x="705" y="197" text-anchor="middle" class="mod">  ├ Decode · └ Prefill</text>

  <!-- ModelRunner → Runner -->
  <path d="M 590 162 L 610 162" class="arrow" marker-end="url(#ah)"/>
  <text x="600" y="155" text-anchor="middle" class="lbl">持有</text>

  <!-- three branches below ModelRunner -->
  <text x="410" y="232" text-anchor="middle" class="lbl">_forward_raw 三路分发</text>
  <path d="M 320 210 L 250 250" class="arrow" marker-end="url(#ah)"/>
  <path d="M 410 210 L 410 250" class="arrow" marker-end="url(#ah)"/>
  <path d="M 500 210 L 570 250" class="arrow" marker-end="url(#ah)"/>

  <rect x="120" y="252" width="190" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="215" y="273" text-anchor="middle" class="label" fill="#f9ca24">Decode CudaGraph</text>
  <text x="215" y="290" text-anchor="middle" class="mod">分桶 replay · sentinel padding</text>
  <text x="215" y="304" text-anchor="middle" class="mod">can_run_graph() → 重放</text>

  <rect x="320" y="252" width="190" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="415" y="273" text-anchor="middle" class="label" fill="#4ecdc4">EagerRunner</text>
  <text x="415" y="290" text-anchor="middle" class="mod">_execute_decode/extend/idle</text>
  <text x="415" y="304" text-anchor="middle" class="mod">→ model.forward</text>

  <rect x="520" y="252" width="190" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="615" y="273" text-anchor="middle" class="label" fill="#f9ca24">Prefill CudaGraph</text>
  <text x="615" y="290" text-anchor="middle" class="mod">FULL / BREAKABLE / TC_PIECEWISE</text>
  <text x="615" y="304" text-anchor="middle" class="mod">CudaGraphConfig · PhaseConfig</text>

  <!-- converge → model + logits -->
  <path d="M 215 312 L 300 345" class="arrow" marker-end="url(#ah)"/>
  <path d="M 415 312 L 400 345" class="arrow" marker-end="url(#ah)"/>
  <path d="M 615 312 L 500 345" class="arrow" marker-end="url(#ah)"/>

  <rect x="240" y="347" width="340" height="48" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="410" y="368" text-anchor="middle" class="label" fill="#9b7cf2">model.forward (layers/ + models/)</text>
  <text x="410" y="385" text-anchor="middle" class="mod">embed → attention(RadixAttention) → MLP/MoE → norm → lm_head</text>
  <path d="M 410 395 L 410 420" class="arrow" marker-end="url(#ah)"/>

  <rect x="240" y="422" width="340" height="42" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="410" y="440" text-anchor="middle" class="label" fill="#ff6b9d">logits_processor → LogitsProcessorOutput</text>
  <text x="410" y="456" text-anchor="middle" class="mod">→ ModelRunner.sample → next_token_ids</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
