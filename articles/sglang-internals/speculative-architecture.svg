<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <rect width="820" height="500" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <!-- Top: enum + registry -->
  <rect x="220" y="20" width="380" height="60" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="410" y="42" text-anchor="middle" class="label" fill="#9b7cf2">SpeculativeAlgorithm（枚举 + 注册表）</text>
  <text x="410" y="58" text-anchor="middle" class="mod">EAGLE · EAGLE3 · DFLASH · DSPARK · NGRAM</text>
  <text x="410" y="72" text-anchor="middle" class="mod">FROZEN_KV_MTP · STANDALONE · @register 插件</text>

  <!-- base ABCs -->
  <rect x="40" y="120" width="360" height="80" rx="8" fill="#1a1e2e" stroke="#9b7cf2" stroke-width="2"/>
  <text x="220" y="143" text-anchor="middle" class="label" fill="#9b7cf2">BaseSpecWorker（ABC）</text>
  <text x="220" y="160" text-anchor="middle" class="mod">forward_batch_generation（入口，子类覆盖）</text>
  <text x="220" y="175" text-anchor="middle" class="mod">alloc_memory_pool · init_cuda_graphs</text>
  <text x="220" y="190" text-anchor="middle" class="mod">on_verify_complete_cpu · activate_step_by_batch（hook）</text>

  <rect x="420" y="120" width="360" height="80" rx="8" fill="#1a1e2e" stroke="#9b7cf2" stroke-width="2"/>
  <text x="600" y="143" text-anchor="middle" class="label" fill="#9b7cf2">EagleDraftWorkerBase（ABC）</text>
  <text x="600" y="160" text-anchor="middle" class="mod">@abstractmethod draft() · draft_extend()</text>
  <text x="600" y="175" text-anchor="middle" class="mod">draft_runners · alloc_memory_pool</text>
  <text x="600" y="190" text-anchor="middle" class="mod">_rebuild_topk1_chain_buffers · init_cuda_graphs</text>

  <path d="M 410 50 L 220 120" class="arrow" marker-end="url(#ah)"/>
  <path d="M 410 50 L 600 120" class="arrow" marker-end="url(#ah)"/>

  <!-- workers row -->
  <rect x="20" y="240" width="180" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="110" y="262" text-anchor="middle" class="label" fill="#4ecdc4">EAGLEWorkerV2</text>
  <text x="110" y="278" text-anchor="middle" class="mod">draft · verify</text>
  <text x="110" y="292" text-anchor="middle" class="mod">on_publish overlap</text>

  <rect x="215" y="240" width="180" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="305" y="262" text-anchor="middle" class="label" fill="#4ecdc4">DFlashWorkerV2</text>
  <text x="305" y="278" text-anchor="middle" class="mod">block-level draft</text>
  <text x="305" y="292" text-anchor="middle" class="mod">compact cache · borrow lm_head</text>

  <rect x="410" y="240" width="180" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="500" y="262" text-anchor="middle" class="label" fill="#4ecdc4">NGRAMWorker</text>
  <text x="500" y="278" text-anchor="middle" class="mod">CPU corpus 查找</text>
  <text x="500" y="292" text-anchor="middle" class="mod">无 draft model</text>

  <rect x="605" y="240" width="195" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="702" y="262" text-anchor="middle" class="label" fill="#4ecdc4">FrozenKVMTPWorkerV2</text>
  <text x="702" y="278" text-anchor="middle" class="mod">继承 EAGLEWorkerV2</text>
  <text x="702" y="292" text-anchor="middle" class="mod">复用 target KV（frozen）</text>

  <path d="M 220 200 L 110 240" class="arrow" marker-end="url(#ah)"/>
  <path d="M 220 200 L 305 240" class="arrow" marker-end="url(#ah)"/>
  <path d="M 220 200 L 500 240" class="arrow" marker-end="url(#ah)"/>
  <path d="M 220 200 L 702 240" class="arrow" marker-end="url(#ah)"/>
  <text x="300" y="225" class="lbl">继承/持有</text>

  <!-- SpecInput (right) -->
  <rect x="540" y="330" width="260" height="90" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="670" y="352" text-anchor="middle" class="label" fill="#f9ca24">SpecInput（ABC）</text>
  <text x="670" y="369" text-anchor="middle" class="mod">EagleDraftInput · EagleVerifyInput</text>
  <text x="670" y="384" text-anchor="middle" class="mod">DFlashDraftInputV2 · DFlashVerifyInput</text>
  <text x="670" y="399" text-anchor="middle" class="mod">NgramVerifyInput · FrozenKVMTPDraftInput</text>
  <text x="670" y="414" text-anchor="middle" class="lbl">SpecInputType 区分 draft/verify</text>

  <path d="M 500 300 L 670 330" class="arrow" marker-end="url(#ah)"/>
  <text x="560" y="320" class="lbl">产出</text>

  <!-- interactions bottom -->
  <rect x="20" y="330" width="500" height="90" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="270" y="352" text-anchor="middle" class="label" fill="#4ecdc4">交互</text>
  <text x="270" y="370" text-anchor="middle" class="mod">Scheduler.maybe_init_draft_worker → create_worker</text>
  <text x="270" y="385" text-anchor="middle" class="mod">target_worker.forward(capture_hidden_mode) · is_verify=True 跳采样</text>
  <text x="270" y="400" text-anchor="middle" class="mod">draft KV pool · move_accept_tokens_to_target_kvcache</text>
  <text x="270" y="414" text-anchor="middle" class="lbl">CUDA graph 加速 draft 多步循环 · HiCache 分层</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
