<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450">
  <rect width="820" height="450" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .ipc { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <!-- http_server + middleware -->
  <rect x="30" y="30" width="760" height="60" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="50" y="55" class="label" fill="#6c8ef5">http_server · FastAPI/uvicorn</text>
  <text x="50" y="75" class="mod">ASGI 中间件：CORSMiddleware · RequestDecompression · _ApiKeyASGIMiddleware</text>

  <!-- API compat handlers (right of engine) -->
  <rect x="600" y="115" width="190" height="42" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="695" y="134" text-anchor="middle" class="label" fill="#6c8ef5">OpenAI / Anthropic / Ollama</text>
  <text x="695" y="150" text-anchor="middle" class="mod">serving_chat · serving_base · 转协议</text>

  <!-- Engine + inheritance/mixin -->
  <rect x="280" y="115" width="260" height="55" rx="8" fill="#1a1e2e" stroke="#6c8ef5" stroke-width="2"/>
  <text x="410" y="138" text-anchor="middle" class="label" fill="#6c8ef5">Engine</text>
  <text x="410" y="156" text-anchor="middle" class="mod">_launch_subprocesses · generate · update_weights</text>

  <rect x="80" y="125" width="170" height="35" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="165" y="147" text-anchor="middle" class="label" fill="#4ecdc4">EngineBase (ABC)</text>
  <path d="M 250 142 L 280 142" class="arrow" marker-end="url(#ah)"/>
  <text x="265" y="135" text-anchor="middle" class="lbl">继承</text>

  <rect x="80" y="180" width="170" height="35" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="165" y="202" text-anchor="middle" class="label" fill="#4ecdc4">EngineScoreMixin</text>
  <path d="M 165 180 L 350 170" class="arrow" marker-end="url(#ah)"/>
  <text x="265" y="173" text-anchor="middle" class="lbl">mixin</text>

  <!-- API compat → Engine (委托) -->
  <path d="M 600 136 L 540 142" class="arrow" marker-end="url(#ah)"/>
  <text x="570" y="130" text-anchor="middle" class="lbl">委托 generate</text>

  <!-- Engine spawns three components -->
  <text x="410" y="200" text-anchor="middle" class="lbl">_launch_subprocesses 装配</text>
  <path d="M 410 170 L 200 230" class="ipc" marker-end="url(#ahp)"/>
  <path d="M 410 170 L 410 230" class="arrow" marker-end="url(#ah)"/>
  <path d="M 410 170 L 620 230" class="ipc" marker-end="url(#ahp)"/>

  <!-- TokenizerManager (in-proc) -->
  <rect x="80" y="232" width="240" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="200" y="253" text-anchor="middle" class="label" fill="#4ecdc4">TokenizerManager（主进程）</text>
  <text x="200" y="270" text-anchor="middle" class="mod">asyncio · 直接引用</text>

  <!-- Scheduler subprocess (boundary) -->
  <rect x="290" y="232" width="240" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="410" y="253" text-anchor="middle" class="label" fill="#4ecdc4">Scheduler 子进程</text>
  <text x="410" y="270" text-anchor="middle" class="mod">mp.Process · managers 模块</text>

  <!-- Detokenizer subprocess -->
  <rect x="560" y="232" width="240" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="680" y="253" text-anchor="middle" class="label" fill="#4ecdc4">DetokenizerManager 子进程</text>
  <text x="680" y="270" text-anchor="middle" class="mod">mp.Process · managers 模块</text>

  <!-- gRPC -->
  <rect x="560" y="115" width="30" height="42" rx="8" fill="#13162a" stroke="#5a6075" stroke-width="1.5"/>

  <!-- Watchdog -->
  <rect x="80" y="320" width="660" height="42" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="410" y="339" text-anchor="middle" class="label" fill="#ff6b9d">SubprocessWatchdog · atexit · SIGQUIT handler</text>
  <text x="410" y="355" text-anchor="middle" class="mod">三重保险防子进程泄漏</text>

  <!-- legend -->
  <line x1="60" y1="395" x2="85" y2="395" class="ipc" marker-end="url(#ahp)"/>
  <text x="95" y="399" class="mod">ZMQ IPC 进程边界</text>
  <line x1="240" y1="395" x2="265" y2="395" class="arrow" marker-end="url(#ah)"/>
  <text x="275" y="399" class="mod">进程内调用/继承</text>
  <rect x="420" y="389" width="14" height="12" rx="2" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="442" y="399" class="mod">子进程边界</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b9d"/>
    </marker>
  </defs>
</svg>
