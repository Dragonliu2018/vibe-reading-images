<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640">
  <rect width="800" height="640" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .gpu { stroke: #f9ca24; stroke-width: 1.5; fill: none; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #f9ca24; }
    .branch { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <text x="400" y="24" text-anchor="middle" fill="#8892a8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">EAGLE decode 一次推测解码链路</text>

  <rect x="220" y="40" width="360" height="48" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="400" y="60" text-anchor="middle" class="label" fill="#9b7cf2">spec_worker.forward_batch_generation</text>
  <text x="400" y="77" text-anchor="middle" class="mod">Scheduler.run_batch → model_worker 入口</text>
  <path d="M 400 88 L 400 113" class="arrow" marker-end="url(#ah)"/>

  <!-- 1. draft -->
  <rect x="220" y="115" width="360" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="135" text-anchor="middle" class="label" fill="#f9ca24">1. draft_worker.draft（多步自回归）</text>
  <text x="400" y="152" text-anchor="middle" class="mod">cuda_graph_runner.execute · select_top_k_tokens</text>
  <path d="M 400 165 L 400 190" class="arrow" marker-end="url(#ah)"/>
  <text x="410" y="183" class="dtype">→ topk_p, topk_index, hidden_states</text>

  <!-- 2. build tree -->
  <rect x="220" y="192" width="360" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="212" text-anchor="middle" class="label" fill="#f9ca24">2. build_tree_kernel_efficient</text>
  <text x="400" y="229" text-anchor="middle" class="mod">tree attention mask · retrieve_index · EagleVerifyInput</text>
  <path d="M 400 242 L 400 267" class="arrow" marker-end="url(#ah)"/>

  <!-- 3. verify -->
  <rect x="220" y="269" width="360" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="289" text-anchor="middle" class="label" fill="#f9ca24">3. verify · target_worker.forward(is_verify=True)</text>
  <text x="400" y="306" text-anchor="middle" class="mod">主模型一次 forward 验证所有 draft token</text>
  <path d="M 400 319 L 400 344" class="arrow" marker-end="url(#ah)"/>
  <text x="410" y="337" class="dtype">→ logits_output</text>

  <!-- 4. eagle_sample -->
  <rect x="220" y="346" width="360" height="50" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="400" y="366" text-anchor="middle" class="label" fill="#9b7cf2">4. eagle_sample（树形接受/拒绝）</text>
  <text x="400" y="383" text-anchor="middle" class="mod">verify_tree_greedy / tree_speculative_sampling</text>
  <path d="M 400 396 L 400 421" class="arrow" marker-end="url(#ah)"/>
  <text x="410" y="414" class="dtype">→ accept_lens, bonus_tokens</text>

  <!-- 5. move KV -->
  <rect x="220" y="423" width="360" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="400" y="443" text-anchor="middle" class="label" fill="#ff6b9d">5. move_accept_tokens_to_target_kvcache</text>
  <text x="400" y="460" text-anchor="middle" class="mod">draft KV → target KV 同步</text>
  <path d="M 400 473 L 400 498" class="arrow" marker-end="url(#ah)"/>

  <!-- 6. on_publish -->
  <rect x="220" y="500" width="360" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="520" text-anchor="middle" class="label" fill="#4ecdc4">6. on_publish(new_seq_lens) · FutureMap</text>
  <text x="400" y="537" text-anchor="middle" class="mod">通知 scheduler 下一轮 prep 可重叠</text>
  <path d="M 400 548 L 400 573" class="arrow" marker-end="url(#ah)"/>

  <!-- 7. draft_extend -->
  <rect x="220" y="575" width="360" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="595" text-anchor="middle" class="label" fill="#f9ca24">7. draft_extend_for_decode</text>
  <text x="400" y="612" text-anchor="middle" class="mod">用 verify hidden states 更新 draft KV · next_draft_input</text>

  <!-- side: NGRAM/DFlash diff -->
  <rect x="600" y="115" width="180" height="80" rx="8" fill="none" stroke="#1e2230" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="690" y="135" text-anchor="middle" class="branch">NGRAM：无 1</text>
  <text x="690" y="150" text-anchor="middle" class="mod">CPU corpus 查 draft</text>
  <text x="690" y="165" text-anchor="middle" class="branch">DFlash：无 1-2</text>
  <text x="690" y="180" text-anchor="middle" class="mod">一次 forward 出 block</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
