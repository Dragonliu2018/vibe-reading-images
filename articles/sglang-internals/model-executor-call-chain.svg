<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580">
  <rect width="800" height="580" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #f9ca24; }
    .branch { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <rect x="230" y="20" width="340" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="40" text-anchor="middle" class="label" fill="#4ecdc4">TpModelWorker.forward_batch_generation</text>
  <text x="400" y="57" text-anchor="middle" class="mod">tp_worker.py:561</text>
  <path d="M 400 68 L 400 93" class="arrow" marker-end="url(#ah)"/>
  <text x="410" y="86" class="dtype">ScheduleBatch → ForwardBatch</text>

  <rect x="250" y="95" width="300" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="115" text-anchor="middle" class="label" fill="#f9ca24">ForwardBatch.init_new</text>
  <text x="400" y="132" text-anchor="middle" class="mod">positions · extend_seq_lens · sampling_info</text>
  <path d="M 400 143 L 400 168" class="arrow" marker-end="url(#ah)"/>

  <rect x="250" y="170" width="300" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="190" text-anchor="middle" class="label" fill="#f9ca24">ModelRunner.forward</text>
  <text x="400" y="207" text-anchor="middle" class="mod">forward_context(ForwardContext(attn_backend))</text>
  <path d="M 400 218 L 400 243" class="arrow" marker-end="url(#ah)"/>

  <rect x="250" y="245" width="300" height="44" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="263" text-anchor="middle" class="label" fill="#f9ca24">_forward_raw（三路分发）</text>
  <text x="400" y="280" text-anchor="middle" class="mod">can_run_graph? · mode.is_*()</text>

  <!-- branch -->
  <path d="M 320 289 L 160 320" class="arrow" marker-end="url(#ah)"/>
  <path d="M 400 289 L 400 320" class="arrow" marker-end="url(#ah)"/>
  <path d="M 480 289 L 640 320" class="arrow" marker-end="url(#ah)"/>
  <text x="200" y="308" text-anchor="middle" class="branch">cuda graph</text>
  <text x="400" y="308" text-anchor="middle" class="branch">eager decode</text>
  <text x="600" y="308" text-anchor="middle" class="branch">eager extend</text>

  <rect x="60" y="322" width="200" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="160" y="343" text-anchor="middle" class="label" fill="#f9ca24">cuda graph replay</text>
  <text x="160" y="360" text-anchor="middle" class="mod">load_batch → backend.replay</text>
  <text x="160" y="374" text-anchor="middle" class="mod">截取 raw_num_token 行</text>

  <rect x="300" y="322" width="200" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="343" text-anchor="middle" class="label" fill="#4ecdc4">EagerRunner.execute</text>
  <text x="400" y="360" text-anchor="middle" class="mod">_execute_decode/extend</text>
  <text x="400" y="374" text-anchor="middle" class="mod">attn_backend.init_forward_metadata</text>

  <rect x="540" y="322" width="200" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="640" y="343" text-anchor="middle" class="label" fill="#4ecdc4">_execute_extend</text>
  <text x="640" y="360" text-anchor="middle" class="mod">prepare_mlp_sync_batch</text>
  <text x="640" y="374" text-anchor="middle" class="mod">→ model.forward</text>

  <!-- converge to model.forward -->
  <path d="M 160 382 L 300 415" class="arrow" marker-end="url(#ah)"/>
  <path d="M 400 382 L 400 415" class="arrow" marker-end="url(#ah)"/>
  <path d="M 640 382 L 500 415" class="arrow" marker-end="url(#ah)"/>

  <rect x="230" y="417" width="340" height="48" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="400" y="438" text-anchor="middle" class="label" fill="#9b7cf2">model.forward(input_ids, positions, fb)</text>
  <text x="400" y="455" text-anchor="middle" class="mod">embed → layers[attention+mlp] → norm → lm_head</text>
  <path d="M 400 465 L 400 490" class="arrow" marker-end="url(#ah)"/>
  <text x="410" y="483" class="dtype">→ LogitsProcessorOutput</text>

  <rect x="230" y="492" width="340" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="400" y="512" text-anchor="middle" class="label" fill="#ff6b9d">ModelRunner.sample（TpModelWorker 调）</text>
  <text x="400" y="529" text-anchor="middle" class="mod">_preprocess_logits(grammar mask) · sampler</text>
  <path d="M 400 540 L 400 560" class="arrow" marker-end="url(#ah)"/>
  <text x="490" y="556" class="dtype">→ next_token_ids</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
