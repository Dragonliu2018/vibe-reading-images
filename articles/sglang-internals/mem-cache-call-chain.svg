<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #f9ca24; }
    .branch { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <text x="400" y="24" text-anchor="middle" fill="#8892a8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">前缀缓存命中/插入链路（prefill 请求）</text>

  <!-- 1. match_prefix -->
  <rect x="220" y="40" width="360" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="400" y="60" text-anchor="middle" class="label" fill="#ff6b9d">req.init_next_round_input · tree_cache.match_prefix</text>
  <text x="400" y="77" text-anchor="middle" class="mod">_match_prefix_helper · 指数搜索+二分</text>
  <path d="M 400 90 L 400 115" class="arrow" marker-end="url(#ah)"/>
  <text x="410" y="108" class="dtype">→ prefix_indices, last_node</text>

  <!-- 2. budget check + evict -->
  <rect x="220" y="117" width="360" height="50" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="400" y="137" text-anchor="middle" class="label" fill="#9b7cf2">PrefillAdder · allocator.available_size</text>
  <text x="400" y="154" text-anchor="middle" class="mod">预算不足 → evict_from_tree_cache</text>
  <path d="M 400 167 L 400 192" class="arrow" marker-end="url(#ah)"/>

  <!-- 2b evict branch -->
  <rect x="600" y="117" width="180" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="690" y="137" text-anchor="middle" class="label" fill="#ff6b9d">tree_cache.evict</text>
  <text x="690" y="154" text-anchor="middle" class="mod">min-heap · eviction_strategy</text>
  <path d="M 580 142 L 600 142" class="arrow" marker-end="url(#ah)"/>

  <!-- 3. alloc -->
  <rect x="220" y="194" width="360" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="214" text-anchor="middle" class="label" fill="#f9ca24">alloc_for_extend（allocation.py:303）</text>
  <text x="400" y="231" text-anchor="middle" class="mod">alloc_req_slots · alloc_token_slots / alloc_extend(Triton)</text>
  <path d="M 400 244 L 400 269" class="arrow" marker-end="url(#ah)"/>
  <text x="410" y="262" class="dtype">→ out_cache_loc (slot 索引)</text>

  <!-- 4. write_cache_indices -->
  <rect x="220" y="271" width="360" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="290" text-anchor="middle" class="label" fill="#4ecdc4">write_cache_indices</text>
  <text x="400" y="306" text-anchor="middle" class="mod">req_to_token_pool 映射写入</text>
  <path d="M 400 313 L 400 338" class="arrow" marker-end="url(#ah)"/>

  <!-- 5. forward (set_kv_buffer) -->
  <rect x="220" y="340" width="360" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="360" text-anchor="middle" class="label" fill="#4ecdc4">attention backend · forward</text>
  <text x="400" y="377" text-anchor="middle" class="mod">set_kv_buffer(layer, out_cache_loc, k, v)</text>
  <path d="M 400 390 L 400 415" class="arrow" marker-end="url(#ah)"/>
  <text x="410" y="408" class="dtype">KV 写入物理池</text>

  <!-- 6. completion: cache_finished_req -->
  <rect x="220" y="417" width="360" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="400" y="437" text-anchor="middle" class="label" fill="#ff6b9d">release_kv_cache · cache_finished_req</text>
  <text x="400" y="454" text-anchor="middle" class="mod">common.py:132 · 请求完成时调用</text>
  <path d="M 400 467 L 400 492" class="arrow" marker-end="url(#ah)"/>

  <!-- 7. insert into tree -->
  <rect x="220" y="494" width="360" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="400" y="514" text-anchor="middle" class="label" fill="#ff6b9d">tree_cache.insert · _insert_helper</text>
  <text x="400" y="531" text-anchor="middle" class="mod">_split_node 分裂 · 新 TreeNode · evictable_size_</text>
  <path d="M 400 544 L 400 569" class="arrow" marker-end="url(#ah)"/>

  <rect x="220" y="571" width="360" height="42" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="400" y="590" text-anchor="middle" class="label" fill="#9b7cf2">dec_lock_ref · 释放引用锁</text>
  <text x="400" y="605" text-anchor="middle" class="mod">后续请求可命中此前缀复用 KV</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
