<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340">
  <rect width="820" height="340" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .ipc { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #f9ca24; }
    .lane { font-family: system-ui, sans-serif; font-size: 11px; fill: #5a6075; }
  </style>

  <!-- process lane backgrounds -->
  <rect x="10" y="55" width="230" height="200" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="125" y="48" text-anchor="middle" class="lane">主进程 HTTP + TokenizerManager</text>
  <rect x="290" y="55" width="240" height="200" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="410" y="48" text-anchor="middle" class="lane">Scheduler 子进程</text>
  <rect x="580" y="55" width="230" height="120" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="695" y="48" text-anchor="middle" class="lane">Detokenizer 子进程</text>

  <!-- Col1 boxes -->
  <rect x="30" y="70" width="190" height="42" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="125" y="89" text-anchor="middle" class="label" fill="#6c8ef5">Engine.generate()</text>
  <text x="125" y="104" text-anchor="middle" class="mod">HTTP handler → GenerateReqInput</text>

  <rect x="30" y="135" width="190" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="125" y="154" text-anchor="middle" class="label" fill="#4ecdc4">tokenize · dispatch</text>
  <text x="125" y="169" text-anchor="middle" class="mod">TokenizerManager._send_one_request</text>

  <rect x="30" y="200" width="190" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="125" y="219" text-anchor="middle" class="label" fill="#4ecdc4">handle_loop · stream</text>
  <text x="125" y="234" text-anchor="middle" class="mod">_handle_batch_output → SSE</text>

  <!-- Col2 boxes -->
  <rect x="310" y="70" width="200" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="89" text-anchor="middle" class="label" fill="#4ecdc4">recv_requests</text>
  <text x="410" y="104" text-anchor="middle" class="mod">process_input_requests → waiting_queue</text>

  <rect x="310" y="135" width="200" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="154" text-anchor="middle" class="label" fill="#4ecdc4">get_next_batch_to_run</text>
  <text x="410" y="169" text-anchor="middle" class="mod">SchedulePolicy + PrefillAdder 准入</text>

  <rect x="310" y="200" width="200" height="42" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="219" text-anchor="middle" class="label" fill="#f9ca24">run_batch · sample</text>
  <text x="410" y="234" text-anchor="middle" class="mod">TpModelWorker → ModelRunner.forward</text>

  <!-- Col3 boxes -->
  <rect x="600" y="70" width="190" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="695" y="89" text-anchor="middle" class="label" fill="#4ecdc4">event_loop recv</text>
  <text x="695" y="104" text-anchor="middle" class="mod">recv_from_scheduler (ZMQ PULL)</text>

  <rect x="600" y="135" width="190" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="695" y="154" text-anchor="middle" class="label" fill="#4ecdc4">batch_decode</text>
  <text x="695" y="169" text-anchor="middle" class="mod">handle_batch_token_id_out</text>

  <!-- arrows col1 internal -->
  <path d="M 125 112 L 125 135" class="arrow" marker-end="url(#ah)"/>
  <!-- col1 dispatch → col2 (ZMQ) -->
  <path d="M 220 156 L 310 91" class="ipc" marker-end="url(#ahp)"/>
  <text x="255" y="118" text-anchor="middle" class="dtype">TokenizedGenerateReqInput</text>

  <!-- col2 internal -->
  <path d="M 410 112 L 410 135" class="arrow" marker-end="url(#ah)"/>
  <path d="M 410 177 L 410 200" class="arrow" marker-end="url(#ah)"/>

  <!-- col2 → col3 (ZMQ) -->
  <path d="M 510 221 L 600 91" class="ipc" marker-end="url(#ahp)"/>
  <text x="565" y="150" text-anchor="middle" class="dtype">BatchTokenIDOutput</text>

  <!-- col3 internal -->
  <path d="M 695 112 L 695 135" class="arrow" marker-end="url(#ah)"/>

  <!-- col3 → col1 return (ZMQ) -->
  <path d="M 600 156 L 540 156 L 540 285 L 125 285 L 125 242" class="ipc" marker-end="url(#ahp)"/>
  <text x="330" y="280" text-anchor="middle" class="dtype">BatchStrOutput</text>

  <!-- col1 stream → SSE -->
  <path d="M 30 221 L 8 221 L 8 91 L 30 91" class="arrow" marker-end="url(#ah)" opacity="0.6"/>
  <text x="22" y="158" class="mod" transform="rotate(-90 22 158)">SSE chunk</text>

  <!-- legend -->
  <line x1="540" y1="300" x2="565" y2="300" class="ipc" marker-end="url(#ahp)"/>
  <text x="575" y="304" class="mod">ZMQ PUSH/PULL 进程边界</text>
  <line x1="300" y1="300" x2="325" y2="300" class="arrow" marker-end="url(#ah)"/>
  <text x="335" y="304" class="mod">进程内调用</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b9d"/>
    </marker>
  </defs>
</svg>
