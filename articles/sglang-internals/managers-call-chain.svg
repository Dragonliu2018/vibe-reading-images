<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .ipc { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #f9ca24; }
    .branch { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <text x="210" y="32" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">路径 A — prefill 批</text>
  <text x="590" y="32" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">路径 B — decode 批</text>
  <line x1="400" y1="44" x2="400" y2="560" stroke="#1e2230" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- shared top: process_input_requests -->
  <rect x="250" y="55" width="300" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="75" text-anchor="middle" class="label" fill="#4ecdc4">process_input_requests</text>
  <text x="400" y="91" text-anchor="middle" class="mod">handle_generate_request → Req → waiting_queue</text>
  <path d="M 320 100 L 200 130" class="arrow" marker-end="url(#ah)"/>
  <path d="M 480 100 L 600 130" class="arrow" marker-end="url(#ah)"/>

  <!-- Path A prefill -->
  <rect x="40" y="132" width="320" height="48" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="200" y="152" text-anchor="middle" class="label" fill="#9b7cf2">get_new_batch_prefill</text>
  <text x="200" y="169" text-anchor="middle" class="mod">calc_priority · PrefillAdder.add_one_req</text>
  <path d="M 200 180 L 200 205" class="arrow" marker-end="url(#ah)"/>
  <text x="210" y="197" class="dtype">→ ScheduleBatch</text>

  <rect x="40" y="207" width="320" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="200" y="227" text-anchor="middle" class="label" fill="#f9ca24">ScheduleBatch.prepare_for_extend</text>
  <text x="200" y="244" text-anchor="middle" class="mod">alloc_for_extend · match_prefix</text>
  <path d="M 200 255 L 200 280" class="arrow" marker-end="url(#ah)"/>

  <!-- Path B decode -->
  <rect x="440" y="132" width="320" height="48" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="600" y="152" text-anchor="middle" class="label" fill="#9b7cf2">get_next_batch (merge running)</text>
  <text x="600" y="169" text-anchor="middle" class="mod">filter_batch · merge_batch · mix_with_running</text>
  <path d="M 600 180 L 600 205" class="arrow" marker-end="url(#ah)"/>
  <text x="610" y="197" class="dtype">→ running_batch</text>

  <rect x="440" y="207" width="320" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="600" y="227" text-anchor="middle" class="label" fill="#f9ca24">ScheduleBatch.prepare_for_decode</text>
  <text x="600" y="244" text-anchor="middle" class="mod">alloc_for_decode · seq_lens+1</text>
  <path d="M 600 255 L 600 280" class="arrow" marker-end="url(#ah)"/>

  <!-- converge: run_batch -->
  <path d="M 200 280 L 200 310 L 400 330" class="arrow" marker-end="url(#ah)"/>
  <path d="M 600 280 L 600 310 L 400 330" class="arrow" marker-end="url(#ah)"/>
  <rect x="250" y="312" width="300" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="333" text-anchor="middle" class="label" fill="#f9ca24">run_batch</text>
  <text x="400" y="350" text-anchor="middle" class="mod">TpModelWorker.forward_batch_generation</text>
  <path d="M 400 362 L 400 387" class="arrow" marker-end="url(#ah)"/>

  <rect x="230" y="389" width="340" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="409" text-anchor="middle" class="label" fill="#4ecdc4">ForwardBatch.init_new → ModelRunner.forward</text>
  <text x="400" y="426" text-anchor="middle" class="mod">→ sample → GenerationBatchResult</text>
  <path d="M 400 437 L 400 462" class="arrow" marker-end="url(#ah)"/>

  <rect x="230" y="464" width="340" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="484" text-anchor="middle" class="label" fill="#4ecdc4">process_batch_result</text>
  <text x="400" y="501" text-anchor="middle" class="mod">batch_result_processor · output_streamer</text>
  <path d="M 400 512 L 400 537" class="ipc" marker-end="url(#ahp)"/>
  <text x="410" y="530" class="dtype">→ BatchTokenIDOutput (ZMQ)</text>

  <rect x="250" y="539" width="300" height="42" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="400" y="558" text-anchor="middle" class="label" fill="#ff6b9d">→ DetokenizerManager</text>
  <text x="400" y="573" text-anchor="middle" class="mod">overlap 模式经 result_queue 延迟一步</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b9d"/>
    </marker>
  </defs>
</svg>
