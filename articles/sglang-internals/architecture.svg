<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530">
  <rect width="800" height="530" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 12px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Layer 1: API / 接口层 -->
  <rect x="20" y="20" width="760" height="70" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="40" y="45" class="label" fill="#6c8ef5">接口层 · API Layer</text>
  <text x="40" y="68" class="mod">entrypoints/ (HTTP Server · OpenAI/Anthropic/Ollama API · gRPC) · sgl-model-gateway (Rust 网关)</text>

  <path d="M 400 90 L 400 123" class="arrow" marker-end="url(#ah)"/>

  <!-- Layer 2: 编排层 -->
  <rect x="20" y="125" width="760" height="70" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="40" y="150" class="label" fill="#4ecdc4">编排层 · Runtime Orchestration</text>
  <text x="40" y="173" class="mod">managers/ (TokenizerManager · Scheduler · DetokenizerManager · DataParallelController) · io_struct (ZMQ IPC)</text>

  <path d="M 400 195 L 400 228" class="arrow" marker-end="url(#ah)"/>

  <!-- Layer 3: 执行层 -->
  <rect x="20" y="230" width="760" height="70" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="40" y="255" class="label" fill="#f9ca24">执行层 · Execution Engine</text>
  <text x="40" y="278" class="mod">model_executor/ (ModelRunner · ForwardBatch · CUDA Graph) · speculative/ (EAGLE/DFlash/n-gram) · sampling/</text>

  <path d="M 400 300 L 400 333" class="arrow" marker-end="url(#ah)"/>

  <!-- Layer 4: 缓存层 -->
  <rect x="20" y="335" width="760" height="70" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="40" y="360" class="label" fill="#ff6b9d">缓存层 · KV Cache (RadixAttention)</text>
  <text x="40" y="383" class="mod">mem_cache/ (RadixCache · HIRadixCache · MemoryPool · Allocator)</text>

  <path d="M 400 405 L 400 438" class="arrow" marker-end="url(#ah)"/>

  <!-- Layer 5: 模型算子与硬件层 -->
  <rect x="20" y="440" width="760" height="70" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="40" y="465" class="label" fill="#9b7cf2">模型算子与硬件层 · Models · Kernels · Hardware</text>
  <text x="40" y="488" class="mod">models/ + layers/ (Attention/MoE/Quant) · sgl-kernel/ (CUDA) · hardware_backend/ · distributed/ (TP/PP/EP/DP)</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
