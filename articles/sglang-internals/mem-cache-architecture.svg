<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520">
  <rect width="820" height="520" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <!-- KVCacheConfigurator (top) -->
  <rect x="250" y="20" width="320" height="42" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="410" y="40" text-anchor="middle" class="label" fill="#9b7cf2">KVCacheConfigurator</text>
  <text x="410" y="56" text-anchor="middle" class="mod">探测显存 · _derive_pool_sizes · _init_pools</text>
  <path d="M 410 62 L 410 88" class="arrow" marker-end="url(#ah)"/>

  <!-- 3-tier MemoryPool (center) -->
  <text x="410" y="84" text-anchor="middle" class="lbl">三层架构</text>
  <rect x="40" y="95" width="240" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="160" y="115" text-anchor="middle" class="label" fill="#4ecdc4">① ReqToTokenPool</text>
  <text x="160" y="131" text-anchor="middle" class="mod">request → token 位置映射</text>

  <rect x="290" y="95" width="240" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="115" text-anchor="middle" class="label" fill="#f9ca24">② Allocator</text>
  <text x="410" y="131" text-anchor="middle" class="mod">管理 KV slot 索引（无数据拷贝）</text>

  <rect x="540" y="95" width="240" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="660" y="115" text-anchor="middle" class="label" fill="#ff6b9d">③ KVCache（物理张量）</text>
  <text x="660" y="131" text-anchor="middle" class="mod">MHA / MLA / FP4 / DSA / …</text>

  <path d="M 280 119 L 290 119" class="arrow" marker-end="url(#ah)"/>
  <path d="M 530 119 L 540 119" class="arrow" marker-end="url(#ah)"/>

  <!-- RadixCache (left, logic) -->
  <rect x="30" y="170" width="250" height="100" rx="8" fill="#1a1e2e" stroke="#ff6b9d" stroke-width="2"/>
  <text x="155" y="193" text-anchor="middle" class="label" fill="#ff6b9d">RadixCache（radix tree）</text>
  <text x="155" y="210" text-anchor="middle" class="mod">TreeNode · RadixKey · children</text>
  <text x="155" y="225" text-anchor="middle" class="mod">match_prefix · insert · _split_node</text>
  <text x="155" y="240" text-anchor="middle" class="mod">evict · inc/dec_lock_ref</text>
  <text x="155" y="257" text-anchor="middle" class="lbl">value = KV slot 索引张量</text>
  <text x="155" y="270" text-anchor="middle" class="lbl">evictable_leaves + eviction_strategy</text>

  <!-- Allocator variants (right) -->
  <rect x="540" y="170" width="240" height="100" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="660" y="193" text-anchor="middle" class="label" fill="#f9ca24">Allocator 变体</text>
  <text x="660" y="210" text-anchor="middle" class="mod">TokenToKVPoolAllocator (page=1)</text>
  <text x="660" y="225" text-anchor="middle" class="mod">Paged (Triton kernel alloc_extend)</text>
  <text x="660" y="240" text-anchor="middle" class="mod">SWA (full+SWA 复合)</text>
  <text x="660" y="255" text-anchor="middle" class="mod">MambaSlot · HiSparse</text>
  <text x="660" y="270" text-anchor="middle" class="lbl">BaseTokenToKVPoolAllocator(ABC)</text>

  <!-- RadixCache ↔ Allocator (value 指向 slot) -->
  <path d="M 280 220 L 540 220" class="arrow" marker-end="url(#ah)"/>
  <text x="410" y="213" text-anchor="middle" class="lbl">node.value = slot 索引</text>

  <!-- variants (bottom) -->
  <rect x="30" y="300" width="240" height="80" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="150" y="322" text-anchor="middle" class="label" fill="#9b7cf2">HiRadixCache（3 层）</text>
  <text x="150" y="339" text-anchor="middle" class="mod">L1 GPU · L2 Host · L3 Storage</text>
  <text x="150" y="354" text-anchor="middle" class="mod">write_through_selective</text>
  <text x="150" y="369" text-anchor="middle" class="mod">load_back DMA · prefetch</text>

  <rect x="290" y="300" width="240" height="80" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="410" y="322" text-anchor="middle" class="label" fill="#9b7cf2">UnifiedRadixCache</text>
  <text x="410" y="339" text-anchor="middle" class="mod">ComponentType: FULL/SWA/MAMBA</text>
  <text x="410" y="354" text-anchor="middle" class="mod">TreeCore 统一 tree 状态</text>
  <text x="410" y="369" text-anchor="middle" class="mod">混合模型多类型 cache</text>

  <rect x="550" y="300" width="240" height="80" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="670" y="322" text-anchor="middle" class="label" fill="#4ecdc4">registry（插件）</text>
  <text x="670" y="339" text-anchor="middle" class="mod">register_radix_cache_backend</text>
  <text x="670" y="354" text-anchor="middle" class="mod">default_radix_cache_factory</text>
  <text x="670" y="369" text-anchor="middle" class="mod">选择链: Chunk→RadixCpp→…</text>

  <!-- eviction strategies -->
  <rect x="30" y="410" width="760" height="42" rx="8" fill="#13162a" stroke="#5a6075" stroke-width="1.5"/>
  <text x="410" y="430" text-anchor="middle" class="label" fill="#9b7cf2">EvictionStrategy（策略工厂）</text>
  <text x="410" y="446" text-anchor="middle" class="mod">LRU(默认) · LFU · FIFO · MRU · FILO · Priority · SLRU</text>

  <!-- interactions bottom -->
  <rect x="30" y="470" width="760" height="38" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="410" y="489" text-anchor="middle" class="mod" fill="#4ecdc4">Scheduler 持有 tree_cache · attention 层 set_kv_buffer/get_key_buffer · ForwardBatch.out_cache_loc</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
