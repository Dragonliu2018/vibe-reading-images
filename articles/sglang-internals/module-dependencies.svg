<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
  <rect width="820" height="430" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .ipc { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <!-- Top row: request-flow modules (left → right) -->
  <rect x="20" y="40" width="180" height="70" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="110" y="65" text-anchor="middle" class="label" fill="#6c8ef5">接口层 entrypoints</text>
  <text x="110" y="88" text-anchor="middle" class="mod">Engine · http_server</text>

  <rect x="230" y="40" width="180" height="70" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" class="label" fill="#4ecdc4">编排层 managers</text>
  <text x="320" y="88" text-anchor="middle" class="mod">Scheduler · TokenizerManager</text>

  <rect x="440" y="40" width="180" height="70" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="530" y="65" text-anchor="middle" class="label" fill="#f9ca24">执行层 model_executor</text>
  <text x="530" y="88" text-anchor="middle" class="mod">ModelRunner · ForwardBatch</text>

  <rect x="650" y="40" width="150" height="70" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="725" y="65" text-anchor="middle" class="label" fill="#ff6b9d">缓存层 mem_cache</text>
  <text x="725" y="88" text-anchor="middle" class="mod">RadixCache · MemoryPool</text>

  <!-- arrows top row -->
  <path d="M 200 75 L 230 75" class="ipc" marker-end="url(#ah)"/>
  <text x="215" y="68" text-anchor="middle" class="lbl">ZMQ</text>
  <path d="M 410 75 L 440 75" class="arrow" marker-end="url(#ah)"/>
  <text x="425" y="68" text-anchor="middle" class="lbl">forward</text>
  <path d="M 620 75 L 650 75" class="arrow" marker-end="url(#ah)"/>
  <text x="635" y="68" text-anchor="middle" class="lbl">KV r/w</text>

  <!-- speculative (below, hub-spoke) -->
  <rect x="330" y="210" width="200" height="70" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="430" y="235" text-anchor="middle" class="label" fill="#9b7cf2">推测解码 speculative</text>
  <text x="430" y="258" text-anchor="middle" class="mod">EAGLE · DFlash · n-gram</text>

  <!-- speculative → managers / model_executor / mem_cache -->
  <path d="M 360 210 L 320 110" class="arrow" marker-end="url(#ah)"/>
  <text x="318" y="165" text-anchor="end" class="lbl">spec_worker</text>
  <path d="M 460 210 L 500 110" class="arrow" marker-end="url(#ah)"/>
  <text x="525" y="165" class="lbl">verify forward</text>
  <path d="M 530 245 L 650 110" class="arrow" marker-end="url(#ah)"/>
  <text x="615" y="185" text-anchor="end" class="lbl">draft KV</text>

  <!-- bottom layer: models/layers + kernel/hardware -->
  <rect x="20" y="340" width="390" height="70" rx="8" fill="#13162a" stroke="#9b7cf2" stroke-width="1.5"/>
  <text x="215" y="365" text-anchor="middle" class="label" fill="#9b7cf2">模型算子层</text>
  <text x="215" y="388" text-anchor="middle" class="mod">models/ + layers/ (Attention · MoE · Quant)</text>

  <rect x="440" y="340" width="360" height="70" rx="8" fill="#13162a" stroke="#5a6075" stroke-width="1.5"/>
  <text x="620" y="365" text-anchor="middle" class="label" fill="#9b7cf2">算子与硬件层</text>
  <text x="620" y="388" text-anchor="middle" class="mod">sgl-kernel (CUDA) · hardware_backend · distributed</text>

  <!-- model_executor → models/layers -->
  <path d="M 490 110 L 300 340" class="arrow" marker-end="url(#ah)"/>
  <text x="370" y="225" text-anchor="end" class="lbl">model.forward</text>
  <!-- mem_cache → kernel -->
  <path d="M 700 110 L 640 340" class="arrow" marker-end="url(#ah)"/>
  <text x="690" y="225" class="lbl">Triton/CUDA op</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b9d"/>
    </marker>
  </defs>
</svg>
