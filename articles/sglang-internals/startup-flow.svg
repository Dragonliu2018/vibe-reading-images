<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <rect width="800" height="560" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #5a6885; font-style: italic; }
  </style>

  <!-- main() -->
  <rect x="270" y="20" width="260" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="42" text-anchor="middle" class="label" fill="#6c8ef5">sglang serve --model-path ...</text>
  <text x="400" y="58" text-anchor="middle" class="mod">cli/serve.py · ServerArgs</text>
  <path d="M 400 70 L 400 95" class="arrow" marker-end="url(#ah)"/>

  <!-- launch_server -->
  <rect x="250" y="97" width="300" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="119" text-anchor="middle" class="label" fill="#6c8ef5">http_server.launch_server()</text>
  <text x="400" y="135" text-anchor="middle" class="mod">entrypoints/http_server.py</text>
  <path d="M 400 147 L 400 172" class="arrow" marker-end="url(#ah)"/>
  <text x="415" y="163" class="dtype">server_args</text>

  <!-- Engine.__init__ -->
  <rect x="230" y="174" width="340" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="196" text-anchor="middle" class="label" fill="#6c8ef5">Engine.__init__() · _launch_subprocesses</text>
  <text x="400" y="212" text-anchor="middle" class="mod">entrypoints/engine.py:1036</text>
  <path d="M 400 224 L 400 250" class="arrow" marker-end="url(#ah)"/>

  <!-- PortArgs + env -->
  <rect x="250" y="252" width="300" height="42" rx="8" fill="#13162a" stroke="#5a6075" stroke-width="1.5"/>
  <text x="400" y="270" text-anchor="middle" class="label">PortArgs.init_new() · _set_envs_and_config</text>
  <text x="400" y="286" text-anchor="middle" class="mod">分配 ZMQ ipc name · NCCL/CUDA env</text>
  <path d="M 400 294 L 400 320" class="arrow" marker-end="url(#ah)"/>

  <!-- three subprocess boxes -->
  <text x="400" y="316" text-anchor="middle" class="dtype">fan-out 三个进程组件</text>
  <!-- branch lines -->
  <path d="M 400 320 L 130 350" class="arrow" marker-end="url(#ah)"/>
  <path d="M 400 320 L 400 350" class="arrow" marker-end="url(#ah)"/>
  <path d="M 400 320 L 670 350" class="arrow" marker-end="url(#ah)"/>

  <!-- TokenizerManager (main proc) -->
  <rect x="30" y="352" width="200" height="55" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="130" y="373" text-anchor="middle" class="label" fill="#4ecdc4">TokenizerManager</text>
  <text x="130" y="392" text-anchor="middle" class="mod">主进程 · asyncio</text>

  <!-- Scheduler (subprocess) -->
  <rect x="300" y="352" width="200" height="55" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="373" text-anchor="middle" class="label" fill="#4ecdc4">Scheduler 子进程</text>
  <text x="400" y="392" text-anchor="middle" class="mod">mp.Process · 每 TP rank 一个</text>

  <!-- Detokenizer (subprocess) -->
  <rect x="570" y="352" width="200" height="55" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="670" y="373" text-anchor="middle" class="label" fill="#4ecdc4">DetokenizerManager</text>
  <text x="670" y="392" text-anchor="middle" class="mod">子进程 · ZMQ PULL</text>

  <!-- load model + kv cache -->
  <path d="M 400 407 L 400 432" class="arrow" marker-end="url(#ah)"/>
  <rect x="270" y="434" width="260" height="45" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="453" text-anchor="middle" class="label" fill="#f9ca24">加载模型 · 构建 KV cache · init_cuda_graphs</text>
  <text x="400" y="469" text-anchor="middle" class="mod">model_loader · kv_cache_builder · ModelRunner</text>

  <!-- wait_for_ready -->
  <path d="M 400 479 L 400 504" class="arrow" marker-end="url(#ah)"/>
  <text x="415" y="495" class="dtype">mp.Pipe "ready"</text>
  <rect x="270" y="506" width="260" height="40" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="400" y="531" text-anchor="middle" class="label" fill="#ff6b9d">wait_for_ready() · SubprocessWatchdog</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
