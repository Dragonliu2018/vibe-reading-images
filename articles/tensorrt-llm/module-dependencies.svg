<svg viewBox="0 0 820 500" xmlns="http://www.w3.org/2000/svg" width="820" height="500" style="display:block;margin:0 auto;">
  <rect width="820" height="500" rx="12" fill="#0b0d14"/>
  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#5a6075"/></marker>
  </defs>
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#e6e8f0" font-family="system-ui,sans-serif">模块依赖关系</text>

  <!-- llmapi -->
  <rect x="320" y="50" width="180" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="410" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c8ef5" font-family="system-ui,sans-serif">llmapi</text>

  <line x1="410" y1="100" x2="410" y2="120" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- executor -->
  <rect x="320" y="125" width="180" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#4ecdc4" font-family="system-ui,sans-serif">executor</text>

  <line x1="410" y1="175" x2="410" y2="195" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- pyexecutor -->
  <rect x="320" y="200" width="180" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9ca24" font-family="system-ui,sans-serif">pyexecutor</text>

  <!-- pyexecutor -> models (left) -->
  <line x1="320" y1="225" x2="200" y2="225" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="200" y1="225" x2="200" y2="295" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="110" y="300" width="180" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="200" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#ff6b9d" font-family="system-ui,sans-serif">models</text>
  <text x="245" y="262" text-anchor="end" font-size="10" fill="#7a8095" font-family="system-ui,sans-serif">forward()</text>

  <!-- pyexecutor -> modules (right) via models -->
  <line x1="200" y1="350" x2="200" y2="375" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="110" y="380" width="180" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="200" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#ff6b9d" font-family="system-ui,sans-serif">modules</text>

  <!-- modules -> attention_backend -->
  <line x1="290" y1="405" x2="320" y2="405" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="320" y="380" width="180" height="50" rx="8" fill="#13162a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="410" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#a78bfa" font-family="system-ui,sans-serif">attention_backend</text>

  <!-- pyexecutor -> speculative (right) -->
  <line x1="500" y1="225" x2="620" y2="225" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="620" y1="225" x2="620" y2="295" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="530" y="300" width="180" height="50" rx="8" fill="#13162a" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="620" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2ecc71" font-family="system-ui,sans-serif">speculative</text>
  <text x="545" y="262" text-anchor="start" font-size="10" fill="#7a8095" font-family="system-ui,sans-serif">drafter hook</text>

  <!-- pyexecutor -> disaggregation -->
  <line x1="620" y1="350" x2="620" y2="375" stroke="#5a6075" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="530" y="380" width="180" height="50" rx="8" fill="#13162a" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="620" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#2ecc71" font-family="system-ui,sans-serif">disaggregation</text>

  <!-- attention_backend -> custom_ops/kernels (down) -->
  <line x1="410" y1="430" x2="410" y2="450" stroke="#5a6075" stroke-width="1.5" stroke-end="url(#arr2)"/>
  <rect x="320" y="455" width="180" height="35" rx="8" fill="#13162a" stroke="#5a6075" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="410" y="478" text-anchor="middle" font-size="11" fill="#7a8095" font-family="system-ui,sans-serif">custom_ops / cpp kernels</text>

  <!-- serve -> executor (left side, dashed) -->
  <line x1="320" y1="150" x2="200" y2="150" stroke="#5a6075" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr2)"/>
  <rect x="20" y="125" width="160" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="100" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c8ef5" font-family="system-ui,sans-serif">serve</text>
</svg>
