<svg xmlns="http://www.w3.org/2000/svg" width="820" height="590" viewBox="0 0 820 590">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="590" fill="#0b0d14"/>
  <text x="410" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e0e0e0">Jeandle 编译流水线（6 阶段）</text>

  <!-- Stage 1: JavaOperationLower(0) -->
  <circle cx="205" cy="95" r="13" fill="#6c8ef5"/>
  <text x="205" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b0d14">1</text>
  <rect x="240" y="66" width="340" height="58" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="410" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6c8ef5">JavaOperationLower&lt;phase=0&gt;</text>
  <text x="410" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c0c6dc">早期 JavaOp 内联</text>
  <text x="600" y="100" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c0">O3 前·展开模板</text>

  <!-- arrow 1->2 -->
  <path d="M410,124 L410,154" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 2: default<O3> -->
  <circle cx="205" cy="183" r="13" fill="#f9ca24"/>
  <text x="205" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b0d14">2</text>
  <rect x="240" y="154" width="340" height="58" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="177" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f9ca24">default&lt;O3&gt;</text>
  <text x="410" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c0c6dc">LLVM 标准 O3 优化</text>
  <text x="600" y="188" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c0">内联·GVN·循环</text>

  <!-- arrow 2->3 -->
  <path d="M410,212 L410,242" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 3: InsertGCBarriers -->
  <circle cx="205" cy="271" r="13" fill="#4ecdc4"/>
  <text x="205" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b0d14">3</text>
  <rect x="240" y="242" width="340" height="58" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4ecdc4">InsertGCBarriers</text>
  <text x="410" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c0c6dc">插入 card-table 屏障</text>
  <text x="600" y="276" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c0">addrspace(1) 写后</text>

  <!-- arrow 3->4 -->
  <path d="M410,300 L410,330" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 4: JavaOperationLower(1) -->
  <circle cx="205" cy="359" r="13" fill="#6c8ef5"/>
  <text x="205" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b0d14">4</text>
  <rect x="240" y="330" width="340" height="58" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="410" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6c8ef5">JavaOperationLower&lt;phase=1&gt;</text>
  <text x="410" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c0c6dc">晚期 JavaOp 内联</text>
  <text x="600" y="364" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c0">展开屏障函数</text>

  <!-- arrow 4->5 -->
  <path d="M410,388 L410,418" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 5: TLSPointerRewrite -->
  <circle cx="205" cy="447" r="13" fill="#b388ff"/>
  <text x="205" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b0d14">5</text>
  <rect x="240" y="418" width="340" height="58" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="410" y="441" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#b388ff">TLSPointerRewrite</text>
  <text x="410" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c0c6dc">TLS 指针基址改写</text>
  <text x="600" y="452" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c0">addrspace(2)→基址</text>

  <!-- arrow 5->6 -->
  <path d="M410,476 L410,506" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 6: RewriteStatepointsForGC -->
  <circle cx="205" cy="535" r="13" fill="#ff6b9d"/>
  <text x="205" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b0d14">6</text>
  <rect x="240" y="506" width="340" height="58" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="410" y="529" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ff6b9d">RewriteStatepointsForGC</text>
  <text x="410" y="548" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c0c6dc">statepoint + relocate</text>
  <text x="600" y="540" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3c0">GC 安全点重写</text>

</svg>
