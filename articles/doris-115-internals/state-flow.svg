troke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M550,88.0 L570,88.0" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="230.0" y="176" width="150" height="48" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/><text x="305.0" y="196" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">ABORTED</text><text x="305.0" y="212" text-anchor="middle" fill="#9aa0c0" font-size="11">abortTransaction / 超时</text><path d="M135.0,112 L230.0,176" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M305.0,112 L305.0,176" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M475.0,112 L380.0,176" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="40" y="246" fill="#9aa0c0" font-size="11">主链 PREPARE→PRECOMMITTED→COMMITTED→VISIBLE 为两阶段提交正常路径；任一前置状态可 abort 进 ABORTED 终态。</text><line x1="40" y1="270" x2="860" y2="270" stroke="#7a86b3" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/><text x="40" y="298" fill="#f9ca24" font-size="14" font-weight="700">执行路径选择（enable_vectorized_engine · SessionVariable.java:169）</text><rect x="60" y="330" width="180" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/><text x="150.0" y="350" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">StmtExecutor</text><text x="150.0" y="366" text-anchor="middle" fill="#9aa0c0" font-size="11">execute()</text><path d="M420.0,322 L520,356.0 L420.0,390 L320,356.0 z" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/><text x="420.0" y="360.0" text-anchor="middle" fill="#e8eaf2" font-size="12" font-weight="600">enable_vectorized_engine?</text><path d="M240,356 L320,356" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="580" y="300" width="240" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/><text x="700.0" y="320" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">向量化 vec/</text><text x="700.0" y="336" text-anchor="middle" fill="#9aa0c0" font-size="11">VNode · Block 列存</text><path d="M520,346.0 L580,324" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="550.0" y="318" text-anchor="middle" fill="#4ecdc4" font-size="11">true（默认）</text><rect x="580" y="370" width="240" height="48" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/><text x="700.0" y="390" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">行式 exec/ + exprs/</text><text x="700.0" y="406" text-anchor="middle" fill="#9aa0c0" font-size="11">ExecNode · RowBatch</text><path d="M520,366.0 L580,394" stroke="#6c8ef5" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="550.0" y="412" text-anchor="middle" fill="#9aa0c0" font-size="11">false</text><text x="40" y="448" fill="#9aa0c0" font-size="11">create_node() 工厂按 enable_vectorized_exec() 二选一实例化 V*Node 或 legacy 节点；1.x 双轨并存，2.x 起统一向量化。</text></svg>