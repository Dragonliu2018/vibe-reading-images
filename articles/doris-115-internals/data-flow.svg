.get_next</text><text x="420.0" y="614" text-anchor="middle" fill="#9aa0c0" font-size="11">Volcano pull 递归拉取</text><path d="M420,626 L420,648" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="240.0" y="648" width="360" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/><text x="420.0" y="668" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">OlapScanNode → Tablet/Segment</text><text x="420.0" y="684" text-anchor="middle" fill="#9aa0c0" font-size="11">列存 Page 解码</text><path d="M420,696 L420,718" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="240.0" y="718" width="360" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/><text x="420.0" y="738" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">ResultSink → BufferControlBlock</text><text x="420.0" y="754" text-anchor="middle" fill="#9aa0c0" font-size="11">结果缓存待取</text><path d="M420,448 L420,508" stroke="#f9ca24" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M600.0,742.0 L820,742.0 L820,74.0 L600.0,74.0" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="5 3"/><text x="824" y="400" fill="#4ecdc4" font-size="11">fetch_data BRPC</text><text x="824" y="416" fill="#4ecdc4" font-size="11">→ ResultReceiver.getNext</text><text x="824" y="432" fill="#4ecdc4" font-size="11">→ MysqlChannel.sendOnePacket</text></svg>