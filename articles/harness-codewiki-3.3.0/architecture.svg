<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="system-ui, sans-serif">
  <rect width="880" height="410" fill="#0b0d14"/>
  <text x="440" y="26" text-anchor="middle" fill="#e8eaf0" font-size="15" font-weight="600">Harness 分层架构（自顶向下依赖）</text>

  <!-- L1 协议入口层 #4ecdc4 -->
  <text x="18" y="74" fill="#4ecdc4" font-size="13" font-weight="600">协议入口层</text>
  <g stroke="#4ecdc4" stroke-width="1.5" fill="#13162a">
    <rect x="142" y="55" width="136" height="30" rx="5"/><rect x="288" y="55" width="136" height="30" rx="5"/><rect x="434" y="55" width="136" height="30" rx="5"/><rect x="580" y="55" width="136" height="30" rx="5"/><rect x="726" y="55" width="136" height="30" rx="5"/>
  </g>
  <g fill="#e8eaf0" font-size="12" text-anchor="middle">
    <text x="210" y="74">WebRouter</text><text x="356" y="74">APIRouter</text><text x="502" y="74">GitRouter</text><text x="648" y="74">Registry</text><text x="794" y="74">SSH Server</text>
  </g>

  <!-- L2 应用编排层 #6c8ef5 -->
  <text x="18" y="128" fill="#6c8ef5" font-size="13" font-weight="600">应用编排层</text>
  <g stroke="#6c8ef5" stroke-width="1.5" fill="#13162a">
    <rect x="142" y="109" width="232" height="30" rx="5"/><rect x="388" y="109" width="232" height="30" rx="5"/><rect x="634" y="109" width="232" height="30" rx="5"/>
  </g>
  <g fill="#e8eaf0" font-size="12" text-anchor="middle">
    <text x="258" y="128">api/handler HTTP 薄层</text><text x="504" y="128">api/controller 编排</text><text x="750" y="128">bootstrap + wire 装配</text>
  </g>

  <!-- L3 领域服务层 #b388ff -->
  <text x="18" y="182" fill="#b388ff" font-size="13" font-weight="600">领域服务层</text>
  <g stroke="#b388ff" stroke-width="1.5" fill="#13162a">
    <rect x="142" y="163" width="112" height="30" rx="5"/><rect x="262" y="163" width="112" height="30" rx="5"/><rect x="382" y="163" width="112" height="30" rx="5"/><rect x="502" y="163" width="112" height="30" rx="5"/><rect x="622" y="163" width="112" height="30" rx="5"/><rect x="742" y="163" width="112" height="30" rx="5"/>
  </g>
  <g fill="#e8eaf0" font-size="12" text-anchor="middle">
    <text x="198" y="182">pullreq/merge</text><text x="318" y="182">protection</text><text x="438" y="182">webhook</text><text x="558" y="182">mergequeue</text><text x="678" y="182">codeowners</text><text x="798" y="182">repo/space</text>
  </g>

  <!-- L4 产品引擎层 #ff6b9d -->
  <text x="18" y="236" fill="#ff6b9d" font-size="13" font-weight="600">产品引擎层</text>
  <g stroke="#ff6b9d" stroke-width="1.5" fill="#13162a">
    <rect x="142" y="217" width="170" height="30" rx="5"/><rect x="324" y="217" width="170" height="30" rx="5"/><rect x="506" y="217" width="170" height="30" rx="5"/><rect x="688" y="217" width="170" height="30" rx="5"/>
  </g>
  <g fill="#e8eaf0" font-size="12" text-anchor="middle">
    <text x="227" y="236">git 引擎</text><text x="409" y="236">pipeline CI</text><text x="591" y="236">gitspace</text><text x="773" y="236">registry 制品</text>
  </g>

  <!-- L5 持久化层 #f9ca24 -->
  <text x="18" y="290" fill="#f9ca24" font-size="13" font-weight="600">持久化层</text>
  <g stroke="#f9ca24" stroke-width="1.5" fill="#13162a">
    <rect x="142" y="271" width="170" height="30" rx="5"/><rect x="324" y="271" width="170" height="30" rx="5"/><rect x="506" y="271" width="170" height="30" rx="5"/><rect x="688" y="271" width="170" height="30" rx="5"/>
  </g>
  <g fill="#e8eaf0" font-size="12" text-anchor="middle">
    <text x="227" y="290">database store</text><text x="409" y="290">migrate 迁移</text><text x="591" y="290">cache/refcache</text><text x="773" y="290">dbtx 事务抽象</text>
  </g>

  <!-- L6 横切基础设施层 #80c7ff -->
  <text x="18" y="344" fill="#80c7ff" font-size="13" font-weight="600">横切基础设施</text>
  <g stroke="#80c7ff" stroke-width="1.5" fill="#13162a">
    <rect x="142" y="325" width="74" height="30" rx="5"/><rect x="223" y="325" width="74" height="30" rx="5"/><rect x="304" y="325" width="74" height="30" rx="5"/><rect x="385" y="325" width="74" height="30" rx="5"/><rect x="466" y="325" width="74" height="30" rx="5"/><rect x="547" y="325" width="74" height="30" rx="5"/><rect x="628" y="325" width="74" height="30" rx="5"/><rect x="709" y="325" width="74" height="30" rx="5"/><rect x="790" y="325" width="74" height="30" rx="5"/>
  </g>
  <g fill="#e8eaf0" font-size="12" text-anchor="middle">
    <text x="179" y="344">job</text><text x="260" y="344">lock</text><text x="341" y="344">pubsub</text><text x="422" y="344">events</text><text x="503" y="344">stream</text><text x="584" y="344">livelog</text><text x="665" y="344">blob</text><text x="746" y="344">encrypt</text><text x="827" y="344">audit</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#9aa3c7">
    <rect x="142" y="378" width="12" height="12" rx="2" fill="#4ecdc4"/><text x="159" y="388">入口</text>
    <rect x="202" y="378" width="12" height="12" rx="2" fill="#6c8ef5"/><text x="219" y="388">编排</text>
    <rect x="262" y="378" width="12" height="12" rx="2" fill="#b388ff"/><text x="279" y="388">服务</text>
    <rect x="322" y="378" width="12" height="12" rx="2" fill="#ff6b9d"/><text x="339" y="388">引擎</text>
    <rect x="382" y="378" width="12" height="12" rx="2" fill="#f9ca24"/><text x="399" y="388">持久化</text>
    <rect x="452" y="378" width="12" height="12" rx="2" fill="#80c7ff"/><text x="469" y="388">基础设施</text>
    <text x="540" y="388" fill="#6a7497">上层依赖下层 · wire 装配全层 · 横切基础设施贯穿所有层</text>
  </g>
</svg>
