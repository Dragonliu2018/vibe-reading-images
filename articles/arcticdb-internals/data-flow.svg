<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="system-ui, sans-serif">
<rect width="820" height="500" fill="#0b0d14"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker>
  <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/></marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b388ff"/></marker>
</defs>
<text x="410" y="28" text-anchor="middle" fill="#e6e8f0" font-size="18" font-weight="600">写入与读取数据流</text>

<!-- Write path label -->
<text x="40" y="74" fill="#4ecdc4" font-size="13" font-weight="600">写入路径</text>
<rect x="40" y="86" width="110" height="56" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="95" y="110" text-anchor="middle" fill="#e6e8f0" font-size="13">DataFrame</text>
<text x="95" y="128" text-anchor="middle" fill="#9aa3c0" font-size="11">pandas/arrow</text>
<rect x="175" y="86" width="110" height="56" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="230" y="110" text-anchor="middle" fill="#e6e8f0" font-size="13">归一化</text>
<text x="230" y="128" text-anchor="middle" fill="#9aa3c0" font-size="11">normalize()</text>
<rect x="310" y="86" width="110" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="365" y="110" text-anchor="middle" fill="#e6e8f0" font-size="13">切片</text>
<text x="365" y="128" text-anchor="middle" fill="#9aa3c0" font-size="11">slice_and_write</text>
<rect x="445" y="86" width="110" height="56" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="500" y="110" text-anchor="middle" fill="#e6e8f0" font-size="13">压缩</text>
<text x="500" y="128" text-anchor="middle" fill="#9aa3c0" font-size="11">LZ4 / ZSTD</text>
<rect x="580" y="86" width="200" height="56" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="680" y="108" text-anchor="middle" fill="#e6e8f0" font-size="13">存储写入（按序）</text>
<text x="680" y="128" text-anchor="middle" fill="#9aa3c0" font-size="11">DATA → INDEX → VERSION → REF</text>
<line x1="150" y1="114" x2="173" y2="114" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="285" y1="114" x2="308" y2="114" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="114" x2="443" y2="114" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="555" y1="114" x2="578" y2="114" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Separator -->
<line x1="40" y1="180" x2="780" y2="180" stroke="#2a2e48" stroke-width="1"/>

<!-- Read path label -->
<text x="40" y="210" fill="#b388ff" font-size="13" font-weight="600">读取路径</text>
<rect x="40" y="222" width="110" height="56" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="95" y="246" text-anchor="middle" fill="#e6e8f0" font-size="13">读取请求</text>
<text x="95" y="264" text-anchor="middle" fill="#9aa3c0" font-size="11">symbol + as_of</text>
<rect x="175" y="222" width="110" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="230" y="246" text-anchor="middle" fill="#e6e8f0" font-size="13">版本解析</text>
<text x="230" y="264" text-anchor="middle" fill="#9aa3c0" font-size="11">VersionMap 缓存</text>
<rect x="310" y="222" width="110" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="365" y="246" text-anchor="middle" fill="#e6e8f0" font-size="13">读索引</text>
<text x="365" y="264" text-anchor="middle" fill="#9aa3c0" font-size="11">TABLE_INDEX</text>
<rect x="445" y="222" width="110" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="500" y="246" text-anchor="middle" fill="#e6e8f0" font-size="13">段裁剪</text>
<text x="500" y="264" text-anchor="middle" fill="#9aa3c0" font-size="11">列统计 min/max</text>
<rect x="580" y="222" width="110" height="56" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="635" y="246" text-anchor="middle" fill="#e6e8f0" font-size="13">并行拉取</text>
<text x="635" y="264" text-anchor="middle" fill="#9aa3c0" font-size="11">解压 async</text>
<rect x="715" y="222" width="65" height="56" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="747" y="246" text-anchor="middle" fill="#e6e8f0" font-size="12">重建</text>
<text x="747" y="264" text-anchor="middle" fill="#9aa3c0" font-size="11">DataFrame</text>
<line x1="150" y1="250" x2="173" y2="250" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="285" y1="250" x2="308" y2="250" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="250" x2="443" y2="250" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="555" y1="250" x2="578" y2="250" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="690" y1="250" x2="713" y2="250" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Key type tree (bottom) -->
<text x="40" y="320" fill="#9aa3c0" font-size="12" font-weight="600">存储中的键树（单个 symbol 的版本链）</text>
<rect x="95" y="338" width="120" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="155" y="363" text-anchor="middle" fill="#e6e8f0" font-size="12">VERSION_REF</text>
<rect x="280" y="338" width="90" height="40" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="325" y="363" text-anchor="middle" fill="#e6e8f0" font-size="12">VERSION</text>
<rect x="430" y="338" width="110" height="40" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="485" y="363" text-anchor="middle" fill="#e6e8f0" font-size="12">TABLE_INDEX</text>
<rect x="590" y="338" width="110" height="40" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="645" y="363" text-anchor="middle" fill="#e6e8f0" font-size="12">TABLE_DATA</text>
<line x1="215" y1="358" x2="278" y2="358" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="370" y1="358" x2="428" y2="358" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540" y1="358" x2="588" y2="358" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="645" y="400" text-anchor="middle" fill="#9aa3c0" font-size="11">叶子：压缩后的行列分片</text>
<text x="325" y="400" text-anchor="middle" fill="#9aa3c0" font-size="11">链表指向前一版本</text>
<text x="155" y="400" text-anchor="middle" fill="#9aa3c0" font-size="11">最新版本快指针</text>

<text x="410" y="448" text-anchor="middle" fill="#9aa3c0" font-size="11">写入按 DATA→INDEX→VERSION→REF 顺序（见 key_types_write_precedence），最后更新 REF 实现 last-writer-wins</text>
</svg>
