<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="system-ui, sans-serif">
<rect width="720" height="440" fill="#0b0d14"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker>
</defs>
<text x="360" y="28" text-anchor="middle" fill="#e6e8f0" font-size="18" font-weight="600">Segment 落盘布局</text>

<!-- Outer segment container -->
<rect x="60" y="56" width="600" height="300" rx="10" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="80" y="76" fill="#9aa3c0" font-size="12">Segment（存储基本单元，一个 TABLE_DATA 键）</text>

<!-- Header -->
<rect x="80" y="90" width="560" height="64" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="360" y="114" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">HEADER</text>
<text x="170" y="138" text-anchor="middle" fill="#9aa3c0" font-size="11">Magic Number</text>
<text x="320" y="138" text-anchor="middle" fill="#9aa3c0" font-size="11">EncodingVersion (V1/V2)</text>
<text x="480" y="138" text-anchor="middle" fill="#9aa3c0" font-size="11">FieldDescriptors</text>
<text x="600" y="138" text-anchor="middle" fill="#9aa3c0" font-size="11">RowCount</text>

<!-- Column data block -->
<rect x="80" y="170" width="560" height="100" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="100" y="190" fill="#f9ca24" font-size="13" font-weight="600">COLUMN DATA（逐列压缩块）</text>
<rect x="100" y="200" width="120" height="56" rx="6" fill="#1a1d2e" stroke="#f9ca24" stroke-width="1"/><text x="160" y="225" text-anchor="middle" fill="#e6e8f0" font-size="11">Column 0</text><text x="160" y="242" text-anchor="middle" fill="#9aa3c0" font-size="10">EncodedField</text>
<rect x="235" y="200" width="120" height="56" rx="6" fill="#1a1d2e" stroke="#f9ca24" stroke-width="1"/><text x="295" y="225" text-anchor="middle" fill="#e6e8f0" font-size="11">Column 1</text><text x="295" y="242" text-anchor="middle" fill="#9aa3c0" font-size="10">LZ4 块</text>
<rect x="370" y="200" width="120" height="56" rx="6" fill="#1a1d2e" stroke="#f9ca24" stroke-width="1"/><text x="430" y="225" text-anchor="middle" fill="#e6e8f0" font-size="11">Column 2</text><text x="430" y="242" text-anchor="middle" fill="#9aa3c0" font-size="10">ZSTD 块</text>
<rect x="505" y="200" width="120" height="56" rx="6" fill="#1a1d2e" stroke="#f9ca24" stroke-width="1"/><text x="565" y="225" text-anchor="middle" fill="#e6e8f0" font-size="11">Column N</text><text x="565" y="242" text-anchor="middle" fill="#9aa3c0" font-size="10">passthrough</text>

<!-- String pool -->
<rect x="80" y="286" width="560" height="56" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="100" y="306" fill="#4ecdc4" font-size="13" font-weight="600">STRING POOL</text>
<text x="360" y="324" text-anchor="middle" fill="#9aa3c0" font-size="11">拼接的字节数据 + offsets（字符串列存偏移而非内联）</text>

<!-- Codec legend -->
<text x="60" y="384" fill="#9aa3c0" font-size="12" font-weight="600">Codec 枚举（memory_layout.hpp）</text>
<rect x="60" y="396" width="70" height="30" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/><text x="95" y="416" text-anchor="middle" fill="#e6e8f0" font-size="11">LZ4</text>
<rect x="140" y="396" width="80" height="30" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/><text x="180" y="416" text-anchor="middle" fill="#e6e8f0" font-size="11">ZSTD</text>
<rect x="230" y="396" width="70" height="30" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/><text x="265" y="416" text-anchor="middle" fill="#e6e8f0" font-size="11">PFOR</text>
<rect x="310" y="396" width="70" height="30" rx="6" fill="#13162a" stroke="#9aa3c0" stroke-width="1.5"/><text x="345" y="416" text-anchor="middle" fill="#9aa3c0" font-size="11">PASS</text>
<text x="400" y="416" fill="#9aa3c0" font-size="11">LZ4 默认；ZSTD 高压缩比；PFOR 整数；PASS 不压缩</text>
</svg>
