<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420" font-family="system-ui, sans-serif">
<rect width="740" height="420" fill="#0b0d14"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker>
  <marker id="arrowy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/></marker>
</defs>
<text x="370" y="28" text-anchor="middle" fill="#e6e8f0" font-size="18" font-weight="600">TaskScheduler 双线程池模型</text>

<!-- TaskScheduler container -->
<rect x="40" y="56" width="660" height="300" rx="10" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="60" y="78" fill="#f9ca24" font-size="14" font-weight="600">TaskScheduler（单例，instance_ / once_flag）</text>

<!-- submit functions -->
<rect x="60" y="96" width="150" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="135" y="121" text-anchor="middle" fill="#e6e8f0" font-size="12">submit_cpu_task</text>
<rect x="230" y="96" width="150" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="305" y="121" text-anchor="middle" fill="#e6e8f0" font-size="12">submit_io_task</text>
<text x="420" y="121" fill="#9aa3c0" font-size="11">Task 须派生自 BaseTask</text>

<!-- CPU pool -->
<rect x="60" y="160" width="290" height="180" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="205" y="184" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">CPU 线程池</text>
<text x="205" y="204" text-anchor="middle" fill="#9aa3c0" font-size="11">FutureExecutor&lt;CPUThreadPoolExecutor&gt;</text>
<rect x="80" y="220" width="50" height="40" rx="6" fill="#1a1d2e" stroke="#6c8ef5" stroke-width="1"/><text x="105" y="244" text-anchor="middle" fill="#9aa3c0" font-size="11">T</text>
<rect x="140" y="220" width="50" height="40" rx="6" fill="#1a1d2e" stroke="#6c8ef5" stroke-width="1"/><text x="165" y="244" text-anchor="middle" fill="#9aa3c0" font-size="11">T</text>
<rect x="200" y="220" width="50" height="40" rx="6" fill="#1a1d2e" stroke="#6c8ef5" stroke-width="1"/><text x="225" y="244" text-anchor="middle" fill="#9aa3c0" font-size="11">T</text>
<rect x="260" y="220" width="50" height="40" rx="6" fill="#1a1d2e" stroke="#6c8ef5" stroke-width="1"/><text x="285" y="244" text-anchor="middle" fill="#9aa3c0" font-size="11">…</text>
<text x="205" y="284" text-anchor="middle" fill="#9aa3c0" font-size="11">压缩 / 解压 / 表达式求值 / 聚合</text>
<text x="205" y="304" text-anchor="middle" fill="#9aa3c0" font-size="11">默认 = hardware_concurrency()</text>
<text x="205" y="324" text-anchor="middle" fill="#9aa3c0" font-size="11">cgroup v1/v2 感知（容器限核）</text>

<!-- IO pool -->
<rect x="390" y="160" width="290" height="180" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="535" y="184" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">I/O 线程池</text>
<text x="535" y="204" text-anchor="middle" fill="#9aa3c0" font-size="11">FutureExecutor&lt;IOThreadPoolExecutor&gt;</text>
<rect x="410" y="220" width="50" height="40" rx="6" fill="#1a1d2e" stroke="#b388ff" stroke-width="1"/><text x="435" y="244" text-anchor="middle" fill="#9aa3c0" font-size="11">T</text>
<rect x="470" y="220" width="50" height="40" rx="6" fill="#1a1d2e" stroke="#b388ff" stroke-width="1"/><text x="495" y="244" text-anchor="middle" fill="#9aa3c0" font-size="11">T</text>
<rect x="530" y="220" width="50" height="40" rx="6" fill="#1a1d2e" stroke="#b388ff" stroke-width="1"/><text x="555" y="244" text-anchor="middle" fill="#9aa3c0" font-size="11">T</text>
<rect x="590" y="220" width="50" height="40" rx="6" fill="#1a1d2e" stroke="#b388ff" stroke-width="1"/><text x="615" y="244" text-anchor="middle" fill="#9aa3c0" font-size="11">…</text>
<text x="535" y="284" text-anchor="middle" fill="#9aa3c0" font-size="11">存储读写（S3/Azure/LMDB…）</text>
<text x="535" y="304" text-anchor="middle" fill="#9aa3c0" font-size="11">默认 = CPU × 1.5（超配隐藏延迟）</text>
<text x="535" y="324" text-anchor="middle" fill="#9aa3c0" font-size="11">VersionMap reload (CheckReloadTask)</text>

<line x1="135" y1="136" x2="180" y2="158" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="305" y1="136" x2="510" y2="158" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="370" y="384" text-anchor="middle" fill="#9aa3c0" font-size="11">fork 后子进程 reattach_instance() 重置池（pthread_atfork 注册）；勿在池任务内向同池提交任务——会死锁</text>
<text x="370" y="404" text-anchor="middle" fill="#9aa3c0" font-size="11">配置：VersionStore.NumCPUThreads / VersionStore.NumIOThreads；TaskScheduler.LogTaskStats 观测</text>
</svg>
