<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui, sans-serif">
<rect width="720" height="420" fill="#0b0d14"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker>
</defs>
<text x="360" y="28" text-anchor="middle" fill="#e6e8f0" font-size="18" font-weight="600">SegmentInMemory 内存结构</text>

<!-- SegmentInMemory container -->
<rect x="40" y="56" width="640" height="250" rx="10" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="60" y="78" fill="#f9ca24" font-size="14" font-weight="600">SegmentInMemory（pimpl 委托 SegmentInMemoryImpl）</text>

<!-- descriptor -->
<rect x="60" y="92" width="600" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="360" y="119" text-anchor="middle" fill="#e6e8f0" font-size="13">descriptor_ : StreamDescriptor（字段名 + TypeDescriptor）</text>

<!-- columns -->
<text x="60" y="158" fill="#9aa3c0" font-size="12">columns_[] : vector&lt;shared_ptr&lt;Column&gt;&gt;</text>
<rect x="60" y="168" width="140" height="80" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="130" y="188" text-anchor="middle" fill="#e6e8f0" font-size="12">Column</text>
<text x="130" y="206" text-anchor="middle" fill="#9aa3c0" font-size="10">type_: TypeDescriptor</text>
<text x="130" y="222" text-anchor="middle" fill="#9aa3c0" font-size="10">data_: ChunkedBuffer</text>
<text x="130" y="238" text-anchor="middle" fill="#9aa3c0" font-size="10">sparse_map_: BitSet</text>
<rect x="220" y="168" width="140" height="80" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="290" y="188" text-anchor="middle" fill="#e6e8f0" font-size="12">Column</text>
<text x="290" y="206" text-anchor="middle" fill="#9aa3c0" font-size="10">set_scalar / scalar_at</text>
<text x="290" y="222" text-anchor="middle" fill="#9aa3c0" font-size="10">is_sparse()</text>
<text x="290" y="238" text-anchor="middle" fill="#9aa3c0" font-size="10">change_type()</text>
<rect x="380" y="168" width="140" height="80" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="450" y="188" text-anchor="middle" fill="#e6e8f0" font-size="12">StringPool</text>
<text x="450" y="206" text-anchor="middle" fill="#9aa3c0" font-size="10">data_ 拼接字节</text>
<text x="450" y="222" text-anchor="middle" fill="#9aa3c0" font-size="10">offsets_ 去重</text>
<text x="450" y="238" text-anchor="middle" fill="#9aa3c0" font-size="10">get() → OffsetString</text>
<rect x="540" y="168" width="120" height="80" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
<text x="600" y="188" text-anchor="middle" fill="#e6e8f0" font-size="12">row_count_</text>
<text x="600" y="206" text-anchor="middle" fill="#9aa3c0" font-size="10">metadata_</text>
<text x="600" y="222" text-anchor="middle" fill="#9aa3c0" font-size="10">(protobuf::Any)</text>
<text x="600" y="238" text-anchor="middle" fill="#9aa3c0" font-size="10">offset_</text>

<!-- ChunkedBuffer detail -->
<rect x="60" y="270" width="600" height="30" rx="6" fill="#1a1d2e" stroke="#9aa3c0" stroke-width="1"/>
<text x="360" y="290" text-anchor="middle" fill="#9aa3c0" font-size="11">ChunkedBuffer：按 64KB 块增长，避免大段连续重分配，利于追加与局部性</text>

<text x="40" y="334" fill="#9aa3c0" font-size="12" font-weight="600">关键操作</text>
<text x="40" y="356" fill="#9aa3c0" font-size="11">• set_scalar&lt;T&gt;(idx, val) / set_string(idx, str) / end_row()：逐行写入</text>
<text x="40" y="376" fill="#9aa3c0" font-size="11">• filter(BitSet) / truncate(start, end) / split(rows) / concatenate(other)：切片与重组</text>
<text x="40" y="396" fill="#9aa3c0" font-size="11">• sparsify() / unsparsify()：稀疏列与密集列互转；sort(columns)：原地排序</text>
</svg>
