<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="system-ui, sans-serif">
<rect width="760" height="470" fill="#0b0d14"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker>
  <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3c0"/></marker>
</defs>
<text x="380" y="28" text-anchor="middle" fill="#e6e8f0" font-size="18" font-weight="600">版本链结构（单个 symbol）</text>

<!-- VERSION_REF -->
<rect x="300" y="52" width="160" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="380" y="79" text-anchor="middle" fill="#e6e8f0" font-size="14">VERSION_REF</text>
<text x="475" y="79" fill="#9aa3c0" font-size="11">REF 键，最新版本快指针</text>

<!-- VERSION linked list v3 -> v2 -> v1 -->
<rect x="80" y="140" width="120" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="140" y="167" text-anchor="middle" fill="#e6e8f0" font-size="14">VERSION v3</text>
<rect x="320" y="140" width="120" height="44" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
<text x="380" y="167" text-anchor="middle" fill="#e6e8f0" font-size="14">VERSION v2</text>
<text x="380" y="200" text-anchor="middle" fill="#ff6b9d" font-size="11">+ TOMBSTONE</text>
<rect x="560" y="140" width="120" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="620" y="167" text-anchor="middle" fill="#e6e8f0" font-size="14">VERSION v1</text>
<!-- REF -> v3 -->
<line x1="380" y1="96" x2="140" y2="138" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- linked list v3 -> v2 -> v1 -->
<line x1="200" y1="162" x2="318" y2="162" stroke="#9aa3c0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowd)"/>
<text x="259" y="154" text-anchor="middle" fill="#9aa3c0" font-size="10">prev</text>
<line x1="440" y1="162" x2="558" y2="162" stroke="#9aa3c0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowd)"/>
<text x="499" y="154" text-anchor="middle" fill="#9aa3c0" font-size="10">prev</text>

<!-- TABLE_INDEX under v3 -->
<rect x="80" y="240" width="120" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="140" y="267" text-anchor="middle" fill="#e6e8f0" font-size="13">TABLE_INDEX</text>
<line x1="140" y1="184" x2="140" y2="238" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- TABLE_DATA segments -->
<rect x="30" y="340" width="90" height="44" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="75" y="367" text-anchor="middle" fill="#e6e8f0" font-size="12">DATA</text>
<text x="75" y="382" text-anchor="middle" fill="#9aa3c0" font-size="10">行 0-10万</text>
<rect x="135" y="340" width="90" height="44" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="180" y="367" text-anchor="middle" fill="#e6e8f0" font-size="12">DATA</text>
<text x="180" y="382" text-anchor="middle" fill="#9aa3c0" font-size="10">行 10-20万</text>
<rect x="240" y="340" width="90" height="44" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="285" y="367" text-anchor="middle" fill="#e6e8f0" font-size="12">DATA</text>
<text x="285" y="382" text-anchor="middle" fill="#9aa3c0" font-size="10">列分片</text>
<!-- index -> data -->
<line x1="110" y1="284" x2="75" y2="338" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="140" y1="284" x2="180" y2="338" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170" y1="284" x2="285" y2="338" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Snapshot ref note -->
<rect x="470" y="240" width="240" height="44" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="590" y="260" text-anchor="middle" fill="#e6e8f0" font-size="12">SNAPSHOT_REF</text>
<text x="590" y="276" text-anchor="middle" fill="#9aa3c0" font-size="11">命名快照，指向多个 INDEX 键</text>
<line x1="380" y1="262" x2="468" y2="262" stroke="#9aa3c0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowd)"/>

<text x="380" y="420" text-anchor="middle" fill="#9aa3c0" font-size="11">VERSION 为不可变 ATOM 键（内容寻址），VERSION_REF 为可变 REF 键</text>
<text x="380" y="440" text-anchor="middle" fill="#9aa3c0" font-size="11">删除 = 在 VERSION 段内写入 TOMBSTONE（惰性），prune_previous_versions 才物理回收</text>
</svg>
