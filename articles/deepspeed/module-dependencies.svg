<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620" font-family="system-ui, sans-serif">
  <defs>
    <marker id="dep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a82a8"/>
    </marker>
    <marker id="inherit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect width="840" height="620" fill="#0b0d14"/>

  <text x="420" y="28" text-anchor="middle" fill="#e8eaf0" font-size="17" font-weight="600">DeepSpeed 模块依赖关系</text>

  <!-- Row 1: Engine (hub) -->
  <rect x="310" y="52" width="220" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
  <text x="420" y="77" text-anchor="middle" fill="#e8eaf0" font-size="14" font-weight="600">DeepSpeedEngine</text>

  <!-- Row 2: direct children -->
  <rect x="30" y="150" width="150" height="38" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="105" y="174" text-anchor="middle" fill="#e8eaf0" font-size="13">ZeRO 1/2/3</text>

  <rect x="225" y="150" width="150" height="38" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="300" y="174" text-anchor="middle" fill="#e8eaf0" font-size="13">FP16 / BF16</text>

  <rect x="420" y="150" width="150" height="38" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="495" y="174" text-anchor="middle" fill="#e8eaf0" font-size="13">PipelineEngine</text>

  <rect x="615" y="150" width="150" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="690" y="174" text-anchor="middle" fill="#e8eaf0" font-size="13">InferenceEngine v2</text>

  <!-- Row 3: mid-level modules -->
  <rect x="30" y="270" width="150" height="38" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="105" y="294" text-anchor="middle" fill="#e8eaf0" font-size="13">DeepCompile</text>

  <rect x="225" y="270" width="150" height="38" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="300" y="294" text-anchor="middle" fill="#e8eaf0" font-size="13">MoE</text>

  <rect x="540" y="270" width="150" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="615" y="294" text-anchor="middle" fill="#e8eaf0" font-size="13">Module Inject</text>

  <!-- Row 4: infrastructure -->
  <rect x="30" y="400" width="150" height="38" rx="6" fill="#13162a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="105" y="424" text-anchor="middle" fill="#e8eaf0" font-size="13">Comm 通信层</text>

  <rect x="225" y="400" width="150" height="38" rx="6" fill="#13162a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="300" y="424" text-anchor="middle" fill="#e8eaf0" font-size="13">Accelerator</text>

  <rect x="420" y="400" width="150" height="38" rx="6" fill="#13162a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="495" y="424" text-anchor="middle" fill="#e8eaf0" font-size="13">Ops / Kernels</text>

  <rect x="615" y="400" width="150" height="38" rx="6" fill="#13162a" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="690" y="424" text-anchor="middle" fill="#e8eaf0" font-size="13">Checkpoint</text>

  <!-- Arrows: Engine -> children (row1 -> row2) -->
  <path d="M370,92 C370,120 105,120 105,150" stroke="#7a82a8" stroke-width="1.5" fill="none" marker-end="url(#dep-arrow)"/>
  <path d="M390,92 L300,150" stroke="#7a82a8" stroke-width="1.5" fill="none" marker-end="url(#dep-arrow)"/>
  <path d="M450,92 L495,150" stroke="#7a82a8" stroke-width="1.5" fill="none" marker-end="url(#dep-arrow)"/>
  <path d="M470,92 C470,120 690,120 690,150" stroke="#7a82a8" stroke-width="1.5" fill="none" marker-end="url(#dep-arrow)"/>

  <!-- PipelineEngine inherits Engine (cyan) -->
  <path d="M495,150 L495,120 L420,120 L420,92" stroke="#4ecdc4" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#inherit-arrow)"/>
  <text x="460" y="115" text-anchor="end" fill="#4ecdc4" font-size="10">inherits</text>

  <!-- ZeRO -> Comm, Accelerator, Checkpoint -->
  <path d="M105,188 L105,400" stroke="#7a82a8" stroke-width="1.5" fill="none" marker-end="url(#dep-arrow)"/>
  <path d="M105,188 C105,280 300,280 300,400" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.7"/>
  <path d="M105,188 C105,300 690,300 690,400" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.6"/>

  <!-- Pipeline -> Comm -->
  <path d="M495,188 C495,280 105,280 105,400" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.6"/>

  <!-- Inference v2 -> Module Inject -->
  <path d="M690,188 L690,230 L615,230 L615,270" stroke="#7a82a8" stroke-width="1.5" fill="none" marker-end="url(#dep-arrow)"/>
  <!-- Inference v2 -> Ops -->
  <path d="M690,188 C690,280 495,280 495,400" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.6"/>

  <!-- Module Inject -> Comm, Ops -->
  <path d="M615,308 C615,350 105,350 105,400" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.6"/>
  <path d="M615,308 C615,350 495,350 495,400" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.6"/>

  <!-- MoE -> Comm, Module Inject -->
  <path d="M300,308 C300,350 105,350 105,400" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.6"/>
  <path d="M375,290 L540,290" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.7"/>

  <!-- DeepCompile -> ZeRO (uses Z3) -->
  <path d="M105,270 L105,230 L105,188" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" stroke-dasharray="4,3" opacity="0.7"/>
  <path d="M105,270 L105,188" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.7"/>

  <!-- Engine -> Checkpoint (direct) -->
  <path d="M530,72 C780,72 800,300 690,400" stroke="#7a82a8" stroke-width="1.3" fill="none" marker-end="url(#dep-arrow)" opacity="0.5" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <rect x="30" y="480" width="780" height="120" rx="6" fill="#101224" stroke="#2a2d44" stroke-width="1"/>
  <text x="50" y="505" fill="#7a82a8" font-size="12" font-weight="600">图例</text>
  <path d="M50,520 L100,520" stroke="#7a82a8" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <text x="110" y="524" fill="#a8aec0" font-size="11">depends on（依赖 / 调用）</text>
  <path d="M290,520 L340,520" stroke="#4ecdc4" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#inherit-arrow)"/>
  <text x="350" y="524" fill="#a8aec0" font-size="11">inherits（继承）</text>
  <path d="M500,520 L550,520" stroke="#7a82a8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#dep-arrow)" opacity="0.7"/>
  <text x="560" y="524" fill="#a8aec0" font-size="11">uses（间接使用）</text>
  <text x="50" y="552" fill="#a8aec0" font-size="11">颜色域：青=引擎  黄=训练  粉=推理  紫=基础设施</text>
  <text x="50" y="572" fill="#a8aec0" font-size="11">DeepSpeedEngine 是中枢，向下编排训练 / 推理两条路径，底层共享 Comm + Accelerator + Ops</text>
  <text x="50" y="588" fill="#a8aec0" font-size="11">PipelineEngine 继承 DeepSpeedEngine；DeepCompile 依赖 ZeRO-3 的参数分片语义插入通信 op</text>
</svg>
