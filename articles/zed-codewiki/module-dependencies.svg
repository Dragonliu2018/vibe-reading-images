<svg width="840" height="500" viewBox="0 0 840 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="840" height="500" fill="#0b0d14"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <text x="395" y="28" text-anchor="middle" fill="#e8e8f0" font-size="17" font-weight="bold" font-family="system-ui, sans-serif">Zed 模块依赖关系</text>

  <!-- Row 1: Features (pink) -->
  <rect x="100" y="55" width="110" height="38" rx="5" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="155" y="78" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">vim</text>
  <rect x="370" y="55" width="110" height="38" rx="5" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="425" y="78" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">agent</text>

  <!-- Row 2: App + Editor (purple/cyan) -->
  <rect x="100" y="150" width="110" height="38" rx="5" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="155" y="173" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">workspace</text>
  <rect x="370" y="150" width="110" height="38" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="425" y="173" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">editor</text>
  <rect x="640" y="150" width="110" height="38" rx="5" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="695" y="173" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">project</text>

  <!-- Row 3: Intermediate (pink/cyan/yellow) -->
  <rect x="100" y="245" width="110" height="38" rx="5" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="155" y="268" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">collab</text>
  <rect x="370" y="245" width="110" height="38" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="425" y="268" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">language</text>
  <rect x="560" y="245" width="110" height="38" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="615" y="268" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">multi_buffer</text>

  <!-- Row 4: Text core (yellow) -->
  <rect x="370" y="340" width="110" height="38" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="425" y="363" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">text</text>

  <!-- Row 5: Foundation (blue) -->
  <rect x="100" y="420" width="110" height="38" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="155" y="443" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">gpui</text>
  <rect x="370" y="420" width="110" height="38" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="425" y="443" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">rope</text>
  <rect x="640" y="420" width="110" height="38" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="695" y="443" text-anchor="middle" fill="#e8e8f0" font-size="13" font-family="system-ui, sans-serif">sum_tree</text>

  <!-- Edges -->
  <!-- 1. vim -> editor -->
  <path d="M 155 93 L 425 150" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="265" y="116" text-anchor="middle" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">wrap</text>
  <!-- 2. agent -> project -->
  <path d="M 425 93 L 695 150" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="565" y="116" text-anchor="middle" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">use</text>
  <!-- 3. workspace -> editor -->
  <path d="M 210 169 L 370 169" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="290" y="162" text-anchor="middle" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">contain</text>
  <!-- 4. editor -> multi_buffer -->
  <path d="M 480 188 L 560 245" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="530" y="212" text-anchor="middle" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">render</text>
  <!-- 5. editor -> language -->
  <path d="M 425 188 L 425 245" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="435" y="220" text-anchor="start" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">syntax</text>
  <!-- 6. multi_buffer -> text -->
  <path d="M 560 283 L 480 340" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="545" y="308" text-anchor="middle" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">excerpt</text>
  <!-- 7. collab -> text -->
  <path d="M 210 264 L 370 340" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="280" y="296" text-anchor="middle" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">CRDT sync</text>
  <!-- 8. language -> text -->
  <path d="M 425 283 L 425 340" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="435" y="315" text-anchor="start" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">parse</text>
  <!-- 9. text -> rope -->
  <path d="M 425 378 L 425 420" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="435" y="402" text-anchor="start" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">store</text>
  <!-- 10. rope -> sum_tree -->
  <path d="M 480 439 L 640 439" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="560" y="432" text-anchor="middle" fill="#9099ba" font-size="10" font-family="system-ui, sans-serif" paint-order="stroke" stroke="#0b0d14" stroke-width="3">built on</text>

  <!-- Note -->
  <text x="395" y="485" text-anchor="middle" fill="#7a86b3" font-size="11" font-family="system-ui, sans-serif">gpui 为基础设施层，几乎所有上层模块通过 Entity/View 系统依赖它（图中省略 gpui 的入向箭头）</text>
</svg>
