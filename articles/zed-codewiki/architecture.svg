  <text x="815" y="120" text-anchor="middle" fill="#7a86b3" font-size="10" font-family="system-ui, sans-serif">依赖</text>
  <text x="815" y="132" text-anchor="middle" fill="#7a86b3" font-size="10" font-family="system-ui, sans-serif">方向</text>
  <path d="M 815 140 L 815 388" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Bottom note -->
  <text x="395" y="482" text-anchor="middle" fill="#7a86b3" font-size="11" font-family="system-ui, sans-serif">上层依赖下层 · 箭头方向 = 依赖关系（上层 → 下层）</text>
