<svg xmlns="http://www.w3.org/2000/svg" width="780" height="510" viewBox="0 0 780 510" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowloop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="510" fill="#0b0d14"/>

  <rect x="290" y="20" width="200" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="45" fill="#4ecdc4" font-size="13" font-weight="bold" text-anchor="middle">train(args)</text>

  <rect x="265" y="90" width="250" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="390" y="110" fill="#e8eaf0" font-size="12" text-anchor="middle">create_placement_groups</text>
  <text x="390" y="128" fill="#8a91a8" font-size="11" text-anchor="middle">PACK + InfoActor + sort_key</text>

  <rect x="265" y="170" width="250" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="390" y="190" fill="#e8eaf0" font-size="12" text-anchor="middle">create_rollout_manager</text>
  <text x="390" y="208" fill="#8a91a8" font-size="11" text-anchor="middle">起 SGLang 引擎 + DataSource</text>

  <rect x="265" y="250" width="250" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="390" y="270" fill="#e8eaf0" font-size="12" text-anchor="middle">create_training_models</text>
  <text x="390" y="288" fill="#8a91a8" font-size="11" text-anchor="middle">RayTrainGroup.create → actor.init</text>

  <rect x="290" y="330" width="200" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="390" y="355" fill="#f9ca24" font-size="12" text-anchor="middle">首次 update_weights</text>

  <!-- 训练循环 -->
  <rect x="80" y="400" width="620" height="80" rx="10" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="424" fill="#4ecdc4" font-size="13" font-weight="bold" text-anchor="middle">for rollout_id in range(num_rollout):</text>
  <text x="390" y="446" fill="#c9cee0" font-size="11" text-anchor="middle">generate → async_train → save_model → update_weights → eval</text>
  <text x="390" y="465" fill="#8a91a8" font-size="11" text-anchor="middle">should_run_periodic_action 周期化保存/评估</text>

  <!-- 装配链箭头 -->
  <path d="M390,60 L390,90" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M390,140 L390,170" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M390,220 L390,250" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M390,300 L390,330" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M390,370 L390,400" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 循环自回环 -->
  <path d="M700,440 L745,440 L745,8 L390,8 L390,20" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#arrowloop)" stroke-dasharray="5,3"/>
  <text x="753" y="150" fill="#4ecdc4" font-size="11">每步循环</text>
</svg>
