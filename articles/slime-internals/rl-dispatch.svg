<svg xmlns="http://www.w3.org/2000/svg" width="820" height="445" viewBox="0 0 820 445" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="445" fill="#0b0d14"/>

  <rect x="250" y="20" width="320" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="410" y="47" fill="#6c8ef5" font-size="13" font-weight="bold" text-anchor="middle">compute_advantages_and_returns</text>

  <rect x="30" y="100" width="220" height="40" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="140" y="125" fill="#c9cee0" font-size="12" text-anchor="middle">compute_approx_kl</text>

  <!-- 5 estimators -->
  <rect x="15"  y="180" width="165" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="97"  y="207" fill="#c9cee0" font-size="11" text-anchor="middle">GRPO / GSPO / CISPO</text>

  <rect x="195" y="180" width="110" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="250" y="207" fill="#c9cee0" font-size="11" text-anchor="middle">PPO (GAE)</text>

  <rect x="320" y="180" width="160" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="207" fill="#c9cee0" font-size="11" text-anchor="middle">REINFORCE++</text>

  <rect x="495" y="180" width="170" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="580" y="207" fill="#c9cee0" font-size="11" text-anchor="middle">R++_baseline</text>

  <rect x="680" y="180" width="125" height="44" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="742" y="200" fill="#ff6b9d" font-size="11" text-anchor="middle">custom</text>
  <text x="742" y="215" fill="#8a91a8" font-size="10" text-anchor="middle">(可插拔)</text>

  <rect x="190" y="265" width="440" height="44" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="410" y="285" fill="#c9cee0" font-size="12" text-anchor="middle">apply_opd_kl_to_advantages（正交）</text>
  <text x="410" y="301" fill="#c9cee0" font-size="12" text-anchor="middle">+ normalize_advantages（CP 感知 whitening）</text>

  <rect x="250" y="340" width="320" height="38" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="364" fill="#f9ca24" font-size="13" font-weight="bold" text-anchor="middle">advantages / returns</text>

  <rect x="250" y="400" width="320" height="38" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="410" y="424" fill="#6c8ef5" font-size="12" font-weight="bold" text-anchor="middle">policy_loss_function</text>

  <!-- arrows -->
  <path d="M300,64 L140,100" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="155" y="88" fill="#8a91a8" font-size="11">算 KL</text>

  <path d="M410,64 L97,180" stroke="#6c8ef5" stroke-width="1.5" fill="none" marker-end="url(#arrowb)"/>
  <path d="M410,64 L250,180" stroke="#6c8ef5" stroke-width="1.5" fill="none" marker-end="url(#arrowb)"/>
  <path d="M410,64 L400,180" stroke="#6c8ef5" stroke-width="1.5" fill="none" marker-end="url(#arrowb)"/>
  <path d="M410,64 L580,180" stroke="#6c8ef5" stroke-width="1.5" fill="none" marker-end="url(#arrowb)"/>
  <path d="M410,64 L742,180" stroke="#6c8ef5" stroke-width="1.5" fill="none" marker-end="url(#arrowb)"/>
  <text x="565" y="130" fill="#8a91a8" font-size="11">dispatch by advantage_estimator</text>

  <path d="M250,224 L300,265" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M580,224 L520,265" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M410,309 L410,340" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M410,378 L410,400" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
