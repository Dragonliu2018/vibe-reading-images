<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowpink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="320" fill="#0b0d14"/>

  <rect x="300" y="25" width="220" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="2"/>
  <text x="410" y="55" fill="#4ecdc4" font-size="14" font-weight="bold" text-anchor="middle">RolloutManager</text>

  <rect x="30"  y="125" width="210" height="66" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="135" y="150" fill="#4ecdc4" font-size="12" font-weight="bold" text-anchor="middle">DataSource</text>
  <text x="135" y="170" fill="#c9cee0" font-size="11" text-anchor="middle">prompt 管理</text>
  <text x="135" y="184" fill="#8a91a8" font-size="11" text-anchor="middle">+ 回放 buffer</text>

  <rect x="305" y="125" width="210" height="66" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="410" y="150" fill="#ff6b9d" font-size="12" font-weight="bold" text-anchor="middle">generate_rollout</text>
  <text x="410" y="170" fill="#c9cee0" font-size="11" text-anchor="middle">可插拔（load_function）</text>
  <text x="410" y="184" fill="#8a91a8" font-size="11" text-anchor="middle">返回 list[list[Sample]]</text>

  <rect x="580" y="125" width="210" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="685" y="155" fill="#4ecdc4" font-size="12" font-weight="bold" text-anchor="middle">RolloutServer</text>

  <rect x="580" y="200" width="210" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="685" y="227" fill="#c9cee0" font-size="12" text-anchor="middle">ServerGroup</text>

  <rect x="580" y="270" width="210" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="685" y="297" fill="#c9cee0" font-size="12" text-anchor="middle">SGLangEngine</text>

  <!-- RolloutManager → 三大持有物 -->
  <path d="M360,73 L160,125" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="100" fill="#8a91a8" font-size="11">持有</text>
  <path d="M410,73 L410,125" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="420" y="103" fill="#8a91a8" font-size="11">加载</text>
  <path d="M460,73 L660,125" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="100" fill="#8a91a8" font-size="11">持有</text>

  <!-- Server 树 -->
  <path d="M685,175 L685,200" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M685,244 L685,270" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- generate_rollout → SGLangEngine（调用 /generate） -->
  <path d="M515,158 L545,158 L545,292 L580,292" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#arrowpink)" stroke-dasharray="5,3"/>
  <text x="510" y="152" fill="#ff6b9d" font-size="11" text-anchor="end">调用 /generate</text>
</svg>
