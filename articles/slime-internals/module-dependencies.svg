<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="360" fill="#0b0d14"/>

  <!-- 入口 -->
  <rect x="340" y="25" width="140" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="50" fill="#4ecdc4" font-size="14" font-weight="bold" text-anchor="middle">train.py</text>

  <!-- 编排 -->
  <rect x="320" y="95" width="180" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="410" y="122" fill="#6c8ef5" font-size="14" font-weight="bold" text-anchor="middle">slime/ray</text>

  <!-- 引擎层三模块 -->
  <rect x="30"  y="175" width="200" height="48" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="130" y="203" fill="#6c8ef5" font-size="12" font-weight="bold" text-anchor="middle">slime/backends</text>
  <text x="130" y="217" fill="#c9cee0" font-size="11" text-anchor="middle">megatron_utils</text>

  <rect x="310" y="175" width="200" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="203" fill="#4ecdc4" font-size="12" font-weight="bold" text-anchor="middle">slime/rollout</text>
  <text x="410" y="217" fill="#c9cee0" font-size="11" text-anchor="middle">数据生成 + 转换</text>

  <rect x="590" y="175" width="200" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="690" y="203" fill="#4ecdc4" font-size="12" font-weight="bold" text-anchor="middle">slime/backends</text>
  <text x="690" y="217" fill="#c9cee0" font-size="11" text-anchor="middle">sglang_utils</text>

  <!-- HUB: slime/utils -->
  <rect x="300" y="290" width="220" height="52" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="2.5"/>
  <text x="410" y="313" fill="#80c7ff" font-size="14" font-weight="bold" text-anchor="middle">slime/utils</text>
  <text x="410" y="331" fill="#c9cee0" font-size="11" text-anchor="middle">RL算法 · 调度 · 分布式 · 监控</text>

  <!-- 扩展 -->
  <rect x="30"  y="296" width="160" height="42" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="110" y="321" fill="#ff6b9d" font-size="12" font-weight="bold" text-anchor="middle">slime/agent</text>

  <rect x="620" y="296" width="170" height="42" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="705" y="321" fill="#ff6b9d" font-size="12" font-weight="bold" text-anchor="middle">slime_plugins</text>

  <!-- 依赖箭头（A→B = A import B） -->
  <!-- train → ray -->
  <path d="M410,65 L410,95" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- ray → megatron_utils -->
  <path d="M345,139 L155,175" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- ray → slime/rollout -->
  <path d="M410,139 L410,175" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- ray → sglang_utils (ray/rollout.py 直接 import) -->
  <path d="M475,139 L665,175" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- slime/rollout → sglang_utils -->
  <path d="M510,199 L590,199" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 三个引擎模块 → utils (汇聚到 hub) -->
  <path d="M150,223 L355,290" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M410,223 L410,290" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M670,223 L465,290" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 扩展 → utils -->
  <path d="M190,317 L300,317" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M620,317 L520,317" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 图例 -->
  <text x="30" y="20" fill="#8a91a8" font-size="11">箭头方向 = import 依赖；slime/utils 为全局 hub（被 import 125 次）</text>
</svg>
