<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="320" fill="#0b0d14"/>

  <text x="20" y="22" fill="#8a91a8" font-size="12">多轮消息树</text>
  <text x="420" y="22" fill="#8a91a8" font-size="12">链 → 训练样本</text>

  <!-- 树 -->
  <rect x="30" y="40" width="150" height="36" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="105" y="63" fill="#c9cee0" font-size="12" text-anchor="middle">root（user prompt）</text>

  <rect x="210" y="90" width="140" height="36" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="280" y="113" fill="#c9cee0" font-size="12" text-anchor="middle">assistant（gen）</text>

  <rect x="210" y="150" width="140" height="36" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="280" y="173" fill="#c9cee0" font-size="12" text-anchor="middle">tool / env</text>

  <rect x="210" y="210" width="140" height="36" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="280" y="233" fill="#c9cee0" font-size="12" text-anchor="middle">assistant（gen）</text>

  <path d="M105,76 L105,88 L210,108" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M280,126 L280,150" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M280,186 L280,210" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 右侧 sample building -->
  <rect x="420" y="40" width="200" height="40" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="520" y="65" fill="#ff6b9d" font-size="12" font-weight="bold" text-anchor="middle">_SampleBuilder</text>

  <rect x="420" y="100" width="200" height="40" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="520" y="125" fill="#c9cee0" font-size="11" text-anchor="middle">classify_token_drift → DriftKind</text>

  <!-- Sample loss_mask 可视化 -->
  <text x="640" y="170" fill="#8a91a8" font-size="11">tokens:</text>
  <rect x="690" y="158" width="50" height="22" rx="4" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="715" y="173" fill="#c9cee0" font-size="10" text-anchor="middle">prompt</text>
  <rect x="742" y="158" width="40" height="22" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="762" y="173" fill="#6c8ef5" font-size="10" text-anchor="middle">gen</text>
  <rect x="784" y="158" width="34" height="22" rx="4" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
  <text x="801" y="173" fill="#c9cee0" font-size="10" text-anchor="middle">tool</text>

  <text x="640" y="208" fill="#8a91a8" font-size="11">loss_mask:</text>
  <rect x="690" y="196" width="50" height="22" rx="4" fill="#1a1d2a" stroke="#3a3f55" stroke-width="1"/>
  <text x="715" y="211" fill="#8a91a8" font-size="11" text-anchor="middle">0</text>
  <rect x="742" y="196" width="40" height="22" rx="4" fill="#1a2436" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="762" y="211" fill="#6c8ef5" font-size="11" text-anchor="middle">1</text>
  <rect x="784" y="196" width="34" height="22" rx="4" fill="#1a1d2a" stroke="#3a3f55" stroke-width="1"/>
  <text x="801" y="211" fill="#8a91a8" font-size="11" text-anchor="middle">0</text>

  <rect x="420" y="250" width="180" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="510" y="275" fill="#f9ca24" font-size="12" font-weight="bold" text-anchor="middle">Sample（共享 rollout_id）</text>

  <path d="M350,108 L420,60" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="90" fill="#8a91a8" font-size="11">record_turn</text>
  <path d="M520,80 L520,100" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M520,140 L520,250" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
