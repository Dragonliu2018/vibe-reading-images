<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="330" fill="#0b0d14"/>

  <rect x="300" y="20" width="180" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="45" fill="#4ecdc4" font-size="14" font-weight="bold" text-anchor="middle">train.py</text>

  <!-- slime/ray 容器 -->
  <rect x="30" y="80" width="720" height="150" rx="10" fill="none" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="48" y="98" fill="#6c8ef5" font-size="12" font-weight="bold">slime/ray/</text>

  <rect x="270" y="100" width="240" height="40" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="390" y="125" fill="#e8eaf0" font-size="12" text-anchor="middle">placement_group.py</text>

  <rect x="50"  y="170" width="240" height="40" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="170" y="190" fill="#e8eaf0" font-size="12" text-anchor="middle">actor_group.py</text>
  <text x="170" y="204" fill="#8a91a8" font-size="11" text-anchor="middle">RayTrainGroup</text>

  <rect x="310" y="170" width="200" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="190" fill="#e8eaf0" font-size="12" text-anchor="middle">rollout.py</text>
  <text x="410" y="204" fill="#8a91a8" font-size="11" text-anchor="middle">RolloutManager</text>

  <rect x="550" y="170" width="180" height="40" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="640" y="190" fill="#8a91a8" font-size="11" text-anchor="middle">ray_actor.py</text>
  <text x="640" y="204" fill="#8a91a8" font-size="11" text-anchor="middle">(mixin)</text>

  <!-- 下游引擎 -->
  <rect x="80"  y="270" width="280" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="220" y="290" fill="#6c8ef5" font-size="12" font-weight="bold" text-anchor="middle">MegatronTrainRayActor</text>
  <text x="220" y="305" fill="#8a91a8" font-size="11" text-anchor="middle">slime/backends/megatron_utils</text>

  <rect x="420" y="270" width="280" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="560" y="290" fill="#4ecdc4" font-size="12" font-weight="bold" text-anchor="middle">SGLangEngine</text>
  <text x="560" y="305" fill="#8a91a8" font-size="11" text-anchor="middle">slime/backends/sglang_utils</text>

  <!-- 箭头 -->
  <path d="M390,60 L390,100" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="84" fill="#8a91a8" font-size="11">create_*</text>
  <path d="M340,140 L200,170" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="225" y="162" fill="#8a91a8" font-size="11">实例化</text>
  <path d="M440,140 L410,170" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M170,210 L220,270" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="135" y="250" fill="#8a91a8" font-size="11">持有</text>
  <path d="M460,210 L540,270" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="510" y="250" fill="#8a91a8" font-size="11">持有</text>
</svg>
