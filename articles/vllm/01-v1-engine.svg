<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="system-ui, sans-serif">
<rect width="820" height="300" fill="#0b0d14"/>
<text x="410.0" y="28" text-anchor="middle" fill="#e8eaf6" font-size="16" font-weight="600">V1 引擎模块架构（前端 ↔ EngineCore 子进程）</text>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
  </marker>
  <marker id="arrowipc" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
  </marker>
</defs>
<text x="160.0" y="60" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="600">前端进程（API Server）</text>
<text x="660.0" y="60" text-anchor="middle" fill="#6c8ef5" font-size="13" font-weight="600">EngineCore 子进程</text>
<rect x="40" y="80" width="240" height="46" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" opacity="0.96"/>
<text x="160.0" y="108" text-anchor="middle" fill="#cdd0e8" font-size="12">InputProcessor</text>
<rect x="40" y="147" width="240" height="46" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" opacity="0.96"/>
<text x="160.0" y="175" text-anchor="middle" fill="#cdd0e8" font-size="12">AsyncLLM</text>
<rect x="40" y="214" width="240" height="46" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" opacity="0.96"/>
<text x="160.0" y="242" text-anchor="middle" fill="#cdd0e8" font-size="12">OutputProcessor · Detokenizer</text>
<rect x="540" y="80" width="240" height="180" rx="10" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" opacity="0.96"/>
<text x="660.0" y="104" fill="#6c8ef5" font-size="13" font-weight="600">EngineCoreProc</text>
<rect x="560" y="118" width="200" height="44" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1" opacity="0.85"/>
<text x="660.0" y="144" text-anchor="middle" fill="#cdd0e8" font-size="12">Scheduler</text>
<rect x="560" y="182" width="200" height="44" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1" opacity="0.85"/>
<text x="660.0" y="208" text-anchor="middle" fill="#cdd0e8" font-size="12">model_executor → Worker</text>
<path d="M280,170 L540,170" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowipc)"/>
<text x="410.0" y="162" text-anchor="middle" fill="#4ecdc4" font-size="10" paint-order="stroke" stroke="#0b0d14" stroke-width="3">ZMQ 请求 ROUTER→DEALER</text>
<path d="M540,237 L280,237" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowipc)"/>
<text x="410.0" y="229" text-anchor="middle" fill="#4ecdc4" font-size="10" paint-order="stroke" stroke="#0b0d14" stroke-width="3">ZMQ 输出 PUSH→PULL</text>
</svg>
