<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="560" fill="#0b0d14"/>

  <text x="40" y="32" font-family="system-ui, sans-serif" font-size="14" fill="#f9ca24" font-weight="600">Go ↔ C++ 的 cgo 边界（internal/cores 之于 querynode/datanode）</text>

  <!-- Go 侧 -->
  <rect x="40" y="56" width="350" height="240" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-opacity="0.7"/>
  <text x="56" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#4ecdc4" font-weight="600">Go 侧（服务编排层）</text>
  <text x="56" y="104" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">Proxy / RootCoord / DataCoord / QueryCoord / QueryNode / StreamingNode / DataNode</text>
  <text x="56" y="128" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">职责：RPC、元数据、调度、WAL、事务、结果归并</text>
  <text x="56" y="158" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">segcore 包（internal/core/src/segcore/*_c.h）：</text>
  <text x="56" y="178" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">QueryNode → NewSearchRequest / ReduceSearchResultsAndFillData</text>
  <text x="56" y="198" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">DataNode → indexbuilder（CreateIndex/BuildIndex 的 C 入口）</text>
  <text x="56" y="228" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">零拷贝优化：SlicedBlob 直接引用 C++ 内存</text>
  <text x="56" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">（EnableResultZeroCopy：gRPC Marshal 时经 MsgPins 释放）</text>
  <text x="56" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">C++ 侧自带三级线程池（Go GC 不进 C++；cgo 调用 pin Go 线程，</text>
  <text x="56" y="288" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">重活留在 C++ 线程池跑，支持运行时热调大小）</text>

  <!-- 边界 -->
  <path d="M 390 176 L 430 176" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 430 196 L 390 196" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">cgo</text>

  <!-- C++ 侧 -->
  <rect x="430" y="56" width="350" height="240" rx="8" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.75"/>
  <text x="446" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#f9ca24" font-weight="600">C++ 侧（internal/core/src，~334K 行）</text>
  <text x="446" y="104" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">segcore：段引擎（SegmentGrowing/ChunkedSegmentSealed）</text>
  <text x="446" y="124" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">exec：算子树（Driver 的物理执行）</text>
  <text x="446" y="144" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">index：索引族（标量/全文/JSON/空间自研 + knowhere 向量）</text>
  <text x="446" y="164" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">query：plan 编译（PlanNode → ExecPlanNodeVisitor）</text>
  <text x="446" y="184" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">storage：binlog 编解码 + 对象存储文件管理</text>
  <text x="446" y="204" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">mmap：ChunkedColumn 的冷数据磁盘映射</text>
  <text x="446" y="228" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">knowhere（独立仓库，pkg-config 链接）：向量索引引擎——</text>
  <text x="446" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">HNSW/IVF/DiskANN/CAGRA 的统一接口（再往下委托 faiss 等）</text>
  <text x="446" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">tantivy（Rust）：全文倒排索引的 C++ 封装</text>
  <text x="446" y="288" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">loon FFI：storagev2 packed（Parquet 列组）读写引擎</text>

  <!-- 为什么 -->
  <rect x="40" y="320" width="740" height="120" rx="8" fill="#13162a" stroke="#80c7ff" stroke-opacity="0.5"/>
  <text x="56" y="344" font-family="system-ui, sans-serif" font-size="13" fill="#80c7ff" font-weight="600">为什么是 cgo 而非进程间（同进程共享内存）</text>
  <text x="56" y="368" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">① Search/Retrieve 结果零拷贝（SlicedBlob 引用 C++ 内存，省一次序列化 + 网络传输）</text>
  <text x="56" y="388" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">② growing segment 的高频小写入（pipeline 微批级 insert/delete），cgo 百 ns 级开销远低于 IPC</text>
  <text x="56" y="408" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">③ bloom filter/stats 等 C++ 状态可被 Go 直接持句柄操作</text>
  <text x="56" y="428" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">代价：Go GC 与 C++ 内存手工管理（大量 defer Release）、cgo pin Go 线程 → C++ 三级线程池兜底</text>

  <!-- 底注 -->
  <rect x="40" y="460" width="740" height="80" rx="8" fill="#13162a"/>
  <text x="56" y="484" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6" font-weight="600">三层向量检索栈的分工：</text>
  <text x="56" y="506" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">Milvus（Go 编排 + C++ segcore 段/算子/过滤）→ knowhere（索引抽象与调度）→ faiss/hnswlib/自己内核（具体 ANN 算法）</text>
  <text x="56" y="526" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">与 Faiss/USearch 系列的关系：Milvus 是"数据库"层——knowhere 之下才是我们前面解读的引擎层（同一 VectorSearch 组的延续阅读）</text>
</svg>
