<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e74c3c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="440" fill="#0b0d14"/>

  <text x="40" y="32" font-family="system-ui, sans-serif" font-size="14" fill="#f9ca24" font-weight="600">Segment 状态机（DataCoord 元数据视角）</text>

  <!-- 状态节点 -->
  <rect x="40" y="70" width="140" height="52" rx="8" fill="#13162a" stroke="#7bed9f" stroke-opacity="0.8"/>
  <text x="110" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle" font-weight="600">Growing</text>
  <text x="110" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">内存，可写可查</text>

  <rect x="240" y="70" width="140" height="52" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-opacity="0.8"/>
  <text x="310" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle" font-weight="600">Sealed</text>
  <text x="310" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">停止写入，等 flush</text>

  <rect x="440" y="70" width="140" height="52" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.85"/>
  <text x="510" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle" font-weight="600">Flushed</text>
  <text x="510" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">binlog 已持久化</text>

  <rect x="640" y="70" width="140" height="52" rx="8" fill="#13162a" stroke="#e74c3c" stroke-opacity="0.7"/>
  <text x="710" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle" font-weight="600">Dropped</text>
  <text x="710" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">GC 待清理</text>

  <!-- 转换 -->
  <path d="M 180 96 L 240 96" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">seal</text>

  <path d="M 380 96 L 440 96" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">flush</text>

  <path d="M 580 96 L 640 96" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">drop/compaction</text>

  <!-- L0 -->
  <rect x="40" y="170" width="140" height="52" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-opacity="0.7"/>
  <text x="110" y="192" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle" font-weight="600">L0 Segment</text>
  <text x="110" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">只存删除 delta</text>

  <path d="M 110 122 L 110 170" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="128" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5">flush 删除</text>

  <path d="M 180 196 L 310 196 L 310 122" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5">L0 compaction 注入</text>

  <!-- Flushed 下游 -->
  <rect x="440" y="170" width="140" height="52" rx="8" fill="#13162a" stroke="#b388ff" stroke-opacity="0.7"/>
  <text x="510" y="192" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle" font-weight="600">Indexed</text>
  <text x="510" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">索引构建完成</text>

  <path d="M 510 122 L 510 170" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="528" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5">index build</text>

  <!-- Clustering 重写 -->
  <rect x="640" y="170" width="140" height="52" rx="8" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.7"/>
  <text x="710" y="192" font-family="system-ui, sans-serif" font-size="13" fill="#e8eaf6" text-anchor="middle" font-weight="600">Clustered</text>
  <text x="710" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">聚类重写产物</text>

  <path d="M 580 196 L 640 196" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#aab2d5" text-anchor="middle">聚类</text>

  <!-- 查询侧视角 -->
  <rect x="40" y="262" width="740" height="164" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.4"/>
  <text x="56" y="286" font-family="system-ui, sans-serif" font-size="13" fill="#6c8ef5" font-weight="600">查询侧的视角（QueryNode）</text>
  <text x="56" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">growing（Streaming scope）：leader 本地，pipeline 实时写入，临时索引/暴力搜——实时可见性</text>
  <text x="56" y="332" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">sealed（Historical scope）：任意 worker，mmap 加载 binlog/索引，knowhere 加速——批量高性能</text>
  <text x="56" y="354" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">TargetVersion 门控：LoadSegments 的 sealed 初始 unreadable(-2)，SyncTargetVersion 后才进可读集合——</text>
  <text x="56" y="374" font-family="system-ui, sans-serif" font-size="12" fill="#c9cfdf">查询视图与 QueryCoord target 原子对齐，避免读到已被 balance 淘汰的旧副本</text>
  <text x="56" y="398" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">分布账本：distribution 的 snapshot（不可变快照）+ PinReadableSegments；delegator 把 sealed 按 worker 分组</text>
  <text x="56" y="418" font-family="system-ui, sans-serif" font-size="12" fill="#aab2d5">发子任务、growing 固定本地——两种 scope 的执行路径与拓扑差异是 growing/historical 分离的根因</text>
</svg>
