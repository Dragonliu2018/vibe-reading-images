<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker></defs><rect width="900" height="440" fill="#0b0d14"/><text x="40" y="30" fill="#6c8ef5" font-size="14" font-weight="700">FE 模块（均以 Catalog god class 为依赖中心）</text><text x="660" y="30" fill="#4ecdc4" font-size="14" font-weight="700">BE 模块</text><line x1="450" y1="46" x2="450" y2="420" stroke="#7a86b3" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/><rect x="40" y="50" width="360" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/><text x="220" y="70" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">查询解析与优化</text><text x="220" y="86" text-anchor="middle" fill="#9aa0c0" font-size="11">analysis/ planner/</text><rect x="40" y="116" width="360" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/><text x="220" y="136" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">元数据与 Catalog</text><text x="220" y="152" text-anchor="middle" fill="#9aa0c0" font-size="11">catalog/ ★ god class</text><rect x="40" y="182" width="360" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/><text x="220" y="202" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">查询协调与协议</text><text x="220" y="218" text-anchor="middle" fill="#9aa0c0" font-size="11">qe/ mysql/ service/</text><rect x="40" y="248" width="360" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/><text x="220" y="268" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">数据导入与事务</text><text x="220" y="284" text-anchor="middle" fill="#9aa0c0" font-size="11">load/ task/ transaction/</text><rect x="40" y="314" width="360" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/><text x="220" y="3