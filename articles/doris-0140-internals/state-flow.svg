<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="system-ui, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/></marker></defs><rect width="900" height="460" fill="#0b0d14"/><text x="40" y="32" fill="#f9ca24" font-size="14" font-weight="700">导入事务状态机（TransactionStatus · transaction/TransactionStatus.java:20）</text><rect x="100" y="64" width="150" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/><text x="175" y="84" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">PREPARE</text><text x="175" y="100" text-anchor="middle" fill="#9aa0c0" font-size="11">beginTransaction</text><rect x="375" y="64" width="150" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/><text x="450" y="84" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">COMMITTED</text><text x="450" y="100" text-anchor="middle" fill="#9aa0c0" font-size="11">commitTransaction</text><rect x="650" y="64" width="150" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/><text x="725" y="84" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">VISIBLE</text><text x="725" y="100" text-anchor="middle" fill="#9aa0c0" font-size="11">publishVersionDaemon</text><path d="M250,88 L375,88" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M525,88 L650,88" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="375" y="176" width="150" height="48" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/><text x="450" y="196" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">ABORTED</text><text x="450" y="212" text-anchor="middle" fill="#9aa0c0" font-size="11">abortTransaction / 超时</text><path d="M175,112 L400,176" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M450,112 L450,176" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="40" y="252" fill="#9aa0c0" font-size="11">主链 PREPARE→COMMITTED→VISIBLE 为两阶段提交正常路径（commit 快返回、publish 异步可见）；PREPARE/COMMITTED 可 abort 进 ABORTED 终态。0.14.0 仅 4 态，无 PRECOMMITTED（1.x 才补预提交态）。</text><line x1="40" y1="276" x2="860" y2="276" stroke="#7a86b3" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/><text x="40" y="304" fill="#f9ca24" font-size="14" font-weight="700">执行路径（0.14.0 唯一行式，无向量化双轨）</text><rect x="60" y="330" width="180" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/><text x="150" y="352" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">StmtExecutor</text><text x="150" y="368" text-anchor="middle" fill="#9aa0c0" font-size="11">execute()</text><path d="M240,356 L380,356" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#a)"/><rect x="380" y="332" width="240" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/><text x="500" y="352" text-anchor="middle" fill="#e8eaf2" font-size="13" font-weight="600">行式 exec/ + exprs/</text><text x="500" y="368" text-anchor="middle" fill="#9aa0c0" font-size="11">ExecNode · RowBatch（唯一）</text><rect x="650" y="332" width="190" height="48" rx="6" fill="none" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/><text x="745" y="352" text-anchor="middle" fill="#ff6b9d" font-size="13" font-weight="600" text-decoration="line-through">向量化 vec/</text><text x="745" y="368" text-anchor="middle" fill="#ff6b9d" font-size="11">0.14.0 不存在</text><text x="40" y="420" fill="#9aa0c0" font-size="11">create_node()（exec_node.cpp:329）是纯 switch，按 TPlanNodeType 直接实例化具体节点，无 enable_vectorized_exec() 二选一分支——0.14.0 纯行式，1.x 才加向量化双轨，2.x 起统一向量化。</text></svg>
