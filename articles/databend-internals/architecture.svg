<svg xmlns="http://www.w3.org/2000/svg" width="820" height="666" viewBox="0 0 820 666" font-family="system-ui, sans-serif">
<rect width="820" height="666" fill="#0b0d14"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/></marker></defs>
<text x="410" y="22" text-anchor="middle" fill="#e8ecf5" font-size="16" font-weight="bold">Databend 分层架构</text>

<!-- Layer 1: 协议接入层 -->
<rect x="20" y="40" width="780" height="78" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1" stroke-opacity="0.5"/>
<text x="36" y="62" fill="#4ecdc4" font-size="14" font-weight="600">协议接入层</text>
<text x="784" y="62" text-anchor="end" fill="#5a6388" font-size="11">servers/ — 协议编解码，统一转交执行路径</text>
<rect x="96" y="72" width="200" height="40" rx="6" fill="#1a1d35" stroke="#4ecdc4" stroke-width="1.2"/>
<text x="196" y="97" text-anchor="middle" fill="#e8ecf5" font-size="12.5">MySQLHandler</text>
<rect x="310" y="72" width="200" height="40" rx="6" fill="#1a1d35" stroke="#4ecdc4" stroke-width="1.2"/>
<text x="410" y="97" text-anchor="middle" fill="#e8ecf5" font-size="12.5">HttpHandler</text>
<rect x="524" y="72" width="200" height="40" rx="6" fill="#1a1d35" stroke="#4ecdc4" stroke-width="1.2"/>
<text x="624" y="97" text-anchor="middle" fill="#e8ecf5" font-size="12.5">FlightSQLServer</text>
<line x1="410" y1="118" x2="410" y2="144" stroke="#7a86b3" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Layer 2: 服务编排层 -->
<rect x="20" y="146" width="780" height="78" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1" stroke-opacity="0.5"/>
<text x="36" y="168" fill="#6c8ef5" font-size="14" font-weight="600">服务编排层</text>
<text x="784" y="168" text-anchor="end" fill="#5a6388" font-size="11">sessions / interpreters / schedulers — 178 个 Interpreter 分发</text>
<rect x="96" y="178" width="200" height="40" rx="6" fill="#1a1d35" stroke="#6c8ef5" stroke-width="1.2"/>
<text x="196" y="203" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Session / QueryContext</text>
<rect x="310" y="178" width="200" height="40" rx="6" fill="#1a1d35" stroke="#6c8ef5" stroke-width="1.2"/>
<text x="410" y="203" text-anchor="middle" fill="#e8ecf5" font-size="12.5">InterpreterFactory</text>
<rect x="524" y="178" width="200" height="40" rx="6" fill="#1a1d35" stroke="#6c8ef5" stroke-width="1.2"/>
<text x="624" y="203" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Fragmenter / Scheduler</text>
<line x1="410" y1="224" x2="410" y2="250" stroke="#7a86b3" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Layer 3: 编译优化层 -->
<rect x="20" y="252" width="780" height="78" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1" stroke-opacity="0.5"/>
<text x="36" y="274" fill="#b388ff" font-size="14" font-weight="600">编译优化层</text>
<text x="784" y="274" text-anchor="end" fill="#5a6388" font-size="11">ast + sql — SQL→逻辑计划→代价优化→物理计划</text>
<rect x="42" y="284" width="136" height="40" rx="6" fill="#1a1d35" stroke="#b388ff" stroke-width="1.2"/>
<text x="110" y="309" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Parser / AST</text>
<rect x="192" y="284" width="136" height="40" rx="6" fill="#1a1d35" stroke="#b388ff" stroke-width="1.2"/>
<text x="260" y="309" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Binder</text>
<rect x="342" y="284" width="136" height="40" rx="6" fill="#1a1d35" stroke="#b388ff" stroke-width="1.2"/>
<text x="410" y="309" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Planner (SExpr)</text>
<rect x="492" y="284" width="136" height="40" rx="6" fill="#1a1d35" stroke="#b388ff" stroke-width="1.2"/>
<text x="560" y="309" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Cascades Optimizer</text>
<rect x="642" y="284" width="136" height="40" rx="6" fill="#1a1d35" stroke="#b388ff" stroke-width="1.2"/>
<text x="710" y="309" text-anchor="middle" fill="#e8ecf5" font-size="12.5">PhysicalPlan</text>
<line x1="410" y1="330" x2="410" y2="356" stroke="#7a86b3" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Layer 4: 执行引擎层 -->
<rect x="20" y="358" width="780" height="78" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1" stroke-opacity="0.5"/>
<text x="36" y="380" fill="#f9ca24" font-size="14" font-weight="600">执行引擎层</text>
<text x="784" y="380" text-anchor="end" fill="#5a6388" font-size="11">pipeline + executor — push-pull 向量化执行</text>
<rect x="41" y="390" width="174" height="40" rx="6" fill="#1a1d35" stroke="#f9ca24" stroke-width="1.2"/>
<text x="128" y="415" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Pipeline DAG</text>
<rect x="229" y="390" width="174" height="40" rx="6" fill="#1a1d35" stroke="#f9ca24" stroke-width="1.2"/>
<text x="316" y="415" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Processor</text>
<rect x="417" y="390" width="174" height="40" rx="6" fill="#1a1d35" stroke="#f9ca24" stroke-width="1.2"/>
<text x="504" y="415" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Transforms</text>
<rect x="605" y="390" width="174" height="40" rx="6" fill="#1a1d35" stroke="#f9ca24" stroke-width="1.2"/>
<text x="692" y="415" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Evaluator</text>
<line x1="410" y1="436" x2="410" y2="462" stroke="#7a86b3" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Layer 5: 存储引擎层 -->
<rect x="20" y="464" width="780" height="78" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1" stroke-opacity="0.5"/>
<text x="36" y="486" fill="#ff6b9d" font-size="14" font-weight="600">存储引擎层</text>
<text x="784" y="486" text-anchor="end" fill="#5a6388" font-size="11">storages + catalog — Parquet 段存储 + 快照 MVCC</text>
<rect x="96" y="496" width="200" height="40" rx="6" fill="#1a1d35" stroke="#ff6b9d" stroke-width="1.2"/>
<text x="196" y="521" text-anchor="middle" fill="#e8ecf5" font-size="12.5">FuseTable</text>
<rect x="310" y="496" width="200" height="40" rx="6" fill="#1a1d35" stroke="#ff6b9d" stroke-width="1.2"/>
<text x="410" y="521" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Iceberg / Delta / Parquet</text>
<rect x="524" y="496" width="200" height="40" rx="6" fill="#1a1d35" stroke="#ff6b9d" stroke-width="1.2"/>
<text x="624" y="521" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Catalog / Table / Database</text>
<line x1="410" y1="542" x2="410" y2="568" stroke="#7a86b3" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Layer 6: 元数据与基础设施层 -->
<rect x="20" y="570" width="780" height="78" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1" stroke-opacity="0.5"/>
<text x="36" y="592" fill="#80c7ff" font-size="14" font-weight="600">元数据与基础设施层</text>
<text x="784" y="592" text-anchor="end" fill="#5a6388" font-size="11">meta + common — 全仓 fan-in 最高 (expression 7187)</text>
<rect x="96" y="602" width="200" height="40" rx="6" fill="#1a1d35" stroke="#80c7ff" stroke-width="1.2"/>
<text x="196" y="627" text-anchor="middle" fill="#e8ecf5" font-size="12.5">MetaService (Raft)</text>
<rect x="310" y="602" width="200" height="40" rx="6" fill="#1a1d35" stroke="#80c7ff" stroke-width="1.2"/>
<text x="410" y="627" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Expression / Column</text>
<rect x="524" y="602" width="200" height="40" rx="6" fill="#1a1d35" stroke="#80c7ff" stroke-width="1.2"/>
<text x="624" y="627" text-anchor="middle" fill="#e8ecf5" font-size="12.5">Common Base</text>
</svg>
