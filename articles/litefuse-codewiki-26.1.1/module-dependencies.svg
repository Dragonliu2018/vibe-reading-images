<path d="M190,115 L190,72 L820,72 L820,275 L790,275" fill="none" stroke="#80c7ff" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arc)"/>
<text x="500" y="66" text-anchor="middle" fill="#80c7ff" font-size="10">queryDoris (读路径，绕行)</text>
<!-- 08 -> 03 read path (horizontal at y=275, clear band) -->
<path d="M190,275 L630,275" fill="none" stroke="#80c7ff" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arc)"/>
<text x="410" y="269" text-anchor="middle" fill="#80c7ff" font-size="10">tRPC 查询</text>
