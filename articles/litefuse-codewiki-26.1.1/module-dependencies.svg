<path d="M590,140 L605,140 L605,435 L630,435" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="612" y="290" text-anchor="start" fill="#8893b3" font-size="9">Prisma 元数据</text>
<!-- 05 -> 02 (folded via gap x=615, up) -->
<path d="M590,355 L615,355 L615,115 L630,115" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- 05 -> 03 query/command (folded via gap x=620) -->
<path d="M590,365 L620,365 L620,290 L630,290" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585" y="328" text-anchor="end" fill="#8893b3" font-size="9">query/command</text>
<!-- 02 -> 03 dorisClient (vertical col4) -->
<path d="M710,140 L710,250" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- 07 -> 03 repositories (vertical col4) -->
<path d="M710,410 L710,300" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="718" y="358" text-anchor="start" fill="#8893b3" font-size="9">repositories</text>
<text x="440" y="526" text-anchor="middle" fill="#8893b3" font-size="11">实线=依赖/调用  ·  虚线=读路径或元数据访问  ·  04 被多模块消费（队列契约在 shared）</text>
