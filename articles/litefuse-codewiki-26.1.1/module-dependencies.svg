<!-- 06 -> 04 入队 (folded via gap x=210) -->
<path d="M190,115 L210,115 L210,195 L230,195" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="218" y="156" text-anchor="start" fill="#8893b3" font-size="10">入队</text>
