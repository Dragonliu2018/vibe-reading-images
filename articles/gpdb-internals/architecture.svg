<svg xmlns="http://www.w3.org/2000/svg" width="820" height="626" viewBox="0 0 820 626" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="626" fill="#0b0d14"/>
  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#e6e6f0">Greenplum 7.0.0-beta.0 分层架构</text>

  <!-- Layer 1: 客户端层 (blue) -->
  <text x="24" y="50" font-size="12" fill="#6c8ef5">客户端层</text>
  <rect x="20" y="54" width="780" height="92" rx="10" fill="none" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="230" y="72" width="180" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="320" y="98" text-anchor="middle" font-size="14" fill="#e6e6f0">psql · 客户端</text>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#8a8db0">src/bin/psql</text>
  <rect x="450" y="72" width="180" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="540" y="98" text-anchor="middle" font-size="14" fill="#e6e6f0">JDBC / ODBC</text>
  <text x="540" y="118" text-anchor="middle" font-size="11" fill="#8a8db0">libpq 协议</text>

  <!-- Layer 2: 接口与进程层 (cyan) -->
  <text x="24" y="164" font-size="12" fill="#4ecdc4">接口与进程层</text>
  <rect x="20" y="168" width="780" height="92" rx="10" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="130" y="186" width="180" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="220" y="212" text-anchor="middle" font-size="14" fill="#e6e6f0">postmaster 进程管理</text>
  <text x="220" y="232" text-anchor="middle" font-size="11" fill="#8a8db0">postmaster.c · PMAuxProcList</text>
  <rect x="350" y="186" width="180" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="212" text-anchor="middle" font-size="14" fill="#e6e6f0">查询分发</text>
  <text x="440" y="232" text-anchor="middle" font-size="11" fill="#8a8db0">postgres.c · exec_simple_query</text>
  <rect x="570" y="186" width="180" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="660" y="212" text-anchor="middle" font-size="14" fill="#e6e6f0">连接与认证</text>
  <text x="660" y="232" text-anchor="middle" font-size="11" fill="#8a8db0">libpq · port.c</text>

  <!-- Layer 3: 优化器层 (yellow) -->
  <text x="24" y="278" font-size="12" fill="#f9ca24">优化器层</text>
  <rect x="20" y="282" width="780" height="92" rx="10" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="48" y="300" width="180" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="138" y="326" text-anchor="middle" font-size="14" fill="#e6e6f0">优化器入口</text>
  <text x="138" y="346" text-anchor="middle" font-size="11" fill="#8a8db0">standard_planner · orca.c</text>
  <rect x="268" y="300" width="304" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="420" y="326" text-anchor="middle" font-size="14" fill="#e6e6f0">GPORCA 代价优化器</text>
  <text x="420" y="346" text-anchor="middle" font-size="11" fill="#8a8db0">gpopt 翻译桥 + gporca Cascades</text>
  <rect x="612" y="300" width="160" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="692" y="326" text-anchor="middle" font-size="14" fill="#e6e6f0">PG planner 回退</text>
  <text x="692" y="346" text-anchor="middle" font-size="11" fill="#8a8db0">optimizer + cdbllize</text>

  <!-- Layer 4: 分布式执行层 (pink) - 3 equal boxes -->
  <text x="24" y="392" font-size="12" fill="#ff6b9d">分布式执行层</text>
  <rect x="20" y="396" width="780" height="92" rx="10" fill="none" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="130" y="414" width="180" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="220" y="440" text-anchor="middle" font-size="14" fill="#e6e6f0">派发与 gang</text>
  <text x="220" y="460" text-anchor="middle" font-size="11" fill="#8a8db0">cdbdisp_query · cdbgang</text>
  <rect x="350" y="414" width="180" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="440" y="440" text-anchor="middle" font-size="14" fill="#e6e6f0">Motion 与互连</text>
  <text x="440" y="460" text-anchor="middle" font-size="11" fill="#8a8db0">nodeMotion · ic_tcp</text>
  <rect x="570" y="414" width="180" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="660" y="440" text-anchor="middle" font-size="14" fill="#e6e6f0">分布式事务</text>
  <text x="660" y="460" text-anchor="middle" font-size="11" fill="#8a8db0">cdbtm · 两阶段提交</text>

  <!-- Layer 5: 存储与容错层 (purple) -->
  <text x="24" y="506" font-size="12" fill="#b388ff">存储与容错层</text>
  <rect x="20" y="510" width="780" height="92" rx="10" fill="none" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="130" y="528" width="180" height="60" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="220" y="554" text-anchor="middle" font-size="14" fill="#e6e6f0">存储引擎</text>
  <text x="220" y="574" text-anchor="middle" font-size="11" fill="#8a8db0">access(heap/AO) · storage</text>
  <rect x="350" y="528" width="180" height="60" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="440" y="554" text-anchor="middle" font-size="14" fill="#e6e6f0">容错服务</text>
  <text x="440" y="574" text-anchor="middle" font-size="11" fill="#8a8db0">fts · primary/mirror 探测提升</text>
  <rect x="570" y="528" width="180" height="60" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="660" y="554" text-anchor="middle" font-size="14" fill="#e6e6f0">集群管理</text>
  <text x="660" y="574" text-anchor="middle" font-size="11" fill="#8a8db0">gpMgmt · gpstart/gpinit</text>

  <text x="410" y="620" text-anchor="middle" font-size="11" fill="#8a8db0">coordinator 顶层驱动 · segment 侧经 Motion 互连交换数据 · 共享无盘架构</text>
</svg>
