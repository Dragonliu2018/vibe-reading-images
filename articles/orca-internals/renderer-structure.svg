<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="640" fill="#0b0d14"/>

  <!-- App 顶层 -->
  <rect x="60" y="40" width="760" height="70" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4ecdc4">RecoverableRenderErrorBoundary（app.root）</text>
  <text x="440" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">main.tsx → StrictMode → I18nProvider → RendererRoot</text>

  <rect x="60" y="140" width="760" height="70" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="440" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">App.tsx（117 行 · 一组 always-mounted use* service hooks）</text>
  <text x="440" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">useAppStartupHydration · useRuntimeGraphSync · useGlobalKeybindings · useAppSessionPersistence …</text>

  <path d="M 440,110 L 440,138" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 三表面 -->
  <rect x="60" y="240" width="230" height="90" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="175" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">AppBackgroundServices</text>
  <text x="175" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">无 UI 后台服务容器</text>
  <text x="175" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">（首屏前常驻）</text>

  <rect x="320" y="240" width="240" height="90" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="440" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">AppWorkspaceShell</text>
  <text x="440" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">Sidebar · Titlebar · TerminalWorkbench</text>
  <text x="440" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">+ lazy ActivePage + RightSidebar</text>

  <rect x="590" y="240" width="230" height="90" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="705" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">AppRootSurfaces</text>
  <text x="705" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">quick-open 等 lazy modal</text>
  <text x="705" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">单向 ratchet：打开过即保持挂载</text>

  <path d="M 175,210 L 175,238" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 440,210 L 440,238" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 705,210 L 705,238" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- store -->
  <rect x="60" y="380" width="760" height="110" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="440" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#b388ff">useAppStore（单一 zustand store）</text>
  <text x="440" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">~45 个 create*Slice 组合 · withReactCommitCascadeWriteProbe 无条件包装</text>
  <text x="440" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">slices/（域切片）+ repos/projects/folder-workspaces/（切片实现细节拆包）+ 横切 selector 守卫</text>
  <text x="440" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">copyOnWriteRecord：首次写才克隆，"identity-keyed selectors stay quiet"</text>

  <path d="M 440,330 L 440,378" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 性能纪律 -->
  <rect x="60" y="530" width="760" height="80" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="440" y="556" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ff6b9d">性能即纪律（不是拆库）</text>
  <text x="440" y="578" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">zustand selector fanout 基准：2500 订阅者 × 2000 写 · 每写 ≤5ms 硬阈值（CI gate）</text>
  <text x="440" y="598" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">always-mounted 表面只准用廉价 selector · commit cascade write probe 直接点名肇事先代码</text>
</svg>
