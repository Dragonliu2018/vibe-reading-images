<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="560" fill="#0b0d14"/>

  <!-- Col1 客户端与装配 -->
  <rect x="30" y="60" width="170" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="115" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">Renderer UI</text>
  <text x="115" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">React + zustand</text>

  <rect x="30" y="150" width="170" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="115" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">Orca CLI</text>
  <text x="115" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">160+ 子命令</text>

  <rect x="30" y="390" width="170" height="64" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="115" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">主进程启动装配</text>
  <text x="115" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">composition root</text>

  <!-- Col2 RPC 接入层 -->
  <rect x="270" y="80" width="190" height="100" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="365" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">统一 RPC 接入层</text>
  <text x="365" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">RpcDispatcher · 590 方法</text>
  <text x="365" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">IPC / WebSocket / Unix socket</text>

  <!-- Col3 hub -->
  <rect x="530" y="60" width="180" height="440" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="620" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#f9ca24">Agent Runtime 核心</text>
  <text x="620" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">OrcaRuntimeService</text>
  <text x="620" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">135 层 mixin 链</text>
  <text x="620" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">OrchestrationDb</text>
  <text x="620" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">编排协调真源</text>
  <text x="620" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">AgentSessionRecord</text>
  <text x="620" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">Store（lease）</text>
  <text x="620" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">RuntimeStore 契约</text>
  <text x="620" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">订阅注册表</text>
  <text x="620" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">tail buffer / 状态</text>

  <!-- Col4 spokes -->
  <rect x="780" y="40" width="170" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="865" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">orcad 终端守护</text>
  <rect x="780" y="112" width="170" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="865" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">Git Worktree 生命周期</text>
  <rect x="780" y="184" width="170" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="865" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">Agent Provider 适配</text>
  <rect x="780" y="256" width="170" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="865" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">会话数据层</text>
  <rect x="780" y="328" width="170" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="865" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">嵌入式浏览器</text>
  <rect x="780" y="400" width="170" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="865" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">SSH 远程执行</text>
  <rect x="780" y="472" width="170" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="865" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">Relay 云中继</text>

  <!-- Renderer / CLI → RPC -->
  <path d="M 200,88 L 268,88" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 200,178 L 268,178" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- RPC → hub -->
  <path d="M 460,130 L 528,130" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="494" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa5c5">dispatch</text>

  <!-- 启动装配 → hub -->
  <path d="M 200,422 L 528,422" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="365" y="414" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa5c5">composition root 装配</text>

  <!-- hub → spokes 扇出 -->
  <path d="M 710,270 L 745,270" stroke="#7a86b3" stroke-width="1.5" fill="none"/>
  <path d="M 745,270 L 745,66 L 778,66" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 745,270 L 745,138 L 778,138" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 745,270 L 745,210 L 778,210" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 745,270 L 745,282 L 778,282" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 745,270 L 745,354 L 778,354" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 745,270 L 745,426 L 778,426" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 745,270 L 745,498 L 778,498" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
