<svg xmlns="http://www.w3.org/2000/svg" width="860" height="630" viewBox="0 0 860 630">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="630" fill="#0b0d14"/>

  <!-- 中央主链 -->
  <rect x="330" y="40" width="240" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="450" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">Composer 提交</text>
  <text x="450" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">launchAgentInNewTab()</text>

  <rect x="330" y="140" width="240" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="450" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">store.createTab()</text>
  <text x="450" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">queueTabStartupCommand</text>

  <rect x="330" y="240" width="240" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="450" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">pty:spawn（IPC invoke）</text>
  <text x="450" y="283" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">preload contextBridge</text>

  <rect x="330" y="340" width="240" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="450" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">LocalPtyProvider.spawn</text>
  <text x="450" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">node-pty → Claude Code</text>

  <rect x="330" y="440" width="240" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="450" y="463" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">proc.onData</text>
  <text x="450" y="483" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">双消费者扇出</text>

  <rect x="330" y="540" width="240" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="450" y="563" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">pty:data 推送</text>
  <text x="450" y="583" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">xterm.js 渲染</text>

  <!-- 主链箭头 -->
  <path d="M 450,96 L 450,138" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="458" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#9aa5c5">startup plan</text>
  <path d="M 450,196 L 450,238" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="458" y="222" font-family="system-ui, sans-serif" font-size="10" fill="#9aa5c5">TerminalPane mount</text>
  <path d="M 450,296 L 450,338" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 450,396 L 450,438" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 450,496 L 450,538" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="458" y="522" font-family="system-ui, sans-serif" font-size="10" fill="#9aa5c5">2ms 批量 + 信用背压</text>

  <!-- 左分支：runtime 侧消费 -->
  <rect x="30" y="440" width="240" height="56" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="150" y="463" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">runtime.onPtyData</text>
  <text x="150" y="483" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">tail buffer · OSC 状态扫描</text>
  <path d="M 330,468 L 272,468" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 右分支：hook 状态链 -->
  <rect x="610" y="340" width="220" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="720" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">hook 脚本 POST</text>
  <text x="720" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">loopback AgentHookServer</text>
  <path d="M 570,368 L 608,368" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="610" y="440" width="220" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="720" y="463" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">agentStatus:set</text>
  <text x="720" y="483" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">→ sidebar / mobile 状态行</text>
  <path d="M 720,396 L 720,438" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
