<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="600" fill="#0b0d14"/>

  <!-- 注册表 -->
  <rect x="60" y="40" width="340" height="110" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="230" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f9ca24">TUI_AGENT_CONFIG_SOURCE</text>
  <text x="230" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">Record&lt;TuiAgent, TuiAgentConfig&gt;（37 个成员）</text>
  <text x="230" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">detectCmd · launchCmd · expectedProcess</text>
  <text x="230" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">promptInjectionMode · trust preset · 就绪信号</text>

  <!-- 计划构建 -->
  <rect x="490" y="40" width="330" height="110" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="655" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">buildAgentStartupPlan()</text>
  <text x="655" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">AgentStartupPlan：</text>
  <text x="655" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">launchCommand · followupPrompt · env</text>
  <text x="655" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">draftPrompt · launchConfig</text>

  <path d="M 400,95 L 488,95" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 6 种注入模式 -->
  <text x="60" y="196" font-family="system-ui, sans-serif" font-size="14" fill="#4ecdc4">promptInjectionMode 六种策略</text>
  <rect x="60" y="210" width="760" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="90" y="236" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">argv（claude -- "prompt"）</text>
  <text x="490" y="236" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">flag-prompt（opencode --prompt）</text>
  <text x="90" y="256" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">flag-prompt-interactive（gemini）</text>
  <text x="490" y="256" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">flag-interactive（copilot -i）</text>
  <text x="90" y="276" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">hermes-query</text>
  <text x="490" y="276" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">stdin-after-start（就绪后粘贴）</text>

  <!-- spawn -->
  <rect x="60" y="310" width="340" height="76" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="230" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">createLocalPtyLaunchPlan()</text>
  <text x="230" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">进程识别 · root cwd 拒绝 · shell 回退链</text>
  <text x="230" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">CODEX_HOME / ORCA_CODEX_HOME 注入</text>

  <rect x="490" y="310" width="330" height="76" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="655" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">draft-paste-ready-scanner</text>
  <text x="655" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">PTY 字节流增量扫描 · bracketed paste</text>
  <text x="655" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">quiet window / glyph marker / alt-screen anchor</text>

  <path d="M 400,348 L 488,348" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 前台检测 -->
  <text x="60" y="436" font-family="system-ui, sans-serif" font-size="14" fill="#ff6b9d">foreground process 多策略检测</text>
  <rect x="60" y="450" width="760" height="120" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="90" y="478" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">POSIX：ps 快照建索引 → collectDescendantsFromIndex 取进程树</text>
  <text x="90" y="504" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">stat 含 + 判定前台 → 外层 wrapper 优先（shell→omp→pi 树返回 omp）</text>
  <text x="90" y="530" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">Windows：PTY Job Object PID 集合做 liveness anchor</text>
  <text x="90" y="556" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">三态 available："扫描失败绝不覆盖已识别 agent"</text>
</svg>
