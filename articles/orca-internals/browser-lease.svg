<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#0b0d14"/>

  <!-- 页面所有权拓扑 -->
  <text x="60" y="36" font-family="system-ui, sans-serif" font-size="14" fill="#4ecdc4">页面所有权：authority 与配对 host</text>

  <rect x="60" y="52" width="260" height="110" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="190" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f9ca24">authority runtime</text>
  <text x="190" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">BrowserHostLeaseRegistry</text>
  <text x="190" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">attach / fence / placeClientPage</text>
  <text x="190" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">issueClientPageCommand / settle</text>

  <rect x="620" y="52" width="230" height="110" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="735" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">配对 browser host</text>
  <text x="735" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">desktop webview / 手机投屏</text>
  <text x="735" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">hostCapabilities: ['webview'…]</text>
  <text x="735" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">断线 15s 宽限重连</text>

  <rect x="340" y="52" width="230" height="110" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="455" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">页面放置（placement）</text>
  <text x="455" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">server（offscreen）/ client</text>
  <text x="455" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">页面记录比 host 活得久</text>

  <path d="M 320,107 L 338,107" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 570,107 L 618,107" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- tab 创建三分支 -->
  <text x="60" y="212" font-family="system-ui, sans-serif" font-size="14" fill="#6c8ef5">browserTabCreate 三分支</text>
  <rect x="60" y="228" width="250" height="90" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="185" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">远程/移动请求</text>
  <text x="185" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">必须 pairedDeviceId（否则 forbidden）</text>
  <text x="185" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">lease registry 选 host → publish</text>

  <rect x="330" y="228" width="250" height="90" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="455" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">headless serve</text>
  <text x="455" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">无 renderer webview</text>
  <text x="455" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">→ offscreen WebContents 兜底</text>

  <rect x="600" y="228" width="250" height="90" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="725" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">桌面</text>
  <text x="725" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">createBrowserTabInRenderer</text>
  <text x="725" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">registerGuest（webContentsId 注册）</text>

  <!-- Design Mode -->
  <text x="60" y="368" font-family="system-ui, sans-serif" font-size="14" fill="#ff6b9d">Design Mode 采集链</text>
  <rect x="60" y="384" width="790" height="70" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="455" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">setGrabMode → guest 注入采集脚本 → 用户点元素</text>
  <text x="455" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">selector / elementPath / reactComponents / sourceFile / htmlSnippet / computedStyles / 裁剪截图（CDP clip）</text>

  <!-- 主侧安全网 -->
  <rect x="60" y="480" width="790" height="110" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="455" y="506" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ff6b9d">clampGrabPayload()——主侧安全网（即使 guest runtime 被攻破）</text>
  <text x="455" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">GRAB_BUDGET 截断 · GRAB_SECRET_PATTERNS 密钥擦除</text>
  <text x="455" y="552" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">URL 剥 query/hash（防 token 泄漏）· GRAB_SAFE_ATTRIBUTE_NAMES 白名单</text>
  <text x="455" y="574" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">→ formatGrabPayloadAsText → submit-after-ready 送入 agent prompt</text>
</svg>
