<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="520" fill="#0b0d14"/>

  <!-- 中央分发链 -->
  <rect x="300" y="40" width="280" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">window.api.runtime.call</text>
  <text x="440" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">renderer（preload bridge）</text>

  <rect x="300" y="130" width="280" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="440" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">ipcMain.handle('runtime:call')</text>
  <text x="440" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">senderFrame === mainFrame 校验</text>

  <rect x="300" y="220" width="280" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="440" y="243" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">RpcDispatcher.dispatch()</text>
  <text x="440" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">registry 查找 · migration fence</text>

  <rect x="300" y="310" width="280" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="440" y="333" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">zod parse params</text>
  <text x="440" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">契约 schema（rpc-contract）</text>

  <rect x="300" y="400" width="280" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="440" y="423" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">handler(params, {runtime, signal})</text>
  <text x="440" y="443" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">590 个 defineMethod</text>

  <path d="M 440,96 L 440,128" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 440,186 L 440,218" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 440,276 L 440,308" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 440,366 L 440,398" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 左：CLI / Unix socket -->
  <rect x="30" y="130" width="210" height="56" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="135" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">Orca CLI</text>
  <text x="135" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">orca-runtime.json → Unix socket</text>
  <path d="M 240,158 L 298,158" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 右：移动端链 -->
  <rect x="640" y="130" width="190" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="735" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">E2EE WebSocket 帧</text>
  <text x="735" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">MobileSocketWiring</text>

  <rect x="640" y="220" width="190" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="735" y="243" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">deviceToken 校验</text>
  <text x="735" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">DeviceRegistry.validateToken</text>

  <rect x="640" y="310" width="190" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="735" y="333" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">mobile allowlist</text>
  <text x="735" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">默认拒绝 · 约 300 方法</text>

  <path d="M 735,186 L 735,218" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 735,276 L 735,308" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 640,338 L 582,338" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
