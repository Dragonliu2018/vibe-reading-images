<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="600" fill="#0b0d14"/>

  <!-- 三方拓扑 -->
  <rect x="60" y="40" width="220" height="70" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="170" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">Renderer</text>
  <text x="170" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">xterm.js 渲染</text>

  <rect x="330" y="40" width="220" height="70" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="440" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">Electron main</text>
  <text x="440" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">DaemonPtyAdapter（IPtyProvider）</text>

  <rect x="600" y="40" width="220" height="70" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="710" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f9ca24">orcad 守护进程</text>
  <text x="710" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">TerminalHost · sessions Map</text>
  <text x="710" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">node-pty + HeadlessEmulator</text>

  <path d="M 280,60 L 328,60" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="304" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa5c5">pty:data</text>
  <path d="M 550,75 L 598,75" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="574" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa5c5">双 socket</text>
  <path d="M 330,95 L 282,95" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="306" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa5c5">spawn 请求</text>

  <!-- cold restore 三段式 -->
  <text x="60" y="170" font-family="system-ui, sans-serif" font-size="14" fill="#4ecdc4">冷恢复三段式（scrollback 跨重启）</text>

  <rect x="60" y="190" width="220" height="80" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="170" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">① 写检查点</text>
  <text x="170" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">markSessionDirty → 5s 脏检查</text>
  <text x="170" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">SerializeAddon → checkpoint.json</text>

  <rect x="330" y="190" width="220" height="80" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="440" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">② 重放</text>
  <text x="440" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">unclean 元数据检测</text>
  <text x="440" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">新 HeadlessEmulator 限速重放</text>

  <rect x="600" y="190" width="220" height="80" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="710" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e6ebf5">③ 送回</text>
  <text x="710" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">ColdRestorePayloadCache（16MB）</text>
  <text x="710" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">spawn 结果 → renderer 重放</text>

  <path d="M 280,230 L 328,230" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 550,230 L 598,230" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 收养机制 -->
  <text x="60" y="330" font-family="system-ui, sans-serif" font-size="14" fill="#4ecdc4">收养（adoption）机制</text>

  <rect x="60" y="350" width="340" height="70" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="230" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">main 启动：probeDaemonSocket()</text>
  <text x="230" y="398" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">socket 能 accept = 旧 daemon 存活 → 直接收养</text>

  <rect x="460" y="350" width="360" height="70" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="640" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">换代安全</text>
  <text x="640" y="398" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">PID 记录 + launch nonce · .swap/.hold 原子 rename</text>

  <path d="M 400,385 L 458,385" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 输出管道 -->
  <text x="60" y="490" font-family="system-ui, sans-serif" font-size="14" fill="#4ecdc4">输出管道</text>
  <rect x="60" y="510" width="760" height="60" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="440" y="536" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6ebf5">PTY 输出 → HeadlessEmulator.writeSync（OSC 7 cwd / title / agent 状态）</text>
  <text x="440" y="556" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c5">→ stream-data-batcher → NDJSON 事件 → DaemonPtyAdapter → markSessionDirty + dataListeners → IPC → xterm</text>
</svg>
