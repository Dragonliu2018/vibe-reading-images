<rect x="260" y="582" width="340" height="36" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
<text x="430" y="605" text-anchor="middle" fill="#e8eaf6" font-size="13">⑨ drain_the_queue → rustc×N → Compilation</text>
