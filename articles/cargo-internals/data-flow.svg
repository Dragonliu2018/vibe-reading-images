<text x="612" y="378" fill="#f9ca24" font-size="11">Vec&lt;Unit&gt;</text>

<rect x="260" y="384" width="340" height="46" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="430" y="412" text-anchor="middle" fill="#e8eaf6" font-size="13">⑥ build_unit_dependencies → UnitGraph</text>
<line x1="430" y1="430" x2="430" y2="450" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
