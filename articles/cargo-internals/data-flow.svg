<svg xmlns="http://www.w3.org/2000/svg" width="860" height="707" viewBox="0 0 860 707" font-family="system-ui, sans-serif">
<rect width="860" height="707" fill="#0b0d14"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
  </marker>
</defs>
<text x="430" y="30" text-anchor="middle" fill="#e8eaf6" font-size="17" font-weight="700">cargo build 端到端数据流</text>

<!-- ① -->
<rect x="260" y="54" width="340" height="46" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="430" y="82" text-anchor="middle" fill="#e8eaf6" font-size="13">① Cargo.toml 清单文件</text>
<line x1="430" y1="100" x2="430" y2="126" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="612" y="118" fill="#f9ca24" font-size="11">TomlManifest</text>

<!-- ② -->
<rect x="260" y="128" width="340" height="46" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="430" y="156" text-anchor="middle" fill="#e8eaf6" font-size="13">② Workspace::new() 装配 packages</text>
<line x1="430" y1="174" x2="430" y2="200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="612" y="192" fill="#f9ca24" font-size="11">Workspace</text>

<!-- ③ -->
<rect x="260" y="202" width="340" height="46" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="430" y="220" text-anchor="middle" fill="#e8eaf6" font-size="13">③ resolve_ws_with_opts()</text>
<text x="430" y="238" text-anchor="middle" fill="#9aa0c0" font-size="11">sources.query + resolver::resolve() DFS 回溯</text>
<line x1="430" y1="248" x2="430" y2="274" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="612" y="266" fill="#f9ca24" font-size="11">WorkspaceResolve</text>

<!-- ④ -->
<rect x="260" y="276" width="340" height="46" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="430" y="304" text-anchor="middle" fill="#e8eaf6" font-size="13">④ Cargo.lock + PackageSet</text>
<line x1="430" y1="322" x2="430" y2="348" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="612" y="340" fill="#f9ca24" font-size="11">Resolve+PackageSet</text>

<!-- ⑤ -->
<rect x="260" y="350" width="340" height="46" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="430" y="378" text-anchor="middle" fill="#e8eaf6" font-size="13">⑤ UnitGenerator 生成 root Units</text>
<line x1="430" y1="396" x2="430" y2="422" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="612" y="414" fill="#f9ca24" font-size="11">Vec&lt;Unit&gt;</text>

<!-- ⑥ -->
<rect x="260" y="424" width="340" height="46" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="430" y="452" text-anchor="middle" fill="#e8eaf6" font-size="13">⑥ build_unit_dependencies → UnitGraph</text>
<line x1="430" y1="470" x2="430" y2="496" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="612" y="488" fill="#f9ca24" font-size="11">UnitGraph</text>

<!-- ⑦ -->
<rect x="260" y="498" width="340" height="46" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="430" y="526" text-anchor="middle" fill="#e8eaf6" font-size="13">⑦ BuildContext 前端 (create_bcx)</text>
<line x1="430" y1="544" x2="430" y2="570" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="612" y="562" fill="#f9ca24" font-size="11">BuildContext</text>

<!-- ⑧ -->
<rect x="260" y="572" width="340" height="46" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="430" y="590" text-anchor="middle" fill="#e8eaf6" font-size="13">⑧ BuildRunner + JobQueue</text>
<text x="430" y="608" text-anchor="middle" fill="#9aa0c0" font-size="11">fingerprint 判定 Dirty/Fresh</text>
<line x1="430" y1="618" x2="430" y2="644" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="612" y="636" fill="#f9ca24" font-size="11">Dirty/Fresh</text>

<!-- ⑨ -->
<rect x="260" y="646" width="340" height="36" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
<text x="430" y="669" text-anchor="middle" fill="#e8eaf6" font-size="13">⑨ drain_the_queue → rustc×N → Compilation</text>
</svg>
