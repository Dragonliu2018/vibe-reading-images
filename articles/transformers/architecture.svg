<svg xmlns="http://www.w3.org/2000/svg" width="820" height="524" viewBox="0 0 820 524" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="524" fill="#0b0d14"/>

  <!-- Layer 1: Interface (青) -->
  <rect x="20" y="24" width="780" height="80" rx="10" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <rect x="20" y="24" width="8" height="80" rx="4" fill="#4ecdc4"/>
  <text x="40" y="52" fill="#4ecdc4" font-size="15" font-weight="600">接口层</text>
  <text x="40" y="72" fill="#8a93b8" font-size="11">用户 API · 懒加载工厂</text>
  <g font-size="13" fill="#e6e8f0" text-anchor="middle">
    <rect x="180" y="42" width="120" height="44" rx="6" fill="#1a1d2e" stroke="#4ecdc4" stroke-width="1"/><text x="240" y="69">pipeline()</text>
    <rect x="316" y="42" width="116" height="44" rx="6" fill="#1a1d2e" stroke="#4ecdc4" stroke-width="1"/><text x="374" y="69">AutoConfig</text>
    <rect x="448" y="42" width="116" height="44" rx="6" fill="#1a1d2e" stroke="#4ecdc4" stroke-width="1"/><text x="506" y="69">AutoModel</text>
    <rect x="580" y="42" width="120" height="44" rx="6" fill="#1a1d2e" stroke="#4ecdc4" stroke-width="1"/><text x="640" y="69">AutoTokenizer</text>
    <rect x="712" y="42" width="84" height="44" rx="6" fill="#1a1d2e" stroke="#4ecdc4" stroke-width="1"/><text x="754" y="69">AutoProcessor</text>
  </g>

  <!-- arrow 1->2 -->
  <path d="M410 112 L410 128" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Layer 2: Task / Training / Generation (蓝) -->
  <rect x="20" y="128" width="780" height="80" rx="10" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <rect x="20" y="128" width="8" height="80" rx="4" fill="#6c8ef5"/>
  <text x="40" y="156" fill="#6c8ef5" font-size="15" font-weight="600">编排层</text>
  <text x="40" y="176" fill="#8a93b8" font-size="11">训练 · 推理 · 生成</text>
  <g font-size="13" fill="#e6e8f0" text-anchor="middle">
    <rect x="220" y="146" width="160" height="44" rx="6" fill="#1a1d2e" stroke="#6c8ef5" stroke-width="1"/><text x="300" y="173">Pipelines</text>
    <rect x="396" y="146" width="160" height="44" rx="6" fill="#1a1d2e" stroke="#6c8ef5" stroke-width="1"/><text x="476" y="173">Trainer</text>
    <rect x="572" y="146" width="200" height="44" rx="6" fill="#1a1d2e" stroke="#6c8ef5" stroke-width="1"/><text x="672" y="173">Generation</text>
  </g>

  <!-- arrow 2->3 -->
  <path d="M410 216 L410 232" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Layer 3: Model Core (黄) -->
  <rect x="20" y="232" width="780" height="80" rx="10" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <rect x="20" y="232" width="8" height="80" rx="4" fill="#f9ca24"/>
  <text x="40" y="260" fill="#f9ca24" font-size="15" font-weight="600">模型核心</text>
  <text x="40" y="280" fill="#8a93b8" font-size="11">生命周期 · 权重加载</text>
  <g font-size="13" fill="#e6e8f0" text-anchor="middle">
    <rect x="170" y="250" width="160" height="44" rx="6" fill="#1a1d2e" stroke="#f9ca24" stroke-width="1"/><text x="250" y="277">PreTrainedModel</text>
    <rect x="346" y="250" width="150" height="44" rx="6" fill="#1a1d2e" stroke="#f9ca24" stroke-width="1"/><text x="421" y="277">PretrainedConfig</text>
    <rect x="512" y="250" width="150" height="44" rx="6" fill="#1a1d2e" stroke="#f9ca24" stroke-width="1"/><text x="587" y="277">WeightConverter</text>
    <rect x="678" y="250" width="120" height="44" rx="6" fill="#1a1d2e" stroke="#f9ca24" stroke-width="1"/><text x="738" y="277">KV Cache</text>
  </g>

  <!-- arrow 3->4 -->
  <path d="M410 320 L410 336" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Layer 4: Modality & Primitives (粉) -->
  <rect x="20" y="336" width="780" height="80" rx="10" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <rect x="20" y="336" width="8" height="80" rx="4" fill="#ff6b9d"/>
  <text x="40" y="364" fill="#ff6b9d" font-size="15" font-weight="600">模态与原语</text>
  <text x="40" y="384" fill="#8a93b8" font-size="11">预处理 · transformer 构建块</text>
  <g font-size="13" fill="#e6e8f0" text-anchor="middle">
    <rect x="160" y="354" width="120" height="44" rx="6" fill="#1a1d2e" stroke="#ff6b9d" stroke-width="1"/><text x="220" y="381">Tokenizer</text>
    <rect x="296" y="354" width="140" height="44" rx="6" fill="#1a1d2e" stroke="#ff6b9d" stroke-width="1"/><text x="366" y="381">ProcessorMixin</text>
    <rect x="452" y="354" width="150" height="44" rx="6" fill="#1a1d2e" stroke="#ff6b9d" stroke-width="1"/><text x="527" y="381">RoPE / Masking</text>
    <rect x="618" y="354" width="160" height="44" rx="6" fill="#1a1d2e" stroke="#ff6b9d" stroke-width="1"/><text x="698" y="381">Activations / Layers</text>
  </g>

  <!-- arrow 4->5 -->
  <path d="M410 424 L410 440" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Layer 5: Acceleration & Registry (紫) -->
  <rect x="20" y="440" width="780" height="64" rx="10" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <rect x="20" y="440" width="8" height="64" rx="4" fill="#b388ff"/>
  <text x="40" y="466" fill="#b388ff" font-size="15" font-weight="600">加速与注册</text>
  <text x="40" y="486" fill="#8a93b8" font-size="11">量化 · 分布式 · 模型注册表</text>
  <g font-size="13" fill="#e6e8f0" text-anchor="middle">
    <rect x="220" y="458" width="120" height="34" rx="6" fill="#1a1d2e" stroke="#b388ff" stroke-width="1"/><text x="280" y="480">Quantizers</text>
    <rect x="356" y="458" width="120" height="34" rx="6" fill="#1a1d2e" stroke="#b388ff" stroke-width="1"/><text x="416" y="480">Distributed</text>
    <rect x="492" y="458" width="120" height="34" rx="6" fill="#1a1d2e" stroke="#b388ff" stroke-width="1"/><text x="552" y="480">Auto Factory</text>
    <rect x="628" y="458" width="150" height="34" rx="6" fill="#1a1d2e" stroke="#b388ff" stroke-width="1"/><text x="703" y="480">models/ (2646)</text>
  </g>
</svg>
