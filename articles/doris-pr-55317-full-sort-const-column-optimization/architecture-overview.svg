<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
  </defs>
  <rect width="860" height="340" fill="#0b0d14"/>
  <text x="430" y="28" text-anchor="middle" fill="#e6e6e6" font-size="16" font-weight="600">FullSorter 架构与改动位置</text>

  <!-- 上游 Block -->
  <rect x="30" y="130" width="120" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="90" y="158" text-anchor="middle" fill="#e6e6e6" font-size="13">上游 Block</text>
  <text x="90" y="176" text-anchor="middle" fill="#999" font-size="11">（含 ColumnConst）</text>

  <!-- FullSorter 大框（虚线） -->
  <rect x="185" y="60" width="490" height="200" rx="8" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="430" y="78" text-anchor="middle" fill="#999" font-size="12">FullSorter</text>

  <!-- 累积阶段（改动一 黄） -->
  <rect x="205" y="92" width="450" height="44" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.8"/>
  <text x="430" y="113" text-anchor="middle" fill="#e6e6e6" font-size="13">累积阶段：append_block</text>
  <text x="430" y="130" text-anchor="middle" fill="#f9ca24" font-size="11">改动一：跳过 ColumnConst 物化 → insert_many_from</text>

  <!-- 排序 -->
  <rect x="205" y="148" width="450" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="430" y="173" text-anchor="middle" fill="#e6e6e6" font-size="13">排序（sort）</text>

  <!-- 归并阶段（改动二 绿） -->
  <rect x="205" y="200" width="450" height="48" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.8"/>
  <text x="430" y="221" text-anchor="middle" fill="#e6e6e6" font-size="13">归并阶段：_merge_sort_read_impl + MergeSortCursorImpl</text>
  <text x="430" y="239" text-anchor="middle" fill="#4ecdc4" font-size="11">改动二：reset() 缓存 columns 裸指针，消除逐行 get_columns()</text>

  <!-- 结果 Block -->
  <rect x="710" y="130" width="120" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="770" y="158" text-anchor="middle" fill="#e6e6e6" font-size="13">结果 Block</text>
  <text x="770" y="176" text-anchor="middle" fill="#999" font-size="11">（排序后）</text>

  <!-- 箭头：上游 → 累积 -->
  <line x1="150" y1="160" x2="203" y2="114" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr3)"/>
  <!-- 累积 → 排序 -->
  <line x1="430" y1="136" x2="430" y2="146" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr3)"/>
  <!-- 排序 → 归并 -->
  <line x1="430" y1="188" x2="430" y2="198" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr3)"/>
  <!-- 归并 → 结果 -->
  <line x1="655" y1="220" x2="708" y2="160" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- 图例 -->
  <rect x="205" y="278" width="14" height="14" rx="3" fill="#13162a" stroke="#f9ca24" stroke-width="1.8"/>
  <text x="227" y="290" fill="#999" font-size="11">改动一（累积阶段）</text>
  <rect x="360" y="278" width="14" height="14" rx="3" fill="#13162a" stroke="#4ecdc4" stroke-width="1.8"/>
  <text x="382" y="290" fill="#999" font-size="11">改动二（归并阶段）</text>
  <rect x="520" y="278" width="14" height="14" rx="3" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="542" y="290" fill="#999" font-size="11">未改动</text>
</svg>
