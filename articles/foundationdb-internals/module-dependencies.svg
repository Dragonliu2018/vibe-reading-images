<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow-md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
    <marker id="arrow-pp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b388ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="480" fill="#0b0d14"/>

  <text x="440" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">模块依赖关系</text>

  <!-- L1: fdbclient (客户端) -->
  <rect x="355" y="50" width="170" height="44" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
  <text x="440" y="70" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">fdbclient</text>
  <text x="440" y="86" text-anchor="middle" fill="#9aa3c4" font-size="10">事务 API · 定位缓存</text>

  <!-- L2: fdbserver data path (4 roles, horizontal) -->
  <g font-size="12" font-weight="600" fill="#e6e8f0">
    <rect x="80" y="130" width="150" height="50" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.4"/>
    <text x="155" y="151" text-anchor="middle">集群协调</text>
    <text x="155" y="167" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">CC · Recovery</text>
    <rect x="270" y="130" width="150" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="345" y="151" text-anchor="middle">事务系统</text>
    <text x="345" y="167" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">Proxy · Resolver</text>
    <rect x="460" y="130" width="150" height="50" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
    <text x="535" y="151" text-anchor="middle">事务日志</text>
    <text x="535" y="167" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">TLog · LogSystem</text>
    <rect x="650" y="130" width="150" height="50" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.4"/>
    <text x="725" y="151" text-anchor="middle">存储引擎</text>
    <text x="725" y="167" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">SS · Redwood</text>
  </g>

  <!-- DD (centered below data path) -->
  <rect x="365" y="226" width="150" height="44" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.4"/>
  <text x="440" y="246" text-anchor="middle" fill="#e6e8f0" font-size="12" font-weight="600">数据分布</text>
  <text x="440" y="262" text-anchor="middle" fill="#9aa3c4" font-size="10">DataDistributor</text>

  <!-- L3: foundation (flow + fdbrpc) -->
  <rect x="210" y="328" width="200" height="50" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
  <text x="310" y="348" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">flow</text>
  <text x="310" y="366" text-anchor="middle" fill="#9aa3c4" font-size="10">异步运行时</text>
  <rect x="470" y="328" width="200" height="50" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
  <text x="570" y="348" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">fdbrpc</text>
  <text x="570" y="366" text-anchor="middle" fill="#9aa3c4" font-size="10">RPC · 网络</text>

  <!-- sim+tools band (cross-cutting) -->
  <rect x="20" y="404" width="840" height="44" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="36" y="424" fill="#ff6b9d" font-size="12" font-weight="600">模拟测试</text>
  <text x="220" y="421" fill="#9aa3c4" font-size="11">Workloads + SimulatedCluster — 复用 flow/fdbrpc 模拟原语，跑同一份 fdbd 代码</text>
  <text x="220" y="437" fill="#7a86b3" font-size="10">运维工具：fdbcli · fdbmonitor · fdbbackup · fdbctl</text>

  <!-- arrows: fdbclient -> 事务系统 (commit) / 存储引擎 (read) -->
  <path d="M 400 94 L 350 130" stroke="#6c8ef5" stroke-width="1.6" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="348" y="116" text-anchor="end" fill="#9aa3c4" font-size="10">commit</text>
  <path d="M 480 94 L 710 130" stroke="#6c8ef5" stroke-width="1.6" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="600" y="116" fill="#9aa3c4" font-size="10">get/getRange</text>

  <!-- data path horizontal: CC -> 事务系统 -> 事务日志 -> 存储引擎 -->
  <path d="M 230 155 L 268 155" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-md)" fill="none"/>
  <text x="249" y="148" text-anchor="middle" fill="#9aa3c4" font-size="10">招募</text>
  <path d="M 420 155 L 458 155" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-md)" fill="none"/>
  <text x="439" y="148" text-anchor="middle" fill="#9aa3c4" font-size="10">push</text>
  <path d="M 610 155 L 648 155" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-md)" fill="none"/>
  <text x="629" y="148" text-anchor="middle" fill="#9aa3c4" font-size="10">peek/pop</text>

  <!-- CC -> DD (招募 SS) -->
  <path d="M 155 180 L 380 226" stroke="#b388ff" stroke-width="1.5" marker-end="url(#arrow-pp)" fill="none"/>
  <text x="230" y="208" fill="#9aa3c4" font-size="10">招募 SS</text>
  <!-- DD -> 存储引擎 (分片迁移) -->
  <path d="M 515 248 L 650 175" stroke="#b388ff" stroke-width="1.5" marker-end="url(#arrow-pp)" fill="none"/>
  <text x="610" y="220" text-anchor="end" fill="#9aa3c4" font-size="10">分片迁移</text>

  <!-- foundation dependency: DD -> flow, 存储引擎 -> fdbrpc -->
  <path d="M 400 270 L 330 328" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow-md)" fill="none"/>
  <text x="330" y="300" text-anchor="end" fill="#9aa3c4" font-size="10">依赖</text>
  <path d="M 720 180 L 580 328" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow-md)" fill="none"/>
  <text x="660" y="280" fill="#9aa3c4" font-size="10">依赖</text>
  <!-- fdbrpc -> flow (基于 Net2) -->
  <path d="M 470 353 L 412 353" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow-md)" fill="none"/>
  <text x="441" y="346" text-anchor="middle" fill="#9aa3c4" font-size="10">基于 Net2</text>
</svg>
