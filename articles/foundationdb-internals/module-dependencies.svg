<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow-md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrow-md2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="560" fill="#0b0d14"/>

  <text x="430" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">模块依赖关系</text>

  <!-- Foundation layer (bottom) -->
  <rect x="230" y="470" width="180" height="50" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
  <text x="320" y="490" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">flow</text>
  <text x="320" y="508" text-anchor="middle" fill="#9aa3c4" font-size="10">异步运行时</text>

  <rect x="450" y="470" width="180" height="50" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
  <text x="540" y="490" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">fdbrpc</text>
  <text x="540" y="508" text-anchor="middle" fill="#9aa3c4" font-size="10">RPC · 网络</text>

  <path d="M 540 470 L 540 440" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow-md)" fill="none"/>
  <text x="548" y="458" fill="#9aa3c4" font-size="10">基于 Net2</text>

  <!-- fdbclient -->
  <rect x="340" y="380" width="180" height="50" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
  <text x="430" y="400" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">fdbclient</text>
  <text x="430" y="418" text-anchor="middle" fill="#9aa3c4" font-size="10">事务 API · 定位缓存</text>

  <path d="M 430 380 L 430 520" stroke="#7a86b3" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-md)" fill="none"/>
  <path d="M 395 380 L 335 470" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#arrow-md)" fill="none"/>
  <path d="M 465 380 L 505 470" stroke="#7a86b3" stroke-width="1.2" marker-end="url(#arrow-md)" fill="none"/>

  <!-- fdbserver roles row -->
  <g font-size="12" font-weight="600" fill="#e6e8f0">
    <rect x="30" y="270" width="150" height="50" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.4"/>
    <text x="105" y="290" text-anchor="middle">集群协调</text>
    <text x="105" y="308" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">CC · Recovery</text>

    <rect x="200" y="270" width="150" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="275" y="290" text-anchor="middle">事务系统</text>
    <text x="275" y="308" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">Proxy · Resolver</text>

    <rect x="370" y="270" width="150" height="50" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
    <text x="445" y="290" text-anchor="middle">事务日志</text>
    <text x="445" y="308" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">TLog · LogSystem</text>

    <rect x="540" y="270" width="150" height="50" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.4"/>
    <text x="615" y="290" text-anchor="middle">存储引擎</text>
    <text x="615" y="308" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">SS · Redwood</text>

    <rect x="710" y="270" width="130" height="50" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.4"/>
    <text x="775" y="290" text-anchor="middle">数据分布</text>
    <text x="775" y="308" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">DataDistributor</text>
  </g>

  <!-- client -> commit proxy -->
  <path d="M 410 380 L 275 320" stroke="#6c8ef5" stroke-width="1.4" marker-end="url(#arrow-md2)" fill="none"/>
  <text x="330" y="350" fill="#9aa3c4" font-size="10">commit/getReadVersion</text>

  <!-- client -> storage (reads) -->
  <path d="M 460 380 L 615 320" stroke="#6c8ef5" stroke-width="1.4" marker-end="url(#arrow-md2)" fill="none"/>
  <text x="540" y="350" fill="#9aa3c4" font-size="10">get/getRange（读）</text>

  <!-- fdbserver -> fdbrpc (all roles depend) -->
  <path d="M 105 320 L 105 400 L 490 400 L 490 470" stroke="#7a86b3" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <!-- intra-fdbserver dependencies -->
  <path d="M 180 295 L 198 295" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow-md)" fill="none"/>
  <text x="150" y="262" text-anchor="middle" fill="#9aa3c4" font-size="10">招募</text>

  <path d="M 350 295 L 368 295" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow-md)" fill="none"/>
  <text x="359" y="262" text-anchor="middle" fill="#9aa3c4" font-size="10">push</text>

  <path d="M 520 295 L 538 295" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow-md)" fill="none"/>
  <text x="529" y="262" text-anchor="middle" fill="#9aa3c4" font-size="10">peek/pop</text>

  <path d="M 690 295 L 708 295" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow-md)" fill="none"/>
  <text x="699" y="262" text-anchor="middle" fill="#9aa3c4" font-size="10">分片迁移</text>

  <!-- DD -> cluster coord (recruit SS) -->
  <path d="M 775 320 L 775 360 L 105 360 L 105 320" stroke="#7a86b3" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <text x="430" y="356" text-anchor="middle" fill="#9aa3c4" font-size="10">招募 storage server</text>

  <!-- Top: tools + simulation -->
  <rect x="30" y="60" width="800" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="46" y="86" fill="#ff6b9d" font-size="12" font-weight="600">模拟测试</text>
  <text x="180" y="86" fill="#9aa3c4" font-size="11">Workloads + SimulatedCluster — 复用 flow/fdbrpc 模拟原语，跑同一份 fdbd 代码</text>

  <rect x="30" y="120" width="800" height="40" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
  <text x="46" y="145" fill="#7a86b3" font-size="12" font-weight="600">运维工具</text>
  <text x="180" y="145" fill="#9aa3c4" font-size="11">fdbcli · fdbmonitor · fdbbackup · fdbctl</text>

  <path d="M 430 160 L 430 270" stroke="#7a86b3" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <text x="438" y="220" fill="#9aa3c4" font-size="10">驱动/管理</text>
</svg>
