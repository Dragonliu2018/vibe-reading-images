<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow-fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7bed9f"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="500" fill="#0b0d14"/>

  <text x="430" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">事务提交数据流（Commit Pipeline）</text>

  <!-- column header boxes (6 actors), box w=100, centers 80/220/360/500/640/780 -->
  <g font-size="12" font-weight="600" fill="#e6e8f0">
    <rect x="30" y="46" width="100" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
    <text x="80" y="64" text-anchor="middle">Client</text>
    <text x="80" y="78" text-anchor="middle" fill="#9aa3c4" font-size="9" font-weight="400">NativeAPI</text>
    <rect x="170" y="46" width="100" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="220" y="64" text-anchor="middle">CommitProxy</text>
    <text x="220" y="78" text-anchor="middle" fill="#9aa3c4" font-size="9" font-weight="400">commitBatch</text>
    <rect x="310" y="46" width="100" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="360" y="64" text-anchor="middle">Sequencer</text>
    <text x="360" y="78" text-anchor="middle" fill="#9aa3c4" font-size="9" font-weight="400">getVersion</text>
    <rect x="450" y="46" width="100" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="500" y="64" text-anchor="middle">Resolver</text>
    <text x="500" y="78" text-anchor="middle" fill="#9aa3c4" font-size="9" font-weight="400">ConflictSet</text>
    <rect x="590" y="46" width="100" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
    <text x="640" y="64" text-anchor="middle">TLog</text>
    <text x="640" y="78" text-anchor="middle" fill="#9aa3c4" font-size="9" font-weight="400">fsync</text>
    <rect x="730" y="46" width="100" height="40" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.4"/>
    <text x="780" y="64" text-anchor="middle">StorageServer</text>
    <text x="780" y="78" text-anchor="middle" fill="#9aa3c4" font-size="9" font-weight="400">apply MVCC</text>
  </g>

  <!-- vertical lifelines (subtle) -->
  <g stroke="#3a3f5c" stroke-width="0.8" stroke-dasharray="2 4">
    <line x1="80" y1="86" x2="80" y2="440"/>
    <line x1="220" y1="86" x2="220" y2="440"/>
    <line x1="360" y1="86" x2="360" y2="440"/>
    <line x1="500" y1="86" x2="500" y2="440"/>
    <line x1="640" y1="86" x2="640" y2="440"/>
    <line x1="780" y1="86" x2="780" y2="440"/>
  </g>

  <!-- Step 1: Client -> CP  commit (forward blue) -->
  <path d="M 130 110 L 168 110" stroke="#6c8ef5" stroke-width="1.8" marker-end="url(#arrow-fwd)" fill="none"/>
  <text x="149" y="103" text-anchor="middle" fill="#6c8ef5" font-size="11" font-weight="600">① commit</text>

  <!-- Step 2: CP -> Seq  getCommitVersion -->
  <path d="M 270 145 L 308 145" stroke="#6c8ef5" stroke-width="1.8" marker-end="url(#arrow-fwd)" fill="none"/>
  <text x="289" y="138" text-anchor="middle" fill="#6c8ef5" font-size="11" font-weight="600">② getCommitVersion</text>

  <!-- Step 3: Seq -> CP  version (return green, leftward) -->
  <path d="M 310 180 L 272 180" stroke="#7bed9f" stroke-width="1.8" marker-end="url(#arrow-ret)" fill="none"/>
  <text x="362" y="173" fill="#7bed9f" font-size="11" font-weight="600">③ commitVersion + prevVersion</text>

  <!-- Step 4: CP -> Resolver  resolveBatch (forward, spans Seq column empty space) -->
  <path d="M 270 215 L 448 215" stroke="#6c8ef5" stroke-width="1.8" marker-end="url(#arrow-fwd)" fill="none"/>
  <text x="359" y="208" text-anchor="middle" fill="#6c8ef5" font-size="11" font-weight="600">④ resolveBatch</text>

  <!-- Step 5: Resolver -> CP  committed[] (return, leftward) -->
  <path d="M 450 250 L 272 250" stroke="#7bed9f" stroke-width="1.8" marker-end="url(#arrow-ret)" fill="none"/>
  <text x="500" y="243" fill="#7bed9f" font-size="11" font-weight="600">⑤ committed[] (OCC)</text>

  <!-- Step 6: CP -> TLog  push (forward, spans Seq+Resolver) -->
  <path d="M 270 285 L 588 285" stroke="#6c8ef5" stroke-width="1.8" marker-end="url(#arrow-fwd)" fill="none"/>
  <text x="429" y="278" text-anchor="middle" fill="#6c8ef5" font-size="11" font-weight="600">⑥ push (tags + mutations)</text>

  <!-- Step 7: TLog -> CP  persisted (return) -->
  <path d="M 590 320 L 272 320" stroke="#7bed9f" stroke-width="1.8" marker-end="url(#arrow-ret)" fill="none"/>
  <text x="640" y="313" fill="#7bed9f" font-size="11" font-weight="600">⑦ persisted (quorum)</text>

  <!-- Step 8: CP -> Client  reply (return, leftward) -->
  <path d="M 170 355 L 132 355" stroke="#7bed9f" stroke-width="1.8" marker-end="url(#arrow-ret)" fill="none"/>
  <text x="220" y="348" fill="#7bed9f" font-size="11" font-weight="600">⑧ reply (Committed/Conflict)</text>

  <!-- Step 9: TLog -> SS  peek (async dashed) -->
  <path d="M 690 393 L 728 393" stroke="#7a86b3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-async)" fill="none"/>
  <text x="709" y="386" text-anchor="middle" fill="#7a86b3" font-size="11" font-weight="600">⑨ peek</text>

  <!-- Step 10: SS -> TLog  pop (async dashed, leftward) -->
  <path d="M 730 428 L 692 428" stroke="#7a86b3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-async)" fill="none"/>
  <text x="780" y="421" fill="#7a86b3" font-size="11" font-weight="600">⑩ pop</text>

  <!-- Legend -->
  <rect x="30" y="455" width="800" height="32" rx="6" fill="none" stroke="#3a3f5c" stroke-width="1"/>
  <text x="44" y="475" fill="#9aa3c4" font-size="10" font-weight="600">图例</text>
  <line x1="100" y1="471" x2="135" y2="471" stroke="#6c8ef5" stroke-width="1.8" marker-end="url(#arrow-fwd)"/>
  <text x="143" y="475" fill="#9aa3c4" font-size="10">请求/数据前向</text>
  <line x1="245" y1="471" x2="280" y2="471" stroke="#7bed9f" stroke-width="1.8" marker-end="url(#arrow-ret)"/>
  <text x="288" y="475" fill="#9aa3c4" font-size="10">回复</text>
  <line x1="345" y1="471" x2="380" y2="471" stroke="#7a86b3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-async)"/>
  <text x="388" y="475" fill="#9aa3c4" font-size="10">异步（SS 消费）</text>
  <text x="820" y="475" text-anchor="end" fill="#7a86b3" font-size="10">时间自上而下 ↓</text>
</svg>
