<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="400" fill="#0b0d14"/>

  <text x="430" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">Recovery 状态机（ClusterRecovery 9 阶段）</text>

  <!-- Row 1: phases 1 -> 2 -> 3 (L to R) -->
  <g font-size="12" font-weight="600" fill="#e6e8f0">
    <rect x="30" y="50" width="210" height="58" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="135" y="74" text-anchor="middle">① READING_CSTATE</text>
    <text x="135" y="94" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">读协调器状态</text>

    <rect x="280" y="50" width="210" height="58" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="385" y="74" text-anchor="middle">② LOCKING_CSTATE</text>
    <text x="385" y="94" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">锁 cstate · 锁旧 TLog</text>

    <rect x="530" y="50" width="210" height="58" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="635" y="74" text-anchor="middle">③ RECRUITING</text>
    <text x="635" y="94" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">招募角色 · 算 recoveryVersion</text>
  </g>
  <path d="M 240 79 L 278 79" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-s)" fill="none"/>
  <path d="M 490 79 L 528 79" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-s)" fill="none"/>

  <!-- 3 -> 4 (down on right) -->
  <path d="M 635 108 L 635 168" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-s)" fill="none"/>

  <!-- Row 2: phases 4 <- 5 <- 6  (R to L visually, arrows go 4->5->6 leftward) -->
  <g font-size="12" font-weight="600" fill="#e6e8f0">
    <rect x="530" y="170" width="210" height="58" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="635" y="194" text-anchor="middle">④ RECOVERY_TRANSACTION</text>
    <text x="635" y="214" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">恢复事务 · 通知 SS 回滚</text>

    <rect x="280" y="170" width="210" height="58" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="385" y="194" text-anchor="middle">⑤ WRITING_CSTATE</text>
    <text x="385" y="214" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">写新 cstate 到协调器</text>

    <rect x="30" y="170" width="210" height="58" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="135" y="194" text-anchor="middle">⑥ ACCEPTING_COMMITS</text>
    <text x="135" y="214" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">开始接受新提交</text>
  </g>
  <path d="M 530 199 L 492 199" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-s)" fill="none"/>
  <path d="M 280 199 L 242 199" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-s)" fill="none"/>

  <!-- 6 -> 7 (down on left) -->
  <path d="M 135 228 L 135 288" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-s)" fill="none"/>

  <!-- Row 3: phases 7 -> 8 -> 9 (L to R) -->
  <g font-size="12" font-weight="600" fill="#e6e8f0">
    <rect x="30" y="290" width="210" height="58" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="135" y="314" text-anchor="middle">⑦ ALL_LOGS_RECRUITED</text>
    <text x="135" y="334" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">新 TLog 全部招募</text>

    <rect x="280" y="290" width="210" height="58" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
    <text x="385" y="314" text-anchor="middle">⑧ STORAGE_RECOVERED</text>
    <text x="385" y="334" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">旧 generation TLog 清理完</text>

    <rect x="530" y="290" width="210" height="58" rx="6" fill="#13162a" stroke="#7bed9f" stroke-width="1.6"/>
    <text x="635" y="314" text-anchor="middle">⑨ FULLY_RECOVERED</text>
    <text x="635" y="334" text-anchor="middle" fill="#9aa3c4" font-size="10" font-weight="400">完全恢复</text>
  </g>
  <path d="M 240 319 L 278 319" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-s)" fill="none"/>
  <path d="M 490 319 L 528 319" stroke="#7a86b3" stroke-width="1.6" marker-end="url(#arrow-s)" fill="none"/>

  <!-- Failure loop: from bottom-right back up to phase 1 -->
  <path d="M 740 319 L 800 319 L 800 362 L 10 362 L 10 79 L 28 79" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-fail)" fill="none"/>
  <text x="430" y="382" text-anchor="middle" fill="#ff6b9d" font-size="11" font-weight="600">故障 / 角色失败 / "better master" → 新 generation 恢复（recoveryCount++）</text>
</svg>
