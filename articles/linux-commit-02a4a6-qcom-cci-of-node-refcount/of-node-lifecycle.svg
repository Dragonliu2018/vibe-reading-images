<svg xmlns="http://www.w3.org/2000/svg" width="820" height="474" viewBox="0 0 820 474" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <rect width="820" height="474" fill="#0b0d14"/>

  <!-- Title -->
  <text x="410" y="26" text-anchor="middle" fill="#e8ecf5" font-size="16" font-weight="600">Qualcomm CCI I2C adapter 的 of_node 引用生命周期</text>

  <!-- Column headers -->
  <rect x="30" y="40" width="350" height="32" rx="6" fill="#1a1014" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="205" y="61" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="600">改动前 · 有悬空引用（bug）</text>
  <rect x="460" y="40" width="350" height="32" rx="6" fill="#0f1c16" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="635" y="61" text-anchor="middle" fill="#7bed9f" font-size="13" font-weight="600">改动后 · 引用配平（已修复）</text>

  <!-- Row 1: probe loop (same both columns) -->
  <rect x="30" y="100" width="350" height="56" rx="6" fill="#13162a" stroke="#2e3354" stroke-width="1.5"/>
  <text x="205" y="124" text-anchor="middle" fill="#e8ecf5" font-size="14">① 探测循环 for_each_available_child_of_node</text>
  <text x="205" y="144" text-anchor="middle" fill="#9aa3c7" font-size="12">循环对 child 持有 +1 引用</text>
  <rect x="460" y="100" width="350" height="56" rx="6" fill="#13162a" stroke="#2e3354" stroke-width="1.5"/>
  <text x="635" y="124" text-anchor="middle" fill="#e8ecf5" font-size="14">① 探测循环 for_each_available_child_of_node</text>
  <text x="635" y="144" text-anchor="middle" fill="#9aa3c7" font-size="12">循环对 child 持有 +1 引用</text>

  <!-- Row 2: store of_node (KEY change) -->
  <rect x="30" y="188" width="350" height="56" rx="6" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="205" y="212" text-anchor="middle" fill="#e8ecf5" font-size="14">② 存储 of_node（adap.dev.of_node = child）</text>
  <text x="205" y="232" text-anchor="middle" fill="#e74c3c" font-size="12">无 of_node_get → 未持有自己的引用</text>
  <rect x="460" y="188" width="350" height="56" rx="6" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="635" y="212" text-anchor="middle" fill="#e8ecf5" font-size="14">② 存储 of_node = of_node_get(child)</text>
  <text x="635" y="232" text-anchor="middle" fill="#7bed9f" font-size="12">取 +1 引用，adapter 自己持有</text>

  <!-- Row 3: loop ends + i2c_add_adapter reads -->
  <rect x="30" y="276" width="350" height="56" rx="6" fill="#13162a" stroke="#2e3354" stroke-width="1.5"/>
  <text x="205" y="300" text-anchor="middle" fill="#e8ecf5" font-size="14">③ 循环结束 + i2c_add_adapter() 读取</text>
  <text x="205" y="320" text-anchor="middle" fill="#e74c3c" font-size="12">loop 已 put → 指针悬空，潜在 use-after-free</text>
  <rect x="460" y="276" width="350" height="56" rx="6" fill="#13162a" stroke="#2e3354" stroke-width="1.5"/>
  <text x="635" y="300" text-anchor="middle" fill="#e8ecf5" font-size="14">③ 循环结束 + i2c_add_adapter() 读取</text>
  <text x="635" y="320" text-anchor="middle" fill="#7bed9f" font-size="12">loop put 后 adapter 仍持 +1，指针有效</text>

  <!-- Row 4: teardown (KEY change) -->
  <rect x="30" y="364" width="350" height="56" rx="6" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="205" y="388" text-anchor="middle" fill="#e8ecf5" font-size="14">④ 拆除 cci_remove / error_i2c</text>
  <text x="205" y="408" text-anchor="middle" fill="#e74c3c" font-size="12">仅 i2c_del_adapter，无 of_node_put</text>
  <rect x="460" y="364" width="350" height="56" rx="6" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="635" y="388" text-anchor="middle" fill="#e8ecf5" font-size="14">④ 拆除 = del_adapter + of_node_put</text>
  <text x="635" y="408" text-anchor="middle" fill="#7bed9f" font-size="12">−1 归零，引用配平</text>

  <!-- Vertical flow arrows (left column) -->
  <path d="M205,72 L205,100" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M205,156 L205,188" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M205,244 L205,276" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M205,332 L205,364" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Vertical flow arrows (right column) -->
  <path d="M635,72 L635,100" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M635,156 L635,188" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M635,244 L635,276" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M635,332 L635,364" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <circle cx="44" cy="450" r="5" fill="#e74c3c"/>
  <text x="56" y="454" fill="#9aa3c7" font-size="12">红 = 改动前的问题点（悬空 / 未配平）</text>
  <circle cx="430" cy="450" r="5" fill="#7bed9f"/>
  <text x="442" y="454" fill="#9aa3c7" font-size="12">绿 = 修复后的 get/put（引用配平）</text>
</svg>
