<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
  <rect width="820" height="420" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .phase { font-family: system-ui, sans-serif; font-size: 11px; fill: #5a6075; font-weight: 600; }
  </style>

  <!-- Input -->
  <rect x="280" y="20" width="260" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="40" text-anchor="middle" class="label" fill="#4ecdc4">输入：{nodes, edges, hyperedges}</text>
  <text x="410" y="56" text-anchor="middle" class="mod">AST + 语义抽取合并结果</text>

  <!-- Dedup -->
  <rect x="30" y="90" width="250" height="100" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="155" y="112" text-anchor="middle" class="label" fill="#ff6b9d">deduplicate_entities</text>
  <text x="155" y="128" text-anchor="middle" class="mod">dedup.py L388</text>
  <text x="155" y="148" text-anchor="middle" class="mod">Pass 0: Exact ID 碰撞排序</text>
  <text x="155" y="164" text-anchor="middle" class="mod">Pass 1: Exact norm 合并</text>
  <text x="155" y="180" text-anchor="middle" class="mod">Pass 2: MinHash + Jaro-Winkler</text>

  <!-- Build -->
  <rect x="310" y="90" width="200" height="100" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="410" y="112" text-anchor="middle" class="label" fill="#ff6b9d">build_from_json</text>
  <text x="410" y="128" text-anchor="middle" class="mod">build.py L741</text>
  <text x="410" y="148" text-anchor="middle" class="mod">nx.DiGraph() / nx.Graph()</text>
  <text x="410" y="164" text-anchor="middle" class="mod">phantom-edge guard</text>
  <text x="410" y="180" text-anchor="middle" class="mod">_LANG_FAMILY 防护</text>

  <!-- Tier -->
  <rect x="540" y="90" width="240" height="100" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="660" y="112" text-anchor="middle" class="label" fill="#6c8ef5">_is_ast_tier</text>
  <text x="660" y="128" text-anchor="middle" class="mod">build.py L43</text>
  <text x="660" y="148" text-anchor="middle" class="mod">_origin: "ast" vs "semantic"</text>
  <text x="660" y="164" text-anchor="middle" class="mod">source_location: L&lt;line&gt; vs null</text>
  <text x="660" y="180" text-anchor="middle" class="mod">semantic 覆盖 AST 同 ID</text>

  <!-- Cluster -->
  <rect x="30" y="220" width="250" height="80" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="155" y="242" text-anchor="middle" class="label" fill="#f9ca24">cluster</text>
  <text x="155" y="258" text-anchor="middle" class="mod">cluster.py L134</text>
  <text x="155" y="274" text-anchor="middle" class="mod">Leiden (graspologic) → Louvain</text>
  <text x="155" y="290" text-anchor="middle" class="mod">分裂 >25% 社区 + 低 cohesion</text>

  <!-- Analyze -->
  <rect x="310" y="220" width="200" height="80" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="242" text-anchor="middle" class="label" fill="#f9ca24">analyze</text>
  <text x="410" y="258" text-anchor="middle" class="mod">analyze.py</text>
  <text x="410" y="274" text-anchor="middle" class="mod">god_nodes() 最高连接度</text>
  <text x="410" y="290" text-anchor="middle" class="mod">surprising_connections()</text>

  <!-- Score -->
  <rect x="540" y="220" width="240" height="80" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="660" y="242" text-anchor="middle" class="label" fill="#f9ca24">score_all</text>
  <text x="660" y="258" text-anchor="middle" class="mod">cluster.py L268</text>
  <text x="660" y="274" text-anchor="middle" class="mod">cohesion score per community</text>
  <text x="660" y="290" text-anchor="middle" class="mod">社区内连边密度 / 期望密度</text>

  <!-- Output -->
  <rect x="280" y="340" width="260" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="360" text-anchor="middle" class="label" fill="#4ecdc4">输出：nx.Graph + communities</text>
  <text x="410" y="376" text-anchor="middle" class="mod">供 export.py to_json() 消费</text>

  <!-- Arrows -->
  <path d="M 410 64 L 410 90" class="arrow" marker-end="url(#ah)"/>
  <text x="420" y="80" class="mod">merged</text>

  <path d="M 280 140 L 310 140" class="arrow" marker-end="url(#ah)"/>
  <text x="295" y="133" text-anchor="middle" class="mod">deduped</text>
  <path d="M 510 140 L 540 140" class="arrow" marker-end="url(#ah)"/>

  <path d="M 155 190 L 155 220" class="arrow" marker-end="url(#ah)"/>
  <path d="M 410 190 L 410 220" class="arrow" marker-end="url(#ah)"/>
  <path d="M 660 190 L 660 220" class="arrow" marker-end="url(#ah)"/>

  <path d="M 410 300 L 410 340" class="arrow" marker-end="url(#ah)"/>
  <path d="M 155 300 L 155 320 L 410 340" class="arrow" marker-end="url(#ah)" opacity="0.6"/>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
