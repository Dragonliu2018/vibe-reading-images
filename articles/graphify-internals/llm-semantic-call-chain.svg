<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520">
  <rect width="820" height="520" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .retry { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #f9ca24; }
    .lane { font-family: system-ui, sans-serif; font-size: 11px; fill: #5a6075; font-weight: 600; }
  </style>

  <!-- Entry -->
  <rect x="280" y="20" width="260" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="40" text-anchor="middle" class="label" fill="#4ecdc4">cli.py: extract 命令</text>
  <text x="410" y="56" text-anchor="middle" class="mod">先 AST 抽取 → 检查 semantic cache</text>

  <!-- Cache check -->
  <rect x="280" y="90" width="260" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="110" text-anchor="middle" class="label" fill="#4ecdc4">check_semantic_cache</text>
  <text x="410" y="126" text-anchor="middle" class="mod">cache.py L1022 → (cached, uncached)</text>

  <!-- Parallel extract -->
  <rect x="30" y="170" width="760" height="80" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="188" class="lane">extract_corpus_parallel (llm.py L2227) — ThreadPool max_concurrency=4</text>

  <rect x="50" y="200" width="180" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="140" y="220" text-anchor="middle" class="label" fill="#f9ca24">_pack_chunks</text>
  <text x="140" y="234" text-anchor="middle" class="mod">按 token budget 分块</text>

  <rect x="260" y="200" width="180" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="350" y="220" text-anchor="middle" class="label" fill="#f9ca24">_extract_adaptive_retry</text>
  <text x="350" y="234" text-anchor="middle" class="mod">llm.py L2034 · 二分重试</text>

  <rect x="470" y="200" width="160" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="550" y="220" text-anchor="middle" class="label" fill="#f9ca24">extract_files_direct</text>
  <text x="550" y="234" text-anchor="middle" class="mod">llm.py L1727</text>

  <rect x="660" y="200" width="120" height="40" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="720" y="220" text-anchor="middle" class="label" fill="#6c8ef5">_call_*</text>
  <text x="720" y="234" text-anchor="middle" class="mod">provider 分派</text>

  <!-- Providers -->
  <rect x="50" y="290" width="100" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="100" y="308" text-anchor="middle" class="mod" fill="#6c8ef5">claude</text>
  <rect x="160" y="290" width="100" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="210" y="308" text-anchor="middle" class="mod" fill="#6c8ef5">claude-cli</text>
  <rect x="270" y="290" width="100" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="320" y="308" text-anchor="middle" class="mod" fill="#6c8ef5">bedrock</text>
  <rect x="380" y="290" width="100" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="430" y="308" text-anchor="middle" class="mod" fill="#6c8ef5">azure</text>
  <rect x="490" y="290" width="280" height="36" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="630" y="308" text-anchor="middle" class="mod" fill="#6c8ef5">openai_compat (openai/gemini/ollama/kimi/deepseek)</text>

  <!-- Parse + Cleanup -->
  <rect x="280" y="350" width="260" height="44" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="370" text-anchor="middle" class="label" fill="#f9ca24">_parse_llm_json + _bind_node_evidence</text>
  <text x="410" y="386" text-anchor="middle" class="mod">llm.py L979 · 验证 code 节点符号存在</text>

  <rect x="280" y="410" width="260" height="44" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="410" y="430" text-anchor="middle" class="label" fill="#ff6b9d">semantic_cleanup + _checkpoint_chunk</text>
  <text x="410" y="446" text-anchor="middle" class="mod">清洗 + 增量写 cache</text>

  <!-- Output -->
  <rect x="280" y="470" width="260" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="490" text-anchor="middle" class="mod" fill="#4ecdc4">→ semantic {nodes, edges, hyperedges} 合并到 AST 结果</text>

  <!-- Arrows -->
  <path d="M 410 64 L 410 90" class="arrow" marker-end="url(#ah)"/>
  <path d="M 410 134 L 410 170" class="arrow" marker-end="url(#ah)"/>
  <text x="420" y="155" class="dtype">uncached_paths</text>

  <path d="M 230 220 L 260 220" class="arrow" marker-end="url(#ah)"/>
  <path d="M 440 220 L 470 220" class="arrow" marker-end="url(#ah)"/>
  <path d="M 630 220 L 660 220" class="arrow" marker-end="url(#ah)"/>

  <path d="M 720 240 L 720 265 L 100 265 L 100 290" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <path d="M 720 240 L 720 265 L 630 265 L 630 290" class="arrow" marker-end="url(#ah)" opacity="0.5"/>

  <path d="M 410 326 L 410 350" class="arrow" marker-end="url(#ah)"/>
  <path d="M 410 394 L 410 410" class="arrow" marker-end="url(#ah)"/>
  <path d="M 410 454 L 410 470" class="arrow" marker-end="url(#ah)"/>

  <!-- Retry loop -->
  <path d="M 350 240 L 350 250 L 260 250 L 260 240" class="retry" marker-end="url(#ahp)"/>
  <text x="305" y="262" text-anchor="middle" class="dtype">截断→二分</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b9d"/>
    </marker>
  </defs>
</svg>
