<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620">
  <rect width="820" height="620" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #f9ca24; }
    .phase { font-family: system-ui, sans-serif; font-size: 12px; fill: #5a6075; font-weight: 600; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .parallel { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .lane { font-family: system-ui, sans-serif; font-size: 11px; fill: #5a6075; }
  </style>

  <!-- Phase 1 lane -->
  <rect x="10" y="20" width="800" height="350" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="20" y="40" class="phase">阶段一：extract — 扫描 + 抽取 + 构建 → graph.json</text>

  <!-- Step 1: Detect -->
  <rect x="30" y="60" width="170" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="115" y="80" text-anchor="middle" class="label" fill="#4ecdc4">detect</text>
  <text x="115" y="96" text-anchor="middle" class="mod">detect.py · classify_file()</text>

  <!-- Step 2: AST Extract -->
  <rect x="230" y="60" width="170" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="315" y="80" text-anchor="middle" class="label" fill="#f9ca24">AST 抽取</text>
  <text x="315" y="96" text-anchor="middle" class="mod">extract.py · ProcessPool</text>

  <!-- Step 3: Semantic Extract -->
  <rect x="430" y="60" width="170" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="515" y="80" text-anchor="middle" class="label" fill="#f9ca24">语义抽取</text>
  <text x="515" y="96" text-anchor="middle" class="mod">llm.py · ThreadPool</text>

  <!-- Step 4: Merge -->
  <rect x="630" y="60" width="170" height="48" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="715" y="80" text-anchor="middle" class="label" fill="#6c8ef5">合并</text>
  <text x="715" y="96" text-anchor="middle" class="mod">cli.py · merge dicts</text>

  <!-- Step 5: Build -->
  <rect x="30" y="150" width="170" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="115" y="170" text-anchor="middle" class="label" fill="#ff6b9d">build</text>
  <text x="115" y="186" text-anchor="middle" class="mod">build.py · nx.DiGraph</text>

  <!-- Step 6: Dedup -->
  <rect x="230" y="150" width="170" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="315" y="170" text-anchor="middle" class="label" fill="#ff6b9d">去重</text>
  <text x="315" y="186" text-anchor="middle" class="mod">dedup.py · MinHash+LSH</text>

  <!-- Step 7: Cluster -->
  <rect x="430" y="150" width="170" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="515" y="170" text-anchor="middle" class="label" fill="#ff6b9d">社区检测</text>
  <text x="515" y="186" text-anchor="middle" class="mod">cluster.py · Leiden</text>

  <!-- Step 8: Analyze -->
  <rect x="630" y="150" width="170" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="715" y="170" text-anchor="middle" class="label" fill="#ff6b9d">分析</text>
  <text x="715" y="186" text-anchor="middle" class="mod">analyze.py · god_nodes</text>

  <!-- Step 9: Export graph.json -->
  <rect x="230" y="250" width="360" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="270" text-anchor="middle" class="label" fill="#4ecdc4">导出 graph.json</text>
  <text x="410" y="286" text-anchor="middle" class="mod">export.py · to_json() · #479 shrink guard</text>

  <!-- Output 1 -->
  <rect x="230" y="320" width="360" height="40" rx="8" fill="#0b1f1a" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="410" y="345" text-anchor="middle" class="mod" fill="#4ecdc4">→ graphify-out/graph.json + .graphify_analysis.json</text>

  <!-- Arrows Phase 1: top row -->
  <path d="M 200 84 L 230 84" class="arrow" marker-end="url(#ah)"/>
  <text x="215" y="77" text-anchor="middle" class="dtype">code files</text>
  <path d="M 400 84 L 430 84" class="arrow" marker-end="url(#ah)"/>
  <text x="415" y="77" text-anchor="middle" class="dtype">doc files</text>
  <path d="M 600 84 L 630 84" class="arrow" marker-end="url(#ah)"/>
  <text x="615" y="77" text-anchor="middle" class="dtype">nodes</text>

  <!-- Arrows: top row → bottom row (merge → build) -->
  <path d="M 715 108 L 715 130 L 115 130 L 115 150" class="arrow" marker-end="url(#ah)"/>
  <text x="400" y="124" text-anchor="middle" class="dtype">merged {nodes, edges, hyperedges}</text>

  <!-- Arrows: bottom row -->
  <path d="M 200 174 L 230 174" class="arrow" marker-end="url(#ah)"/>
  <text x="215" y="167" text-anchor="middle" class="dtype">nx.Graph</text>
  <path d="M 400 174 L 430 174" class="arrow" marker-end="url(#ah)"/>
  <path d="M 600 174 L 630 174" class="arrow" marker-end="url(#ah)"/>
  <text x="615" y="167" text-anchor="middle" class="dtype">communities</text>

  <!-- Arrow: analyze → export -->
  <path d="M 715 198 L 715 224 L 410 224 L 410 250" class="arrow" marker-end="url(#ah)"/>
  <text x="560" y="219" text-anchor="middle" class="dtype">G + communities + gods</text>

  <!-- Arrow: export → output -->
  <path d="M 410 298 L 410 320" class="arrow" marker-end="url(#ah)"/>

  <!-- Phase 2 lane -->
  <rect x="10" y="380" width="800" height="220" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="20" y="400" class="phase">阶段二：cluster-only — 重新聚类 + 命名 + 报告 → graph.html + REPORT.md</text>

  <!-- Load graph.json -->
  <rect x="30" y="420" width="150" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="105" y="440" text-anchor="middle" class="label" fill="#4ecdc4">加载 graph.json</text>
  <text x="105" y="456" text-anchor="middle" class="mod">build_from_json()</text>

  <!-- Re-cluster + Label -->
  <rect x="210" y="420" width="170" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="295" y="440" text-anchor="middle" class="label" fill="#ff6b9d">重新聚类 + 命名</text>
  <text x="295" y="456" text-anchor="middle" class="mod">cluster() + label</text>

  <!-- Generate REPORT -->
  <rect x="410" y="420" width="170" height="48" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="495" y="440" text-anchor="middle" class="label" fill="#6c8ef5">生成报告</text>
  <text x="495" y="456" text-anchor="middle" class="mod">report.py · generate()</text>

  <!-- Generate HTML -->
  <rect x="610" y="420" width="180" height="48" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="700" y="440" text-anchor="middle" class="label" fill="#6c8ef5">生成 HTML</text>
  <text x="700" y="456" text-anchor="middle" class="mod">exporters/html.py · vis.js</text>

  <!-- Output 2 -->
  <rect x="210" y="510" width="580" height="40" rx="8" fill="#0b1f1a" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="500" y="535" text-anchor="middle" class="mod" fill="#4ecdc4">→ graphify-out/graph.html + GRAPH_REPORT.md (更新后的 graph.json)</text>

  <!-- Arrows Phase 2 -->
  <path d="M 180 444 L 210 444" class="arrow" marker-end="url(#ah)"/>
  <text x="195" y="437" text-anchor="middle" class="dtype">nx.Graph</text>
  <path d="M 380 444 L 410 444" class="arrow" marker-end="url(#ah)"/>
  <text x="395" y="437" text-anchor="middle" class="dtype">labeled</text>
  <path d="M 580 444 L 610 444" class="arrow" marker-end="url(#ah)"/>

  <!-- Arrow: phase 2 outputs -->
  <path d="M 495 468 L 495 510" class="arrow" marker-end="url(#ah)"/>
  <path d="M 700 468 L 700 490 L 500 510" class="arrow" marker-end="url(#ah)" opacity="0.6"/>

  <!-- Phase 1 → Phase 2 connector -->
  <path d="M 410 360 L 410 380 L 105 380 L 105 420" stroke="#4ecdc4" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#ahc)" opacity="0.7"/>
  <text x="250" y="375" class="mod" fill="#4ecdc4">graph.json 传递到阶段二</text>

  <!-- Parallel markers -->
  <text x="315" y="116" text-anchor="middle" class="mod" fill="#ff6b9d">↕ ProcessPool</text>
  <text x="515" y="116" text-anchor="middle" class="mod" fill="#ff6b9d">↕ ThreadPool (max 4)</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahc" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ecdc4"/>
    </marker>
  </defs>
</svg>
