<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480">
  <rect width="820" height="480" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .lane { font-family: system-ui, sans-serif; font-size: 11px; fill: #5a6075; font-weight: 600; }
  </style>

  <!-- AI Assistants -->
  <rect x="30" y="20" width="760" height="56" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="38" class="lane">15+ AI 助手平台</text>
  <rect x="50" y="46" width="80" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="90" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">Claude Code</text>
  <rect x="140" y="46" width="60" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="170" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">Cursor</text>
  <rect x="210" y="46" width="60" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="240" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">Codex</text>
  <rect x="280" y="46" width="70" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="315" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">Gemini CLI</text>
  <rect x="360" y="46" width="60" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="390" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">Copilot</text>
  <rect x="430" y="46" width="50" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="455" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">Aider</text>
  <rect x="490" y="46" width="60" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="520" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">Kilo Code</text>
  <rect x="560" y="46" width="50" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="585" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">Trae</text>
  <rect x="620" y="46" width="60" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="650" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">OpenCode</text>
  <rect x="690" y="46" width="80" height="24" rx="4" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="730" y="62" text-anchor="middle" class="mod" fill="#6c8ef5">+ 7 more</text>

  <!-- install.py -->
  <rect x="30" y="100" width="240" height="80" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="150" y="122" text-anchor="middle" class="label" fill="#6c8ef5">install.py</text>
  <text x="150" y="140" text-anchor="middle" class="mod">dispatch_install_cli()</text>
  <text x="150" y="156" text-anchor="middle" class="mod">写 skill 文件 + settings.json</text>
  <text x="150" y="172" text-anchor="middle" class="mod">_resolve_graphify_exe() L1395</text>

  <!-- serve.py -->
  <rect x="290" y="100" width="240" height="80" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="122" text-anchor="middle" class="label" fill="#f9ca24">serve.py</text>
  <text x="410" y="140" text-anchor="middle" class="mod">_build_server() MCP server</text>
  <text x="410" y="156" text-anchor="middle" class="mod">starlette 1.x/2.x 双兼容</text>
  <text x="410" y="172" text-anchor="middle" class="mod">list_tools / list_resources</text>

  <!-- hooks.py + cli.py hooks -->
  <rect x="550" y="100" width="240" height="80" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="670" y="122" text-anchor="middle" class="label" fill="#ff6b9d">hooks.py + cli.py</text>
  <text x="670" y="140" text-anchor="middle" class="mod">PreToolUse nudge/deny</text>
  <text x="670" y="156" text-anchor="middle" class="mod">_READ_NUDGE / _READ_DENY</text>
  <text x="670" y="172" text-anchor="middle" class="mod">Git hooks (post-commit)</text>

  <!-- Entry -->
  <rect x="290" y="210" width="240" height="56" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="232" text-anchor="middle" class="label" fill="#4ecdc4">__main__.py main()</text>
  <text x="410" y="250" text-anchor="middle" class="mod">_check_skill_version() L164</text>
  <text x="410" y="262" text-anchor="middle" class="mod">dispatch_command() → cli.py</text>

  <!-- hook-guard flow -->
  <rect x="30" y="300" width="760" height="80" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="318" class="lane">PreToolUse hook-guard 流程 (cli.py L582 · fail-open)</text>

  <rect x="50" y="330" width="140" height="36" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="120" y="353" text-anchor="middle" class="mod" fill="#ff6b9d">PreToolUse 触发</text>

  <rect x="210" y="330" width="140" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="280" y="353" text-anchor="middle" class="mod" fill="#f9ca24">graph.json 存在?</text>

  <rect x="370" y="330" width="140" height="36" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="353" text-anchor="middle" class="mod" fill="#4ecdc4">soft nudge</text>

  <rect x="530" y="330" width="100" height="36" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="580" y="353" text-anchor="middle" class="mod" fill="#ff6b9d">strict deny</text>

  <rect x="650" y="330" width="120" height="36" rx="6" fill="#13162a" stroke="#5a6075" stroke-width="1.5"/>
  <text x="710" y="353" text-anchor="middle" class="mod" fill="#5a6075">≤1x/session</text>

  <!-- Output -->
  <rect x="290" y="410" width="240" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="430" text-anchor="middle" class="label" fill="#4ecdc4">graphify 核心管线</text>
  <text x="410" y="446" text-anchor="middle" class="mod">extract → build → cluster → export</text>

  <!-- Arrows -->
  <path d="M 90 70 L 90 100" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <path d="M 410 76 L 410 100" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <path d="M 670 70 L 670 100" class="arrow" marker-end="url(#ah)" opacity="0.5"/>

  <path d="M 150 180 L 150 195 L 410 210" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <path d="M 410 180 L 410 210" class="arrow" marker-end="url(#ah)"/>
  <path d="M 670 180 L 670 195 L 410 210" class="arrow" marker-end="url(#ah)" opacity="0.5"/>

  <path d="M 410 266 L 410 300 L 120 330" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <path d="M 410 266 L 410 410" class="arrow" marker-end="url(#ah)"/>

  <path d="M 190 348 L 210 348" class="arrow" marker-end="url(#ah)"/>
  <path d="M 350 348 L 370 348" class="arrow" marker-end="url(#ah)"/>
  <path d="M 510 348 L 530 348" class="arrow" marker-end="url(#ah)"/>
  <path d="M 630 348 L 650 348" class="arrow" marker-end="url(#ah)"/>

  <path d="M 440 366 L 440 390 L 410 410" class="arrow" marker-end="url(#ah)" opacity="0.5"/>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
