<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480">
  <rect width="820" height="480" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .phase { font-family: system-ui, sans-serif; font-size: 11px; fill: #5a6075; font-weight: 600; }
  </style>

  <!-- Phase 1: Cache + Dispatch -->
  <rect x="30" y="30" width="760" height="90" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="48" class="phase">Phase 1：缓存检查 + 语言分派</text>

  <rect x="50" y="58" width="160" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="130" y="78" text-anchor="middle" class="label" fill="#4ecdc4">load_cached</text>
  <text x="130" y="94" text-anchor="middle" class="mod">cache.py · file_hash</text>

  <rect x="240" y="58" width="160" height="48" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle" class="label" fill="#6c8ef5">_get_extractor</text>
  <text x="320" y="94" text-anchor="middle" class="mod">_DISPATCH 字典 + shebang</text>

  <rect x="430" y="58" width="160" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="510" y="78" text-anchor="middle" class="label" fill="#f9ca24">_extract_generic</text>
  <text x="510" y="94" text-anchor="middle" class="mod">engine.py L2526</text>

  <rect x="620" y="58" width="160" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="700" y="78" text-anchor="middle" class="label" fill="#f9ca24">tree-sitter</text>
  <text x="700" y="94" text-anchor="middle" class="mod">Parser.parse → AST</text>

  <!-- Phase 2: Walk -->
  <rect x="30" y="140" width="760" height="90" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="158" class="phase">Phase 2：AST 遍历（模板方法，config 驱动）</text>

  <rect x="50" y="168" width="150" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="125" y="188" text-anchor="middle" class="label" fill="#f9ca24">walk(node)</text>
  <text x="125" y="204" text-anchor="middle" class="mod">engine.py L2713</text>

  <rect x="230" y="168" width="150" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="305" y="188" text-anchor="middle" class="label" fill="#4ecdc4">import_handler</text>
  <text x="305" y="204" text-anchor="middle" class="mod">config 策略注入</text>

  <rect x="410" y="168" width="150" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="485" y="188" text-anchor="middle" class="label" fill="#4ecdc4">class/function types</text>
  <text x="485" y="204" text-anchor="middle" class="mod">add_node + add_edge</text>

  <rect x="590" y="168" width="180" height="48" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="680" y="188" text-anchor="middle" class="label" fill="#f9ca24">walk_calls(body)</text>
  <text x="680" y="204" text-anchor="middle" class="mod">engine.py L4496 · raw_calls</text>

  <!-- Phase 3: Resolution -->
  <rect x="30" y="250" width="760" height="90" rx="6" fill="none" stroke="#1e2230" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="40" y="268" class="phase">Phase 3：跨文件后处理（语料级）</text>

  <rect x="50" y="278" width="170" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="135" y="298" text-anchor="middle" class="label" fill="#ff6b9d">symbol resolution</text>
  <text x="135" y="314" text-anchor="middle" class="mod">resolution.py L1867</text>

  <rect x="250" y="278" width="170" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="335" y="298" text-anchor="middle" class="label" fill="#ff6b9d">member-call resolvers</text>
  <text x="335" y="314" text-anchor="middle" class="mod">run_language_resolvers</text>

  <rect x="450" y="278" width="170" height="48" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="535" y="298" text-anchor="middle" class="label" fill="#ff6b9d">phantom-edge guard</text>
  <text x="535" y="314" text-anchor="middle" class="mod">_lang_family + god-node</text>

  <rect x="650" y="278" width="120" height="48" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="710" y="298" text-anchor="middle" class="label" fill="#6c8ef5">EXTRACTED/</text>
  <text x="710" y="314" text-anchor="middle" class="label" fill="#6c8ef5">INFERRED</text>

  <!-- Output -->
  <rect x="250" y="380" width="320" height="48" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="400" text-anchor="middle" class="label" fill="#4ecdc4">返回 {nodes, edges, raw_calls}</text>
  <text x="410" y="416" text-anchor="middle" class="mod">dict · 供 build.py 消费</text>

  <!-- Arrows Phase 1 -->
  <path d="M 210 82 L 240 82" class="arrow" marker-end="url(#ah)"/>
  <text x="225" y="75" text-anchor="middle" class="mod">MISS</text>
  <path d="M 400 82 L 430 82" class="arrow" marker-end="url(#ah)"/>
  <path d="M 590 82 L 620 82" class="arrow" marker-end="url(#ah)"/>

  <!-- Arrows Phase 1 → Phase 2 -->
  <path d="M 700 106 L 700 130 L 125 130 L 125 168" class="arrow" marker-end="url(#ah)"/>
  <text x="400" y="125" text-anchor="middle" class="mod">AST root node</text>

  <!-- Arrows Phase 2 internal -->
  <path d="M 200 192 L 230 192" class="arrow" marker-end="url(#ah)"/>
  <path d="M 380 192 L 410 192" class="arrow" marker-end="url(#ah)"/>
  <path d="M 560 192 L 590 192" class="arrow" marker-end="url(#ah)"/>

  <!-- Arrows Phase 2 → Phase 3 -->
  <path d="M 680 216 L 680 240 L 135 240 L 135 278" class="arrow" marker-end="url(#ah)"/>
  <text x="400" y="235" text-anchor="middle" class="mod">per-file results</text>

  <!-- Arrows Phase 3 internal -->
  <path d="M 220 302 L 250 302" class="arrow" marker-end="url(#ah)"/>
  <path d="M 420 302 L 450 302" class="arrow" marker-end="url(#ah)"/>
  <path d="M 620 302 L 650 302" class="arrow" marker-end="url(#ah)"/>

  <!-- Arrow Phase 3 → Output -->
  <path d="M 410 326 L 410 380" class="arrow" marker-end="url(#ah)"/>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
