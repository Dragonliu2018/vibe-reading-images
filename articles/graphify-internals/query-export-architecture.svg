<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <rect width="820" height="400" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 11px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Input: graph.json -->
  <rect x="300" y="20" width="220" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="40" text-anchor="middle" class="label" fill="#4ecdc4">graph.json</text>
  <text x="410" y="56" text-anchor="middle" class="mod">node-link 格式</text>

  <!-- Load -->
  <rect x="300" y="90" width="220" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="410" y="110" text-anchor="middle" class="label" fill="#6c8ef5">load_node_link_graph</text>
  <text x="410" y="126" text-anchor="middle" class="mod">paths.py L318 → nx.Graph</text>

  <!-- Three commands -->
  <rect x="30" y="170" width="180" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="120" y="192" text-anchor="middle" class="label" fill="#f9ca24">query</text>
  <text x="120" y="208" text-anchor="middle" class="mod">关键词匹配 + 社区定位</text>
  <text x="120" y="222" text-anchor="middle" class="mod">→ scoped 子图</text>

  <rect x="320" y="170" width="180" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="192" text-anchor="middle" class="label" fill="#f9ca24">path A B</text>
  <text x="410" y="208" text-anchor="middle" class="mod">方向感知 BFS</text>
  <text x="410" y="222" text-anchor="middle" class="mod">→ 最短路径</text>

  <rect x="610" y="170" width="180" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="700" y="192" text-anchor="middle" class="label" fill="#f9ca24">explain</text>
  <text x="700" y="208" text-anchor="middle" class="mod">节点查找 + 连接展示</text>
  <text x="700" y="222" text-anchor="middle" class="mod">→ EXTRACTED/INFERRED</text>

  <!-- querylog -->
  <rect x="250" y="270" width="320" height="44" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="410" y="290" text-anchor="middle" class="label" fill="#ff6b9d">querylog.log_query()</text>
  <text x="410" y="306" text-anchor="middle" class="mod">→ reflect 经验学习闭环</text>

  <!-- Export -->
  <rect x="30" y="340" width="180" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="120" y="360" text-anchor="middle" class="label" fill="#4ecdc4">to_json</text>
  <text x="120" y="376" text-anchor="middle" class="mod">export.py · #479 guard</text>

  <rect x="320" y="340" width="180" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="360" text-anchor="middle" class="label" fill="#4ecdc4">to_html</text>
  <text x="410" y="376" text-anchor="middle" class="mod">exporters/html.py · vis.js</text>

  <rect x="610" y="340" width="180" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="700" y="360" text-anchor="middle" class="label" fill="#4ecdc4">to_graphdb</text>
  <text x="700" y="376" text-anchor="middle" class="mod">exporters/graphdb.py</text>

  <!-- Arrows -->
  <path d="M 410 64 L 410 90" class="arrow" marker-end="url(#ah)"/>
  <path d="M 360 134 L 120 170" class="arrow" marker-end="url(#ah)"/>
  <path d="M 410 134 L 410 170" class="arrow" marker-end="url(#ah)"/>
  <path d="M 460 134 L 700 170" class="arrow" marker-end="url(#ah)"/>
  <path d="M 120 230 L 120 270 L 300 290" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <path d="M 410 230 L 410 270" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <path d="M 700 230 L 700 270 L 520 290" class="arrow" marker-end="url(#ah)" opacity="0.5"/>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
  </defs>
</svg>
