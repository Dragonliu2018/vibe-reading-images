  <text x="350" y="272" text-anchor="middle" fill="#9aa3c7" font-size="13">交换</text>

  <rect x="490" y="72" width="120" height="180" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="550" y="66" text-anchor="middle" fill="#7bed9f" font-size="12">829k</text>
  <text x="550" y="272" text-anchor="middle" fill="#9aa3c7" font-size="13">全删</text>
