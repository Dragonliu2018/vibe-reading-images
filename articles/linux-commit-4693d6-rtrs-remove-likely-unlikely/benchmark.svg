<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310" font-family="system-ui, sans-serif">
  <rect width="700" height="310" fill="#0b0d14"/>

  <text x="350" y="26" text-anchor="middle" fill="#e8ecf5" font-size="16" font-weight="600">rtrs likely/unlikely 移除 benchmark：IOPS 无变化</text>

  <!-- "no difference" annotation (no marker, no rotation) -->
