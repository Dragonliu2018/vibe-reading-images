  <path d="M150,50 L550,50" stroke="#7bed9f" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>

  <!-- 3 bars (all 829k, same height) -->
  <rect x="90" y="72" width="120" height="180" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="150" y="66" text-anchor="middle" fill="#e8ecf5" font-size="12">829k</text>
