<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="560" fill="#0b0d14"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" fill="#e8eaf0" font-size="18" font-weight="700">OpenCodeReview 分层架构</text>
  <text x="410" y="54" text-anchor="middle" fill="#7a86b3" font-size="12">确定性工程 × Agent 混合 · 自顶向下依赖</text>

  <!-- ============ Row 1: 接口层 ============ -->
  <rect x="20" y="74" width="130" height="76" rx="8" fill="#4ecdc4" fill-opacity="0.14" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="85" y="105" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="700">接口层</text>
  <text x="85" y="124" text-anchor="middle" fill="#4ecdc4" font-size="11">cmd/</text>

  <rect x="170" y="74" width="200" height="76" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="270" y="104" text-anchor="middle" fill="#e8eaf0" font-size="14" font-weight="600">命令树</text>
  <text x="270" y="124" text-anchor="middle" fill="#9aa3c0" font-size="11">root · review · scan · delegate</text>

  <rect x="390" y="74" width="200" height="76" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="490" y="104" text-anchor="middle" fill="#e8eaf0" font-size="14" font-weight="600">Provider TUI</text>
  <text x="490" y="124" text-anchor="middle" fill="#9aa3c0" font-size="11">交互式配置 provider/model</text>

  <rect x="610" y="74" width="190" height="76" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="705" y="104" text-anchor="middle" fill="#e8eaf0" font-size="14" font-weight="600">输出格式</text>
  <text x="705" y="124" text-anchor="middle" fill="#9aa3c0" font-size="11">Markdown · JSON · SARIF</text>

  <!-- ============ Row 2: 编排层 ============ -->
  <rect x="20" y="166" width="130" height="76" rx="8" fill="#6c8ef5" fill-opacity="0.14" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="85" y="197" text-anchor="middle" fill="#6c8ef5" font-size="14" font-weight="700">编排层</text>
  <text x="85" y="216" text-anchor="middle" fill="#6c8ef5" font-size="11">orchestration</text>

  <rect x="170" y="166" width="200" height="76" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="270" y="196" text-anchor="middle" fill="#e8eaf0" font-size="14" font-weight="600">ReviewAgent</text>
  <text x="270" y="216" text-anchor="middle" fill="#9aa3c0" font-size="11">diff 审查 · 并发子审查</text>

  <rect x="390" y="166" width="200" height="76" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="490" y="196" text-anchor="middle" fill="#e8eaf0" font-size="14" font-weight="600">ScanAgent</text>
  <text x="490" y="216" text-anchor="middle" fill="#9aa3c0" font-size="11">全文件扫描 · 批次切分</text>

  <rect x="610" y="166" width="190" height="76" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="705" y="196" text-anchor="middle" fill="#e8eaf0" font-size="14" font-weight="600">会话编排</text>
  <text x="705" y="216" text-anchor="middle" fill="#9aa3c0" font-size="11">manifest · resume · 持久化</text>

