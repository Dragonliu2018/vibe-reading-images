<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7bed9f"/>
    </marker>
    <marker id="arrowN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <rect width="780" height="320" fill="#0b0d14"/>

  <text x="390" y="26" text-anchor="middle" fill="#e8ecf5" font-size="16" font-weight="600">rtrs permit 分配：bitmap 扫描的 rewind vs resume</text>

  <!-- 改动前 -->
  <text x="30" y="60" fill="#e74c3c" font-size="13" font-weight="600">改动前 · find_first_zero_bit()</text>
  <!-- bitmap bar: low-set (red) + free (green outline) -->
  <rect x="30" y="70" width="420" height="30" fill="#3a1a1a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="240" y="89" text-anchor="middle" fill="#e8ecf5" font-size="12">低段密集置位（in-use permits）</text>
  <rect x="450" y="70" width="200" height="30" fill="#13162a" stroke="#7bed9f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="550" y="89" text-anchor="middle" fill="#7bed9f" font-size="12">空闲区</text>
  <text x="660" y="89" fill="#9aa3c7" font-size="11">bit 0 ←</text>
  <!-- scan: 0 -> free, lose race, rewind to 0 -->
  <path d="M40,118 L540,118" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrowN)"/>
  <text x="290" y="114" text-anchor="middle" fill="#9aa3c7" font-size="11">① 扫到空闲位</text>
  <path d="M540,135 L50,135" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowR)"/>
  <text x="290" y="131" text-anchor="middle" fill="#e74c3c" font-size="11">② 竞态失败 → 回 bit 0 重扫已置位低段（浪费 ∝ in-use 数）</text>

  <!-- 改动后 -->
  <text x="30" y="180" fill="#7bed9f" font-size="13" font-weight="600">改动后 · find_next_zero_bit(map, max, bit)</text>
  <rect x="30" y="190" width="420" height="30" fill="#3a1a1a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="240" y="209" text-anchor="middle" fill="#e8ecf5" font-size="12">低段密集置位（in-use permits）</text>
  <rect x="450" y="190" width="200" height="30" fill="#13162a" stroke="#7bed9f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="550" y="209" text-anchor="middle" fill="#7bed9f" font-size="12">空闲区</text>
  <text x="660" y="209" fill="#9aa3c7" font-size="11">bit 0 ←</text>
  <!-- scan: 0 -> free, lose race, resume forward -->
  <path d="M40,238 L540,238" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrowN)"/>
  <text x="290" y="234" text-anchor="middle" fill="#9aa3c7" font-size="11">① 扫到空闲位（从上次 bit 续扫）</text>
  <path d="M540,255 L600,255" stroke="#7bed9f" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
  <text x="445" y="251" text-anchor="end" fill="#7bed9f" font-size="11">② 竞态失败 → 从上次位置续扫，不回 0</text>

  <!-- Legend -->
  <circle cx="44" cy="295" r="5" fill="#e74c3c"/>
  <text x="56" y="299" fill="#9aa3c7" font-size="11">红 = 改动前的浪费（失败后回 0 重扫已置位低段）</text>
  <circle cx="430" cy="295" r="5" fill="#7bed9f"/>
  <text x="442" y="299" fill="#9aa3c7" font-size="11">绿 = 改动后的优化（续扫，不重扫）</text>
</svg>
