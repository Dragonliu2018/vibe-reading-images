<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" font-family="system-ui,sans-serif">
<rect x="0" y="0" width="940" height="540" fill="#0b0d14"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
  </marker>
  <marker id="arrow-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
  </marker>
  <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7bed9f"/>
  </marker>
  <marker id="arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
  </marker>
</defs>
<text x="470" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#e6e6f0">模块依赖关系</text>
<text x="470" y="50" text-anchor="middle" font-size="11.5" fill="#9aa0c0">实线 = 依赖/调用方向（A→B：A 依赖 B）；虚线 = 离线产物喂入在线</text>
<rect x="330" y="78" width="280" height="66" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="470" y="102" text-anchor="middle" font-size="15" fill="#e6e6f0">入口层 Entry</text>
<text x="470" y="121" text-anchor="middle" font-size="10.5" fill="#9aa0c0">test/ · app/（4 个可执行入口）</text>
<rect x="330" y="164" width="280" height="66" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="470" y="188" text-anchor="middle" font-size="15" fill="#e6e6f0">运行时层 Runtime</text>
<text x="470" y="207" text-anchor="middle" font-size="10.5" fill="#9aa0c0">Env · Workers · ResourcePool</text>
<text x="470" y="221" text-anchor="middle" font-size="10.5" fill="#9aa0c0">ClusterMap · ClusterExtra</text>
<rect x="330" y="250" width="280" height="66" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="470" y="274" text-anchor="middle" font-size="15" fill="#e6e6f0">索引层 Index</text>
<text x="470" y="293" text-anchor="middle" font-size="10.5" fill="#9aa0c0">IndexAbs · HnswImp</text>
<text x="470" y="307" text-anchor="middle" font-size="10.5" fill="#9aa0c0">HyperConstImp · Compute · Prune</text>
<rect x="330" y="336" width="280" height="66" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
<text x="470" y="360" text-anchor="middle" font-size="15" fill="#e6e6f0">NVMe I/O 层</text>
<text x="470" y="379" text-anchor="middle" font-size="10.5" fill="#9aa0c0">NVMeManager · NVMeCtrl</text>
<text x="470" y="393" text-anchor="middle" font-size="10.5" fill="#9aa0c0">NVMeAllocator · NVMeMetaHandler</text>
<rect x="330" y="422" width="280" height="66" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="470" y="446" text-anchor="middle" font-size="15" fill="#e6e6f0">基础设施 Infra</text>
<text x="470" y="465" text-anchor="middle" font-size="10.5" fill="#9aa0c0">Collection/Meta · File I/O</text>
<text x="470" y="479" text-anchor="middle" font-size="10.5" fill="#9aa0c0">hnswlib · json · Dataset · GtReader</text>
<path d="M 470 144 L 470 164" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 470 230 L 470 250" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 470 316 L 470 336" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 470 402 L 470 422" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 330 283 C 240 283, 240 197, 330 197" stroke="#f9ca24" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow-y)"/>
<text x="325" y="243" text-anchor="end" font-size="10.5" fill="#f9ca24" paint-order="stroke" stroke="#0b0d14" stroke-width="3">HyperConstImp 持有</text>
<text x="325" y="257" text-anchor="end" font-size="10.5" fill="#f9ca24" paint-order="stroke" stroke="#0b0d14" stroke-width="3">ClusterMap / Extra</text>
<path d="M 610 197 C 685 197, 685 369, 610 369" stroke="#6c8ef5" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow-c)"/>
<text x="692" y="278" font-size="10.5" fill="#6c8ef5" paint-order="stroke" stroke="#0b0d14" stroke-width="3">ResourcePool /</text>
<text x="692" y="292" font-size="10.5" fill="#6c8ef5" paint-order="stroke" stroke="#0b0d14" stroke-width="3">OfflineWorker</text>
<rect x="770" y="140" width="150" height="240" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
<text x="845" y="170" text-anchor="middle" font-size="14" fill="#e6e6f0">离线构建</text>
<text x="845" y="192" text-anchor="middle" font-size="10.5" fill="#9aa0c0">SpannIndex</text>
<text x="845" y="206" text-anchor="middle" font-size="10.5" fill="#9aa0c0">third_party/spann_aug</text>
<text x="845" y="236" text-anchor="middle" font-size="11" fill="#7bed9f">SPTAG SPANN</text>
<text x="845" y="252" text-anchor="middle" font-size="9.5" fill="#9aa0c0">HeadVecs · FullList</text>
<text x="845" y="282" text-anchor="middle" font-size="11" fill="#7bed9f">Filling 算法</text>
<text x="845" y="298" text-anchor="middle" font-size="9.5" fill="#9aa0c0">定长 cluster_size</text>
<text x="845" y="328" text-anchor="middle" font-size="11" fill="#7bed9f">→ HV_CONST 文件</text>
<text x="845" y="344" text-anchor="middle" font-size="9.5" fill="#9aa0c0">centroids_index.bin</text>
<path d="M 770 283 L 610 283" stroke="#7bed9f" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75" marker-end="url(#arrow-g)"/>
<text x="690" y="275" text-anchor="middle" font-size="10" fill="#7bed9f" paint-order="stroke" stroke="#0b0d14" stroke-width="3">索引文件</text>
<path d="M 740 70 L 740 500" stroke="#7a86b3" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.25"/>
<text x="40" y="518" font-size="10.5" fill="#9aa0c0">五层在线 serving 栈 + 离线构建支线；索引层反向持有运行时层的 ClusterMap/ClusterExtra（聚簇映射服务于检索）</text>
</svg>