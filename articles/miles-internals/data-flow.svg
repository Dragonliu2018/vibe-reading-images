<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="system-ui, sans-serif">
<rect width="940" height="620" fill="#0b0d14"/>
