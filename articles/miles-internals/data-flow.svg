  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
  </marker>

  <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7bed9f"/>
  </marker>

</defs>
<text x="470.0" y="30" text-anchor="middle" fill="#e8eaf6" font-size="17" font-weight="600">RL 训练循环数据流</text>
<rect x="5" y="90" width="150" height="110" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
<text x="80" y="112" text-anchor="middle" fill="#4ecdc4" font-size="12.5" font-weight="600">① 采样</text>
<text x="80" y="132" text-anchor="middle" fill="#e8eaf6" font-size="9.5">DataSource.get_samples()</text>
<text x="80" y="152" text-anchor="middle" fill="#7a86b3" font-size="9">list[list[Sample]]</text>
<text x="80" y="165" text-anchor="middle" fill="#7a86b3" font-size="9">(prompt 分组)</text>
<rect x="175" y="90" width="150" height="110" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
<text x="250" y="112" text-anchor="middle" fill="#f9ca24" font-size="12.5" font-weight="600">② 生成</text>
<text x="250" y="132" text-anchor="middle" fill="#e8eaf6" font-size="9.5">Generate Hub → SGLang</text>
<text x="250" y="152" text-anchor="middle" fill="#7a86b3" font-size="9">Sample.tokens/response</text>
<text x="250" y="165" text-anchor="middle" fill="#7a86b3" font-size="9">+ rollout_log_probs</text>
<rect x="345" y="90" width="150" height="110" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
<text x="420" y="112" text-anchor="middle" fill="#f9ca24" font-size="12.5" font-weight="600">③ 打分</text>
<text x="420" y="132" text-anchor="middle" fill="#e8eaf6" font-size="9.5">RM Hub → async_rm()</text>
<text x="420" y="152" text-anchor="middle" fill="#7a86b3" font-size="9">Sample.reward</text>
<text x="420" y="165" text-anchor="middle" fill="#7a86b3" font-size="9">+ loss_mask</text>
<rect x="525" y="90" width="150" height="110" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
<text x="600" y="112" text-anchor="middle" fill="#6c8ef5" font-size="12.5" font-weight="600">④ 优化</text>
<text x="600" y="132" text-anchor="middle" fill="#e8eaf6" font-size="9.5">Megatron train_one_step</text>
<text x="600" y="152" text-anchor="middle" fill="#7a86b3" font-size="9">ref_log_probs → advantages</text>
<text x="600" y="165" text-anchor="middle" fill="#7a86b3" font-size="9">→ PPO clip loss → backward</text>
<path d="M155,145 L173,145" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M325,145 L343,145" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M495,145 L523,145" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="80" y="260" width="600" height="70" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.4"/>
<text x="380.0" y="284" text-anchor="middle" fill="#7bed9f" font-size="12.5" font-weight="600">⑤ 权重同步 update_weights()</text>
<text x="380.0" y="306" text-anchor="middle" fill="#e8eaf6" font-size="9.5">Megatron→HF 转换 → P2P RDMA / NCCL Broadcast → SGLang engine</text>
<path d="M600,200 L600,258" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M680,295 L730,295 L730,72 L250,72 L250,88" stroke="#7bed9f" stroke-width="1.5" fill="none" marker-end="url(#arrowg)"/>
<text x="738" y="64" fill="#7bed9f" font-size="10">权重更新后</text>
<text x="738" y="78" fill="#7bed9f" font-size="10">rollout 用新权重生成</text>
<rect x="18" y="380" width="802" height="200" rx="8" fill="none" stroke="#7a86b3" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="30" y="400" fill="#7a86b3" font-size="11" font-weight="600">rollout → train 数据转换边界（Ray ObjectStore）</text>
<rect x="30" y="416" width="160" height="60" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.1"/>
<text x="110" y="436" text-anchor="middle" fill="#e8eaf6" font-size="10" font-weight="600">postprocess_rollout_data</text>
<text x="110" y="453" text-anchor="middle" fill="#7a86b3" font-size="8.5">flatten / trim to</text>
<text x="110" y="465" text-anchor="middle" fill="#7a86b3" font-size="8.5"> global_batch_size</text>
<rect x="230" y="416" width="160" height="60" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.1"/>
<text x="310" y="436" text-anchor="middle" fill="#e8eaf6" font-size="10" font-weight="600">convert_samples_to_train_data</text>
<text x="310" y="453" text-anchor="middle" fill="#7a86b3" font-size="8.5">Sample[] → dict</text>
<text x="310" y="465" text-anchor="middle" fill="#7a86b3" font-size="8.5">{tokens, rewards, ...}</text>
<rect x="440" y="416" width="160" height="60" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.1"/>
<text x="520" y="436" text-anchor="middle" fill="#e8eaf6" font-size="10" font-weight="600">split_train_data_by_dp</text>
<text x="520" y="453" text-anchor="middle" fill="#7a86b3" font-size="8.5">按 DP rank 分片</text>
<text x="520" y="465" text-anchor="middle" fill="#7a86b3" font-size="8.5">object_store.put → ObjectRef</text>
<rect x="640" y="416" width="160" height="60" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.1"/>
<text x="720" y="436" text-anchor="middle" fill="#e8eaf6" font-size="10" font-weight="600">get_rollout_data</text>
<text x="720" y="453" text-anchor="middle" fill="#7a86b3" font-size="8.5">ObjectRef → GPU tensor</text>
<text x="720" y="465" text-anchor="middle" fill="#7a86b3" font-size="8.5">→ RolloutBatch</text>
<path d="M190,446 L228,446" stroke="#7a86b3" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M390,446 L438,446" stroke="#7a86b3" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M600,446 L638,446" stroke="#7a86b3" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<text x="92" y="498" fill="#f9ca24" font-size="10" font-weight="600">Sample（miles/utils/types.py）</text>
<text x="92" y="514" fill="#7a86b3" font-size="9">全链路唯一数据契约：prompt · tokens · response · reward · loss_mask · rollout_log_probs · rollout_routed_experts(R3) · status</text>
<text x="92" y="530" fill="#7a86b3" font-size="9">四旋钮不变式：rollout_batch_size × n_samples_per_prompt = global_batch_size × num_steps_per_rollout（arguments.py 校验）</text>
<text x="92" y="548" fill="#7a86b3" font-size="9">异步解耦：train_async.py 预取下一轮 rollout（ObjectRef 非阻塞）；fully-async 用 DataBuffer 生产者-消费者完全并行</text>
</svg>