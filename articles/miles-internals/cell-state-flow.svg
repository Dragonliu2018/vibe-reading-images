<text x="150" y="335" text-anchor="middle" fill="#7a86b3" font-size="9">actor 已 kill</text>
<path d="M225,130 L305,130" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="265.0" y="78" text-anchor="middle" fill="#7a86b3" font-size="9">allocate_for_pending()</text>
<path d="M455,130 L535,130" stroke="#7bed9f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="495.0" y="78" text-anchor="middle" fill="#7bed9f" font-size="9">init() → _mark_as_alive()</text>
<path d="M560,167 L430,263" stroke="#e74c3c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="523.0" y="215.0" text-anchor="start" fill="#e74c3c" font-size="9">execute 失败</text>
<path d="M305,300 L225,300" stroke="#e74c3c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="265.0" y="292" text-anchor="middle" fill="#e74c3c" font-size="9">stop()</text>
<path d="M150,263 L150,167" stroke="#7bed9f" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
<text x="60" y="215.0" text-anchor="middle" fill="#7bed9f" font-size="9">mark_as_pending()</text>
<path d="M610,93.0 L610,60 L68,60 L68,300 L73,300" stroke="#b388ff" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
<text x="339.0" y="52" text-anchor="middle" fill="#b388ff" font-size="9.5">stop()（offload / 正常停止）</text>
<rect x="40" y="410" width="820" height="44" rx="6" fill="#13162a" stroke="#7bed9f" stroke-opacity="0.4" stroke-width="1"/>
<text x="54" y="428" fill="#7bed9f" font-size="10" font-weight="600">原地恢复（no restart, no pause）</text>
<text x="54" y="444" fill="#7a86b3" font-size="9">_refresh_cells()：alive cell 经 NCCL 发 in-memory checkpoint → healing cell recv_ckpt → 重建 PG（quorum_id++）</text>
</svg>