  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#e74c3c"/>
  </marker>

  <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7bed9f"/>
  </marker>

</defs>
<text x="450.0" y="28" text-anchor="middle" fill="#e8eaf6" font-size="17" font-weight="600">RayTrainCell 状态机（容错恢复）</text>
<rect x="75.0" y="93.0" width="150" height="74" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="150" y="122" text-anchor="middle" fill="#4ecdc4" font-size="11" font-weight="600">StatePending</text>
<text x="150" y="152" text-anchor="middle" fill="#7a86b3" font-size="9">等待分配 GPU</text>
<rect x="305.0" y="93.0" width="150" height="74" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="380" y="122" text-anchor="middle" fill="#f9ca24" font-size="11" font-weight="600">StateAllocated</text>
<text x="380" y="137" text-anchor="middle" fill="#f9ca24" font-size="11" font-weight="600">Uninitialized</text>
<text x="380" y="152" text-anchor="middle" fill="#7a86b3" font-size="9">已分配 actor</text>
<text x="380" y="165" text-anchor="middle" fill="#7a86b3" font-size="9">未 init</text>
<rect x="535.0" y="93.0" width="150" height="74" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
<text x="610" y="122" text-anchor="middle" fill="#7bed9f" font-size="11" font-weight="600">StateAllocated</text>
<text x="610" y="137" text-anchor="middle" fill="#7bed9f" font-size="11" font-weight="600">Alive</text>
<text x="610" y="152" text-anchor="middle" fill="#7a86b3" font-size="9">已 init · 健康运行</text>
<text x="610" y="165" text-anchor="middle" fill="#7a86b3" font-size="9">参与训练</text>
<rect x="305.0" y="263.0" width="150" height="74" rx="8" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
<text x="380" y="292" text-anchor="middle" fill="#e74c3c" font-size="11" font-weight="600">StateAllocated</text>
<text x="380" y="307" text-anchor="middle" fill="#e74c3c" font-size="11" font-weight="600">Errored</text>
<text x="380" y="322" text-anchor="middle" fill="#7a86b3" font-size="9">运行中出错</text>
<text x="380" y="335" text-anchor="middle" fill="#7a86b3" font-size="9">actor 被 kill</text>
<rect x="75.0" y="263.0" width="150" height="74" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="150" y="292" text-anchor="middle" fill="#b388ff" font-size="11" font-weight="600">StateStopped</text>
