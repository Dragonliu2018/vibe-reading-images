<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7bed9f"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#0b0d14"/>

  <!-- title -->
  <text x="400" y="26" text-anchor="middle" fill="#e6e8f0" font-size="15" font-weight="600">性能根因：H2D 流与 Ulysses all2all 的带宽争用</text>

  <!-- ROW 1: layerwise offload -->
  <text x="80" y="60" fill="#ff6b9d" font-size="13" font-weight="600">旧 · layerwise offload（r35）</text>
  <rect x="80" y="70" width="220" height="60" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="190" y="91" text-anchor="middle" fill="#e6e8f0" font-size="13">每步 H2D 流<tspan x="190" dy="18">292,268 ms</tspan></text>
  <rect x="500" y="70" width="240" height="60" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="620" y="91" text-anchor="middle" fill="#e6e8f0" font-size="13">Ulysses all2all<tspan x="620" dy="18">nccl 219,963 ms</tspan></text>
  <path d="M300,100 L500,100" fill="none" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="400" y="92" text-anchor="middle" fill="#ff6b9d" font-size="11">共享互连 → 争用</text>

  <!-- ROW 2: DiT resident -->
  <text x="80" y="180" fill="#7bed9f" font-size="13" font-weight="600">新 · DiT 全驻留（slab 2）</text>
  <rect x="80" y="190" width="220" height="60" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="190" y="211" text-anchor="middle" fill="#e6e8f0" font-size="13">H2D 流<tspan x="190" dy="18">9.3 ms（消失）</tspan></text>
  <rect x="500" y="190" width="240" height="60" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="620" y="211" text-anchor="middle" fill="#e6e8f0" font-size="13">Ulysses all2all<tspan x="620" dy="18">nccl 150,634 ms（−31.5%）</tspan></text>
  <path d="M300,220 L500,220" fill="none" stroke="#7bed9f" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="400" y="212" text-anchor="middle" fill="#7bed9f" font-size="11">互连解放</text>

  <!-- summary box -->
  <rect x="80" y="290" width="640" height="80" rx="8" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
  <text x="400" y="312" text-anchor="middle" fill="#e6e8f0" font-size="13">all2all 节省 (219,963 − 150,634) / 8 = 8.67 s/rank ≈ e2e Δ 8.71 s<tspan x="400" dy="20">对照：NCCL_P2P_LEVEL=SYS（112 SHM → 直连 P2P）只改子集链路</tspan><tspan x="400" dy="20">→ nccl kernel −4.1%、denoise 0%：不是少拷字节，是去掉共享带宽争用</tspan></text>
</svg>
