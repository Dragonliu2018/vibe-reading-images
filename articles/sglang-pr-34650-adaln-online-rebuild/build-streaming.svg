<svg xmlns="http://www.w3.org/2000/svg" width="800" height="486" viewBox="0 0 800 486" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>

  <rect width="800" height="486" fill="#0b0d14"/>

  <!-- title -->
  <text x="400" y="26" text-anchor="middle" fill="#e6e8f0" font-size="15" font-weight="600">build() 流式重建：逐层读权重 → GEMM → all-gather → 写 slab</text>

  <!-- checkpoint node -->
  <rect x="160" y="54" width="480" height="56" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="86" text-anchor="middle" fill="#e6e8f0" font-size="13">checkpoint safetensors · adaln_proj 50 层 · 24.2 GiB</text>

  <!-- arrow checkpoint -> loop -->
  <path d="M400,110 L400,140" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="408" y="130" fill="#7a86b3" font-size="11">ExitStack 一次打开所有文件</text>

  <!-- loop container -->
  <rect x="40" y="140" width="720" height="140" rx="10" fill="none" stroke="#3a3f5c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="52" y="162" fill="#7a86b3" font-size="12">for layer in range(50):</text>

  <!-- L1 read_shard -->
  <rect x="60" y="190" width="170" height="60" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="145" y="211" text-anchor="middle" fill="#e6e8f0" font-size="13">read_shard<tspan x="145" dy="18">本 rank 列分片 (1/tp)</tspan></text>
  <!-- L2 GEMM -->
  <rect x="270" y="190" width="180" height="60" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="360" y="211" text-anchor="middle" fill="#e6e8f0" font-size="13">F.linear GEMM<tspan x="360" dy="18">M = plan 长度</tspan></text>
  <!-- L3 all_gather -> slab -->
  <rect x="490" y="190" width="250" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="615" y="211" text-anchor="middle" fill="#e6e8f0" font-size="13">all_gather →<tspan x="615" dy="18">slab[slot, :M, layer]</tspan></text>

  <!-- intra-loop arrows -->
  <path d="M230,220 L270,220" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M450,220 L490,220" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- arrow loop -> slab -->
  <path d="M400,280 L400,310" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- slab peak node -->
  <rect x="160" y="310" width="480" height="56" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="400" y="342" text-anchor="middle" fill="#e6e8f0" font-size="13">瞬时峰值 = 一层 496 MiB（非 24.2 GiB）</text>

  <!-- warning callouts -->
  <rect x="60" y="394" width="330" height="66" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="225" y="418" text-anchor="middle" fill="#e6e8f0" font-size="13">cuBLAS 按 GEMM 形状选 kernel<tspan x="225" dy="18">非单调：必须用精确 M 重建</tspan></text>

  <rect x="410" y="394" width="330" height="66" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="575" y="418" text-anchor="middle" fill="#e6e8f0" font-size="13">tp&gt;1：分片 GEMM 的 N 不同<tspan x="575" dy="18">→ kernel 不同，须镜像 ColumnParallelLinear</tspan></text>
</svg>
