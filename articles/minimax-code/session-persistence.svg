<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="860" height="600" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="16" font-weight="600">会话持久化：双层 schema 与 canonical history</text>

  <!-- 应用层 -->
  <rect x="40" y="64" width="780" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="430" y="88" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12.5">SessionRecordService.createSession → SessionRepository.create（26 项能力契约）</text>
  <text x="430" y="108" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">keyset cursor 分页 · CAS 乐观检查 · applyAgentState 带 runtimeSeq 防乱序</text>

  <line x1="430" y1="120" x2="430" y2="148" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- schema 双层 -->
  <rect x="40" y="152" width="380" height="100" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="230" y="178" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">local_runtime_sessions 表</text>
  <text x="230" y="200" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11">record_json（真源 · 36 字段 SessionRecord）</text>
  <text x="230" y="220" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">columnar 列（columnarVersion=3 部分索引）</text>
  <text x="230" y="240" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">旧行未回填不进新索引，免全表重写</text>

  <rect x="460" y="152" width="360" height="100" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="640" y="178" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AppDb（infra/db/client.ts）</text>
  <text x="640" y="200" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11">better-sqlite3 + drizzle-orm（同步 API）</text>
  <text x="640" y="220" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">WAL · busy_timeout 5000 · foreign_keys ON</text>
  <text x="640" y="240" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">dataDir/v2/sqlite/runtime-state.sqlite</text>

  <line x1="430" y1="252" x2="430" y2="286" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="274" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">迁移：备份（online backup + integrity_check）→ 三段式 DDL/backfill/DDL</text>

  <!-- canonical history -->
  <rect x="40" y="290" width="780" height="110" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="430" y="316" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">canonical history（transcript）</text>
  <text x="430" y="338" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11">DurableCanonicalHistoryStore（AgentHost 包装 · KeyedOperationLane 串行化）</text>
  <text x="430" y="358" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">→ canonical-history-provider（session-system 独占 owner：布局 / 迁移 / checkpoint / 恢复）</text>
  <text x="430" y="378" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">→ JSONL：5 键 envelope · SENSITIVE_COMPACT_KEYS 写前脱敏（约 60 个敏感键）</text>

  <line x1="430" y1="400" x2="430" y2="428" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- read fallback -->
  <rect x="40" y="432" width="780" height="64" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="430" y="458" text-anchor="middle" fill="#80c7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">读取四级回退（selectCanonicalHistorySource）</text>
  <text x="430" y="480" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">target JSONL → ledger snapshot → sqlite rows → sqlite blob；旧 opencode 数据由 legacy-db 只读源承接</text>

  <!-- infra strip -->
  <text x="40" y="530" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">infra 横切设施</text>
  <text x="40" y="554" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">event-bus（live-only fan-out，订阅者异常被吞）· scheduler（croner + 持久 job 表）· runtime-owner（proper-lockfile 跨进程租约）</text>
  <text x="40" y="574" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">git（fork worktree + 所有权 sidecar）· storage-retention（固定日志根 7 天 · 2000 entry 预算）· sse（BoundedRing 背压）</text>
</svg>
