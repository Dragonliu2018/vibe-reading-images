  </defs>
  <rect width="860" height="620" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="16" font-weight="600">LocalModelResolver：三源模型解析</text>

  <!-- input -->
  <rect x="280" y="64" width="300" height="56" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
