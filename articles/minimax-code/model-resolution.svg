  <text x="430" y="352" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">finishResolve</text>
  <text x="430" y="374" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11">thinking 协议解析 · 组装 Pi Model&lt;Api&gt;</text>
  <text x="430" y="394" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">headers 注入 · streamFn 包装（错误归因 / maxTokens 钳制）</text>

  <line x1="430" y1="408" x2="430" y2="440" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="430" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">LocalResolvedModelConfig</text>

  <rect x="250" y="444" width="360" height="60" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="430" y="470" text-anchor="middle" fill="#b388ff" font-family="system-ui, sans-serif" font-size="12.5">pi-ai provider registry（9 种 API 格式）</text>
  <text x="430" y="490" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">anthropic-messages / openai-* / google-* / bedrock / mistral</text>

  <!-- agent catalog side -->
  <text x="40" y="540" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">内置 agent（BuiltinAgentCatalog · builtin-agents.json roster）</text>
  <text x="40" y="564" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">mavis · explore · worker · verifier —— PERSONA.md + system-prompt.md.hbs（handlebars 模板 + locale/mode/feature 层）</text>
  <text x="40" y="584" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">选择链：agent:&lt;name&gt; 显式 → primary family → canonical subagent role → 名称/display name 兼容；歧义抛 AMBIGUOUS_AGENT_NAME</text>
