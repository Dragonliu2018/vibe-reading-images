  <text x="430" y="108" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">resolution/model-key.ts · 三源判定</text>

  <!-- three sources -->
  <line x1="360" y1="120" x2="180" y2="160" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="120" x2="430" y2="160" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="120" x2="680" y2="160" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="164" width="280" height="104" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="180" y="190" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">托管（managed）</text>
  <text x="180" y="212" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11">MiniMax 账号 / Token Plan</text>
  <text x="180" y="230" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">authMode: managed-login（Bearer 头）</text>
  <text x="180" y="248" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">managed fetch 重试 · 凭据经 auth.json 投影</text>

  <rect x="360" y="164" width="180" height="104" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="450" y="190" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">minimax_api</text>
  <text x="450" y="212" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11">用户 API key（BYOK）</text>
  <text x="450" y="230" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">anthropic-messages 格式</text>
  <text x="450" y="248" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">api.minimaxi.com/anthropic</text>

  <rect x="580" y="164" width="240" height="104" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="700" y="190" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="13" font-weight="600">custom_provider（BYOK）</text>
  <text x="700" y="212" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11">openai-completions / responses</text>
  <text x="700" y="230" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">anthropic-messages / OAuth 类</text>
  <text x="700" y="248" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">openai-codex-responses 归 Pi 专属管</text>

  <!-- converge -->
  <line x1="180" y1="268" x2="400" y2="320" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="268" x2="435" y2="320" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="268" x2="470" y2="320" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

