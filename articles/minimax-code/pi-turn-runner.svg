<svg xmlns="http://www.w3.org/2000/svg" width="860" height="660" viewBox="0 0 860 660">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="860" height="660" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="16" font-weight="600">PiTurnRunner.runTurn 八步组装与事件桥</text>

  <!-- steps -->
  <rect x="40" y="64" width="190" height="64" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="135" y="90" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12">1 newTurn()</text>
  <text x="135" y="112" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">工具表 / streamFn / Bridge</text>

  <rect x="270" y="64" width="190" height="64" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="365" y="90" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12">2 emitRunning</text>
  <text x="365" y="112" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">首帧 session.status</text>

  <rect x="500" y="64" width="190" height="64" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="595" y="90" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12">3 newAgent()</text>
  <text x="595" y="112" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">pi Agent 构造</text>

  <line x1="230" y1="96" x2="270" y2="96" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="96" x2="500" y2="96" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="152" width="190" height="64" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="135" y="178" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12">4 setToolHooks</text>
  <text x="135" y="200" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">before/afterToolCall 串接</text>

  <rect x="270" y="152" width="190" height="64" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="365" y="178" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12">5 setLLMHook</text>
  <text x="365" y="200" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">compaction / 消息改写</text>

  <rect x="500" y="152" width="190" height="64" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="595" y="178" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12">6 subscribeEvents</text>
  <text x="595" y="200" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">单一串行队列保序</text>

  <line x1="135" y1="128" x2="135" y2="152" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="184" x2="270" y2="184" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="184" x2="500" y2="184" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="240" width="280" height="64" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.4"/>
  <text x="180" y="266" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12">7 runAgent：prompt / continue</text>
  <text x="180" y="288" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">waitForIdle</text>

  <rect x="360" y="240" width="280" height="64" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="500" y="266" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12">8 drain + flushTail + emitTerminal</text>
  <text x="500" y="288" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">扫描 pi 无回调追加的消息</text>

  <line x1="320" y1="272" x2="360" y2="272" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- event flow -->
  <line x1="180" y1="304" x2="180" y2="340" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="328" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">AgentEvent 流</text>

  <rect x="40" y="344" width="600" height="60" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="340" y="368" text-anchor="middle" fill="#80c7ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">pi Agent（agent-loop.ts runLoop）</text>
  <text x="340" y="390" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">外层 follow-up 循环 + 内层「steering 注入 → streamAssistantResponse → executeToolCalls」</text>

  <rect x="680" y="344" width="140" height="60" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="750" y="368" text-anchor="middle" fill="#80c7ff" font-family="system-ui, sans-serif" font-size="12">streamFn</text>
  <text x="750" y="390" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">9 种 provider</text>

  <line x1="640" y1="374" x2="680" y2="374" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="340" y1="404" x2="340" y2="436" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- bridge -->
  <rect x="40" y="440" width="600" height="92" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
  <text x="340" y="466" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">EventBridge（bridge.ts:151）</text>
  <text x="340" y="488" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11">AgentEvent（message_* / tool_execution_*）→ RuntimeEvent</text>
  <text x="340" y="508" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">message_id 契约：首个 message_start 请求 host 分配 id 后回注</text>
  <text x="340" y="524" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">completed agent_message 延迟到全部 tool_execution_end 到齐才发射</text>

  <line x1="340" y1="532" x2="340" y2="560" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="552" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">串行队列 → eventWriter → host</text>

  <rect x="40" y="564" width="780" height="60" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="430" y="588" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">convertToLlm = projectAgentMessagesForModel（outbound-message-normalizer.ts）</text>
  <text x="430" y="610" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">按模型投影历史 / 剔除孤儿 tool result —— agent-core 零 IO，pi 类型只出现在 pi-turn-runner 与 event-bridge 两个 subpath</text>
</svg>
