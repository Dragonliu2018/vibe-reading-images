<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="860" height="640" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="16" font-weight="600">权限三步流与横切模块</text>

  <!-- permission -->
  <text x="40" y="70" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">PermissionEngine.checkPermission（engine.ts:183 三步流）</text>

  <rect x="40" y="88" width="240" height="96" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="160" y="114" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Step 1 · Reject</text>
  <text x="160" y="136" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">whole-tool deny / ask</text>
  <text x="160" y="154" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">工具 checker（bash AST / fs 路径）</text>
  <text x="160" y="172" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">content 规则 bypass 免疫</text>

  <rect x="330" y="88" width="240" height="96" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="450" y="114" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Step 2 · Allow</text>
  <text x="450" y="136" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">bypassPermissions 整体放行</text>
  <text x="450" y="154" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">whole-tool allow 规则</text>

  <rect x="620" y="88" width="200" height="96" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="720" y="114" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Step 3 · fallback ask</text>
  <text x="720" y="136" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">permission.ask 事件</text>
  <text x="720" y="154" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">TUI 弹窗三选一</text>
  <text x="720" y="172" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">allowOnce / Always / deny</text>

  <line x1="280" y1="136" x2="330" y2="136" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="136" x2="620" y2="136" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="216" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">askGate 不变量：bypassPermissions 模式永不弹卡（模式入口快照一次，防中途翻转）；不确定输入升级云网关分类器</text>

  <line x1="430" y1="230" x2="430" y2="258" stroke="#2a2f45" stroke-width="1"/>

  <!-- skills -->
  <text x="40" y="262" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Skill 五级来源（SOURCE_RANK 优先级）</text>

  <rect x="40" y="280" width="780" height="64" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="430" y="306" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12">project &gt; workspace &gt; agent &gt; global/user &gt; builtin</text>
  <text x="430" y="328" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">同名遮蔽可诊断 · SKILL.md O_NOFOLLOW + dev/ino/mtime 稳定性校验 · watch 200ms debounce 热更新</text>

  <line x1="430" y1="344" x2="430" y2="372" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="364" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">renderCatalog()（20k 字符预算）注入 system prompt → skill 工具按需加载全文</text>

  <!-- context manager -->
  <text x="40" y="408" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">ContextManager / AutomaticContextCompactor（两代并存）</text>

  <rect x="40" y="426" width="380" height="84" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="230" y="452" text-anchor="middle" fill="#b388ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">v1：ContextManager</text>
  <text x="230" y="474" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">beforeLlmCall → checkpoint → evaluateTrigger</text>
  <text x="230" y="492" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">远程 count_tokens（headers/tools 必须透传）</text>

  <rect x="440" y="426" width="380" height="84" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="630" y="452" text-anchor="middle" fill="#b388ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">v2：AutomaticContextCompactor</text>
  <text x="630" y="474" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">PiBeforeLlmCallHook · inputTokens 超阈值或字节超限</text>
  <text x="630" y="492" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">tool_archive 归档旧工具结果（read 可读回）→ llm_checkpoint</text>

  <!-- other modules strip -->
  <text x="40" y="548" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">其余横切原语（IO-free · host ports 注入）</text>
  <text x="40" y="572" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">cron（CronRegistry host-ports + v2 Sqlite 重写版双轨）· goal（create/update/get 三工具，仅依赖 ThreadGoalStore 端口）</text>
  <text x="40" y="592" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">background-task（TaskRunner 注册表）· system-reminder（28 个 provider 责任链，critical 不被 allowlist 绕过）</text>
  <text x="40" y="612" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">conversation-contract（ConversationSource 14 值枚举 · ConversationIngress submit/steer 契约）</text>
</svg>
