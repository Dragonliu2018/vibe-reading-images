<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="16" font-weight="600">TUI 包：三入口汇合于同一 runtime</text>

  <rect x="40" y="70" width="240" height="130" rx="10" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="160" y="96" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">交互 TUI</text>
  <text x="160" y="120" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11.5">runTuiCli → launchTui()</text>
  <text x="160" y="140" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">createTuiApp + deferred runtime</text>
  <text x="160" y="158" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">首帧渲染与初始化并行</text>
  <text x="160" y="180" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">launcher.ts:489 Promise.race 汇合</text>

  <rect x="330" y="70" width="220" height="130" rx="10" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="440" y="96" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">headless exec</text>
  <text x="440" y="120" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11.5">runTuiExecCommand</text>
  <text x="440" y="140" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">runTuiExec + ExecRunSupervisor</text>
  <text x="440" y="160" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">quarantined 启动策略</text>
  <text x="440" y="180" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">无 questionnaire / permission 弹卡</text>

  <rect x="600" y="70" width="220" height="130" rx="10" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="710" y="96" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ACP</text>
  <text x="710" y="120" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11.5">runTuiAcpCommand</text>
  <text x="710" y="140" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">serveTuiAcpStdio</text>
  <text x="710" y="160" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">createTuiAcpAgent（2111 行）</text>
  <text x="710" y="180" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">console 重定向保 stdio 纯净</text>

  <line x1="160" y1="200" x2="400" y2="260" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="200" x2="430" y2="260" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="200" x2="470" y2="260" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="264" width="300" height="84" rx="10" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
  <text x="430" y="292" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">createTuiRuntime(surface)</text>
  <text x="430" y="314" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="11.5">runtime/lifecycle.ts</text>
  <text x="430" y="334" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">surface = 'tui' | 'headless' | 'acp' 能力门控</text>

  <line x1="430" y1="348" x2="430" y2="380" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="384" width="400" height="76" rx="10" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
  <text x="430" y="410" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">TuiRuntimeAdapter implements TuiRuntime</text>
  <text x="430" y="432" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">9 个 Access 分片：Session / Conversation / Product / Interaction / Event /</text>
  <text x="430" y="450" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">Delegation / Workspace / Plugin / Goal —— 包住 CliService</text>

  <line x1="430" y1="460" x2="430" y2="490" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="480" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">进程内直调 · AsyncGenerator</text>

  <rect x="230" y="494" width="400" height="46" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="430" y="522" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="12.5">CliService（@mavis/local-runtime-v2）</text>
</svg>
