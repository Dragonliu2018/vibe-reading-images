<svg xmlns="http://www.w3.org/2000/svg" width="860" height="780" viewBox="0 0 860 780">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect width="860" height="780" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="16" font-weight="600">MiniMax Code（mcode）分层架构</text>

  <!-- 前端层 -->
  <rect x="40" y="60" width="780" height="108" rx="10" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="430" y="84" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">前端层 packages/tui</text>
  <rect x="64" y="98" width="220" height="52" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="174" y="119" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="13">交互 TUI</text>
  <text x="174" y="138" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="11">launcher · TuiChatController</text>
  <rect x="320" y="98" width="220" height="52" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="430" y="119" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="13">headless exec</text>
  <text x="430" y="138" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="11">runTuiExecCommand</text>
  <rect x="576" y="98" width="220" height="52" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="686" y="119" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="13">ACP</text>
  <text x="686" y="138" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="11">createTuiAcpAgent</text>

  <line x1="430" y1="168" x2="430" y2="200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="190" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="11">TuiRuntimeAdapter · AsyncGenerator 流</text>

  <!-- local 门面层 -->
  <rect x="40" y="204" width="780" height="88" rx="10" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="430" y="228" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">进程内门面 local-runtime-v2/src/local + application</text>
  <rect x="180" y="240" width="500" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="430" y="266" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="13">CliService → RuntimeApplications（session / conversation / queue）</text>

  <line x1="430" y1="292" x2="430" y2="324" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

