<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" fill="#e8eaf2" font-family="system-ui, sans-serif" font-size="16" font-weight="600">插件：安装 → 快照 → 发布 → Hook 注入</text>

  <!-- sources -->
  <rect x="40" y="70" width="230" height="88" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="155" y="98" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">官方 registry</text>
  <text x="155" y="120" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">official-reconciler 同步</text>
  <text x="155" y="138" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">materializeOfficialPluginArchive</text>

  <rect x="310" y="70" width="230" height="88" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="425" y="98" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">GitHub 导入</text>
  <text x="425" y="120" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">github-plugin-importer.prepare</text>
  <text x="425" y="138" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">暂存 → 查重 → 接受</text>

  <rect x="580" y="70" width="240" height="88" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="700" y="98" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">本地 dataDir/plugins</text>
  <text x="700" y="120" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">LocalPluginDirectoryWatcher</text>
  <text x="700" y="138" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">变更自动触发发布</text>

  <line x1="155" y1="158" x2="410" y2="200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="158" x2="428" y2="200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="158" x2="450" y2="200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- unified -->
  <rect x="230" y="204" width="400" height="84" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="430" y="230" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ReadPluginPackage（统一模型）</text>
  <text x="430" y="252" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">skills / mcpServers / hooks / hostBindings / miniapp / apps</text>
  <text x="430" y="272" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">兼容 MINIMAX / CLAUDE / CODEX 三种 manifest 格式</text>

  <line x1="430" y1="288" x2="430" y2="318" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- snapshot -->
  <rect x="230" y="322" width="400" height="76" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.4"/>
  <text x="430" y="348" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PluginSnapshot（deep-frozen · revision）</text>
  <text x="430" y="370" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">PluginSnapshotBuilder.build · 逐层 Object.freeze</text>
  <text x="430" y="388" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">MCP server 名经 McpNameRegistry 命名空间分配</text>

  <line x1="430" y1="398" x2="430" y2="426" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- publish -->
  <rect x="230" y="430" width="400" height="76" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="430" y="456" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="13" font-weight="600">发布事务（turn 系统门闩）</text>
  <text x="430" y="478" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">publicationPort.tryPublish → mcpRuntime.reconcile</text>
  <text x="430" y="496" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">→ adoptPublishedSnapshot（revision 引用计数保活旧快照）</text>

  <!-- hook injection side -->
  <path d="M630,468 H700 V362 H670" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" marker-end="url(#arrow)"/>
  <text x="706" y="420" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">turn 组装时快照式取用</text>

  <rect x="670" y="240" width="160" height="90" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="750" y="266" text-anchor="middle" fill="#b388ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Hook 注入 turn</text>
  <text x="750" y="288" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">PreToolUse（15s 预算）</text>
  <text x="750" y="306" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">deny → block · updatedInput</text>
  <text x="750" y="322" text-anchor="middle" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="10.5">改写工具入参</text>

  <!-- miniapp note -->
  <text x="40" y="530" fill="#8b93b8" font-family="system-ui, sans-serif" font-size="11">MiniApp：插件包声明的 Node 子进程（nodeEntry）→ DefaultMiniAppSupervisor 世代/租约管理 · 30s idle 停进程 · hostConnector NDJSON 帧协议</text>
</svg>
