  <text x="430" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">实际执行是 demand-driven：codegen 触发 optimized_mir → mir_borrowck → typeck → mir_built → lower_to_hir → resolver</text>
