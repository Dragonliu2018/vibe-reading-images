<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b388ff"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
  </defs>

  <rect width="820" height="560" fill="#0b0d14"/>

  <text x="410" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">RTK 模块依赖关系</text>

  <!-- main.rs entry (top) -->
  <rect x="340" y="46" width="140" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.3"/>
  <text x="410" y="71" text-anchor="middle" fill="#e6e8f0" font-size="13">main.rs 路由</text>

  <!-- cmds (left top) -->
  <rect x="40" y="120" width="170" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.3"/>
  <text x="125" y="144" text-anchor="middle" fill="#ff6b9d" font-size="13" font-weight="600">cmds/</text>
  <text x="125" y="162" text-anchor="middle" fill="#9aa3c2" font-size="11">100+ 命令处理器</text>

  <!-- hooks (right top) -->
  <rect x="610" y="120" width="170" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.3"/>
  <text x="695" y="144" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="600">hooks/</text>
  <text x="695" y="162" text-anchor="middle" fill="#9aa3c2" font-size="11">Agent 集成 / 改写</text>

  <!-- parser (left mid) -->
  <rect x="40" y="250" width="170" height="56" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.3"/>
  <text x="125" y="274" text-anchor="middle" fill="#80c7ff" font-size="13" font-weight="600">parser/</text>
  <text x="125" y="292" text-anchor="middle" fill="#9aa3c2" font-size="11">OutputParser / Formatter</text>

  <!-- core (center) — the hub -->
  <rect x="310" y="236" width="200" height="84" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="410" y="262" text-anchor="middle" fill="#6c8ef5" font-size="14" font-weight="700">core/</text>
  <text x="410" y="280" text-anchor="middle" fill="#e6e8f0" font-size="12">runner · stream</text>
  <text x="410" y="296" text-anchor="middle" fill="#e6e8f0" font-size="12">tracking · guard</text>
  <text x="410" y="312" text-anchor="middle" fill="#9aa3c2" font-size="11">filter · toml_filter · tee</text>

  <!-- discover (right mid) -->
  <rect x="610" y="250" width="170" height="56" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.3"/>
  <text x="695" y="274" text-anchor="middle" fill="#b388ff" font-size="13" font-weight="600">discover/</text>
  <text x="695" y="292" text-anchor="middle" fill="#9aa3c2" font-size="11">registry · lexer · rules</text>

  <!-- analytics (left bottom) -->
  <rect x="40" y="398" width="170" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.3"/>
  <text x="125" y="422" text-anchor="middle" fill="#f9ca24" font-size="13" font-weight="600">analytics/</text>
  <text x="125" y="440" text-anchor="middle" fill="#9aa3c2" font-size="11">gain · cc_economics</text>

  <!-- learn (right bottom) -->
  <rect x="610" y="398" width="170" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.3"/>
  <text x="695" y="422" text-anchor="middle" fill="#f9ca24" font-size="13" font-weight="600">learn/</text>
  <text x="695" y="440" text-anchor="middle" fill="#9aa3c2" font-size="11">CLI 修正模式检测</text>

  <!-- legend (bottom) -->
  <text x="300" y="500" fill="#9aa3c2" font-size="11">依赖方向：消费者 → 被依赖模块</text>
  <line x1="300" y1="510" x2="330" y2="510" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="500" fill="#9aa3c2" font-size="11">core 为全局 hub（最高扇入）</text>

  <!-- arrows: main → cmds (L-shape to cmds top-center), main → hooks (L-shape to hooks top-center) -->
  <path d="M340 86 L125 86 L125 120" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M480 86 L695 86 L695 120" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- cmds → core (right, mid level) -->
  <path d="M210 158 L260 158 L260 278 L308 278" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="232" y="152" fill="#9aa3c2" font-size="11">exec/filter/track</text>

  <!-- cmds → parser (down) -->
  <path d="M125 176 L125 248" stroke="#ff6b9d" stroke-width="1.3" fill="none" marker-end="url(#arrow-pink)" opacity="0.7"/>
  <text x="135" y="216" fill="#9aa3c2" font-size="11">uses</text>

  <!-- parser → core (right) -->
  <path d="M210 278 L308 278" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- hooks → discover (down) -->
  <path d="M695 176 L695 248" stroke="#b388ff" stroke-width="1.3" fill="none" marker-end="url(#arrow-purple)" opacity="0.85"/>
  <text x="705" y="216" fill="#9aa3c2" font-size="11">rewrite</text>

  <!-- hooks → core (left, mid) — bridge over discover to avoid crossing cmds→core? cmds→core is at y158/278 left side; this goes left at y200 -->
  <path d="M610 158 L560 158 L560 278 L512 278" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- discover → core (left) -->
  <path d="M610 278 L512 278" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- analytics → core (up-right) -->
  <path d="M210 426 L260 426 L260 306 L308 306" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="232" y="420" fill="#9aa3c2" font-size="11">读 SQLite</text>

  <!-- analytics → discover relationship omitted from graph: route would cross learn box; analytics also uses discover/provider (see text) -->

  <!-- learn → discover (up) -->
  <path d="M695 398 L695 308" stroke="#b388ff" stroke-width="1.3" fill="none" marker-end="url(#arrow-purple)" opacity="0.7"/>
  <text x="705" y="366" fill="#9aa3c2" font-size="11">provider</text>
</svg>
