<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
  </defs>

  <rect width="860" height="580" fill="#0b0d14"/>

  <text x="430" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">RTK 端到端请求流程</text>

  <!-- Phase labels on left -->
  <text x="20" y="76" fill="#9aa3c2" font-size="11">拦截层</text>
  <text x="20" y="206" fill="#9aa3c2" font-size="11">执行层</text>
  <text x="20" y="406" fill="#9aa3c2" font-size="11">统计层</text>

  <!-- Row 1: Hook interception path -->
  <rect x="150" y="46" width="150" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.3"/>
  <text x="225" y="68" text-anchor="middle" fill="#e6e8f0" font-size="12">LLM Agent</text>
  <text x="225" y="86" text-anchor="middle" fill="#9aa3c2" font-size="11">git status</text>

  <path d="M300 74 L350 74" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>

  <rect x="350" y="46" width="170" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.3"/>
  <text x="435" y="68" text-anchor="middle" fill="#e6e8f0" font-size="12">PreToolUse hook</text>
  <text x="435" y="86" text-anchor="middle" fill="#9aa3c2" font-size="11">hook_cmd.rs</text>

  <path d="M520 74 L570 74" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>

  <rect x="570" y="46" width="170" height="56" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.3"/>
  <text x="655" y="68" text-anchor="middle" fill="#e6e8f0" font-size="12">registry::rewrite_command</text>
  <text x="655" y="86" text-anchor="middle" fill="#9aa3c2" font-size="11">→ "rtk git status"</text>

  <!-- connector row1 end → row2 start (down then left) -->
  <path d="M655 102 L655 130 L80 130 L80 174" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="90" y="124" fill="#9aa3c2" font-size="11">agent 执行改写后命令</text>

  <!-- Row 2: Execution path (6-phase lifecycle) -->
  <rect x="40" y="174" width="130" height="56" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.3"/>
  <text x="105" y="196" text-anchor="middle" fill="#e6e8f0" font-size="12">① Parse</text>
  <text x="105" y="214" text-anchor="middle" fill="#9aa3c2" font-size="11">main.rs Clap</text>

  <path d="M170 202 L200 202" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="200" y="174" width="130" height="56" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.3"/>
  <text x="265" y="196" text-anchor="middle" fill="#e6e8f0" font-size="12">② Route</text>
  <text x="265" y="214" text-anchor="middle" fill="#9aa3c2" font-size="11">git::run</text>

  <path d="M330 202 L360 202" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="360" y="174" width="140" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.3"/>
  <text x="430" y="196" text-anchor="middle" fill="#e6e8f0" font-size="12">③ Execute</text>
  <text x="430" y="214" text-anchor="middle" fill="#9aa3c2" font-size="11">runner→stream spawn</text>

  <path d="M500 202 L530 202" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="530" y="174" width="140" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.3"/>
  <text x="600" y="196" text-anchor="middle" fill="#e6e8f0" font-size="12">④ Filter</text>
  <text x="600" y="214" text-anchor="middle" fill="#9aa3c2" font-size="11">format_git_output</text>

  <path d="M670 202 L700 202" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="700" y="174" width="130" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.3"/>
  <text x="765" y="196" text-anchor="middle" fill="#e6e8f0" font-size="12">⑤ Guard</text>
  <text x="765" y="214" text-anchor="middle" fill="#9aa3c2" font-size="11">never_worse</text>

  <!-- raw output 10MiB cap note -->
  <text x="430" y="250" text-anchor="middle" fill="#9aa3c2" font-size="10">子进程 stdout/stderr 捕获（10MiB 上限，ChildGuard 防 zombie）</text>

  <!-- connector to row 3 -->
  <path d="M765 230 L765 260 L430 260 L430 300" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="595" y="278" fill="#9aa3c2" font-size="11">filtered ≤ raw</text>

  <!-- Row 3: Print + Track + output -->
  <rect x="200" y="300" width="140" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.3"/>
  <text x="270" y="322" text-anchor="middle" fill="#e6e8f0" font-size="12">⑥ Print</text>
  <text x="270" y="340" text-anchor="middle" fill="#9aa3c2" font-size="11">stdout</text>

  <path d="M340 328 L390 328" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="390" y="300" width="160" height="56" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.3"/>
  <text x="470" y="322" text-anchor="middle" fill="#e6e8f0" font-size="12">tracking::track</text>
  <text x="470" y="340" text-anchor="middle" fill="#9aa3c2" font-size="11">SQLite (bytes/4)</text>

  <path d="M550 328 L600 328" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="600" y="300" width="170" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.3"/>
  <text x="685" y="322" text-anchor="middle" fill="#e6e8f0" font-size="12">Agent 读到压缩输出</text>
  <text x="685" y="340" text-anchor="middle" fill="#9aa3c2" font-size="11">85-99% 减少</text>

  <!-- analytics sidecar reads SQLite -->
  <rect x="390" y="400" width="160" height="50" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="470" y="420" text-anchor="middle" fill="#e6e8f0" font-size="12">analytics/gain.rs</text>
  <text x="470" y="438" text-anchor="middle" fill="#9aa3c2" font-size="11">rtk gain 仪表盘</text>
  <path d="M470 356 L470 398" stroke="#f9ca24" stroke-width="1.3" fill="none" marker-end="url(#arrow)" opacity="0.6" stroke-dasharray="5 4"/>
  <text x="478" y="384" fill="#9aa3c2" font-size="10">读历史</text>

  <!-- fail-safe note -->
  <text x="430" y="478" text-anchor="middle" fill="#9aa3c2" font-size="11">降级链：filter panic → 透传 raw stdout · 命令失败 → skip_filter_on_failure 直出 · exit code 传播</text>
  <text x="430" y="498" text-anchor="middle" fill="#9aa3c2" font-size="11">单线程无 async · LazyLock 编译 regex · &lt;10ms 代理开销</text>
</svg>
