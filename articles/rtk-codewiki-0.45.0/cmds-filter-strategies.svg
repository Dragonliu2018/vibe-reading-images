<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <rect width="820" height="560" fill="#0b0d14"/>

  <text x="410" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">RTK 命令过滤策略分类</text>
  <text x="410" y="44" text-anchor="middle" fill="#9aa3c2" font-size="12">12 类过滤策略 · 策略→使用命令 · 压缩率</text>

  <!-- Row 1 -->
  <rect x="40" y="62" width="180" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="130" y="84" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">1 统计提取</text>
  <text x="130" y="102" text-anchor="middle" fill="#e6e8f0" font-size="11">git status/log/diff</text>
  <text x="130" y="120" text-anchor="middle" fill="#9aa3c2" font-size="11">pnpm list</text>
  <text x="130" y="136" text-anchor="middle" fill="#f9ca24" font-size="11">90-99%</text>

  <rect x="240" y="62" width="180" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="330" y="84" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">2 仅错误</text>
  <text x="330" y="102" text-anchor="middle" fill="#e6e8f0" font-size="11">runner err 模式</text>
  <text x="330" y="120" text-anchor="middle" fill="#9aa3c2" font-size="11">测试失败</text>
  <text x="330" y="136" text-anchor="middle" fill="#f9ca24" font-size="11">60-80%</text>

  <rect x="440" y="62" width="180" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="530" y="84" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">3 按模式分组</text>
  <text x="530" y="102" text-anchor="middle" fill="#e6e8f0" font-size="11">lint/tsc/grep</text>
  <text x="530" y="120" text-anchor="middle" fill="#9aa3c2" font-size="11">按 rule/file 分组</text>
  <text x="530" y="136" text-anchor="middle" fill="#f9ca24" font-size="11">80-90%</text>

  <rect x="640" y="62" width="140" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="710" y="84" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">4 去重</text>
  <text x="710" y="102" text-anchor="middle" fill="#e6e8f0" font-size="11">log_cmd</text>
  <text x="710" y="120" text-anchor="middle" fill="#9aa3c2" font-size="11">Unique+count</text>
  <text x="710" y="136" text-anchor="middle" fill="#f9ca24" font-size="11">70-85%</text>

  <!-- Row 2 -->
  <rect x="40" y="158" width="180" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="130" y="180" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">5 仅结构</text>
  <text x="130" y="198" text-anchor="middle" fill="#e6e8f0" font-size="11">json_cmd</text>
  <text x="130" y="216" text-anchor="middle" fill="#9aa3c2" font-size="11">Keys+types</text>
  <text x="130" y="232" text-anchor="middle" fill="#f9ca24" font-size="11">80-95%</text>

  <rect x="240" y="158" width="180" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="330" y="180" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">6 代码过滤</text>
  <text x="330" y="198" text-anchor="middle" fill="#e6e8f0" font-size="11">read/smart</text>
  <text x="330" y="216" text-anchor="middle" fill="#9aa3c2" font-size="11">None/Min/Aggressive</text>
  <text x="330" y="232" text-anchor="middle" fill="#f9ca24" font-size="11">20-90%</text>

  <rect x="440" y="158" width="180" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="530" y="180" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">7 失败聚焦</text>
  <text x="530" y="198" text-anchor="middle" fill="#e6e8f0" font-size="11">vitest/playwright</text>
  <text x="530" y="216" text-anchor="middle" fill="#9aa3c2" font-size="11">隐通过，显失败</text>
  <text x="530" y="232" text-anchor="middle" fill="#f9ca24" font-size="11">94-99%</text>

  <rect x="640" y="158" width="140" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="710" y="180" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">8 树形压缩</text>
  <text x="710" y="198" text-anchor="middle" fill="#e6e8f0" font-size="11">ls</text>
  <text x="710" y="216" text-anchor="middle" fill="#9aa3c2" font-size="11">扁平→树+计数</text>
  <text x="710" y="232" text-anchor="middle" fill="#f9ca24" font-size="11">50-70%</text>

  <!-- Row 3 -->
  <rect x="40" y="254" width="180" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="130" y="276" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">9 进度过滤</text>
  <text x="130" y="294" text-anchor="middle" fill="#e6e8f0" font-size="11">wget/pnpm install</text>
  <text x="130" y="312" text-anchor="middle" fill="#9aa3c2" font-size="11">剥 ANSI 进度条</text>
  <text x="130" y="328" text-anchor="middle" fill="#f9ca24" font-size="11">85-95%</text>

  <rect x="240" y="254" width="180" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="330" y="276" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">10 JSON/文本双模</text>
  <text x="330" y="294" text-anchor="middle" fill="#e6e8f0" font-size="11">ruff/pip</text>
  <text x="330" y="312" text-anchor="middle" fill="#9aa3c2" font-size="11">JSON 优先</text>
  <text x="330" y="328" text-anchor="middle" fill="#f9ca24" font-size="11">80%+</text>

  <rect x="440" y="254" width="180" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="530" y="276" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">11 状态机解析</text>
  <text x="530" y="294" text-anchor="middle" fill="#e6e8f0" font-size="11">pytest</text>
  <text x="530" y="312" text-anchor="middle" fill="#9aa3c2" font-size="11">test_name→PASS/FAIL</text>
  <text x="530" y="328" text-anchor="middle" fill="#f9ca24" font-size="11">90%+</text>

  <rect x="640" y="254" width="140" height="78" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="710" y="276" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">12 NDJSON 流</text>
  <text x="710" y="294" text-anchor="middle" fill="#e6e8f0" font-size="11">go test</text>
  <text x="710" y="312" text-anchor="middle" fill="#9aa3c2" font-size="11">逐行 JSON 聚合</text>
  <text x="710" y="328" text-anchor="middle" fill="#f9ca24" font-size="11">90%+</text>

  <!-- run → exec → filter → guard → track pipeline -->
  <text x="410" y="362" text-anchor="middle" fill="#6c8ef5" font-size="13" font-weight="600">统一执行骨架（模板方法）</text>
  <rect x="60" y="374" width="120" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.3"/>
  <text x="120" y="398" text-anchor="middle" fill="#e6e8f0" font-size="12">run()</text>
  <path d="M180 394 L210 394" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="210" y="374" width="130" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.3"/>
  <text x="275" y="398" text-anchor="middle" fill="#e6e8f0" font-size="12">exec 子进程</text>
  <path d="M340 394 L370 394" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="370" y="374" width="120" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.3"/>
  <text x="430" y="398" text-anchor="middle" fill="#e6e8f0" font-size="12">filter 过滤</text>
  <path d="M490 394 L520 394" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="520" y="374" width="120" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.3"/>
  <text x="580" y="398" text-anchor="middle" fill="#e6e8f0" font-size="12">never_worse</text>
  <path d="M640 394 L670 394" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="670" y="374" width="110" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.3"/>
  <text x="725" y="398" text-anchor="middle" fill="#e6e8f0" font-size="12">track 记录</text>

  <!-- passthrough fallback note -->
  <rect x="40" y="448" width="740" height="50" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="410" y="470" text-anchor="middle" fill="#4ecdc4" font-size="12" font-weight="600">三层 passthrough 兜底</text>
  <text x="410" y="488" text-anchor="middle" fill="#9aa3c2" font-size="11">命令级 Other→run_passthrough · 全局 run_fallback→toml_filter→raw · 解析失败→raw</text>

  <text x="410" y="528" text-anchor="middle" fill="#9aa3c2" font-size="11">每命令独立文件而非统一注册表——过滤逻辑差异极大，无法抽象成同一接口</text>
</svg>
