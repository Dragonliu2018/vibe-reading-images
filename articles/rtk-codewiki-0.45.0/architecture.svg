<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>

  <rect width="820" height="560" fill="#0b0d14"/>

  <text x="410" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="600">RTK 分层架构</text>

  <!-- Layer 1: Agent 集成层 -->
  <rect x="40" y="50" width="740" height="80" rx="10" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="72" fill="#4ecdc4" font-size="13" font-weight="600">Agent 集成层</text>
  <rect x="60" y="82" width="200" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="160" y="106" text-anchor="middle" fill="#e6e8f0" font-size="13">hooks/init.rs</text>
  <rect x="310" y="82" width="200" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="410" y="106" text-anchor="middle" fill="#e6e8f0" font-size="13">hooks/hook_cmd.rs</text>
  <rect x="560" y="82" width="200" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="660" y="106" text-anchor="middle" fill="#e6e8f0" font-size="13">hooks/rewrite_cmd.rs</text>

  <!-- arrow L1 -> L2 -->
  <path d="M410 130 L410 158" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="420" y="148" fill="#9aa3c2" font-size="11">PreToolUse</text>

  <!-- Layer 2: CLI 路由层 -->
  <rect x="40" y="158" width="740" height="72" rx="10" fill="none" stroke="#80c7ff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="180" fill="#80c7ff" font-size="13" font-weight="600">CLI 入口与路由</text>
  <rect x="150" y="188" width="240" height="34" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="270" y="210" text-anchor="middle" fill="#e6e8f0" font-size="13">main.rs (Clap Commands enum)</text>
  <rect x="430" y="188" width="240" height="34" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="550" y="210" text-anchor="middle" fill="#e6e8f0" font-size="13">parser/ (formatter, types)</text>

  <!-- arrow L2 -> L3 -->
  <path d="M410 230 L410 258" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="420" y="248" fill="#9aa3c2" font-size="11">route</text>

  <!-- Layer 3: 核心引擎层 -->
  <rect x="40" y="258" width="740" height="92" rx="10" fill="none" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="280" fill="#6c8ef5" font-size="13" font-weight="600">核心引擎层</text>
  <rect x="60" y="290" width="168" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="144" y="310" text-anchor="middle" fill="#e6e8f0" font-size="13">core/runner.rs</text>
  <text x="144" y="328" text-anchor="middle" fill="#9aa3c2" font-size="11">子进程执行</text>
  <rect x="248" y="290" width="168" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="332" y="310" text-anchor="middle" fill="#e6e8f0" font-size="13">core/stream.rs</text>
  <text x="332" y="328" text-anchor="middle" fill="#9aa3c2" font-size="11">exec_capture 捕获</text>
  <rect x="436" y="290" width="168" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="520" y="310" text-anchor="middle" fill="#e6e8f0" font-size="13">core/tracking.rs</text>
  <text x="520" y="328" text-anchor="middle" fill="#9aa3c2" font-size="11">SQLite 统计</text>
  <rect x="624" y="290" width="144" height="50" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="696" y="310" text-anchor="middle" fill="#e6e8f0" font-size="13">guard / truncate</text>
  <text x="696" y="328" text-anchor="middle" fill="#9aa3c2" font-size="11">never_worse 降级</text>

  <!-- arrow L3 -> L4 -->
  <path d="M410 350 L410 378" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="420" y="368" fill="#9aa3c2" font-size="11">exec + filter</text>

  <!-- Layer 4: 命令处理器层 -->
  <rect x="40" y="378" width="740" height="80" rx="10" fill="none" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="400" fill="#ff6b9d" font-size="13" font-weight="600">命令处理器层</text>
  <rect x="60" y="410" width="120" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="120" y="434" text-anchor="middle" fill="#e6e8f0" font-size="12">cmds/git/</text>
  <rect x="194" y="410" width="120" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="254" y="434" text-anchor="middle" fill="#e6e8f0" font-size="12">cmds/rust/</text>
  <rect x="328" y="410" width="120" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="388" y="434" text-anchor="middle" fill="#e6e8f0" font-size="12">cmds/js/</text>
  <rect x="462" y="410" width="120" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="522" y="434" text-anchor="middle" fill="#e6e8f0" font-size="12">cmds/python/</text>
  <rect x="596" y="410" width="172" height="38" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="682" y="434" text-anchor="middle" fill="#e6e8f0" font-size="12">+ 7 类 ecosystem</text>

  <!-- sidecar: discover (改写引擎) — feeds Layer 1 rewrite_cmd -->
  <rect x="40" y="478" width="360" height="64" rx="10" fill="none" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="500" fill="#b388ff" font-size="13" font-weight="600">改写引擎（被 Hook 调用）</text>
  <rect x="60" y="508" width="150" height="28" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="135" y="526" text-anchor="middle" fill="#e6e8f0" font-size="12">discover/registry.rs</text>
  <rect x="226" y="508" width="158" height="28" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="305" y="526" text-anchor="middle" fill="#e6e8f0" font-size="12">lexer.rs / rules.rs</text>

  <!-- sidecar: analytics (读 tracking DB) -->
  <rect x="420" y="478" width="360" height="64" rx="10" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="436" y="500" fill="#f9ca24" font-size="13" font-weight="600">统计分析（读 SQLite）</text>
  <rect x="440" y="508" width="150" height="28" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="515" y="526" text-anchor="middle" fill="#e6e8f0" font-size="12">analytics/gain.rs</text>
  <rect x="606" y="508" width="162" height="28" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="687" y="526" text-anchor="middle" fill="#e6e8f0" font-size="12">cc_economics.rs</text>

  <!-- sidecar relationship labels already state "被 Hook 调用" / "读 SQLite"; arrows omitted to avoid crossing layer boxes (see module-dependencies.svg for full dep graph) -->
</svg>
