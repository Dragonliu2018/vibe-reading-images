<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#0b0d14"/>
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#e6e9f5">OceanBase 核心状态机（2PC 提交 · leader 选举）</text>

  <!-- Partition 1: 2PC -->
  <text x="40" y="64" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6c8ef5">分布式事务 2PC 状态机（ObTxCycleTwoPhaseCommitter，tx/ob_committer_define.h）</text>
  <rect x="40" y="84" width="100" height="38" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="90" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">INIT</text>
  <rect x="165" y="84" width="100" height="38" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="215" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">REDO_COMPLETE</text>
  <rect x="290" y="84" width="100" height="38" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="340" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">PREPARE</text>
  <rect x="415" y="84" width="100" height="38" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="465" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">PRE_COMMIT</text>
  <rect x="540" y="84" width="100" height="38" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="590" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">COMMIT</text>
  <rect x="665" y="84" width="100" height="38" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="715" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">CLEAR</text>

  <line x1="140" y1="103" x2="165" y2="103" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="265" y1="103" x2="290" y2="103" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="103" x2="415" y2="103" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="515" y1="103" x2="540" y2="103" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="103" x2="665" y2="103" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 90,84 L 90,52 L 590,52 L 590,84" fill="none" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="340" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">单参与者一阶段提交（SP_TRANS）</text>

  <rect x="290" y="160" width="100" height="34" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="340" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">ABORT</text>
  <line x1="340" y1="122" x2="340" y2="160" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <text x="356" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">任一阶段失败</text>
  <path d="M 390,177 L 715,177 L 715,122" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Partition 2: leader election -->
  <text x="40" y="236" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4ecdc4">Palf leader 选举与角色状态机（LogStateMgr，logservice/palf/log_state_mgr.h）</text>
  <rect x="90" y="256" width="140" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="160" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">FOLLOWER</text>
  <rect x="330" y="256" width="140" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">RECONFIRM</text>
  <rect x="570" y="256" width="150" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="645" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6e9f5">LEADER（ACTIVE）</text>

  <line x1="230" y1="275" x2="330" y2="275" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">赢得选举</text>
  <line x1="470" y1="275" x2="570" y2="275" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">日志对齐完成</text>
  <path d="M 645,294 L 645,322 L 160,322 L 160,294" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">卸任 / 切主 / 被更高优先级抢占（reconfirm 失败回退至 FOLLOWER）</text>
</svg>
