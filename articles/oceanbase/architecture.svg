<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="800" height="700" fill="#0b0d14"/>
  <text x="400" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#e6e9f5">OceanBase 单进程 observer 分层架构</text>

  <!-- 接入层 -->
  <rect x="30" y="58" width="740" height="96" rx="10" fill="#0e1122" stroke="#232848" stroke-width="1"/>
  <text x="48" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#4ecdc4">接入层</text>
  <rect x="60" y="90" width="330" height="52" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="225" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">observer</text>
  <text x="225" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">MySQL 协议 · omt 多租户 · 虚拟表</text>
  <rect x="420" y="90" width="320" height="52" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="580" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">rootserver（RS）</text>
  <text x="580" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">DDL · 均衡 · unit · 心跳（sys LS leader）</text>

  <line x1="230" y1="154" x2="230" y2="184" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="154" x2="570" y2="184" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SQL 引擎层 -->
  <rect x="30" y="184" width="740" height="96" rx="10" fill="#0e1122" stroke="#232848" stroke-width="1"/>
  <text x="48" y="206" font-family="system-ui, sans-serif" font-size="13" fill="#6c8ef5">SQL 引擎层</text>
  <rect x="60" y="216" width="210" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="165" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">SQL 编译前端</text>
  <text x="165" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">parser→resolver→rewrite→optimizer</text>
  <rect x="295" y="216" width="210" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">SQL 执行引擎</text>
  <text x="400" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">算子 · 表达式向量化 · DAS · PX</text>
  <rect x="530" y="216" width="210" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="635" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">PL/SQL 引擎</text>
  <text x="635" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">PL 编译 · objit（LLVM JIT）· SPI</text>

  <line x1="230" y1="280" x2="230" y2="310" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="280" x2="570" y2="310" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 分布式内核层 -->
  <rect x="30" y="310" width="740" height="96" rx="10" fill="#0e1122" stroke="#232848" stroke-width="1"/>
  <text x="48" y="332" font-family="system-ui, sans-serif" font-size="13" fill="#f9ca24">分布式内核层</text>
  <rect x="60" y="342" width="210" height="52" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="165" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">logservice</text>
  <text x="165" y="381" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">Palf · LS · apply/replay · 选举</text>
  <rect x="295" y="342" width="210" height="52" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">storage</text>
  <text x="400" y="381" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">tablet · memtable · SSTable</text>
  <rect x="530" y="342" width="210" height="52" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="635" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">tx</text>
  <text x="635" y="381" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">2PC · MVCC · tx_table</text>

  <line x1="230" y1="406" x2="230" y2="436" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="406" x2="570" y2="436" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 共享服务层 -->
  <rect x="30" y="436" width="740" height="96" rx="10" fill="#0e1122" stroke="#232848" stroke-width="1"/>
  <text x="48" y="458" font-family="system-ui, sans-serif" font-size="13" fill="#80c7ff">共享服务层</text>
  <rect x="60" y="468" width="680" height="52" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="400" y="489" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">share</text>
  <text x="400" y="507" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">schema 多版本 · location cache · IO mClock · 统计信息 · 系统变量 · 内表生成代码</text>

  <line x1="230" y1="532" x2="230" y2="562" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="532" x2="570" y2="562" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 基础库层 -->
  <rect x="30" y="562" width="740" height="96" rx="10" fill="#0e1122" stroke="#232848" stroke-width="1"/>
  <text x="48" y="584" font-family="system-ui, sans-serif" font-size="13" fill="#b388ff">基础库层</text>
  <rect x="60" y="594" width="430" height="52" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="275" y="615" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">oblib</text>
  <text x="275" y="633" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">Worker 线程模型 · MemoryContext · ObLatch · RPC 框架</text>
  <rect x="510" y="594" width="230" height="52" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="625" y="615" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6e9f5">easy</text>
  <text x="625" y="633" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">Reactor 网络库（魔改）</text>

  <text x="400" y="684" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b93b8">箭头 = 依赖方向（上层依赖下层）；rootserver 逻辑内嵌于 observer 进程，在 sys 租户 1 号日志流 leader 上激活</text>
</svg>
