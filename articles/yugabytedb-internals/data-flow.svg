<rect x="225" y="636" width="370" height="48" rx="7" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="410" y="656" text-anchor="middle" fill="#e8eaf2" font-size="13.5" font-weight="600">Apply 到 DocDB</text>
