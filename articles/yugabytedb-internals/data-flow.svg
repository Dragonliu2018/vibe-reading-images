<text x="40" y="715" fill="#7a93b8" font-size="11">左列：YSQL 单行 INSERT 下推（PG backend 进程内 pggate）· 右列：YBClient 存储 API 直写 · 底部汇合为公共 Raft→Apply→DocDB 链</text>
