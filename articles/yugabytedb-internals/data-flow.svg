<text x="560" y="394" text-anchor="middle" fill="#8a93b8" font-size="10">YBSession 批量 + write_id</text>
<rect x="225" y="426" width="370" height="48" rx="7" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
