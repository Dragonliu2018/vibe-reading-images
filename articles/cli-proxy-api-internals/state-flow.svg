<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="540" fill="#0b0d14"/>
  <text x="420" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#e8ecf5" font-weight="600">凭据调度状态机（authScheduler.scheduledState）</text>

  <!-- Ready -->
  <rect x="335" y="260" width="170" height="50" rx="10" fill="#13162a" stroke="#4ecdc4" stroke-width="2"/>
  <text x="420" y="281" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e8ecf5">Ready</text>
  <text x="420" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">可被 Selector 选中</text>

  <!-- Cooldown -->
  <rect x="580" y="130" width="190" height="50" rx="10" fill="#13162a" stroke="#f9ca24" stroke-width="2"/>
  <text x="675" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e8ecf5">Cooldown（模型级）</text>
  <text x="675" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">指数退避 1s×2ⁿ 封顶 30min</text>

  <!-- Blocked -->
  <rect x="580" y="390" width="190" height="50" rx="10" fill="#13162a" stroke="#e74c3c" stroke-width="2"/>
  <text x="675" y="411" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e8ecf5">Blocked（凭据级）</text>
  <text x="675" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">5h/7d 窗口 · 整凭据跨模型</text>

  <!-- Disabled -->
  <rect x="90" y="130" width="170" height="50" rx="10" fill="#13162a" stroke="#b388ff" stroke-width="2"/>
  <text x="175" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e8ecf5">Disabled</text>
  <text x="175" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">管理面板 / 文件删除</text>

  <!-- Ready -> Cooldown -->
  <path d="M 445 260 L 445 140 L 580 140" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">429 · 5xx · 401（单模型降权）</text>

  <!-- Cooldown -> Ready -->
  <path d="M 580 168 L 475 168 L 475 260" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="488" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">退避到期 promoteExpired</text>

  <!-- Ready -> Blocked -->
  <path d="M 445 310 L 445 400 L 580 400" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">Anthropic 5h/7d 统一窗口 rejected</text>

  <!-- Blocked -> Ready -->
  <path d="M 580 428 L 475 428 L 475 310" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="488" y="470" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">Retry-After 到期恢复</text>

  <!-- Ready -> Disabled -->
  <path d="M 395 260 L 395 145 L 260 145" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="268" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">管理禁用 / auth 文件删除</text>

  <!-- Disabled -> Ready -->
  <path d="M 260 168 L 355 168 L 355 260" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="268" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">重新启用 / 文件恢复</text>

  <!-- 成功自恢复注释 -->
  <text x="420" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4ecdc4">成功请求 MarkResult 重置模型级冷却（resetModelState）</text>

  <!-- 补充说明 -->
  <text x="420" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">状态由 MarkResult in conductor_cooldown.go 写入 · 存 Auth.NextRetryAfter（凭据级）/ ModelState（模型级）· 重启后经 .cds 文件恢复</text>
</svg>
