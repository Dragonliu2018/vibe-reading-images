<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="600" fill="#0b0d14"/>
  <text x="420" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#e8ecf5" font-weight="600">一次流式代理请求的数据流（stream=true）</text>

  <!-- 客户端 -->
  <rect x="330" y="52" width="180" height="44" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="420" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">客户端</text>
  <text x="420" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">POST /v1/chat/completions</text>

  <!-- 左列：请求方向 -->
  <text x="160" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#80c7ff">请求方向</text>

  <rect x="60" y="146" width="200" height="44" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="160" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">API key 鉴权 + 中间件</text>
  <text x="160" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">AuthMiddleware · TraceID · 日志</text>

  <rect x="60" y="226" width="200" height="44" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="160" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Handler 解析请求体</text>
  <text x="160" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">ReadRequestBody → Request/Options</text>

  <rect x="60" y="306" width="200" height="44" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="160" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Conductor 选凭据</text>
  <text x="160" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">scheduler 分桶 · cooldown 过滤 · 重试</text>

  <rect x="60" y="386" width="200" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="160" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Executor 翻译请求</text>
  <text x="160" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">TranslateRequest → 上游 wire + 伪装/签名</text>

  <rect x="60" y="466" width="200" height="44" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="160" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">上游 API（HTTP / WebSocket）</text>
  <text x="160" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">uTLS 指纹客户端</text>

  <!-- 右列：响应方向 -->
  <text x="680" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4ecdc4">响应方向</text>

  <rect x="580" y="146" width="200" height="44" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="680" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">SSE 流式响应</text>
  <text x="680" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">data: {...} 帧 + Flush</text>

  <rect x="580" y="226" width="200" height="44" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="680" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">ForwardStream 转发循环</text>
  <text x="680" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">keep-alive · 终态错误帧</text>

  <rect x="580" y="306" width="200" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="680" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">bootstrap 重试 + 插件拦截</text>
  <text x="680" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">首帧前可换凭据 · StreamChunk 改写</text>

  <rect x="580" y="386" width="200" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="680" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Executor 逐行翻译</text>
  <text x="680" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">TranslateStream · param 状态机</text>

  <rect x="580" y="466" width="200" height="44" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="680" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">上游 SSE 流</text>
  <text x="680" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">后台 goroutine 逐行读取</text>

  <!-- 客户端 -> 左1 -->
  <path d="M 370 96 L 370 126 L 160 126 L 160 146" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 左列纵向箭头 -->
  <path d="M 160 190 L 160 226" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="214" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">rawJSON []byte</text>
  <path d="M 160 270 L 160 306" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="294" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">Request + Options</text>
  <path d="M 160 350 L 160 386" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">选中 Auth 凭据</text>
  <path d="M 160 430 L 160 466" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="454" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">上游 wire JSON</text>

  <!-- 底部：上游连接 -->
  <path d="M 260 488 L 580 488" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 右列纵向箭头（向上） -->
  <path d="M 680 466 L 680 430" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <path d="M 680 386 L 680 350" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <text x="690" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">StreamChunk chan</text>
  <path d="M 680 306 L 680 270" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <path d="M 680 226 L 680 190" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <text x="690" y="214" font-family="system-ui, sans-serif" font-size="10" fill="#9aa3bd">data: {...}</text>

  <!-- 右1 -> 客户端 -->
  <path d="M 680 146 L 680 126 L 470 126 L 470 96" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- 图例 -->
  <text x="60" y="548" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">灰色箭头 = 请求方向 · 青色箭头 = 响应方向 · 虚线框 = 进程外上游</text>
  <text x="60" y="568" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">失败路径：429/401 → MarkResult 写 cooldown → 换凭据重试（maxRetryCredentials 上限，Conductor 内闭环）</text>
</svg>
