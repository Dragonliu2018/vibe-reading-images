<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="640" fill="#0b0d14"/>
  <text x="420" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#e8ecf5" font-weight="600">CLIProxyAPI v7.3.16 分层架构</text>

  <!-- ===== L1 客户端层 ===== -->
  <text x="40" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#4ecdc4">客户端层</text>
  <rect x="30" y="72" width="140" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="100" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Claude Code</text>
  <rect x="186" y="72" width="140" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="256" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Codex CLI</text>
  <rect x="342" y="72" width="150" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="417" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">OpenAI / Claude SDK</text>
  <rect x="508" y="72" width="130" height="38" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="573" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">管理面板</text>

  <!-- L1 -> L2 -->
  <path d="M 100 110 L 100 148" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 256 110 L 256 148" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 417 110 L 417 148" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 573 110 L 573 148" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== L2 接入层 ===== -->
  <text x="40" y="172" font-family="system-ui, sans-serif" font-size="13" fill="#80c7ff">接入层 · internal/api + sdk/api/handlers</text>
  <rect x="30" y="182" width="180" height="44" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="120" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">协议 Handler</text>
  <text x="120" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">openai / claude / gemini</text>
  <rect x="226" y="182" width="180" height="44" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="316" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">API key 鉴权</text>
  <text x="316" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">sdk/access 中间件</text>
  <rect x="422" y="182" width="216" height="44" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="530" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Management API + 面板</text>
  <text x="530" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">/v0/management · bcrypt</text>
  <rect x="654" y="182" width="150" height="44" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="729" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">协议多路复用</text>
  <text x="729" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">HTTP + Redis 同端口</text>

  <!-- L2 -> L3 -->
  <path d="M 316 226 L 316 264" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== L3 调度层 ===== -->
  <text x="40" y="288" font-family="system-ui, sans-serif" font-size="13" fill="#6c8ef5">调度层 · Conductor（sdk/cliproxy/auth）</text>
