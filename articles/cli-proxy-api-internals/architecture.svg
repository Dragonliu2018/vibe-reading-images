  <text x="729" y="307" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e8ecf5">翻译矩阵 translator</text>
  <rect x="666" y="330" width="126" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="729" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e8ecf5">thinking + 回放缓存</text>
  <rect x="666" y="376" width="126" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="729" y="399" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e8ecf5">模型注册表 registry</text>
  <rect x="666" y="422" width="126" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="729" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e8ecf5">插件宿主 pluginhost</text>
  <rect x="666" y="468" width="126" height="36" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="729" y="491" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e8ecf5">config + watcher</text>

  <!-- 横切层与主链路的虚连接 -->
  <path d="M 654 302 L 638 302" stroke="#f9ca24" stroke-width="1" opacity="0.7" stroke-dasharray="3,3"/>
  <path d="M 654 348 L 638 348" stroke="#f9ca24" stroke-width="1" opacity="0.7" stroke-dasharray="3,3"/>
  <path d="M 654 394 L 638 394" stroke="#f9ca24" stroke-width="1" opacity="0.7" stroke-dasharray="3,3"/>
  <path d="M 654 440 L 638 440" stroke="#f9ca24" stroke-width="1" opacity="0.7" stroke-dasharray="3,3"/>
  <path d="M 654 486 L 638 486" stroke="#f9ca24" stroke-width="1" opacity="0.7" stroke-dasharray="3,3"/>

  <!-- 图例 -->
  <rect x="30" y="566" width="12" height="12" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="50" y="576" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">客户端</text>
  <rect x="110" y="566" width="12" height="12" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="130" y="576" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">接入</text>
  <rect x="180" y="566" width="12" height="12" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="200" y="576" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">调度</text>
  <rect x="250" y="566" width="12" height="12" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="270" y="576" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">执行</text>
  <rect x="320" y="566" width="12" height="12" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="340" y="576" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">横切</text>
  <text x="410" y="576" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">箭头 = 调用方向 · 虚线框 = 进程外</text>
