  <text x="120" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Selector 策略</text>
  <text x="120" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">RR / WRR / FillFirst / 亲和</text>
  <rect x="226" y="298" width="180" height="44" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="316" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">authScheduler 镜像</text>
  <text x="316" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">ready / cooldown / blocked 桶</text>
  <rect x="422" y="298" width="216" height="44" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="530" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Cooldown / Quota / 重试</text>
  <text x="530" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">双粒度降权 · .cds 持久化</text>

  <!-- L3 -> L4 -->
  <path d="M 316 342 L 316 380" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== L4 执行层 ===== -->
  <text x="40" y="404" font-family="system-ui, sans-serif" font-size="13" fill="#ff6b9d">执行层 · ProviderExecutor（internal/runtime/executor）</text>
  <rect x="30" y="414" width="150" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="105" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">ClaudeExecutor</text>
  <text x="105" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">cloak / CCH 签名</text>
  <rect x="196" y="414" width="150" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="271" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">CodexExecutor</text>
  <text x="271" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">HTTP + WebSocket 双工</text>
  <rect x="362" y="414" width="150" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="437" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">Gemini 等 10+ 家族</text>
  <text x="437" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">antigravity / kimi / xai / devin</text>
  <rect x="528" y="414" width="110" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="583" y="438" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">插件 Executor</text>

  <!-- L4 -> L5 -->
  <path d="M 271 458 L 271 496" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== L5 上游 ===== -->
  <rect x="30" y="500" width="608" height="44" rx="6" fill="#13162a" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="334" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8ecf5">上游订阅端点（OAuth 订阅凭据）</text>
  <text x="334" y="534" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa3bd">api.anthropic.com · chatgpt.com/backend-api · generativelanguage.googleapis.com · 兼容网关</text>

  <!-- ===== 右侧横切层 ===== -->
  <rect x="654" y="248" width="150" height="296" rx="8" fill="none" stroke="#f9ca24" stroke-width="1" stroke-dasharray="4,4"/>
