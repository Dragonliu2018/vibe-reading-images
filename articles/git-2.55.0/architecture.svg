<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="500" fill="#0b0d14"/>
  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#e6e6f0">Git v2.55.0 分层架构</text>

  <!-- Layer 1: 命令与进程层 (blue) -->
  <text x="24" y="50" font-size="12" fill="#6c8ef5">命令与进程层</text>
  <rect x="20" y="54" width="780" height="92" rx="10" fill="none" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="235" y="72" width="160" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="315" y="98" text-anchor="middle" font-size="14" fill="#e6e6f0">命令分发</text>
  <text x="315" y="118" text-anchor="middle" font-size="11" fill="#8a8db0">git.c · setup.c · parse-options.c</text>
  <rect x="425" y="72" width="160" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="505" y="98" text-anchor="middle" font-size="14" fill="#e6e6f0">内置命令</text>
  <text x="505" y="118" text-anchor="middle" font-size="11" fill="#8a8db0">builtin/ · 130 commands</text>

  <!-- Layer 2: 操作层 (cyan) -->
  <text x="24" y="156" font-size="12" fill="#4ecdc4">操作层</text>
  <rect x="20" y="160" width="780" height="92" rx="10" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="146" y="178" width="160" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="226" y="204" text-anchor="middle" font-size="14" fill="#e6e6f0">版本遍历与历史</text>
  <text x="226" y="224" text-anchor="middle" font-size="11" fill="#8a8db0">revision.c · pretty.c · blame.c</text>
  <rect x="330" y="178" width="160" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="204" text-anchor="middle" font-size="14" fill="#e6e6f0">Diff · 合并 · 补丁</text>
  <text x="410" y="224" text-anchor="middle" font-size="11" fill="#8a8db0">diff.c · xdiff · sequencer.c</text>
  <rect x="514" y="178" width="160" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="594" y="204" text-anchor="middle" font-size="14" fill="#e6e6f0">传输与协议</text>
  <text x="594" y="224" text-anchor="middle" font-size="11" fill="#8a8db0">transport.c · pkt-line.c</text>

  <!-- Layer 3: 核心数据层 (yellow) -->
  <text x="24" y="262" font-size="12" fill="#f9ca24">核心数据层</text>
  <rect x="20" y="266" width="780" height="92" rx="10" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="146" y="284" width="160" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="226" y="310" text-anchor="middle" font-size="14" fill="#e6e6f0">对象数据库</text>
  <text x="226" y="330" text-anchor="middle" font-size="11" fill="#8a8db0">object-file.c · packfile.c · odb/</text>
  <rect x="330" y="284" width="160" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="310" text-anchor="middle" font-size="14" fill="#e6e6f0">引用管理</text>
  <text x="410" y="330" text-anchor="middle" font-size="11" fill="#8a8db0">refs.c · reftable/ · files-backend.c</text>
  <rect x="514" y="284" width="160" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="594" y="310" text-anchor="middle" font-size="14" fill="#e6e6f0">索引与工作树</text>
  <text x="594" y="330" text-anchor="middle" font-size="11" fill="#8a8db0">read-cache.c · unpack-trees.c</text>

  <!-- Layer 4: 基础设施层 (pink) -->
  <text x="24" y="368" font-size="12" fill="#ff6b9d">基础设施层</text>
  <rect x="20" y="372" width="780" height="92" rx="10" fill="none" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <rect x="60" y="390" width="160" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="140" y="416" text-anchor="middle" font-size="14" fill="#e6e6f0">配置</text>
  <text x="140" y="436" text-anchor="middle" font-size="11" fill="#8a8db0">config.c · environment.c</text>
  <rect x="240" y="390" width="160" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="320" y="416" text-anchor="middle" font-size="14" fill="#e6e6f0">子进程</text>
  <text x="320" y="436" text-anchor="middle" font-size="11" fill="#8a8db0">run-command.c</text>
  <rect x="420" y="390" width="160" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="500" y="416" text-anchor="middle" font-size="14" fill="#e6e6f0">哈希 · zlib</text>
  <text x="500" y="436" text-anchor="middle" font-size="11" fill="#8a8db0">sha256 · block-sha1 · git zlib</text>
  <rect x="600" y="390" width="160" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="680" y="416" text-anchor="middle" font-size="14" fill="#e6e6f0">追踪</text>
  <text x="680" y="436" text-anchor="middle" font-size="11" fill="#8a8db0">trace2/</text>

  <text x="410" y="486" text-anchor="middle" font-size="11" fill="#8a8db0">上层依赖下层 · the_repository 全局枢纽贯穿各层</text>
</svg>
