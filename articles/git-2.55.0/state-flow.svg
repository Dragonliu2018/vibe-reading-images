<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" font-family="system-ui, sans-serif">
  <defs>
    <marker id="sf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
    <marker id="sf-arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="300" fill="#0b0d14"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e6f0">ref 事务状态机</text>

  <!-- OPEN -->
  <rect x="60" y="100" width="120" height="50" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="120" y="122" text-anchor="middle" font-size="14" fill="#4ecdc4" font-weight="600">OPEN</text>
  <text x="120" y="140" text-anchor="middle" font-size="10" fill="#8a8db0">ref_transaction_begin</text>

  <!-- PREPARED -->
  <rect x="260" y="100" width="120" height="50" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="320" y="122" text-anchor="middle" font-size="14" fill="#4ecdc4" font-weight="600">PREPARED</text>
  <text x="320" y="140" text-anchor="middle" font-size="10" fill="#8a8db0">加锁 + 校验 + hook</text>

  <!-- COMMITTED/CLOSED -->
  <rect x="460" y="100" width="130" height="50" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="525" y="122" text-anchor="middle" font-size="14" fill="#4ecdc4" font-weight="600">CLOSED</text>
  <text x="525" y="140" text-anchor="middle" font-size="10" fill="#8a8db0">transaction_finish 落盘</text>

  <!-- ABORTED -->
  <rect x="160" y="210" width="120" height="50" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="220" y="232" text-anchor="middle" font-size="14" fill="#ff6b9d" font-weight="600">ABORTED</text>
  <text x="220" y="250" text-anchor="middle" font-size="10" fill="#8a8db0">释放锁 + 回滚</text>

  <!-- Transitions -->
  <path d="M180,125 L260,125" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#sf-arrow)"/>
  <text x="220" y="118" text-anchor="middle" font-size="10" fill="#4ecdc4">prepare</text>

  <path d="M380,125 L460,125" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#sf-arrow)"/>
  <text x="420" y="118" text-anchor="middle" font-size="10" fill="#4ecdc4">finish</text>

  <path d="M290,150 L250,210" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#sf-arrow-r)"/>
  <text x="265" y="184" font-size="10" fill="#ff6b9d">abort</text>

  <path d="M150,150 L195,210" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#sf-arrow-r)"/>
  <text x="140" y="184" font-size="10" fill="#ff6b9d">abort</text>

  <text x="310" y="288" text-anchor="middle" font-size="10" fill="#8a8db0">reference-transaction hook 在 preparing / prepared / committed / aborted 四阶段介入</text>
</svg>
