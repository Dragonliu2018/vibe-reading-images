<svg width="860" height="540" viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e2e8f0" font-weight="600">CI 关键链：typecheck 与 Studio E2E 双轨 matrix</text>

  <rect x="330" y="60" width="200" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="430" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">Pull Request</text>
  <text x="430" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">44 个 workflows 并行触发</text>
  <path d="M 430 116 L 430 140 L 160 140 L 160 164" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 430 116 L 430 140 L 440 140 L 440 164" stroke="#7a86b3" stroke-width="1.5" fill="none"/>
  <path d="M 430 116 L 430 140 L 700 140 L 700 164" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="164" width="240" height="90" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="160" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">typecheck.yml</text>
  <text x="160" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">install 前先跑 check-case-hazards</text>
  <text x="160" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">turbo typecheck（TS7 native tsc）</text>
  <text x="160" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">eslint · 全部 action SHA 锁定</text>

  <rect x="320" y="164" width="240" height="90" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="440" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">studio-e2e-test.yml</text>
  <text x="440" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">paths-filter 判定受影响路径</text>
  <text x="440" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">27 个 spec · 分片权重 62:38</text>
  <text x="440" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">merge-reports 聚合成败</text>

  <rect x="600" y="164" width="240" height="90" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="720" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">lint ratchet 棘轮</text>
  <text x="720" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">eslint-rule-baselines.json 基线</text>
  <text x="720" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">PR 只许减不许增</text>
  <text x="720" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">周日 cron 自动降基线开 PR</text>

  <!-- e2e 细节链 -->
  <rect x="320" y="310" width="240" height="64" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="440" y="334" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">matrix 双维度</text>
  <text x="440" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">framework: next × tanstack</text>
  <text x="440" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">shardIndex: 1..2</text>
  <path d="M 440 254 L 440 306" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="320" y="430" width="240" height="64" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="440" y="454" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">supabase start</text>
  <text x="440" y="474" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">CLI 拉起真实后端 Docker 栈</text>
  <text x="440" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">--exclude studio,mailpit</text>
  <path d="M 440 374 L 440 426" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="160" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">typecheck 用 TS 7 native（10x 速度）；</text>
  <text x="160" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">typescript 6.0 兼容包服务 eslint / Next 构建</text>
  <text x="720" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">zizmor 扫描 workflow 安全；</text>
  <text x="720" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">autofix bot 凭据隔离（artifact 传 patch）</text>
</svg>
