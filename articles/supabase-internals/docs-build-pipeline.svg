<svg width="860" height="540" viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#80c7ff"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e2e8f0" font-weight="600">docs 文档站构建流水线（spec 单一真源）</text>

  <!-- 三类源 -->
  <rect x="40" y="70" width="240" height="90" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="160" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">spec/（spec-as-source）</text>
  <text x="160" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">Management API OpenAPI（生产端点下载）</text>
  <text x="160" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">CLI yaml + SDK TypeDoc spec</text>
  <text x="160" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">与 api-types 包同源</text>
  <rect x="310" y="70" width="240" height="90" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="430" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">content/guides MDX</text>
  <text x="430" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">手写指南 + &lt;$Partial /&gt; 复用</text>
  <text x="430" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">troubleshooting TOML frontmatter</text>
  <rect x="580" y="70" width="240" height="90" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="700" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">federated content 5 源</text>
  <text x="700" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">wrappers / setup-ci / pg_graphql</text>
  <text x="700" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">vecs / terraform</text>
  <text x="700" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">按 tag 构建期拉取</text>

  <!-- codegen 条 -->
  <rect x="40" y="210" width="780" height="70" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="430" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">prebuild 8 步 codegen</text>
  <text x="430" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">redocly bundle → references（legacy+new）→ examples 拷贝 → federated 拉取 → guides/reference markdown → gz archive → sitemap</text>
  <path d="M 160 160 L 160 206" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 430 160 L 430 206" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 700 160 L 700 206" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 产物 -->
  <rect x="40" y="330" width="360" height="70" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="220" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">generated/* + content/reference/*</text>
  <text x="220" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">api.latest.sections.json / endpointsById</text>
  <text x="220" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">SDK bySlug / functions / typeSpec</text>
  <rect x="440" y="330" width="380" height="70" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="630" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">public/markdown/* + docs.tar.gz</text>
  <text x="630" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">manifest.json（markdown 协商门控）</text>
  <text x="630" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">确定性 tar（sorted / fixed mtime）</text>
  <path d="M 220 280 L 220 326" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 630 280 L 630 326" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 页面 -->
  <rect x="40" y="450" width="360" height="70" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="220" y="474" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">app/reference/[...slug] 四合一入口</text>
  <text x="220" y="494" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">ClientSdk / Cli / Api / SelfHosting</text>
  <text x="220" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">dynamicParams=false 全静态</text>
  <rect x="440" y="450" width="380" height="70" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="630" y="474" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">AI / 爬虫分发</text>
  <text x="630" y="494" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">negotiateMarkdown（Vary: Accept · 406 语义）</text>
  <text x="630" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">bot 简化 HTML（/api/crawlers）</text>
  <path d="M 220 400 L 220 446" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 630 400 L 630 446" stroke="#80c7ff" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
</svg>
