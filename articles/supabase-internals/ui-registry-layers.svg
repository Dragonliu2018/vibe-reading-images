  <path d="M 670 354 L 670 396" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="40" y="400" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">OKLCH 派生 token：--hue / --chroma / --surface / --contrast 四输入变量</text>
  <text x="40" y="420" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">经 CSS calc 派生全部语义色；theme 文件只覆盖输入集合</text>
  <text x="40" y="448" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">registryItemAppend()：block × 4 种 client 框架自动展开变体，</text>
  <text x="40" y="466" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">合并去重 registryDependencies / dependencies / files</text>
