<svg width="860" height="580" viewBox="0 0 860 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
  </defs>
  <rect width="860" height="580" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e2e8f0" font-weight="600">模块依赖关系（包级 import 方向）</text>

  <!-- 左列：apps -->
  <rect x="60" y="170" width="140" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="130" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">studio</text>
  <text x="130" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">Dashboard</text>
  <rect x="60" y="350" width="140" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="130" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">docs</text>
  <text x="130" y="396" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">文档站</text>
  <rect x="60" y="470" width="140" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="130" y="495" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">www</text>
  <text x="130" y="516" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">官网</text>

  <!-- 中列：packages -->
  <rect x="360" y="90" width="160" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">ui-patterns</text>
  <text x="440" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">业务组件模式</text>
  <rect x="360" y="166" width="160" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="189" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">ui</text>
  <text x="440" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">UI 原语 + 主题 token</text>
  <rect x="360" y="242" width="160" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">common</text>
  <text x="440" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">flags · 遥测 · consent</text>
  <rect x="360" y="318" width="160" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">pg-meta</text>
  <text x="440" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">SQL 生成引擎</text>
  <rect x="360" y="394" width="160" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="417" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">api-types</text>
  <text x="440" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">OpenAPI 生成类型</text>
  <rect x="360" y="470" width="160" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="440" y="493" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">shared-data</text>
  <text x="440" y="512" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">定价 / 计划数据</text>

  <!-- 右列：docker -->
  <rect x="660" y="320" width="150" height="76" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="735" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">docker 自托管</text>
  <text x="735" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">编排 12 服务</text>
  <text x="735" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">setup / update 脚本</text>

  <!-- studio 扇形发散到中列 -->
  <path d="M 200 200 L 358 120" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 200 200 L 358 196" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 200 200 L 358 272" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 200 200 L 358 348" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 200 200 L 358 424" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- docs → api-types / www → shared-data -->
  <path d="M 200 380 L 358 420" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 200 500 L 358 500" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- www → docs：prebuild 拉取 docs 构建产物 -->
  <path d="M 130 470 L 130 414" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="142" y="447" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">prebuild 拉取 docs 构建产物</text>

  <!-- docker ← studio：构建镜像（绕行顶部） -->
  <path d="M 130 170 L 130 70 L 735 70 L 735 316" stroke="#f9ca24" stroke-width="1.5" fill="none" marker-end="url(#arrowY)" opacity="0.85"/>
  <text x="430" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f9ca24">构建 studio Docker 镜像</text>

  <!-- 图例 -->
  <text x="60" y="556" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">注：studio/www/docs 对 ui-patterns/common 的重复依赖仅以 studio 扇形示意；marketing / icons / config 等小包未画出</text>
</svg>
