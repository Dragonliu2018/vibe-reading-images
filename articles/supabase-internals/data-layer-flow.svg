<svg width="860" height="460" viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect width="860" height="460" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e2e8f0" font-weight="600">Studio 数据层结构（fetcher / hooks / 权限三层）</text>

  <!-- 主链行 -->
  <rect x="40" y="70" width="160" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="120" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">UI 组件</text>
  <text x="120" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">页面 / 面板</text>
  <rect x="240" y="70" width="180" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="330" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">useQuery hooks</text>
  <text x="330" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">queryKey 工厂（keys.ts）</text>
  <rect x="460" y="70" width="170" height="60" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="545" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">getXxx() 纯函数</text>
  <text x="545" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">data/&lt;resource&gt;/ 资源目录</text>
  <rect x="670" y="70" width="150" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="745" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">openapi-fetch</text>
  <text x="745" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">createClient&lt;paths&gt;</text>
  <path d="M 200 100 L 236 100" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 100 L 456 100" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 630 100 L 666 100" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 第二行：api-types / middleware -->
  <rect x="460" y="190" width="170" height="90" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="545" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">api-types</text>
  <text x="545" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">openapi-typescript 生成</text>
  <text x="545" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">~45k 行类型</text>
  <text x="545" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">Management API spec 单一真源</text>
  <rect x="670" y="190" width="150" height="90" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="745" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">双中间件</text>
  <text x="745" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">onRequest：鉴权头</text>
  <text x="745" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">+ pgMetaGuard 前置校验</text>
  <text x="745" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">onResponse：错误富集</text>
  <path d="M 545 130 L 545 186" stroke="#7a86b3" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="558" y="162" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">编译期类型</text>
  <path d="M 745 130 L 745 186" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 平台 API -->
  <rect x="670" y="330" width="150" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="745" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">平台 API</text>
  <text x="745" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">/platform/* 端点</text>
  <path d="M 745 280 L 745 326" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- pg-meta 旁路 -->
  <rect x="240" y="250" width="180" height="70" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="330" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">executeSql()</text>
  <text x="330" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">数据库对象走 SQL 旁路</text>
  <text x="330" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">148 文件引用 · I/O 总线</text>
  <rect x="460" y="250" width="170" height="70" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="545" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">pg-meta 执行服务</text>
  <text x="545" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">POST /platform/pg-meta</text>
  <text x="545" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">/{ref}/query</text>
  <path d="M 330 130 L 330 246" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="344" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">useXxxSqlQuery</text>
  <path d="M 420 285 L 456 285" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 权限 -->
  <rect x="40" y="250" width="160" height="70" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="120" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">权限门控</text>
  <text x="120" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">useAsyncCheckPermissions</text>
  <text x="120" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">271 文件扇入</text>
  <path d="M 120 130 L 120 246" stroke="#7a86b3" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="120" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">所有 *-query.ts 的 if (error) handleError(error) 统一抛出（384 文件扇入）；错误元数据由中间件先行注入</text>
</svg>
