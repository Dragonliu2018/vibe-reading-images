<svg width="860" height="680" viewBox="0 0 860 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect width="860" height="680" fill="#0b0d14"/>
  <text x="430" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e2e8f0" font-weight="600">自托管部署栈服务拓扑（docker-compose.yml · 12 服务）</text>

  <!-- 用户 -->
  <rect x="60" y="80" width="140" height="56" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="130" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">浏览器用户</text>
  <text x="130" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">宿主 :8000 访问</text>

  <!-- 网关 hub -->
  <rect x="60" y="230" width="170" height="84" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="145" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">api-gw 网关</text>
  <text x="145" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">envoy 默认（:8000）</text>
  <text x="145" y="294" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">网络别名 envoy + kong</text>

  <!-- 右列：经网关路由的 6 个服务 -->
  <rect x="360" y="60" width="150" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="435" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">studio :3000</text>
  <text x="435" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">Dashboard · 无宿主端口</text>
  <rect x="360" y="140" width="150" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="435" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">auth · gotrue :9999</text>
  <text x="435" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">JWT 认证</text>
  <rect x="360" y="220" width="150" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="435" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">rest · postgrest :3000</text>
  <text x="435" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">自动 REST API</text>
  <rect x="360" y="300" width="150" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="435" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">realtime :4000</text>
  <text x="435" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">WebSocket 实时</text>
  <rect x="360" y="380" width="150" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="435" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">storage :5000</text>
  <text x="435" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">文件存储网关</text>
  <rect x="360" y="460" width="150" height="60" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="435" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">functions :9000</text>
  <text x="435" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">Deno Edge Functions</text>

  <!-- 用户 → 网关 -->
  <path d="M 130 136 L 130 226" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 网关 → 6 服务（扇形发散） -->
  <path d="M 230 250 L 356 90" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 230 258 L 356 170" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 230 266 L 356 250" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 230 274 L 356 330" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 230 282 L 356 410" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 230 290 L 356 490" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 底行：db 与元数据服务 -->
  <rect x="60" y="580" width="200" height="64" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="160" y="604" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">db · postgres 17</text>
  <text x="160" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">无宿主端口 · 仅容器网络</text>
  <rect x="300" y="580" width="170" height="64" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="385" y="604" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">meta :8080</text>
  <text x="385" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">postgres-meta · 执行 SQL</text>
  <rect x="500" y="580" width="160" height="64" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="580" y="604" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">supavisor</text>
  <text x="580" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">连接池化 :5432/:6543</text>
  <rect x="690" y="580" width="150" height="64" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="765" y="604" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">imgproxy :5001</text>
  <text x="765" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">图像变换</text>

  <!-- 依赖总线：6 服务全部依赖 db -->
  <path d="M 435 540 L 435 556" stroke="#7a86b3" stroke-width="1.5" fill="none"/>
  <path d="M 300 556 L 435 556" stroke="#7a86b3" stroke-width="1.5" fill="none"/>
  <path d="M 160 556 L 160 576" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 300 556 L 300 576" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="370" y="548" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">auth / rest / realtime / storage / meta / supavisor 均依赖 db（healthy）</text>

  <!-- storage → imgproxy -->
  <path d="M 510 440 L 580 440 L 580 576" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)" opacity="0.7"/>
  <text x="600" y="432" font-family="system-ui, sans-serif" font-size="11" fill="#9aa5c4">storage → imgproxy 变换</text>

  <!-- studio 特殊连接 -->
  <path d="M 145 230 L 145 180 L 340 180" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#arrowC)" opacity="0.7"/>
  <text x="240" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#4ecdc4">SUPABASE_URL（经网关）</text>
</svg>
