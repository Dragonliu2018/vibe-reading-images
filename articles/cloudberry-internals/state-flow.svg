<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#80c7ff"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="320" fill="#0b0d14"/>

  <text x="480" y="24" text-anchor="middle" fill="#e6e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">segment failover 状态流（FtsMessageState）</text>

  <!-- A: PROBE_SEGMENT -->
  <rect x="40" y="50" width="150" height="44" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="115" y="69" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PROBE_SEGMENT</text>
  <text x="115" y="86" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">发 PROBE 消息</text>

  <!-- B: PROBE_SUCCESS -->
  <rect x="240" y="50" width="150" height="44" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="315" y="69" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PROBE_SUCCESS</text>
  <text x="315" y="86" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">探测成功</text>

  <!-- C: PROBE_FAILED -->
  <rect x="40" y="150" width="150" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="115" y="169" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PROBE_FAILED</text>
  <text x="115" y="186" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">探测失败</text>

  <!-- D: processResponse -->
  <rect x="240" y="150" width="150" height="44" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="315" y="169" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">processResponse</text>
  <text x="315" y="186" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">重试耗尽判定</text>

  <!-- E: PROMOTE_SEGMENT -->
  <rect x="440" y="150" width="150" height="44" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="515" y="169" text-anchor="middle" fill="#80c7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PROMOTE_SEGMENT</text>
  <text x="515" y="186" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">发 PROMOTE</text>

  <!-- F: PROMOTE_SUCCESS -->
  <rect x="640" y="150" width="150" height="44" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="715" y="169" text-anchor="middle" fill="#80c7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">PROMOTE_SUCCESS</text>
  <text x="715" y="186" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">提升成功</text>

  <!-- G: double fault -->
  <rect x="240" y="250" width="150" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="315" y="269" text-anchor="middle" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">double fault</text>
  <text x="315" y="286" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">集群不可用</text>

  <!-- T: RESPONSE_PROCESSED (terminal, tall, spans 3 rows) -->
  <rect x="830" y="50" width="130" height="244" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="895" y="166" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">RESPONSE_</text>
  <text x="895" y="184" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">PROCESSED</text>
  <text x="895" y="204" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="11">（终态）</text>

  <!-- A->B success -->
  <path d="M190,72 L240,72" stroke="#4ecdc4" stroke-width="1.5" fill="none" marker-end="url(#arrowc)"/>
  <text x="215" y="64" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="10">成功</text>

  <!-- B->T (row1, enters T left edge at y=72) -->
  <path d="M390,72 L830,72" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="610" y="64" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">处理后</text>

  <!-- A->C failure (vertical at x=115) -->
  <path d="M115,94 L115,150" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#arrowr)"/>
  <text x="128" y="126" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="10">失败</text>

  <!-- C retry loop: out C left -> up left margin -> into A left (no crossing with A->C) -->
  <path d="M40,172 L18,172 L18,72 L40,72" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="18" y="126" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">重试</text>
  <text x="18" y="140" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">1s ×N</text>

  <!-- C->D retry exhausted -->
  <path d="M190,172 L240,172" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="215" y="164" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">重试耗尽</text>

  <!-- D->E in-sync -->
  <path d="M390,172 L440,172" stroke="#80c7ff" stroke-width="1.5" fill="none" marker-end="url(#arrowg)"/>
  <text x="415" y="164" text-anchor="middle" fill="#80c7ff" font-family="system-ui, sans-serif" font-size="10">in-sync</text>

  <!-- E->F promote -->
  <path d="M590,172 L640,172" stroke="#80c7ff" stroke-width="1.5" fill="none" marker-end="url(#arrowg)"/>
  <text x="615" y="164" text-anchor="middle" fill="#80c7ff" font-family="system-ui, sans-serif" font-size="10">提升</text>

  <!-- F->T (row2, enters T left edge at y=172) -->
  <path d="M790,172 L830,172" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- D->G not in-sync (vertical) -->
  <path d="M315,194 L315,250" stroke="#ff6b9d" stroke-width="1.5" fill="none" marker-end="url(#arrowr)"/>
  <text x="328" y="226" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="10">not in-sync</text>

  <!-- G->T (row3, enters T left edge at y=272) -->
  <path d="M390,272 L830,272" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="40" y="312" fill="#6a7088" font-family="system-ui, sans-serif" font-size="10">青=探测成功路径 · 粉=失败/double fault · 浅蓝=提升路径 · 黄虚线=终态</text>
</svg>
