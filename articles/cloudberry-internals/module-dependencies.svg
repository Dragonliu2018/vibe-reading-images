<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#80c7ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="460" fill="#0b0d14"/>

  <text x="360" y="26" text-anchor="middle" fill="#e6e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Cloudberry 模块依赖关系</text>

  <!-- Main column (left, x=40..240) -->
  <!-- tcop -->
  <rect x="40" y="45" width="200" height="46" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="140" y="73" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">tcop/postgres.c</text>

  <!-- optimizer -->
  <rect x="40" y="125" width="200" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="140" y="148" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">查询优化器</text>
  <text x="140" y="168" text-anchor="middle" fill="#a0a8c0" font-family="system-ui, sans-serif" font-size="11">CBDB 并行 · AQUMV · PG planner</text>

  <!-- gpopt (branch right of optimizer) -->
  <rect x="290" y="125" width="160" height="56" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="370" y="148" text-anchor="middle" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">DXL 翻译桥</text>
  <text x="370" y="168" text-anchor="middle" fill="#a0a8c0" font-family="system-ui, sans-serif" font-size="11">gpopt</text>

  <!-- gporca (branch right of gpopt) -->
  <rect x="490" y="125" width="190" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="585" y="148" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">GPORCA 优化器</text>
  <text x="585" y="168" text-anchor="middle" fill="#a0a8c0" font-family="system-ui, sans-serif" font-size="11">gporca (Cascades C++)</text>

  <!-- cdb -->
  <rect x="40" y="225" width="200" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="140" y="248" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">分布式执行内核</text>
  <text x="140" y="268" text-anchor="middle" fill="#a0a8c0" font-family="system-ui, sans-serif" font-size="11">cdb (Motion/Gang/interconnect)</text>

  <!-- fts (branch right of cdb) -->
  <rect x="290" y="225" width="200" height="56" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="390" y="248" text-anchor="middle" fill="#80c7ff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">容错服务</text>
  <text x="390" y="268" text-anchor="middle" fill="#a0a8c0" font-family="system-ui, sans-serif" font-size="11">fts (segment 保活)</text>

  <!-- executor -->
  <rect x="40" y="325" width="200" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="140" y="348" text-anchor="middle" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">执行引擎</text>
  <text x="140" y="368" text-anchor="middle" fill="#a0a8c0" font-family="system-ui, sans-serif" font-size="11">executor (Volcano + Motion)</text>

  <text x="140" y="402" text-anchor="middle" fill="#6a7088" font-family="system-ui, sans-serif" font-size="12">结果汇总返回客户端</text>

  <!-- Arrows (main column vertical) -->
  <!-- tcop -> optimizer -->
  <path d="M140,91 L140,125" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- optimizer -> gpopt (ORCA bridge) -->
  <path d="M240,148 L290,148" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="265" y="140" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">DXL</text>
  <!-- gpopt -> gporca -->
  <path d="M450,153 L490,153" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="470" y="145" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">优化</text>
  <!-- optimizer -> cdb (Locus/motion) -->
  <path d="M140,181 L140,225" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="155" y="207" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">Locus</text>
  <!-- cdb -> fts (query state) -->
  <path d="M240,246 L290,246" stroke="#80c7ff" stroke-width="1.5" fill="none" marker-end="url(#arrowft)"/>
  <text x="265" y="238" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">查状态</text>
  <!-- fts -> cdb (topology update) -->
  <path d="M290,262 L240,262" stroke="#80c7ff" stroke-width="1.5" fill="none" marker-end="url(#arrowft)"/>
  <text x="265" y="278" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">重建 Gang</text>
  <!-- cdb -> executor (plan dispatch) -->
  <path d="M140,281 L140,325" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="155" y="307" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">派发</text>
  <!-- executor -> cdb (reverse, Motion uses interconnect) on left -->
  <path d="M70,325 L70,281" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)" opacity="0.7"/>
  <text x="70" y="307" text-anchor="middle" fill="#8a92a8" font-family="system-ui, sans-serif" font-size="10">Motion 收发</text>

  <!-- Legend -->
  <text x="490" y="348" fill="#6a7088" font-family="system-ui, sans-serif" font-size="11">蓝 = 核心逻辑/引擎</text>
  <text x="490" y="365" fill="#6a7088" font-family="system-ui, sans-serif" font-size="11">青 = 入口 · 黄 = 翻译库</text>
  <text x="490" y="382" fill="#6a7088" font-family="system-ui, sans-serif" font-size="11">浅蓝 = 生命周期/容错</text>
</svg>
