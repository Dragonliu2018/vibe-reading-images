<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#0b0d14"/>

  <text x="380" y="26" text-anchor="middle" fill="#e8ecf5" font-size="16" font-weight="600">5 个 i2c 总线驱动的 of_node 引用泄漏 → 统一修复</text>

  <!-- Left: 5 driver boxes -->
  <rect x="30" y="60" width="300" height="44" rx="6" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="180" y="80" text-anchor="middle" fill="#e8ecf5" font-size="13">mpc — of_node_get 漏 put（Fixes 9fd049）</text>
  <text x="180" y="96" text-anchor="middle" fill="#9aa3c7" font-size="11">i2c-mpc.c · fsl_i2c_probe/remove · +5/-1</text>

  <rect x="30" y="116" width="300" height="44" rx="6" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="180" y="136" text-anchor="middle" fill="#e8ecf5" font-size="13">cpm — of_node_get 漏 put（Fixes 9fd049）</text>
  <text x="180" y="152" text-anchor="middle" fill="#9aa3c7" font-size="11">i2c-cpm.c · cpm_i2c_probe/remove · +3</text>

  <rect x="30" y="172" width="300" height="44" rx="6" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="180" y="192" text-anchor="middle" fill="#e8ecf5" font-size="13">ibm_iic — of_node_get 漏 put（Fixes 9fd049）</text>
  <text x="180" y="208" text-anchor="middle" fill="#9aa3c7" font-size="11">i2c-ibm_iic.c · iic_probe/remove · +4</text>

  <rect x="30" y="228" width="300" height="44" rx="6" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="180" y="248" text-anchor="middle" fill="#e8ecf5" font-size="13">opal — of_node_get 漏 put（Fixes 470834508f87）</text>
  <text x="180" y="264" text-anchor="middle" fill="#9aa3c7" font-size="11">i2c-opal.c · i2c_opal_probe/remove · +5/-1</text>

  <rect x="30" y="284" width="300" height="44" rx="6" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="180" y="304" text-anchor="middle" fill="#e8ecf5" font-size="13">pnx — of_node_get 漏 put（Fixes b41a216）</text>
  <text x="180" y="320" text-anchor="middle" fill="#9aa3c7" font-size="11">i2c-pnx.c · i2c_pnx_probe/remove · +12/-3</text>

  <!-- Right: unified fix box -->
  <rect x="450" y="60" width="280" height="268" rx="6" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="590" y="92" text-anchor="middle" fill="#7bed9f" font-size="14" font-weight="600">统一修复（本系列 5 patch）</text>
  <text x="590" y="124" text-anchor="middle" fill="#e8ecf5" font-size="12">remove 路径：</text>
  <text x="590" y="144" text-anchor="middle" fill="#9aa3c7" font-size="11">node = adap.dev.of_node</text>
  <text x="590" y="162" text-anchor="middle" fill="#9aa3c7" font-size="11">→ i2c_del_adapter（内部 memset）</text>
  <text x="590" y="180" text-anchor="middle" fill="#7bed9f" font-size="11">→ of_node_put(node) 用快照</text>
  <text x="590" y="214" text-anchor="middle" fill="#e8ecf5" font-size="12">probe 错误路径：</text>
  <text x="590" y="234" text-anchor="middle" fill="#7bed9f" font-size="11">补 of_node_put(adap.dev.of_node)</text>
  <text x="590" y="276" text-anchor="middle" fill="#9aa3c7" font-size="11">根因：i2c_del_adapter 末尾</text>
  <text x="590" y="294" text-anchor="middle" fill="#9aa3c7" font-size="11">memset 清零 of_node（bd4bc3dbded9）</text>

  <!-- Fan-in arrows: left boxes right edge (x=330) -> right box left edge (x=450) -->
  <path d="M330,82 L450,82" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M330,138 L450,138" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M330,194 L450,194" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M330,250 L450,250" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M330,306 L450,306" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <circle cx="44" cy="356" r="5" fill="#e74c3c"/>
  <text x="56" y="360" fill="#9aa3c7" font-size="11">红 = 各驱动的泄漏（of_node_get 漏配对 put）</text>
  <circle cx="430" cy="356" r="5" fill="#7bed9f"/>
  <text x="442" y="360" fill="#9aa3c7" font-size="11">绿 = 统一修复（cache-before-del + 错误路径 put）</text>
</svg>
