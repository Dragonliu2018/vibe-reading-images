<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="system-ui, sans-serif">
  <rect width="800" height="560" fill="#0b0d14"/>
  <defs>
    <marker id="ah-arch" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b90a8"/></marker>
  </defs>

  <text x="20" y="24" fill="#e4e7f0" font-size="16" font-weight="600">FastGen 分层架构</text>

  <!-- Layer 1: 入口与配置层 (y 42-128) -->
  <rect x="20" y="42" width="760" height="86" rx="8" fill="none" stroke="#6c8ef5" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="32" y="60" fill="#6c8ef5" font-size="12" font-weight="600">入口与配置层</text>
  <rect x="180" y="68" width="200" height="46" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="280" y="91" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">train.py</text>
  <rect x="400" y="68" width="200" height="46" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="500" y="91" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">configs/ (BaseConfig)</text>
  <rect x="620" y="68" width="150" height="46" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="695" y="91" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">instantiate</text>

  <line x1="400" y1="128" x2="400" y2="142" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#ah-arch)"/>

  <!-- Layer 2: 编排层 (y 142-228) -->
  <rect x="20" y="142" width="760" height="86" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="32" y="160" fill="#4ecdc4" font-size="12" font-weight="600">编排层</text>
  <rect x="250" y="168" width="240" height="46" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="370" y="191" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">trainer.py (Trainer.run)</text>
  <rect x="510" y="168" width="200" height="46" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="610" y="191" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">callbacks/ (EMA等)</text>

  <line x1="400" y1="228" x2="400" y2="242" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#ah-arch)"/>

  <!-- Layer 3: 算法层 (y 242-328) -->
  <rect x="20" y="242" width="760" height="86" rx="8" fill="none" stroke="#f9ca24" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="32" y="260" fill="#f9ca24" font-size="12" font-weight="600">算法层</text>
  <rect x="180" y="268" width="200" height="46" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="280" y="291" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">FastGenModel</text>
  <rect x="400" y="268" width="200" height="46" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="500" y="291" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">DMD2 / CM / LADD</text>
  <rect x="620" y="268" width="150" height="46" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="695" y="291" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">common_loss</text>

  <line x1="400" y1="328" x2="400" y2="342" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#ah-arch)"/>

  <!-- Layer 4: 模型与数据层 (y 342-428) -->
  <rect x="20" y="342" width="760" height="86" rx="8" fill="none" stroke="#ff6b9d" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="32" y="360" fill="#ff6b9d" font-size="12" font-weight="600">模型与数据层</text>
  <rect x="120" y="368" width="240" height="46" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="240" y="391" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">networks/ (FastGenNetwork)</text>
  <rect x="380" y="368" width="180" height="46" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="470" y="391" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">noise_schedule</text>
  <rect x="580" y="368" width="180" height="46" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="670" y="391" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">datasets/</text>

  <line x1="400" y1="428" x2="400" y2="442" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#ah-arch)"/>

  <!-- Layer 5: 基础设施层 (y 442-528) -->
  <rect x="20" y="442" width="760" height="86" rx="8" fill="none" stroke="#7bed9f" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="32" y="460" fill="#7bed9f" font-size="12" font-weight="600">基础设施层</text>
  <rect x="80" y="468" width="180" height="46" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="170" y="491" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">distributed</text>
  <rect x="280" y="468" width="160" height="46" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="360" y="491" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">checkpointer</text>
  <rect x="460" y="468" width="150" height="46" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="535" y="491" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">autoresume</text>
  <rect x="630" y="468" width="140" height="46" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="700" y="491" fill="#e4e7f0" font-size="13" text-anchor="middle" dominant-baseline="middle">logging</text>

  <text x="770" y="548" fill="#8b90a8" font-size="11" text-anchor="end">↓ 依赖方向（上层依赖下层）</text>
</svg>
