<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="system-ui, sans-serif">
  <rect width="780" height="470" fill="#0b0d14"/>
  <defs>
    <marker id="ah-tf" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#363b62"/></marker>
  </defs>
  <style>.label{font-size:13px;font-weight:600;fill:#e2e8f0}.typ{font-size:10px;fill:#7a85a3}.tag{font-size:10px;fill:#7a85a3}.arrow{stroke:#363b62;stroke-width:1.5;fill:none}</style>

  <!-- run() -->
  <rect x="290" y="20" width="200" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="47" text-anchor="middle" class="label" fill="#4ecdc4">Trainer.run(model)</text>
  <line x1="390" y1="65" x2="390" y2="95" class="arrow" marker-end="url(#ah-tf)"/>

  <!-- loop -->
  <rect x="270" y="95" width="240" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="122" text-anchor="middle" class="label" fill="#4ecdc4">for iter in range(max_iter)</text>
  <line x1="390" y1="140" x2="390" y2="170" class="arrow" marker-end="url(#ah-tf)"/>

  <!-- grad accum loop -->
  <rect x="250" y="170" width="280" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="197" text-anchor="middle" class="label" fill="#4ecdc4">for grad_accum_iter in rounds</text>
  <line x1="390" y1="215" x2="390" y2="245" class="arrow" marker-end="url(#ah-tf)"/>

  <!-- preprocess -->
  <rect x="250" y="245" width="280" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="267" text-anchor="middle" class="label" fill="#4ecdc4">preprocess_data(data)</text>
  <text x="390" y="283" text-anchor="middle" class="typ">dict → dict (VAE/augment encoded)</text>
  <line x1="390" y1="290" x2="390" y2="320" class="arrow" marker-end="url(#ah-tf)"/>

  <!-- train_step -->
  <rect x="230" y="320" width="320" height="55" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="390" y="342" text-anchor="middle" class="label" fill="#4ecdc4">Trainer.train_step(model, data, iter, accum)</text>
  <text x="390" y="358" text-anchor="middle" class="typ">sync_grads = (accum == rounds-1)</text>
  <text x="390" y="372" text-anchor="middle" class="typ">→ (loss_map, outputs)</text>

  <!-- 分支: autocast/forward -->
  <line x1="310" y1="375" x2="200" y2="410" class="arrow" marker-end="url(#ah-tf)"/>
  <rect x="80" y="410" width="240" height="45" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="200" y="432" text-anchor="middle" class="label" fill="#f9ca24">model.single_train_step(data)</text>
  <text x="200" y="448" text-anchor="middle" class="typ">→ (loss_map, outputs)</text>

  <!-- 分支: backward -->
  <line x1="470" y1="375" x2="580" y2="410" class="arrow" marker-end="url(#ah-tf)"/>
  <rect x="460" y="410" width="240" height="45" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="580" y="432" text-anchor="middle" class="label" fill="#ff6b9d">grad_scaler.scale(loss).backward()</text>
  <text x="580" y="448" text-anchor="middle" class="typ">loss_map["total_loss"]/rounds</text>

  <!-- callbacks side (right) -->
  <line x1="550" y1="347" x2="640" y2="347" class="arrow" marker-end="url(#ah-tf)" stroke-dasharray="4 2"/>
  <rect x="640" y="320" width="120" height="55" rx="8" fill="#0d1018" stroke="#7bed9f" stroke-width="1"/>
  <text x="700" y="342" text-anchor="middle" class="label" fill="#7bed9f">callbacks</text>
  <text x="700" y="358" text-anchor="middle" class="tag">on_backward_begin</text>
  <text x="700" y="372" text-anchor="middle" class="tag">on_training_step_end</text>
</svg>
