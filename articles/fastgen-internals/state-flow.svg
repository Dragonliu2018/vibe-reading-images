<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="system-ui, sans-serif">
  <rect width="760" height="320" fill="#0b0d14"/>
  <defs>
    <marker id="ah-sf-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6c8ef5"/></marker>
    <marker id="ah-sf-pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff6b9d"/></marker>
    <marker id="ah-sf-dim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b90a8"/></marker>
  </defs>

  <text x="20" y="24" fill="#e4e7f0" font-size="16" font-weight="600">DMD2 交替训练状态流</text>

  <!-- Decision node (top center) -->
  <rect x="270" y="50" width="220" height="50" rx="8" fill="#1a1d34" stroke="#ffa502" stroke-width="1.5"/>
  <text x="380" y="79" fill="#e4e7f0" font-size="12" text-anchor="middle" dominant-baseline="middle">iteration % student_update_freq</text>

  <!-- Student update (left) -->
  <rect x="50" y="170" width="260" height="80" rx="10" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="180" y="198" fill="#e4e7f0" font-size="14" text-anchor="middle" dominant-baseline="middle">Student 更新</text>
  <text x="180" y="218" fill="#8b90a8" font-size="11" text-anchor="middle" dominant-baseline="middle">VSD loss + GAN loss</text>
  <text x="180" y="234" fill="#8b90a8" font-size="11" text-anchor="middle" dominant-baseline="middle">优化 self.net</text>

  <!-- FakeScore/Disc update (right) -->
  <rect x="450" y="170" width="260" height="80" rx="10" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="580" y="198" fill="#e4e7f0" font-size="14" text-anchor="middle" dominant-baseline="middle">FakeScore / Disc 更新</text>
  <text x="580" y="218" fill="#8b90a8" font-size="11" text-anchor="middle" dominant-baseline="middle">DSM loss + GAN loss</text>
  <text x="580" y="234" fill="#8b90a8" font-size="11" text-anchor="middle" dominant-baseline="middle">优化 fake_score + discriminator</text>

  <!-- Decision -> Student (== 0), L-shaped: down from decision left side then to student top -->
  <polyline points="310,100 310,140 180,140 180,170" fill="none" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#ah-sf-blue)"/>
  <text x="232" y="132" fill="#6c8ef5" font-size="11" text-anchor="middle">== 0</text>

  <!-- Decision -> FakeScore (!= 0), L-shaped: down from decision right then to fake top -->
  <polyline points="450,100 450,140 580,140 580,170" fill="none" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#ah-sf-pink)"/>
  <text x="528" y="132" fill="#ff6b9d" font-size="11" text-anchor="middle">!= 0</text>

  <!-- Loop back: Student -> Decision (next iter), L-shaped up -->
  <polyline points="180,170 180,150 60,150 60,75 270,75" fill="none" stroke="#8b90a8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah-sf-dim)"/>
  <text x="68" y="70" fill="#8b90a8" font-size="11">next iter</text>

  <!-- Loop back: FakeScore -> Decision -->
  <polyline points="580,170 580,150 700,150 700,75 490,75" fill="none" stroke="#8b90a8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah-sf-dim)"/>
</svg>
