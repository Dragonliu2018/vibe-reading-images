<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="system-ui, sans-serif">
  <rect width="820" height="440" fill="#0b0d14"/>
  <defs>
    <marker id="ah-ca" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#363b62"/></marker>
  </defs>
  <style>.label{font-size:13px;font-weight:600;fill:#e2e8f0}.mod{font-size:11px;fill:#a0aec0}.tag{font-size:10px;fill:#7a85a3}.arrow{stroke:#363b62;stroke-width:1.5;fill:none}</style>

  <!-- 三层配置 (左列纵向) -->
  <!-- BaseConfig -->
  <rect x="40" y="20" width="220" height="60" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="150" y="42" text-anchor="middle" class="label" fill="#6c8ef5">BaseConfig</text>
  <text x="150" y="58" text-anchor="middle" class="mod">config.py · attrs.define</text>
  <text x="150" y="72" text-anchor="middle" class="tag">model/trainer/data/eval · model_class=L(FastGenModel)</text>

  <line x1="150" y1="80" x2="150" y2="110" class="arrow" marker-end="url(#ah-ca)"/>
  <text x="160" y="100" class="tag">▼ 继承</text>

  <!-- methods config -->
  <rect x="40" y="110" width="220" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="150" y="132" text-anchor="middle" class="label" fill="#f9ca24">methods/config_dmd2.py</text>
  <text x="150" y="148" text-anchor="middle" class="mod">Config(BaseConfig)</text>
  <text x="150" y="162" text-anchor="middle" class="tag">model_class=L(DMD2Model) · ModelConfig 加 disc</text>

  <line x1="150" y1="170" x2="150" y2="200" class="arrow" marker-end="url(#ah-ca)"/>
  <text x="160" y="190" class="tag">▼ 调用 create_config()</text>

  <!-- experiments config -->
  <rect x="40" y="200" width="220" height="60" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="150" y="222" text-anchor="middle" class="label" fill="#ff6b9d">experiments/EDM/config_dmd2_test.py</text>
  <text x="150" y="238" text-anchor="middle" class="mod">create_config() 覆盖参数</text>
  <text x="150" y="252" text-anchor="middle" class="tag">pretrained_path/max_iter/batch_size</text>

  <!-- 右侧: LazyCall + instantiate -->
  <line x1="260" y1="50" x2="400" y2="50" class="arrow" marker-end="url(#ah-ca)"/>
  <text x="330" y="42" class="tag">model_class 字段</text>
  <rect x="400" y="20" width="200" height="60" rx="8" fill="#13162a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="500" y="42" text-anchor="middle" class="label" fill="#a78bfa">LazyCall</text>
  <text x="500" y="58" text-anchor="middle" class="mod">utils/__init__.py:108</text>
  <text x="500" y="72" text-anchor="middle" class="tag">L(DMD2Model)(config=None) → DictConfig</text>

  <line x1="500" y1="80" x2="500" y2="120" class="arrow" marker-end="url(#ah-ca)"/>
  <text x="510" y="105" class="tag">延迟执行</text>

  <rect x="380" y="120" width="240" height="60" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="500" y="142" text-anchor="middle" class="label" fill="#7bed9f">instantiate(cfg)</text>
  <text x="500" y="158" text-anchor="middle" class="mod">utils/__init__.py:60</text>
  <text x="500" y="172" text-anchor="middle" class="tag">递归: _target_ → locate → cls(**kwargs)</text>

  <!-- 输出对象 -->
  <line x1="500" y1="180" x2="500" y2="220" class="arrow" marker-end="url(#ah-ca)"/>
  <rect x="360" y="220" width="280" height="80" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="500" y="242" text-anchor="middle" class="label" fill="#4ecdc4">运行时对象</text>
  <text x="500" y="258" text-anchor="middle" class="mod">DMD2Model 实例</text>
  <text x="500" y="272" text-anchor="middle" class="tag">└ build_model() → instantiate(net) → FastGenNetwork</text>
  <text x="500" y="286" text-anchor="middle" class="tag">└ init_optimizers() → instantiate(optimizer)</text>

  <!-- Hydra override (bottom) -->
  <line x1="150" y1="260" x2="150" y2="320" class="arrow" marker-end="url(#ah-ca)" stroke-dasharray="4 2"/>
  <rect x="40" y="320" width="280" height="55" rx="8" fill="#13162a" stroke="#ffa502" stroke-width="1.5"/>
  <text x="180" y="342" text-anchor="middle" class="label" fill="#ffa502">override_config_with_opts()</text>
  <text x="180" y="358" text-anchor="middle" class="mod">config_utils.py:128</text>
  <text x="180" y="372" text-anchor="middle" class="tag">attrs→dict→hydra.compose(- key=value)→attrs</text>

  <!-- 命令行入口 -->
  <line x1="180" y1="320" x2="180" y2="300" class="arrow" marker-end="url(#ah-ca)" stroke-dasharray="4 2"/>
  <rect x="80" y="395" width="200" height="35" rx="8" fill="#0d1018" stroke="#ffa502" stroke-width="1"/>
  <text x="180" y="417" text-anchor="middle" class="mod" fill="#ffa502">train.py --config ... - key=value</text>
  <line x1="180" y1="395" x2="180" y2="375" class="arrow" marker-end="url(#ah-ca)"/>
</svg>
