<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <rect width="800" height="460" fill="#0b0d14"/>
  <defs>
    <marker id="ah-mf" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#363b62"/></marker>
  </defs>
  <style>.label{font-size:13px;font-weight:600;fill:#e2e8f0}.typ{font-size:10px;fill:#7a85a3}.tag{font-size:10px;fill:#7a85a3}.arrow{stroke:#363b62;stroke-width:1.5;fill:none}</style>

  <!-- entry -->
  <rect x="280" y="20" width="240" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="47" text-anchor="middle" class="label" fill="#4ecdc4">DMD2Model.single_train_step(data, iter)</text>
  <line x1="400" y1="65" x2="400" y2="90" class="arrow" marker-end="url(#ah-mf)"/>

  <!-- prepare -->
  <rect x="260" y="90" width="280" height="45" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="112" text-anchor="middle" class="label" fill="#f9ca24">_prepare_training_data(data)</text>
  <text x="400" y="128" text-anchor="middle" class="typ">→ (real_data, condition, neg_condition)</text>
  <line x1="400" y1="135" x2="400" y2="160" class="arrow" marker-end="url(#ah-mf)"/>

  <!-- setup grad -->
  <rect x="240" y="160" width="320" height="45" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="400" y="182" text-anchor="middle" class="label" fill="#f9ca24">_setup_grad_requirements(iter)</text>
  <text x="400" y="198" text-anchor="middle" class="typ">切换 fake_score/disc 的 requires_grad</text>
  <line x1="400" y1="205" x2="400" y2="225" class="arrow" marker-end="url(#ah-mf)"/>

  <!-- decision -->
  <rect x="260" y="225" width="280" height="40" rx="8" fill="#1a1d34" stroke="#ffa502" stroke-width="1.5"/>
  <text x="400" y="250" text-anchor="middle" class="label" fill="#ffa502">iter % student_update_freq ?</text>

  <!-- left branch: == 0 student -->
  <line x1="320" y1="265" x2="180" y2="300" class="arrow" marker-end="url(#ah-mf)"/>
  <text x="235" y="285" class="tag" fill="#6c8ef5">== 0</text>
  <rect x="60" y="300" width="240" height="60" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="180" y="322" text-anchor="middle" class="label" fill="#6c8ef5">_student_update_step()</text>
  <text x="180" y="338" text-anchor="middle" class="typ">gen_data = self.net(input, t)</text>
  <text x="180" y="352" text-anchor="middle" class="typ">vsd_loss + gan_loss → self.net</text>

  <!-- right branch: != 0 fake_score -->
  <line x1="480" y1="265" x2="620" y2="300" class="arrow" marker-end="url(#ah-mf)"/>
  <text x="545" y="285" class="tag" fill="#ff6b9d">!= 0</text>
  <rect x="500" y="300" width="240" height="60" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="620" y="322" text-anchor="middle" class="label" fill="#ff6b9d">_fake_score_disc_update()</text>
  <text x="620" y="338" text-anchor="middle" class="typ">dsm_loss → fake_score</text>
  <text x="620" y="352" text-anchor="middle" class="typ">gan_disc_loss → discriminator</text>

  <!-- bottom: loss return -->
  <line x1="180" y1="360" x2="350" y2="400" class="arrow" marker-end="url(#ah-mf)"/>
  <line x1="620" y1="360" x2="450" y2="400" class="arrow" marker-end="url(#ah-mf)"/>
  <rect x="320" y="400" width="160" height="45" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="400" y="422" text-anchor="middle" class="label" fill="#7bed9f">return loss_map</text>
  <text x="400" y="438" text-anchor="middle" class="typ">→ backward()</text>
</svg>
