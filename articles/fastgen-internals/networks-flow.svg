<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="system-ui, sans-serif">
  <rect width="780" height="400" fill="#0b0d14"/>
  <defs>
    <marker id="ah-nf" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#363b62"/></marker>
  </defs>
  <style>.label{font-size:13px;font-weight:600;fill:#e2e8f0}.typ{font-size:10px;fill:#7a85a3}.tag{font-size:10px;fill:#7a85a3}.arrow{stroke:#363b62;stroke-width:1.5;fill:none}</style>

  <!-- EDMPrecond.forward -->
  <rect x="250" y="20" width="280" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="390" y="42" text-anchor="middle" class="label" fill="#f9ca24">EDMPrecond.forward(x_t, t, condition)</text>
  <text x="390" y="58" text-anchor="middle" class="typ">x_t: Tensor [B,C,H,W] · t: Tensor [B]</text>
  <line x1="390" y1="70" x2="390" y2="100" class="arrow" marker-end="url(#ah-nf)"/>

  <!-- precond_input -->
  <rect x="230" y="100" width="320" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="390" y="122" text-anchor="middle" class="label" fill="#f9ca24">precond_input(x_t, t, sigma_data)</text>
  <text x="390" y="138" text-anchor="middle" class="typ">c_in = 1/√(σ²+t²) · t = log(t)/4 → (x_t_in, t_in)</text>
  <line x1="390" y1="150" x2="390" y2="180" class="arrow" marker-end="url(#ah-nf)"/>

  <!-- self.model (底层 UNet) -->
  <rect x="250" y="180" width="280" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="390" y="202" text-anchor="middle" class="label" fill="#6c8ef5">self.model(x_t_in, t_in, class_labels)</text>
  <text x="390" y="218" text-anchor="middle" class="typ">SongUNet / DhariwalUNet → out: Tensor</text>
  <line x1="390" y1="230" x2="390" y2="260" class="arrow" marker-end="url(#ah-nf)"/>

  <!-- precond_output -->
  <rect x="210" y="260" width="360" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="390" y="282" text-anchor="middle" class="label" fill="#f9ca24">precond_output(out, x_t_in, t_in, sigma_data)</text>
  <text x="390" y="298" text-anchor="middle" class="typ">c_skip * x_t + c_out * out → out: Tensor</text>
  <line x1="390" y1="310" x2="390" y2="340" class="arrow" marker-end="url(#ah-nf)"/>

  <!-- convert_model_output -->
  <rect x="170" y="340" width="440" height="50" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="390" y="362" text-anchor="middle" class="label" fill="#7bed9f">noise_scheduler.convert_model_output(x_t, out, t, src, target)</text>
  <text x="390" y="378" text-anchor="middle" class="typ">src_pred_type → x0 → target_pred_type → Tensor</text>
</svg>
