<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="system-ui, sans-serif">
  <rect width="820" height="440" fill="#0b0d14"/>
  <defs>
    <marker id="ah-da" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#363b62"/></marker>
  </defs>
  <style>.label{font-size:13px;font-weight:600;fill:#e2e8f0}.mod{font-size:11px;fill:#a0aec0}.tag{font-size:10px;fill:#7a85a3}.arrow{stroke:#363b62;stroke-width:1.5;fill:none}</style>

  <!-- 两条路径标题 -->
  <text x="20" y="22" class="tag" fill="#6c8ef5">路径 A: class-conditional</text>
  <text x="440" y="22" class="tag" fill="#f9ca24">路径 B: WebDataset</text>

  <!-- 路径 A: ImageDataset -->
  <rect x="40" y="35" width="200" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="140" y="57" text-anchor="middle" class="label" fill="#6c8ef5">ImageDataset (ABC)</text>
  <text x="140" y="73" text-anchor="middle" class="mod">class_cond_dataset.py:23</text>
  <line x1="140" y1="85" x2="140" y2="110" class="arrow" marker-end="url(#ah-da)"/>

  <rect x="40" y="110" width="200" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="140" y="132" text-anchor="middle" class="label" fill="#6c8ef5">ImageFolderDataset</text>
  <text x="140" y="148" text-anchor="middle" class="mod">ZIP/目录/S3 · dataset.json 标签</text>
  <line x1="140" y1="160" x2="140" y2="185" class="arrow" marker-end="url(#ah-da)"/>

  <rect x="40" y="185" width="200" height="45" rx="8" fill="#13162a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="140" y="207" text-anchor="middle" class="label" fill="#a78bfa">InfiniteSampler</text>
  <text x="140" y="223" text-anchor="middle" class="mod">无限循环 · iteration-based</text>

  <!-- 路径 B: BaseWDSLoader 继承树 -->
  <rect x="440" y="35" width="220" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="550" y="57" text-anchor="middle" class="label" fill="#f9ca24">BaseWDSLoader</text>
  <text x="550" y="73" text-anchor="middle" class="mod">wds_utils.py:364 · _create_loader 模板</text>
  <line x1="550" y1="85" x2="550" y2="110" class="arrow" marker-end="url(#ah-da)"/>

  <rect x="440" y="110" width="220" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="550" y="132" text-anchor="middle" class="label" fill="#f9ca24">WDSLoader</text>
  <text x="550" y="148" text-anchor="middle" class="mod">latent/embedding · key_map · presets</text>

  <!-- WDSLoader 的两个子类 -->
  <line x1="500" y1="160" x2="380" y2="195" class="arrow" marker-end="url(#ah-da)"/>
  <line x1="600" y1="160" x2="700" y2="195" class="arrow" marker-end="url(#ah-da)"/>
  <rect x="270" y="195" width="220" height="55" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="380" y="217" text-anchor="middle" class="label" fill="#ff6b9d">ImageWDSLoader</text>
  <text x="380" y="233" text-anchor="middle" class="mod">decode_image + transform</text>
  <text x="380" y="247" text-anchor="middle" class="tag">输出 [B,C,H,W]</text>

  <rect x="600" y="195" width="200" height="55" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="700" y="217" text-anchor="middle" class="label" fill="#ff6b9d">VideoWDSLoader</text>
  <text x="700" y="233" text-anchor="middle" class="mod">decode_video + transform</text>
  <text x="700" y="247" text-anchor="middle" class="tag">输出 [B,C,T,H,W]</text>

  <!-- DeterministicWDS (side) -->
  <line x1="550" y1="85" x2="700" y2="110" class="arrow" marker-end="url(#ah-da)" stroke-dasharray="4 2"/>
  <text x="640" y="102" class="tag">deterministic 模式</text>
  <rect x="600" y="110" width="200" height="50" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="700" y="132" text-anchor="middle" class="label" fill="#7bed9f">DeterministicWDS</text>
  <text x="700" y="148" text-anchor="middle" class="mod">shard fast-forward · 精确恢复</text>

  <!-- 统一输出 (bottom) -->
  <line x1="140" y1="230" x2="350" y2="310" class="arrow" marker-end="url(#ah-da)"/>
  <line x1="380" y1="250" x2="390" y2="310" class="arrow" marker-end="url(#ah-da)"/>
  <line x1="700" y1="250" x2="430" y2="310" class="arrow" marker-end="url(#ah-da)"/>

  <rect x="250" y="310" width="340" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="420" y="332" text-anchor="middle" class="label" fill="#4ecdc4">统一输出 dict</text>
  <text x="420" y="348" text-anchor="middle" class="mod">{"real": tensor, "condition": ...,</text>
  <text x="420" y="362" text-anchor="middle" class="mod"> "neg_condition": zeros, "idx": ...}</text>

  <!-- AugmentPipe (bottom right, 在 Trainer 调用) -->
  <line x1="590" y1="340" x2="680" y2="340" class="arrow" marker-end="url(#ah-da)" stroke-dasharray="4 2"/>
  <text x="635" y="332" class="tag">Trainer.preprocess</text>
  <rect x="680" y="310" width="120" height="60" rx="8" fill="#13162a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="740" y="332" text-anchor="middle" class="label" fill="#a78bfa">AugmentPipe</text>
  <text x="740" y="348" text-anchor="middle" class="mod">EDM 风格</text>
  <text x="740" y="362" text-anchor="middle" class="tag">像素/几何/颜色</text>
</svg>
