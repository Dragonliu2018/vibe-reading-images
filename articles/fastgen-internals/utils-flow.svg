<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="system-ui, sans-serif">
  <rect width="800" height="470" fill="#0b0d14"/>
  <defs>
    <marker id="ah-uf" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#363b62"/></marker>
  </defs>
  <style>.label{font-size:13px;font-weight:600;fill:#e2e8f0}.typ{font-size:10px;fill:#7a85a3}.tag{font-size:10px;fill:#7a85a3}.arrow{stroke:#363b62;stroke-width:1.5;fill:none}</style>

  <!-- 左路: FSDP 装配 -->
  <text x="20" y="22" class="tag" fill="#6c8ef5">FSDP 装配链</text>
  <rect x="40" y="35" width="240" height="45" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="160" y="57" text-anchor="middle" class="label" fill="#6c8ef5">fsdp.model_to_fsdp(model)</text>
  <text x="160" y="73" text-anchor="middle" class="typ">fsdp.py:67</text>
  <line x1="160" y1="80" x2="160" y2="110" class="arrow" marker-end="url(#ah-uf)"/>

  <rect x="20" y="110" width="280" height="45" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="160" y="132" text-anchor="middle" class="label" fill="#6c8ef5">_get_submodules_to_shard()</text>
  <text x="160" y="148" text-anchor="middle" class="typ">按 min_num_params(10M) 阈值选分片单元</text>
  <line x1="160" y1="155" x2="160" y2="185" class="arrow" marker-end="url(#ah-uf)"/>

  <rect x="40" y="185" width="240" height="45" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="160" y="207" text-anchor="middle" class="label" fill="#6c8ef5">apply_fsdp_checkpointing()</text>
  <text x="160" y="223" text-anchor="middle" class="typ">checkpoint_wrapper · activation 省显存</text>
  <line x1="160" y1="230" x2="160" y2="260" class="arrow" marker-end="url(#ah-uf)"/>

  <rect x="60" y="260" width="200" height="45" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="160" y="282" text-anchor="middle" class="label" fill="#7bed9f">fully_shard(...)</text>
  <text x="160" y="298" text-anchor="middle" class="typ">PyTorch FSDP2 分片完成</text>

  <!-- 右路: Checkpointer save/load -->
  <text x="480" y="22" class="tag" fill="#7bed9f">检查点保存/加载链</text>
  <rect x="480" y="35" width="260" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="610" y="57" text-anchor="middle" class="label" fill="#4ecdc4">Trainer.save_checkpoint(model, iter)</text>
  <text x="610" y="73" text-anchor="middle" class="typ">trainer.py:263</text>
  <line x1="610" y1="80" x2="610" y2="110" class="arrow" marker-end="url(#ah-uf)"/>

  <rect x="460" y="110" width="300" height="45" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="610" y="132" text-anchor="middle" class="label" fill="#7bed9f">Checkpointer.save(model, iter, path)</text>
  <text x="610" y="148" text-anchor="middle" class="typ">ModelWrapper.state_dict() + OptimizerWrapper</text>
  <line x1="610" y1="155" x2="610" y2="185" class="arrow" marker-end="url(#ah-uf)"/>

  <rect x="480" y="185" width="260" height="55" rx="8" fill="#13162a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="610" y="207" text-anchor="middle" class="label" fill="#a78bfa">callback.state_dict()</text>
  <text x="610" y="223" text-anchor="middle" class="typ">EMA/Wandb 状态 + grad_scaler</text>
  <text x="610" y="237" text-anchor="middle" class="typ">→ {iteration:07d}.pth</text>
  <line x1="610" y1="240" x2="610" y2="270" class="arrow" marker-end="url(#ah-uf)"/>

  <rect x="480" y="270" width="260" height="45" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
  <text x="610" y="292" text-anchor="middle" class="label" fill="#7bed9f">[FSDP] FSDPCheckpointer</text>
  <text x="610" y="308" text-anchor="middle" class="typ">DTensor gather/scatter · catch Missing key</text>

  <!-- 汇聚: auto_resume 恢复 -->
  <line x1="160" y1="305" x2="400" y2="370" class="arrow" marker-end="url(#ah-uf)" stroke-dasharray="4 2"/>
  <line x1="610" y1="315" x2="400" y2="370" class="arrow" marker-end="url(#ah-uf)" stroke-dasharray="4 2"/>
  <rect x="280" y="370" width="320" height="55" rx="8" fill="#13162a" stroke="#ffa502" stroke-width="1.5"/>
  <text x="440" y="392" text-anchor="middle" class="label" fill="#ffa502">auto_resume 恢复链</text>
  <text x="440" y="408" text-anchor="middle" class="typ">auto_resume.get_resume_details() → Checkpointer.load()</text>
  <text x="440" y="422" text-anchor="middle" class="typ">→ model/optim/callback.load_state_dict + sampler_start_idx</text>

  <line x1="440" y1="425" x2="440" y2="450" class="arrow" marker-end="url(#ah-uf)"/>
  <rect x="360" y="450" width="160" height="20" rx="6" fill="#0d1018" stroke="#7a85a3" stroke-width="1"/>
  <text x="440" y="464" text-anchor="middle" class="tag">恢复训练 iteration</text>
</svg>
