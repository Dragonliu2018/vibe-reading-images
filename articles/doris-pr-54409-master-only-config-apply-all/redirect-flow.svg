<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#0b0d14"/>
  <text x="440" y="28" text-anchor="middle" fill="#e6e6e6" font-size="16" font-weight="600">ADMIN SET ALL FRONTENDS CONFIG 路由链路与改动位置</text>

  <!-- Client -->
  <rect x="20" y="150" width="100" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="70" y="174" text-anchor="middle" fill="#e6e6e6" font-size="13">MySQL</text>
  <text x="70" y="192" text-anchor="middle" fill="#e6e6e6" font-size="13">Client</text>

  <!-- 接入 FE 分组 -->
  <rect x="150" y="70" width="250" height="270" rx="8" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="275" y="92" text-anchor="middle" fill="#999" font-size="12">接入 FE（任意节点）</text>

  <rect x="165" y="105" width="220" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="275" y="127" text-anchor="middle" fill="#e6e6e6" font-size="12">NereidsParser 解析</text>
  <text x="275" y="145" text-anchor="middle" fill="#999" font-size="11">applyToAll = 语句含 ALL</text>

  <rect x="165" y="175" width="220" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="2"/>
  <text x="275" y="197" text-anchor="middle" fill="#f9ca24" font-size="12" font-weight="600">Command 构造器</text>
  <text x="275" y="215" text-anchor="middle" fill="#999" font-size="11">masterOnly 判定 —— 本 PR 改动点</text>

  <rect x="165" y="255" width="220" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="275" y="277" text-anchor="middle" fill="#e6e6e6" font-size="12">StmtExecutor</text>
  <text x="275" y="295" text-anchor="middle" fill="#999" font-size="11">toRedirectStatus() → 是否转 Master</text>

  <!-- Master FE 分组 -->
  <rect x="440" y="70" width="230" height="270" rx="8" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="555" y="92" text-anchor="middle" fill="#999" font-size="12">Master FE</text>

  <rect x="455" y="105" width="200" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="555" y="127" text-anchor="middle" fill="#e6e6e6" font-size="12">run() → Env.setConfig</text>
  <text x="555" y="145" text-anchor="middle" fill="#999" font-size="11">applyToAll 保留为 true</text>

  <rect x="455" y="175" width="200" height="52" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="555" y="197" text-anchor="middle" fill="#e6e6e6" font-size="12">setMutableConfigWithCallback</text>
  <text x="555" y="215" text-anchor="middle" fill="#999" font-size="11">本节点内存生效</text>

  <rect x="455" y="255" width="200" height="52" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="555" y="277" text-anchor="middle" fill="#e6e6e6" font-size="12">FEOpExecutor 扇出</text>
  <text x="555" y="295" text-anchor="middle" fill="#4ecdc4" font-size="11">getLocalSetStmt → 其余存活 FE</text>

  <!-- 其余 FE -->
  <rect x="710" y="120" width="150" height="64" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="785" y="146" text-anchor="middle" fill="#e6e6e6" font-size="12">Follower FE</text>
  <text x="785" y="166" text-anchor="middle" fill="#4ecdc4" font-size="11">setConfig 本地生效</text>

  <rect x="710" y="245" width="150" height="64" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="785" y="271" text-anchor="middle" fill="#e6e6e6" font-size="12">Observer FE</text>
  <text x="785" y="291" text-anchor="middle" fill="#4ecdc4" font-size="11">setConfig 本地生效</text>

  <!-- 箭头 -->
  <line x1="120" y1="178" x2="148" y2="178" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="275" y1="157" x2="275" y2="173" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="275" y1="235" x2="275" y2="253" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="275" y1="307" x2="275" y2="322" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#arrY)"/>
  <line x1="400" y1="178" x2="438" y2="178" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="555" y1="157" x2="555" y2="173" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="555" y1="227" x2="555" y2="253" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="655" y1="281" x2="708" y2="160" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="655" y1="285" x2="708" y2="275" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="275" y="345" text-anchor="middle" fill="#f9ca24" font-size="11">applyToAll=true 时跳过特判</text>
  <text x="275" y="361" text-anchor="middle" fill="#999" font-size="11">（旧代码在此把 applyToAll 清成 false）</text>

  <!-- 图例 -->
  <rect x="620" y="352" width="14" height="14" rx="3" fill="#13162a" stroke="#f9ca24" stroke-width="2"/>
  <text x="640" y="363" fill="#999" font-size="11">改动位置</text>
  <rect x="710" y="352" width="14" height="14" rx="3" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="730" y="363" fill="#999" font-size="11">全 FE 生效路径</text>
</svg>
