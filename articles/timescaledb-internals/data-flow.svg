<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="700" fill="#0b0d14"/>

  <text x="380" y="26" text-anchor="middle" font-size="17" fill="#e4e7f3" font-weight="600">Hypertable 写入数据流（INSERT / COPY）</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#9aa3c0">逐行路由到 chunk · 压缩 chunk 透明解压 · 连续聚合失效追踪</text>

  <!-- 1. INSERT/COPY -->
  <rect x="180" y="60" width="400" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="380" y="79" text-anchor="middle" font-size="13" fill="#e4e7f3">INSERT / COPY FROM hypertable</text>
  <text x="380" y="95" text-anchor="middle" font-size="11" fill="#9aa3c0">PG 接收写入语句</text>
  <path d="M 380 104 L 380 132" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 2. planner -->
  <rect x="180" y="132" width="400" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="380" y="151" text-anchor="middle" font-size="13" fill="#e4e7f3">planner</text>
  <text x="380" y="167" text-anchor="middle" font-size="11" fill="#9aa3c0">replace_modify_hypertable_paths() → ModifyHypertablePath</text>
  <path d="M 380 176 L 380 204" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 3. ExecModifyTable -->
  <rect x="180" y="204" width="400" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="380" y="223" text-anchor="middle" font-size="13" fill="#e4e7f3">ExecModifyTable 逐行循环</text>
  <text x="380" y="239" text-anchor="middle" font-size="11" fill="#9aa3c0">modify_hypertable_exec.c</text>
  <path d="M 380 248 L 380 276" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 4. calculate point -->
  <rect x="180" y="276" width="400" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="380" y="295" text-anchor="middle" font-size="13" fill="#e4e7f3">ts_hyperspace_calculate_point()</text>
  <text x="380" y="311" text-anchor="middle" font-size="11" fill="#9aa3c0">TupleTableSlot → Point（N 维 int64 坐标）</text>
  <path d="M 380 320 L 380 348" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 5. chunk routing -->
  <rect x="180" y="348" width="400" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="380" y="367" text-anchor="middle" font-size="13" fill="#e4e7f3">chunk_tuple_routing 查找/创建 chunk</text>
  <text x="380" y="383" text-anchor="middle" font-size="11" fill="#9aa3c0">dimension_slice B-tree 扫描定位区间</text>
  <path d="M 380 392 L 380 420" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="395" y="410" font-size="11" fill="#f9ca24">chunk 已压缩？</text>

  <!-- 6. decompress (TSL, conditional dashed) -->
  <rect x="180" y="420" width="400" height="44" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="380" y="439" text-anchor="middle" font-size="13" fill="#e4e7f3">decompress_batches_for_insert()</text>
  <text x="380" y="455" text-anchor="middle" font-size="11" fill="#9aa3c0">若已压缩：解压冲突 batch 使行可见 [TSL]</text>
  <path d="M 380 464 L 380 492" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="395" y="482" font-size="11" fill="#6c8ef5">解压后行可见</text>

  <!-- 7. write -->
  <rect x="180" y="492" width="400" height="44" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="380" y="511" text-anchor="middle" font-size="13" fill="#e4e7f3">table_tuple_insert()</text>
  <text x="380" y="527" text-anchor="middle" font-size="11" fill="#9aa3c0">或 compressor_add_slot() 直写列存 [TSL]</text>
  <path d="M 380 536 L 380 564" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 8. CAGG invalidate (TSL) -->
  <rect x="180" y="564" width="400" height="44" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="2"/>
  <text x="380" y="583" text-anchor="middle" font-size="13" fill="#e4e7f3">continuous_agg_dml_invalidate()</text>
  <text x="380" y="599" text-anchor="middle" font-size="11" fill="#9aa3c0">记录变更时间范围 → invalidation_log [TSL]</text>
  <path d="M 380 608 L 380 636" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 9. catalog -->
  <rect x="180" y="636" width="400" height="44" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="2"/>
  <text x="380" y="655" text-anchor="middle" font-size="13" fill="#e4e7f3">TS Catalog 持久化</text>
  <text x="380" y="671" text-anchor="middle" font-size="11" fill="#9aa3c0">invalidation_log / dimension_slice / chunk 元数据</text>

  <!-- Legend -->
  <g transform="translate(180, 692)">
    <rect x="0" y="-9" width="12" height="12" rx="2" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
    <text x="18" y="1" font-size="11" fill="#9aa3c0">Apache（src/）</text>
    <rect x="120" y="-9" width="12" height="12" rx="2" fill="#13162a" stroke="#ff6b9d" stroke-width="2"/>
    <text x="138" y="1" font-size="11" fill="#9aa3c0">Timescale License（tsl/）</text>
    <rect x="290" y="-9" width="12" height="12" rx="2" fill="#13162a" stroke="#f9ca24" stroke-width="2"/>
    <text x="308" y="1" font-size="11" fill="#9aa3c0">TS Catalog</text>
  </g>
</svg>
