<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
  </marker>
  </defs>
  <rect width="720" height="420" fill="#0b0d14"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#c9d1e8">Phi 合并：前驱状态汇聚到后继块</text>

  <!-- Predecessor A -->
  <rect x="40" y="70" width="200" height="70" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="140" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6c8ef5">前驱块 A</text>
  <text x="140" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">locals[i] = vA</text>
  <text x="140" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">stack = [vA2]</text>

  <!-- Predecessor B -->
  <rect x="480" y="70" width="200" height="70" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="580" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6c8ef5">前驱块 B</text>
  <text x="580" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">locals[i] = vB</text>
  <text x="580" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">stack = [vB2]</text>

  <!-- arrows to join -->
  <path d="M140,140 L240,200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <path d="M580,140 L480,200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- Join block -->
  <rect x="240" y="200" width="240" height="90" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="360" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#f9ca24">后继块（join）</text>
  <text x="360" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">phi_i = phi(vA, vB)</text>
  <text x="360" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">phi_top = phi(vA2, vB2)</text>
  <text x="360" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">initialize_VM_state_from（首前驱）</text>

  <!-- match check -->
  <rect x="40" y="330" width="640" height="70" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="352" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#ff6b9d">match() 前置校验</text>
  <text x="60" y="372" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">栈深度一致 · 对应槽 LLVM 类型一致 · 锁数一致</text>
  <text x="60" y="390" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">不匹配 → update_phi_nodes 返回 false → report_jeandle_error</text>

</svg>
