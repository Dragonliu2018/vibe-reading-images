  <text x="370" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">align · offset · code_size</text>

  <path d="M370,164 L370,188" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

