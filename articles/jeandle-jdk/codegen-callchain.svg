  <text x="370" y="308" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">Step1 JITLink: routine/const/oop 重定位 → JeandleReloc*</text>
  <text x="370" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">Step2 .llvm_stackmaps: record→OopMap→CallReloc（按 statepoint id/offset 匹配）</text>
  <text x="370" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">Step3 sort · Step4 fixup_offset(prolog) + emit_reloc</text>

  <path d="M370,348 L370,372" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

