  <text x="370" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">ic_check · verified_entry · stack_overflow_check · emit_insts(.text)</text>

  <path d="M370,244 L370,268" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

