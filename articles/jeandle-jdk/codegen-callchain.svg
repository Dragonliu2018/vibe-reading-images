  <text x="370" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">createELFObjectFile → _elf</text>

  <path d="M370,96 L370,120" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

