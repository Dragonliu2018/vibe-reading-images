  </defs>
  <rect width="740" height="520" fill="#0b0d14"/>
  <text x="370" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#c9d1e8">finalize 调用链路（ELF→CodeBuffer）</text>

