  <text x="370" y="392" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">build_exception_handler_table · build_implicit_exception_table</text>
  <text x="370" y="410" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">.gcc_except_table(ULEB128) · .llvm_faultmaps(FaultMapParser)</text>

