<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
  </marker>
  <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
  </marker>
  </defs>
  <rect width="720" height="540" fill="#0b0d14"/>
  <text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#c9d1e8">编译驱动调用链路（compile_method）</text>

  <!-- entry -->
  <rect x="240" y="52" width="240" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="360" y="77" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">JeandleCompiler::compile_method</text>

  <path d="M360,92 L360,116" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- initialize -->
  <rect x="200" y="116" width="320" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="360" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">initialize() · setup_llvm_module(bitcode)</text>

  <path d="M360,156 L360,180" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- check_can_parse -->
  <rect x="200" y="180" width="320" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="360" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">check_can_parse（前置校验）</text>

  <!-- fail branch -->
  <path d="M200,200 L120,200 L120,232" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arrr)" fill="none"/>
  <text x="128" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#ff6b9d">不可解析</text>
  <rect x="40" y="232" width="160" height="40" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="120" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">record_method_not_compilable</text>

  <path d="M360,220 L360,244" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- AbstractInterpreter -->
  <rect x="160" y="244" width="400" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="360" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">JeandleAbstractInterpreter（翻译为 IR）</text>
  <text x="360" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b95b8">→ 模块：抽象解释器</text>

  <path d="M360,288 L360,312" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- verify + optimize -->
  <rect x="160" y="312" width="400" height="40" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="360" y="337" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">verifyModule · llvm::jeandle::optimize(O3)</text>

  <path d="M360,352 L360,376" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- compile_module -->
  <rect x="160" y="376" width="400" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="360" y="401" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">compile_module · addPassesToEmitMC → ELF</text>

  <path d="M360,416 L360,440" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- finalize -->
  <rect x="160" y="440" width="400" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="360" y="465" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">_code.finalize()（重定位/OopMap/异常表）</text>
  <text x="360" y="476" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8b95b8">→ 模块：代码生成</text>

  <path d="M360,480 L360,500" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- install -->
  <rect x="240" y="500" width="240" height="32" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="360" y="521" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">install_code → register_method</text>

  <!-- error side rail -->
  <path d="M560,440 L620,440 L620,300 L560,300" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="5 3" fill="none" opacity="0.6"/>
  <text x="628" y="372" font-family="system-ui,sans-serif" font-size="11" fill="#ff6b9d">error_occurred</text>
  <text x="628" y="388" font-family="system-ui,sans-serif" font-size="11" fill="#ff6b9d">→ CrashOnError? fatal</text>
  <text x="628" y="404" font-family="system-ui,sans-serif" font-size="11" fill="#ff6b9d">: record_not_compilable</text>

</svg>
