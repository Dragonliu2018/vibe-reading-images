<svg xmlns="http://www.w3.org/2000/svg" width="740" height="460" viewBox="0 0 740 460">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
  </marker>
  </defs>
  <rect width="740" height="460" fill="#0b0d14"/>
  <text x="370" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#c9d1e8">抽象解释调用链路（interpret）</text>

  <!-- interpret entry -->
  <rect x="220" y="52" width="300" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="370" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">interpret()</text>
  <text x="370" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">push 首块 · initialize_VM_state · merge 首块</text>

  <path d="M370,96 L370,120" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- loop header -->
  <rect x="180" y="120" width="380" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="370" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">while (_work_list 非空)</text>
  <text x="370" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">取 RPO 末尾块 · interpret_block(block)</text>

  <path d="M370,176 L370,200" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- interpret_block -->
  <rect x="120" y="200" width="500" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="370" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">interpret_block()</text>
  <text x="370" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">SetInsertPoint · 遍历字节码 switch(code) → IRBuilder 生成 IR</text>

  <path d="M370,256 L370,280" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- bytecode handlers -->
  <rect x="40" y="280" width="200" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="140" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">算术/常量/转换</text>
  <rect x="270" y="280" width="200" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="370" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">invoke / 字段 / 数组</text>
  <rect x="500" y="280" width="200" height="40" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="600" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">check/throw/monitor</text>

  <path d="M370,320 L370,344" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- successor merge -->
  <rect x="160" y="344" width="420" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="370" y="364" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#c9d1e8">遍历 block->successors()</text>
  <text x="370" y="382" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">merge_VM_state_from(Phi 合并) · 未编译则 add_to_work_list</text>

  <!-- loop back arrow -->
  <path d="M160,372 L90,372 L90,148 L180,148" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none" opacity="0.7"/>
  <text x="96" y="260" font-family="system-ui,sans-serif" font-size="11" fill="#8b95b8">下一块</text>

  <!-- finalize -->
  <path d="M370,400 L370,424" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <rect x="220" y="424" width="300" height="30" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="370" y="444" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c9d1e8">remove_dead_blocks()</text>

</svg>
