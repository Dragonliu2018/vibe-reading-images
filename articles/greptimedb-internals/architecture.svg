<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="560" fill="#0b0d14"/>

  <text x="410" y="22" text-anchor="middle" fill="#e6e6f0" font-size="16" font-weight="700">GreptimeDB 分层架构（crate 依赖自上而下）</text>

  <!-- L1 Access -->
