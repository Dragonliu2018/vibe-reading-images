  <rect x="112" y="470" width="108" height="44" rx="4" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.55" stroke-width="1"/>
  <text x="166" y="492" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="11">runtime</text>
  <rect x="228" y="470" width="108" height="44" rx="4" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.55" stroke-width="1"/>
  <text x="282" y="492" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="11">config</text>
  <rect x="344" y="470" width="108" height="44" rx="4" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.55" stroke-width="1"/>
  <text x="398" y="492" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="11">error</text>
  <rect x="460" y="470" width="108" height="44" rx="4" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.55" stroke-width="1"/>
  <text x="514" y="492" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="11">telemetry</text>
  <rect x="576" y="470" width="108" height="44" rx="4" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.55" stroke-width="1"/>
  <text x="630" y="492" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="11">procedure</text>
  <rect x="692" y="470" width="108" height="44" rx="4" fill="#13162a" stroke="#f9ca24" stroke-opacity="0.55" stroke-width="1"/>
  <text x="746" y="492" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="11">wal</text>

  <text x="410" y="552" text-anchor="middle" fill="#7a86b3" font-size="11">依赖方向：上层 crate 仅可依赖下层 crate（architecture-invariants 强制分层，禁止循环依赖）</text>
</svg>
