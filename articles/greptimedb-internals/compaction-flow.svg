<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 875 175" width="875" height="175" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="875" height="175" fill="#0b0d14"/>

  <text x="437" y="22" text-anchor="middle" fill="#e6e6f0" font-size="16" font-weight="700">TWCS Compaction 合并流水线</text>
  <text x="437" y="40" text-anchor="middle" fill="#8a90b0" font-size="11">状态机 Idle → Picking → Executing → Finished · 失败/取消 → Cancelled/Failed · TTL 过期文件直接 remove_expired</text>

  <!-- pipeline boxes (w=120, x=15,160,305,450,595,740) -->
  <rect x="15" y="54" width="120" height="56" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.8" stroke-width="1"/>
  <text x="75" y="76" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="12">L0 SST 文件</text>
  <text x="75" y="94" text-anchor="middle" dominant-baseline="central" fill="#8a90b0" font-size="10">flush 产物</text>

  <rect x="160" y="54" width="120" height="56" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.75" stroke-width="1"/>
  <text x="220" y="76" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="12">时间窗口分组</text>
  <text x="220" y="94" text-anchor="middle" dominant-baseline="central" fill="#8a90b0" font-size="10">按 max_timestamp</text>

  <rect x="305" y="54" width="120" height="56" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.75" stroke-width="1"/>
  <text x="365" y="76" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="12">sorted runs</text>
  <text x="365" y="94" text-anchor="middle" dominant-baseline="central" fill="#8a90b0" font-size="10">重叠文件检测</text>

  <rect x="450" y="54" width="120" height="56" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.8" stroke-width="1"/>
  <text x="510" y="76" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="12">merge / reduce</text>
  <text x="510" y="94" text-anchor="middle" dominant-baseline="central" fill="#8a90b0" font-size="10">合并去重</text>

  <rect x="595" y="54" width="120" height="56" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.8" stroke-width="1"/>
  <text x="655" y="76" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="12">L1 输出 SST</text>
  <text x="655" y="94" text-anchor="middle" dominant-baseline="central" fill="#8a90b0" font-size="10">按 size 拆分</text>

  <rect x="740" y="54" width="120" height="56" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-opacity="0.75" stroke-width="1"/>
  <text x="800" y="76" text-anchor="middle" dominant-baseline="central" fill="#d6d9e8" font-size="12">manifest 更新</text>
  <text x="800" y="94" text-anchor="middle" dominant-baseline="central" fill="#8a90b0" font-size="10">RegionEdit</text>

  <!-- arrows -->
  <path d="M135,82 L160,82" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M280,82 L305,82" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M425,82 L450,82" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M570,82 L595,82" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M715,82 L740,82" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="437" y="140" text-anchor="middle" fill="#7a86b3" font-size="11">触发：flush 完成后自动 / 手动 DDL · 受 min_compaction_interval 与 staging 模式约束 · 内存预算由 CompactionMemoryManager 控制</text>
</svg>
