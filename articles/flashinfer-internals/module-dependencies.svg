<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="system-ui, sans-serif">
  <rect width="880" height="580" fill="#0b0d14"/>
  <defs>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8b95b5"/>
    </marker>
    <marker id="ay" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#f9ca24"/>
    </marker>
  </defs>
  <text x="440" y="28" text-anchor="middle" fill="#e6e8f0" font-size="17" font-weight="700">模块依赖关系</text>
  <text x="440" y="48" text-anchor="middle" fill="#8b95b5" font-size="11">灰箭头 = 调用/依赖 · 黄箭头 = 算子经 JIT 编译 / autotune 调度</text>

  <!-- 中心: attention -->
  <rect x="340" y="70" width="180" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="430" y="92" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">attention</text>
  <text x="430" y="110" text-anchor="middle" fill="#8b95b5" font-size="11">BatchAttention.plan/run</text>

  <!-- fused_moe -->
  <rect x="340" y="160" width="180" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="430" y="182" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">fused_moe</text>
  <text x="430" y="200" text-anchor="middle" fill="#8b95b5" font-size="11">MoELayer + 7 Runners</text>

  <!-- gemm -->
  <rect x="60" y="250" width="170" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="145" y="272" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">gemm</text>
  <text x="145" y="290" text-anchor="middle" fill="#8b95b5" font-size="11">多 backend GEMM</text>

  <!-- grouped_mm -->
  <rect x="250" y="250" width="170" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="335" y="272" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">grouped_mm</text>
  <text x="335" y="290" text-anchor="middle" fill="#8b95b5" font-size="11">MoE grouped GEMM</text>

  <!-- sampling -->
  <rect x="600" y="160" width="180" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="690" y="182" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">sampling</text>
  <text x="690" y="200" text-anchor="middle" fill="#8b95b5" font-size="11">top-k / top-p / chain</text>

  <!-- JIT -->
  <rect x="150" y="360" width="170" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="235" y="382" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">jit</text>
  <text x="235" y="400" text-anchor="middle" fill="#8b95b5" font-size="11">JitSpec / build_and_load</text>

  <!-- autotuner -->
  <rect x="360" y="360" width="170" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="445" y="382" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">autotuner</text>
  <text x="445" y="400" text-anchor="middle" fill="#8b95b5" font-size="11">choose_one / TunableRunner</text>

  <!-- trace -->
  <rect x="570" y="360" width="170" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="655" y="382" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">trace</text>
  <text x="655" y="400" text-anchor="middle" fill="#8b95b5" font-size="11">Template / Solution / apply</text>

  <!-- CUDA kernels 底层 -->
  <rect x="150" y="470" width="590" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="445" y="492" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">csrc/ + include/flashinfer/ (CUDA kernels)</text>
  <text x="445" y="510" text-anchor="middle" fill="#8b95b5" font-size="11">CUTLASS · CuTe DSL · cuDNN · TRT-LLM · 手写 CUDA</text>

  <!-- 灰箭头: 算子间依赖 -->
  <!-- attention -> jit (穿过) 用折线 -->
  <path d="M 340 95 L 235 95 L 235 358" fill="none" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ad)"/>
  <text x="232" y="220" text-anchor="end" fill="#8b95b5" font-size="10">gen_module</text>

  <!-- attention -> trace -->
  <path d="M 520 95 L 655 95 L 655 358" fill="none" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ad)"/>
  <text x="658" y="220" fill="#8b95b5" font-size="10">trace template</text>

  <!-- fused_moe -> grouped_mm -->
  <line x1="380" y1="210" x2="335" y2="248" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ad)"/>
  <!-- fused_moe -> gemm (kernel 复用) -->
  <line x1="340" y1="195" x2="232" y2="248" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ad)"/>
  <text x="278" y="225" fill="#8b95b5" font-size="10">kernel 复用</text>

  <!-- fused_moe -> autotuner -->
  <line x1="430" y1="210" x2="445" y2="358" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="452" y="285" fill="#f9ca24" font-size="10">choose_one</text>

  <!-- gemm -> autotuner -->
  <path d="M 145 300 L 145 330 L 410 330 L 410 358" fill="none" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="275" y="324" fill="#f9ca24" font-size="10">choose_one</text>

  <!-- grouped_mm -> gemm -->
  <line x1="250" y1="275" x2="232" y2="275" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ad)"/>

  <!-- sampling -> jit -->
  <path d="M 690 210 L 690 330 L 235 330 L 235 358" fill="none" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ad)"/>
  <text x="460" y="324" fill="#8b95b5" font-size="10">gen_sampling_module</text>

  <!-- jit -> CUDA -->
  <line x1="235" y1="410" x2="235" y2="468" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ad)"/>
  <!-- trace -> CUDA (via jit cpp loader) -->
  <path d="M 655 410 L 655 440 L 620 440 L 620 468" fill="none" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ad)"/>

  <!-- autotuner -> CUDA (runners forward call kernel) -->
  <line x1="445" y1="410" x2="445" y2="468" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#ay)"/>
</svg>
