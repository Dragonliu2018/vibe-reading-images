<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640" font-family="system-ui, sans-serif">
  <rect width="860" height="640" fill="#0b0d14"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8b95b5"/>
    </marker>
  </defs>
  <text x="430" y="30" text-anchor="middle" fill="#e6e8f0" font-size="17" font-weight="700">FlashInfer 分层架构</text>

  <!-- API 层 -->
  <rect x="40" y="55" width="780" height="78" rx="10" fill="none" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="56" y="74" fill="#6c8ef5" font-size="12" font-weight="600">API 层（用户接口）</text>
  <g font-size="13" fill="#e6e8f0">
    <rect x="70" y="86" width="150" height="36" rx="6" fill="#13162a" stroke="#6c8ef5"/>
    <text x="145" y="109" text-anchor="middle">BatchAttention</text>
    <rect x="240" y="86" width="160" height="36" rx="6" fill="#13162a" stroke="#6c8ef5"/>
    <text x="320" y="109" text-anchor="middle">MoELayer</text>
    <rect x="420" y="86" width="150" height="36" rx="6" fill="#13162a" stroke="#6c8ef5"/>
    <text x="495" y="109" text-anchor="middle">mm_bf16 / mm_fp8</text>
    <rect x="590" y="86" width="210" height="36" rx="6" fill="#13162a" stroke="#6c8ef5"/>
    <text x="695" y="109" text-anchor="middle">top_k_sampling / softmax</text>
  </g>

  <!-- 计算算子层 -->
  <rect x="40" y="153" width="780" height="150" rx="10" fill="none" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="56" y="172" fill="#4ecdc4" font-size="12" font-weight="600">计算算子层（Python Wrapper + backend dispatch）</text>
  <g font-size="13" fill="#e6e8f0">
    <rect x="60" y="186" width="120" height="50" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="120" y="207" text-anchor="middle">attention</text>
    <text x="120" y="225" text-anchor="middle" font-size="11" fill="#8b95b5">plan / run</text>
    <rect x="200" y="186" width="120" height="50" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="260" y="207" text-anchor="middle">fused_moe</text>
    <text x="260" y="225" text-anchor="middle" font-size="11" fill="#8b95b5">Runner 策略</text>
    <rect x="340" y="186" width="120" height="50" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="400" y="207" text-anchor="middle">gemm</text>
    <text x="400" y="225" text-anchor="middle" font-size="11" fill="#8b95b5">多 backend</text>
    <rect x="480" y="186" width="120" height="50" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="540" y="207" text-anchor="middle">sampling</text>
    <text x="540" y="225" text-anchor="middle" font-size="11" fill="#8b95b5">sorting-free</text>
    <rect x="620" y="186" width="180" height="50" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="710" y="207" text-anchor="middle">norm / rope / activation</text>
    <text x="710" y="225" text-anchor="middle" font-size="11" fill="#8b95b5">辅助算子</text>
  </g>
  <g font-size="13" fill="#e6e8f0">
    <rect x="200" y="256" width="200" height="36" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="300" y="279" text-anchor="middle">grouped_mm（MoE 用）</text>
    <rect x="430" y="256" width="200" height="36" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="530" y="279" text-anchor="middle">comm（AllReduce / NVSHMEM）</text>
  </g>

  <!-- 调度与编译基础设施层 -->
  <rect x="40" y="323" width="780" height="100" rx="10" fill="none" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="56" y="342" fill="#f9ca24" font-size="12" font-weight="600">调度与编译基础设施层</text>
  <g font-size="13" fill="#e6e8f0">
    <rect x="70" y="356" width="170" height="50" rx="6" fill="#13162a" stroke="#f9ca24"/>
    <text x="155" y="377" text-anchor="middle">JIT 编译系统</text>
    <text x="155" y="395" text-anchor="middle" font-size="11" fill="#8b95b5">JitSpec / ninja / cubin</text>
    <rect x="260" y="356" width="170" height="50" rx="6" fill="#13162a" stroke="#f9ca24"/>
    <text x="345" y="377" text-anchor="middle">Autotuner</text>
    <text x="345" y="395" text-anchor="middle" font-size="11" fill="#8b95b5">tactic profiling</text>
    <rect x="450" y="356" width="170" height="50" rx="6" fill="#13162a" stroke="#f9ca24"/>
    <text x="535" y="377" text-anchor="middle">Trace 系统</text>
    <text x="535" y="395" text-anchor="middle" font-size="11" fill="#8b95b5">torch.compile 兼容</text>
    <rect x="640" y="356" width="150" height="50" rx="6" fill="#13162a" stroke="#f9ca24"/>
    <text x="715" y="377" text-anchor="middle">compilation_context</text>
    <text x="715" y="395" text-anchor="middle" font-size="11" fill="#8b95b5">SM arch 归一化</text>
  </g>

  <!-- CUDA Kernel 层 -->
  <rect x="40" y="443" width="780" height="100" rx="10" fill="none" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="56" y="462" fill="#ff6b9d" font-size="12" font-weight="600">CUDA Kernel 层（C++ / CUTLASS / CuTe DSL / cuDNN）</text>
  <g font-size="13" fill="#e6e8f0">
    <rect x="60" y="476" width="140" height="50" rx="6" fill="#13162a" stroke="#ff6b9d"/>
    <text x="130" y="497" text-anchor="middle">fmha_v2 / xqa</text>
    <text x="130" y="515" text-anchor="middle" font-size="11" fill="#8b95b5">persistent kernel</text>
    <rect x="220" y="476" width="140" height="50" rx="6" fill="#13162a" stroke="#ff6b9d"/>
    <text x="290" y="497" text-anchor="middle">fused_moe kernels</text>
    <text x="290" y="515" text-anchor="middle" font-size="11" fill="#8b95b5">trtllm / cutlass</text>
    <rect x="380" y="476" width="140" height="50" rx="6" fill="#13162a" stroke="#ff6b9d"/>
    <text x="450" y="497" text-anchor="middle">CUTLASS GEMM</text>
    <text x="450" y="515" text-anchor="middle" font-size="11" fill="#8b95b5">sm90 / sm100</text>
    <rect x="540" y="476" width="130" height="50" rx="6" fill="#13162a" stroke="#ff6b9d"/>
    <text x="605" y="497" text-anchor="middle">sampling.cuh</text>
    <text x="605" y="515" text-anchor="middle" font-size="11" fill="#8b95b5">radix / scan</text>
    <rect x="690" y="476" width="100" height="50" rx="6" fill="#13162a" stroke="#ff6b9d"/>
    <text x="740" y="497" text-anchor="middle">topk.cuh</text>
    <text x="740" y="515" text-anchor="middle" font-size="11" fill="#8b95b5">multi-CTA</text>
  </g>

  <!-- 层间箭头 -->
  <line x1="430" y1="134" x2="430" y2="150" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="430" y1="304" x2="430" y2="320" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="430" y1="424" x2="430" y2="440" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="430" y="575" text-anchor="middle" fill="#8b95b5" font-size="12">箭头表示依赖方向：上层调用下层，下层对上层透明</text>
  <text x="430" y="600" text-anchor="middle" fill="#8b95b5" font-size="11">compute capability: SM75 ~ SM121 (Turing / Ampere / Ada / Hopper / Blackwell)</text>
</svg>
