<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="system-ui, sans-serif">
  <rect width="900" height="660" fill="#0b0d14"/>
  <defs>
    <marker id="af" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#8b95b5"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4ecdc4"/>
    </marker>
  </defs>
  <text x="450" y="28" text-anchor="middle" fill="#e6e8f0" font-size="17" font-weight="700">BatchAttention 端到端数据流</text>
  <text x="450" y="48" text-anchor="middle" fill="#8b95b5" font-size="11">青色 = host→device / kernel 数据 · 灰色 = 控制流</text>

  <!-- Step 1: __init__ -->
  <rect x="40" y="70" width="200" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="140" y="93" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">1. __init__</text>
  <text x="140" y="112" text-anchor="middle" fill="#8b95b5" font-size="11">分配 workspace (384MB float / 8MB int)</text>

  <!-- Step 2: plan -->
  <rect x="280" y="70" width="280" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="420" y="93" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">2. plan(qo_indptr, kv_indices, ...)</text>
  <text x="420" y="112" text-anchor="middle" fill="#8b95b5" font-size="11">CPU 侧负载均衡调度 → plan_info</text>

  <!-- Step 2b: JIT -->
  <rect x="600" y="70" width="260" height="56" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="730" y="93" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">2b. get_holistic_attention_module</text>
  <text x="730" y="112" text-anchor="middle" fill="#8b95b5" font-size="11">JitSpec.build_and_load (Jinja→ninja)</text>

  <line x1="240" y1="98" x2="278" y2="98" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#af)"/>
  <line x1="560" y1="98" x2="598" y2="98" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- plan 内部展开 -->
  <rect x="280" y="160" width="580" height="120" rx="8" fill="none" stroke="#6c8ef5" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="296" y="180" fill="#6c8ef5" font-size="11" font-weight="600">plan 阶段内部（CPU pinned → GPU）</text>
  <g font-size="12" fill="#e6e8f0">
    <rect x="300" y="192" width="170" height="34" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="385" y="214" text-anchor="middle">indptr/indices → CPU</text>
    <rect x="490" y="192" width="170" height="34" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="575" y="214" text-anchor="middle">TwoStageHolisticPlan</text>
    <rect x="680" y="192" width="170" height="34" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="765" y="214" text-anchor="middle">cudaMemcpyAsync</text>
    <text x="300" y="250" fill="#8b95b5" font-size="11">输入: qo_indptr [B+1] int32, kv_indices, kv_len_arr</text>
    <text x="300" y="268" fill="#8b95b5" font-size="11">输出: plan_info (28×int64) + GPU int_buffer (q_indptr, work_indptr, partial_lse offsets)</text>
  </g>
  <line x1="420" y1="126" x2="420" y2="158" stroke="#8b95b5" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Step 3: run -->
  <rect x="280" y="310" width="280" height="56" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="420" y="333" text-anchor="middle" fill="#e6e8f0" font-size="13" font-weight="600">3. run(q, kv_cache, out, lse)</text>
  <text x="420" y="352" text-anchor="middle" fill="#8b95b5" font-size="11">dispatch 到 persistent cooperative kernel</text>

  <line x1="420" y1="280" x2="420" y2="308" stroke="#8b95b5" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- run 内部展开 -->
  <rect x="280" y="390" width="580" height="150" rx="8" fill="none" stroke="#6c8ef5" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="296" y="410" fill="#6c8ef5" font-size="11" font-weight="600">run 阶段内部（cooperative kernel launch）</text>
  <g font-size="12" fill="#e6e8f0">
    <rect x="300" y="422" width="160" height="34" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="380" y="444" text-anchor="middle">_unpack_paged_kv_cache</text>
    <rect x="480" y="422" width="160" height="34" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="560" y="444" text-anchor="middle">DISPATCH_context</text>
    <rect x="660" y="422" width="180" height="34" rx="6" fill="#13162a" stroke="#4ecdc4"/>
    <text x="750" y="444" text-anchor="middle">cudaLaunchCooperative</text>
    <rect x="300" y="470" width="260" height="34" rx="6" fill="#13162a" stroke="#ff6b9d"/>
    <text x="430" y="492" text-anchor="middle">prefill runner (CTA_TILE_Q=128)</text>
    <rect x="580" y="470" width="260" height="34" rx="6" fill="#13162a" stroke="#ff6b9d"/>
    <text x="710" y="492" text-anchor="middle">decode runner (CTA_TILE_Q=16)</text>
    <text x="300" y="526" fill="#8b95b5" font-size="11">q [total_q,N,h] · kv_cache [pages] → out [total_q,N,h], lse [total_q,N]</text>
  </g>
  <line x1="560" y1="422" x2="560" y2="368" stroke="#8b95b5" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="430" y1="466" x2="430" y2="470" stroke="none"/>
  <line x1="560" y1="456" x2="430" y2="470" stroke="#ff6b9d" stroke-width="1.2" marker-end="url(#ag)"/>
  <line x1="560" y1="456" x2="710" y2="470" stroke="#ff6b9d" stroke-width="1.2" marker-end="url(#ag)"/>

  <!-- grid.sync -->
  <rect x="380" y="560" width="360" height="40" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="560" y="585" text-anchor="middle" fill="#e6e8f0" font-size="12">grid.sync() → BlockReductionPersistent (merge split-KV)</text>
  <line x1="560" y1="504" x2="560" y2="558" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#ag)"/>

  <text x="450" y="630" text-anchor="middle" fill="#8b95b5" font-size="11">prefill 与 decode 请求在同一 cooperative kernel 内由不同 runner 顺序处理，中间用 grid.sync() 全局同步</text>
</svg>
