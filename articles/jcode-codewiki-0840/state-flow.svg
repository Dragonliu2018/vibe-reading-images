<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
<rect width="800" height="460" fill="#0b0d14"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
  </marker>
  <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#e74c3c"/>
  </marker>
  <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7bed9f"/>
  </marker>
</defs>
<text x="400" y="26" fill="#e0e6f0" font-size="15" text-anchor="middle">Swarm 成员状态机 与 会话状态机（左右两分区）</text>
<text x="200" y="56" fill="#6c8ef5" font-size="13" font-weight="600" text-anchor="middle">SwarmMember.status</text>
<rect x="120" y="80" width="160" height="40" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
<text x="200" y="105" fill="#6c8ef5" font-size="12.5" text-anchor="middle">Spawning</text>
<rect x="60" y="180" width="160" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="140" y="205" fill="#4ecdc4" font-size="12.5" text-anchor="middle">Ready</text>
<rect x="260" y="180" width="160" height="40" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
<text x="340" y="205" fill="#f9ca24" font-size="12.5" text-anchor="middle">Running</text>
<rect x="60" y="300" width="140" height="40" rx="8" fill="#13162a" stroke="#7bed9f" stroke-width="1.5"/>
<text x="130" y="325" fill="#7bed9f" font-size="12" text-anchor="middle">Completed</text>
<rect x="210" y="300" width="120" height="40" rx="8" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
<text x="270" y="325" fill="#e74c3c" font-size="12" text-anchor="middle">Failed</text>
<rect x="340" y="300" width="120" height="40" rx="8" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
<text x="400" y="325" fill="#7a86b3" font-size="12" text-anchor="middle">Stopped</text>
<text x="270" y="380" fill="#8090a8" font-size="10.5" text-anchor="middle">terminal 态 24h 后 GC · idle worker 30min reap</text>
<path d="M200,120 L180,180" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="168" y="155" fill="#7a86b3" font-size="10" text-anchor="end">spawn_swarm_agent()</text>
<path d="M200,120 L310,180" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="268" y="143" fill="#7a86b3" font-size="10" text-anchor="start">注册即执行</text>
<path d="M220,200 L260,200" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240" y="192" fill="#7a86b3" font-size="10" text-anchor="middle">开始</text>
<path d="M300,220 L200,300" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320,220 L270,300" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M360,220 L395,300" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="490" y="56" fill="#b388ff" font-size="13" font-weight="600" text-anchor="middle">Session 会话状态</text>
<rect x="530" y="80" width="160" height="40" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="610" y="105" fill="#b388ff" font-size="12.5" text-anchor="middle">Active</text>
<rect x="530" y="180" width="160" height="40" rx="8" fill="#13162a" stroke="#7a86b3" stroke-width="1.5"/>
<text x="610" y="205" fill="#7a86b3" font-size="12.5" text-anchor="middle">Idle</text>
<rect x="530" y="280" width="160" height="40" rx="8" fill="#13162a" stroke="#e74c3c" stroke-width="1.5"/>
<text x="610" y="305" fill="#e74c3c" font-size="12.5" text-anchor="middle">Crashed</text>
<rect x="720" y="180" width="60" height="40" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="750" y="204" fill="#4ecdc4" font-size="10.5" text-anchor="middle">Resumed</text>
<rect x="530" y="380" width="160" height="40" rx="8" fill="#13162a" stroke="#8090a8" stroke-width="1.5"/>
<text x="610" y="405" fill="#8090a8" font-size="12.5" text-anchor="middle">Closed（journal）</text>
<path d="M590,120 L610,180" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="155" fill="#7a86b3" font-size="10" text-anchor="end">client 断开</text>
<path d="M660,200 L720,200" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690" y="192" fill="#7a86b3" font-size="10" text-anchor="middle">--resume</text>
<path d="M610,120 L630,280" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowr)"/>
<text x="662" y="220" fill="#e74c3c" font-size="10" text-anchor="start">panic / kill</text>
<path d="M570,220 L560,280" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="255" fill="#7a86b3" font-size="10" text-anchor="end">detect_crash()</text>
<path d="M610,220 L610,380" fill="none" stroke="#7a86b3" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="618" y="350" fill="#7a86b3" font-size="10" text-anchor="start">正常关闭</text>
<path d="M750,220 L760,300" fill="none" stroke="#7a86b3" stroke-width="0" />
</svg>
