<path d="M180,382 L200,382" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M340,382 L360,382" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M510,382 L530,382" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<rect x="200" y="432" width="140" height="40" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
<text x="270" y="457" text-anchor="middle" fill="#e8eaf6" font-size="11">redispatch</text>
<text x="270" y="471" text-anchor="middle" fill="#9aa0c0" font-size="9">去 Autograd 位</text>
<rect x="360" y="432" width="150" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
<text x="435" y="452" text-anchor="middle" fill="#e8eaf6" font-size="11">CPU/CUDA kernel</text>
<text x="435" y="466" text-anchor="middle" fill="#9aa0c0" font-size="9">add_stub</text>
<rect x="530" y="432" width="160" height="40" rx="6" fill="#1a1d2a" stroke="#7bed9f" stroke-width="1.5"/>
<text x="610" y="457" text-anchor="middle" fill="#7bed9f" font-size="11">向量化计算 (AVX/NCCL)</text>

<!-- autograd -> redispatch down -->
<path d="M610,402 L610,417 L270,417 L270,432" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M340,452 L360,452" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M510,452 L530,452" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- backward flow note -->
<rect x="40" y="512" width="800" height="56" rx="6" fill="#0e1020" stroke="#2a2e45" stroke-width="1"/>
<text x="60" y="534" fill="#f9ca24" font-size="11" font-weight="600">反向数据流 loss.backward()：</text>
<text x="60" y="552" fill="#9aa0c0" font-size="11">Engine::execute → compute_dependencies(反向BFS) → ReadyQueue(按sequence_nr堆排序) → Node::apply(多线程) → next_edges 依赖归零入队 → AccumulateGrad 写入 param.grad</text>

<text x="40" y="596" fill="#9aa0c0" font-size="10">黄框 = 数据产出节点 · 绿框 = 运行时最终产物 · 箭头 = 数据/调用流向</text>
</svg>