<text x="440" y="28" text-anchor="middle" fill="#e8eaf6" font-size="17" font-weight="700">PyTorch 两条核心数据流</text>

<!-- ===== Flow A: torch.compile pipeline ===== -->
<text x="40" y="60" fill="#ff6b9d" font-size="13" font-weight="600">A. torch.compile(model)(x) 编译管线</text>

