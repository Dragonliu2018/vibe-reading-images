<path d="M540,92 L560,92" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<!-- second row of pipeline -->
<rect x="40" y="142" width="150" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
