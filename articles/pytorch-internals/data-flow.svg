<text x="285" y="106" text-anchor="middle" fill="#9aa0c0" font-size="9">PEP 523</text>
<rect x="380" y="72" width="160" height="40" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
