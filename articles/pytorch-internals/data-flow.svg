<text x="435" y="396" text-anchor="middle" fill="#9aa0c0" font-size="9">keyset 提取</text>
<rect x="530" y="362" width="160" height="40" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
