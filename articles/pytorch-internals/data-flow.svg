<text x="270" y="382" text-anchor="middle" fill="#e8eaf6" font-size="11">at::add</text>
<text x="270" y="396" text-anchor="middle" fill="#9aa0c0" font-size="9">codegen</text>
<rect x="360" y="362" width="150" height="40" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
