<text x="60" y="568" fill="#f9ca24" font-size="11" font-weight="600">反向数据流 loss.backward()：</text>
<text x="60" y="586" fill="#9aa0c0" font-size="11">Engine::execute → compute_dependencies(反向BFS) → ReadyQueue(按sequence_nr堆排序) → Node::apply(多线程) → next_edges 依赖归零入队 → AccumulateGrad 写入 param.grad</text>

<text x="40" y="630" fill="#9aa0c0" font-size="10">黄框 = 数据产出节点 · 绿框 = 运行时最终产物 · 箭头 = 数据/调用流向</text>
