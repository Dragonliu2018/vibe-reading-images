  <rect x="528" y="468" width="118" height="26" rx="6" fill="#1a1d35" stroke="#ff6b9d" stroke-width="1"/>
  <text x="587" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">memory / rag server</text>
  <rect x="656" y="468" width="120" height="26" rx="6" fill="#1a1d35" stroke="#ff6b9d" stroke-width="1"/>
  <text x="716" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">tts / stt / youtube</text>

