  <rect x="290" y="90" width="106" height="26" rx="6" fill="#1a1d35" stroke="#b388ff" stroke-width="1"/>
  <text x="343" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">cookbook</text>
  <rect x="406" y="90" width="106" height="26" rx="6" fill="#1a1d35" stroke="#b388ff" stroke-width="1"/>
  <text x="459" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">文档 / 编辑器</text>
  <rect x="522" y="90" width="126" height="26" rx="6" fill="#1a1d35" stroke="#b388ff" stroke-width="1"/>
  <text x="585" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">无构建 ES modules</text>
  <rect x="658" y="90" width="118" height="26" rx="6" fill="#1a1d35" stroke="#b388ff" stroke-width="1"/>
  <text x="717" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">sw.js PWA</text>

