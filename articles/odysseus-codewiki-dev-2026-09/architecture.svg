  <text x="587" y="359" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">task_scheduler</text>
  <rect x="650" y="342" width="126" height="26" rx="6" fill="#1a1d35" stroke="#6c8ef5" stroke-width="1"/>
  <text x="713" y="359" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">memory / RAG / MCP</text>

  <line x1="410" y1="400" x2="410" y2="428" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

