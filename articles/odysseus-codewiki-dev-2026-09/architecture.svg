  <text x="376" y="603" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">ChromaDB</text>
  <rect x="440" y="586" width="108" height="26" rx="6" fill="#1a1d35" stroke="#f9ca24" stroke-width="1"/>
  <text x="494" y="603" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">SearXNG</text>
  <rect x="558" y="586" width="108" height="26" rx="6" fill="#1a1d35" stroke="#f9ca24" stroke-width="1"/>
  <text x="612" y="603" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">ntfy 推送</text>
  <rect x="676" y="586" width="100" height="26" rx="6" fill="#1a1d35" stroke="#f9ca24" stroke-width="1"/>
  <text x="726" y="603" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e8eaf6">tmux / ssh</text>
</svg>
