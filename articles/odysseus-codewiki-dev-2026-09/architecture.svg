    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="640" fill="#0b0d14"/>
  <text x="410" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#e8eaf6" font-weight="600">Odysseus 分层架构</text>

