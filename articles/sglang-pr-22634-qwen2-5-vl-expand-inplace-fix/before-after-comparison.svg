<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 359" width="560" height="359" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="560" height="359" fill="#0b0d14"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
  </defs>
  <text x="280" y="22" font-size="15" font-weight="600" fill="#e8e8f0" text-anchor="middle">expand() 视图原地写修复：操作顺序重排</text>
  <text x="135" y="52" font-size="13" font-weight="600" fill="#ff6b9d" text-anchor="middle">修复前：先 expand 再 +=</text>
  <text x="425" y="52" font-size="13" font-weight="600" fill="#4ecdc4" text-anchor="middle">修复后：先 + 再 expand</text>
  <line x1="280" y1="65" x2="280" y2="334" stroke="#2a2d3e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="40" y="68" width="190" height="44" rx="6" fill="#13162a" stroke="#3a3d52" stroke-width="1.5"/>
  <text x="135" y="87" font-size="12" fill="#e8e8f0" text-anchor="middle">arange(seq_length)</text>
  <text x="135" y="103" font-size="11" fill="#8a8a9a" text-anchor="middle">[S]</text>
  <line x1="135" y1="112" x2="135" y2="142" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="40" y="142" width="190" height="44" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="135" y="161" font-size="12" fill="#e8e8f0" text-anchor="middle">expand(3, B, -1)</text>
  <text x="135" y="177" font-size="11" fill="#f9ca24" text-anchor="middle">零步长视图 [3,B,S]</text>
  <line x1="135" y1="186" x2="135" y2="216" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="40" y="216" width="190" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="135" y="235" font-size="12" fill="#e8e8f0" text-anchor="middle">+= delta</text>
  <text x="135" y="251" font-size="11" fill="#ff6b9d" text-anchor="middle">原地写 ❌</text>
  <line x1="135" y1="260" x2="135" y2="290" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="40" y="290" width="190" height="44" rx="6" fill="#1a0e14" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="135" y="309" font-size="12" fill="#ff6b9d" text-anchor="middle">RuntimeError</text>
  <text x="135" y="325" font-size="11" fill="#8a8a9a" text-anchor="middle">多元素指向同一地址</text>
  <rect x="330" y="68" width="190" height="44" rx="6" fill="#13162a" stroke="#3a3d52" stroke-width="1.5"/>
  <text x="425" y="87" font-size="12" fill="#e8e8f0" text-anchor="middle">arange(S) + delta</text>
  <text x="425" y="103" font-size="11" fill="#8a8a9a" text-anchor="middle">out-of-place [B,S]</text>
  <line x1="425" y1="112" x2="425" y2="142" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="330" y="142" width="190" height="44" rx="6" fill="#13162a" stroke="#3a3d52" stroke-width="1.5"/>
  <text x="425" y="161" font-size="12" fill="#e8e8f0" text-anchor="middle">unsqueeze(0)</text>
  <text x="425" y="177" font-size="11" fill="#8a8a9a" text-anchor="middle">[1, B, S]</text>
  <line x1="425" y1="186" x2="425" y2="216" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="330" y="216" width="190" height="44" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="425" y="235" font-size="12" fill="#e8e8f0" text-anchor="middle">expand(3, -1, -1)</text>
  <text x="425" y="251" font-size="11" fill="#4ecdc4" text-anchor="middle">只读视图 ✓ [3,B,S]</text>
  <line x1="425" y1="260" x2="425" y2="290" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="330" y="290" width="190" height="44" rx="6" fill="#0f1a1a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="425" y="309" font-size="12" fill="#4ecdc4" text-anchor="middle">position_ids ✓</text>
  <text x="425" y="325" font-size="11" fill="#8a8a9a" text-anchor="middle">下游只读消费</text>
</svg>
