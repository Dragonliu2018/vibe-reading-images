<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="system-ui, sans-serif">
  <rect width="820" height="500" fill="#0b0d14"/>
  <text x="410" y="28" text-anchor="middle" fill="#e4e7f0" font-size="17" font-weight="600">模块依赖关系</text>

  <!-- Left column: execution -->
  <rect x="40" y="70" width="200" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="140" y="91" text-anchor="middle" fill="#ff6b9d" font-size="14" font-weight="600">Agent Runtime</text>
  <text x="140" y="108" text-anchor="middle" fill="#8b91a8" font-size="11">pkg/agent · 14 providers</text>

  <rect x="40" y="160" width="200" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="140" y="181" text-anchor="middle" fill="#ff6b9d" font-size="14" font-weight="600">Daemon 执行引擎</text>
  <text x="140" y="198" text-anchor="middle" fill="#8b91a8" font-size="11">internal/daemon + daemonws</text>

  <!-- Center column: core -->
  <rect x="310" y="115" width="200" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="136" text-anchor="middle" fill="#f9ca24" font-size="14" font-weight="600">Realtime Hub</text>
  <text x="410" y="153" text-anchor="middle" fill="#8b91a8" font-size="11">WS 房间 + Redis 分片中继</text>

  <rect x="310" y="205" width="200" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="226" text-anchor="middle" fill="#4ecdc4" font-size="14" font-weight="600">Task API &amp; Service</text>
  <text x="410" y="243" text-anchor="middle" fill="#8b91a8" font-size="11">handler + service</text>

  <rect x="310" y="370" width="200" height="46" rx="8" fill="#13162a" stroke="#5a6078" stroke-width="1.5"/>
  <text x="410" y="397" text-anchor="middle" fill="#a8aec4" font-size="14" font-weight="600">PostgreSQL (sqlc)</text>

  <!-- Right column -->
  <rect x="580" y="70" width="200" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="680" y="91" text-anchor="middle" fill="#f9ca24" font-size="14" font-weight="600">Scheduler &amp; Autopilot</text>
  <text x="680" y="108" text-anchor="middle" fill="#8b91a8" font-size="11">scheduler + service/autopilot</text>

  <rect x="580" y="160" width="200" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="680" y="181" text-anchor="middle" fill="#6c8ef5" font-size="14" font-weight="600">Integrations</text>
  <text x="680" y="198" text-anchor="middle" fill="#8b91a8" font-size="11">channel + lark</text>

  <!-- Arrows -->
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3f5c"/>
    </marker>
    <marker id="arP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ff6b9d"/>
    </marker>
  </defs>

  <!-- Daemon -> Agent Runtime -->
  <path d="M 140 160 L 140 120" fill="none" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arP)"/>
  <text x="148" y="143" fill="#ff6b9d" font-size="10">import</text>

  <!-- Daemon -> Task API (HTTP claim/start/complete) -->
  <path d="M 240 185 L 310 225" fill="none" stroke="#3a3f5c" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 3"/>
  <text x="252" y="200" fill="#6b7186" font-size="10">HTTP</text>

  <!-- Task API -> Realtime -->
  <path d="M 410 205 L 410 165" fill="none" stroke="#3a3f5c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="418" y="188" fill="#6b7186" font-size="10">bus→broadcast</text>

  <!-- Task API -> DB -->
  <path d="M 410 255 L 410 370" fill="none" stroke="#3a3f5c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Scheduler -> Task API (AutopilotService -> TaskService) -->
  <path d="M 680 120 L 680 180 L 510 225" fill="none" stroke="#3a3f5c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="540" y="172" fill="#6b7186" font-size="10">dispatch</text>

  <!-- Scheduler -> DB -->
  <path d="M 680 120 L 680 345 L 510 393" fill="none" stroke="#3a3f5c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)" opacity="0.6"/>

  <!-- Integrations -> Task API -->
  <path d="M 580 185 L 510 225" fill="none" stroke="#3a3f5c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="535" y="200" fill="#6b7186" font-size="10">issue+task</text>

  <!-- daemonws (server) connection from Task API -->
  <text x="410" y="300" text-anchor="middle" fill="#8b91a8" font-size="11">daemonws.Hub 被 handler 持有 · service 通过 Wakeup 通知 daemon</text>

  <!-- legend -->
  <rect x="40" y="448" width="14" height="3" fill="none" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="60" y="453" fill="#8b91a8" font-size="11">执行层</text>
  <rect x="120" y="448" width="14" height="3" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="140" y="453" fill="#8b91a8" font-size="11">API/Service</text>
  <rect x="210" y="448" width="14" height="3" fill="none" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="230" y="453" fill="#8b91a8" font-size="11">实时/调度</text>
  <rect x="300" y="448" width="14" height="3" fill="none" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="320" y="453" fill="#8b91a8" font-size="11">集成</text>
  <line x1="370" y1="450" x2="384" y2="450" stroke="#3a3f5c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="392" y="453" fill="#8b91a8" font-size="11">HTTP/WS 跨进程</text>
  <line x1="480" y1="450" x2="494" y2="450" stroke="#3a3f5c" stroke-width="1.5"/>
  <text x="502" y="453" fill="#8b91a8" font-size="11">进程内 import/调用</text>
</svg>
