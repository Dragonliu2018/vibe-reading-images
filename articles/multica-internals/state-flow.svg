<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" font-family="system-ui, sans-serif">
  <rect width="840" height="400" fill="#0b0d14"/>
  <text x="420" y="28" text-anchor="middle" fill="#e4e7f0" font-size="17" font-weight="600">agent_task_queue 状态机</text>

  <defs>
    <marker id="sf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4ecdc4"/>
    </marker>
    <marker id="sfY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f9ca24"/>
    </marker>
    <marker id="sfR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ff6b9d"/>
    </marker>
    <marker id="sfG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6078"/>
    </marker>
  </defs>

  <!-- Happy path states -->
  <circle cx="50" cy="80" r="14" fill="#13162a" stroke="#5a6078" stroke-width="1.5"/>
  <text x="50" y="84" text-anchor="middle" fill="#8b91a8" font-size="11">∅</text>

  <rect x="100" y="60" width="110" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="155" y="86" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="600">queued</text>

  <rect x="270" y="60" width="110" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="325" y="86" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="600">dispatched</text>

  <rect x="440" y="60" width="110" height="42" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="495" y="86" text-anchor="middle" fill="#f9ca24" font-size="13" font-weight="600">running</text>

  <rect x="610" y="60" width="130" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="675" y="86" text-anchor="middle" fill="#4ecdc4" font-size="13" font-weight="600">completed</text>

  <!-- Happy path arrows -->
  <path d="M 64 80 L 100 80" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#sf)"/>
  <text x="72" y="74" fill="#8b91a8" font-size="10">enqueue</text>

  <path d="M 210 80 L 270 80" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#sf)"/>
  <text x="220" y="74" fill="#8b91a8" font-size="10">claim (FOR UPDATE SKIP LOCKED)</text>

  <path d="M 380 80 L 440 80" fill="none" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#sfY)"/>
  <text x="390" y="74" fill="#8b91a8" font-size="10">StartTask</text>

  <path d="M 550 80 L 610 80" fill="none" stroke="#4ecdc4" stroke-width="1.5" marker-end="url(#sf)"/>
  <text x="560" y="74" fill="#8b91a8" font-size="10">CompleteTask</text>

  <!-- waiting_local_directory -->
  <rect x="270" y="170" width="180" height="42" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="190" text-anchor="middle" fill="#f9ca24" font-size="12" font-weight="600">waiting_local_directory</text>
  <text x="360" y="205" text-anchor="middle" fill="#8b91a8" font-size="10">local_directory 路径被占</text>

  <path d="M 325 102 L 325 170" fill="none" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#sfY)"/>
  <path d="M 360 170 L 360 102" fill="none" stroke="#f9ca24" stroke-width="1.5" marker-end="url(#sfY)" stroke-dasharray="4 3"/>
  <text x="368" y="140" fill="#8b91a8" font-size="10">parked</text>
  <text x="300" y="140" text-anchor="end" fill="#8b91a8" font-size="10">resume</text>

  <!-- failed -->
  <rect x="440" y="170" width="110" height="42" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="495" y="190" text-anchor="middle" fill="#ff6b9d" font-size="13" font-weight="600">failed</text>
  <text x="495" y="205" text-anchor="middle" fill="#8b91a8" font-size="10">FailTask</text>

  <path d="M 495 102 L 495 170" fill="none" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#sfR)"/>
  <text x="503" y="140" fill="#ff6b9d" font-size="10">agent 失败</text>

  <!-- retry: failed -> queued -->
  <path d="M 440 191 L 155 191 L 155 102" fill="none" stroke="#5a6078" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#sfG)"/>
  <text x="290" y="184" fill="#5a6078" font-size="10">retry (infra 类失败, attempt &lt; max) → CreateRetryTask</text>

  <!-- reclaim: dispatched stale -->
  <path d="M 300 102 L 300 130 L 250 130 L 250 80" fill="none" stroke="#5a6078" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#sfG)" opacity="0.7"/>
  <text x="180" y="125" fill="#5a6078" font-size="10">ReclaimStaleDispatched (lease 过期)</text>

  <!-- cancelled -->
  <rect x="610" y="170" width="130" height="42" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="675" y="190" text-anchor="middle" fill="#ff6b9d" font-size="13" font-weight="600">cancelled</text>
  <text x="675" y="205" text-anchor="middle" fill="#8b91a8" font-size="10">用户取消</text>

  <path d="M 495 102 L 495 130 L 675 130 L 675 170" fill="none" stroke="#ff6b9d" stroke-width="1.4" marker-end="url(#sfR)" opacity="0.7"/>
  <path d="M 325 102 L 325 135 L 610 135 L 610 170" fill="none" stroke="#ff6b9d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#sfR)" opacity="0.5"/>
  <text x="555" y="128" fill="#ff6b9d" font-size="10">* → cancelled</text>

  <!-- orphan recovery -->
  <rect x="40" y="280" width="760" height="96" rx="8" fill="none" stroke="#2a2e48" stroke-width="1"/>
  <text x="55" y="302" fill="#8b91a8" font-size="12" font-weight="600">崩溃恢复（三层兜底）</text>
  <text x="55" y="322" fill="#8b91a8" font-size="11">① prepare_lease (45s)：claim→start 间租约，过期可被 ReclaimStaleDispatchedTask 回收</text>
  <text x="55" y="340" fill="#8b91a8" font-size="11">② claimResponseRecoveryWindow (90s)：claim 响应丢失的恢复窗口（&gt; daemon HTTP timeout × 2）</text>
  <text x="55" y="358" fill="#8b91a8" font-size="11">③ RecoverOrphanedTasks：daemon 启动时原子 fail 该 runtime 的 dispatched/running 任务 → MaybeRetryFailedTask</text>
</svg>
