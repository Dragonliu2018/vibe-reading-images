<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="system-ui, sans-serif">
  <rect width="800" height="560" fill="#0b0d14"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <text x="400" y="26" text-anchor="middle" fill="#e6e8f0" font-size="16" font-weight="700">开机 → 图形会话 → 桌面 Shell 就绪</text>

  <!-- N1 SDDM -->
  <rect x="230" y="54" width="340" height="54" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="400" y="78" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">SDDM 登录</text>
  <text x="400" y="97" text-anchor="middle" fill="#7a86b3" font-size="12">omarchy.desktop: uwsm start -g Hyprland</text>
  <path d="M400,108 L400,126" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- N2 env-bootstrap -->
  <rect x="230" y="126" width="340" height="54" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="400" y="150" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">uwsm source 10-omarchy</text>
  <text x="400" y="169" text-anchor="middle" fill="#7a86b3" font-size="12">env-bootstrap → export OMARCHY_PATH</text>
  <text x="586" y="159" fill="#80c7ff" font-size="11">单一真源</text>
  <path d="M400,180 L400,198" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- N3 Hyprland -->
  <rect x="230" y="198" width="340" height="54" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="400" y="222" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">Hyprland 启动</text>
  <text x="400" y="241" text-anchor="middle" fill="#7a86b3" font-size="12">bootstrap.lua → autostart.lua</text>
  <path d="M400,252 L400,270" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- N4 launch-shell -->
  <rect x="230" y="270" width="340" height="54" rx="8" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="400" y="294" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">omarchy-launch-shell</text>
  <text x="400" y="313" text-anchor="middle" fill="#7a86b3" font-size="12">quickshell -p $OMARCHY_PATH/shell</text>
  <text x="586" y="303" fill="#80c7ff" font-size="11">crash supervisor</text>
  <path d="M400,324 L400,342" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- N5 onCompleted -->
  <rect x="230" y="342" width="340" height="54" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="366" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">shell.qml onCompleted</text>
  <text x="400" y="385" text-anchor="middle" fill="#7a86b3" font-size="12">PluginRegistry.rescan() 扫描 plugins/</text>
  <text x="586" y="375" fill="#6c8ef5" font-size="11">first-party 优先</text>
  <path d="M400,396 L400,414" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- N6 shell.json -->
  <rect x="230" y="414" width="340" height="54" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="400" y="438" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">shell.json 加载</text>
  <text x="400" y="457" text-anchor="middle" fill="#7a86b3" font-size="12">默认 ‖ 用户配置，无 deep-merge</text>
  <path d="M400,468 L400,486" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- N7 ready -->
  <rect x="230" y="486" width="340" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="400" y="510" text-anchor="middle" fill="#e6e8f0" font-size="14" font-weight="600">bar/widgets 渲染 + service 加载</text>
  <text x="400" y="529" text-anchor="middle" fill="#7a86b3" font-size="12">IpcHandler shell 就绪 → omarchy-shell 可调</text>
</svg>
