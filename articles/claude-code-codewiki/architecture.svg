  <rect x="200" y="234" width="132" height="30" rx="6" fill="#1a1d30" stroke="#4ecdc4" stroke-width="1"/>
  <text x="266" y="253" text-anchor="middle" font-size="12" fill="#e8eaf0">agents/</text>
  <rect x="344" y="234" width="132" height="30" rx="6" fill="#1a1d30" stroke="#4ecdc4" stroke-width="1"/>
