  <text x="614" y="372" text-anchor="middle" font-size="10" fill="#e8eaf0">feature-dev · commit-commands</text>
  <text x="614" y="386" text-anchor="middle" font-size="10" fill="#e8eaf0">agent-sdk-dev</text>

