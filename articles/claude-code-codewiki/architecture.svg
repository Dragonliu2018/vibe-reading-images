  <text x="612" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#e8eaf0">hookify</text>
  <text x="612" y="454" text-anchor="middle" font-size="9" fill="#8b90a8">Python 规则引擎</text>

  <!-- arrow L3 -> L4 -->
  <path d="M410,474 L410,506" stroke="#6c8ef5" stroke-width="1.5" marker-end="url(#arrow)"/>
