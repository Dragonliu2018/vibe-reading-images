  </defs>
  <rect x="0" y="0" width="820" height="680" fill="#0b0d14"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#e8eaf0">Claude Code 仓库分层架构</text>

  <!-- L1 Runtime (external) -->
  <rect x="270" y="48" width="280" height="54" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5" stroke-dasharray="5 3"/>
