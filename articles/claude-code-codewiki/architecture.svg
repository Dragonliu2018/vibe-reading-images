  <!-- row 1 -->
  <rect x="56" y="544" width="180" height="46" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="146" y="563" text-anchor="middle" font-size="12" fill="#e8eaf0">gateway/gcp</text>
  <text x="146" y="580" text-anchor="middle" font-size="9" fill="#8b90a8">Terraform + Docker + Cloud Run</text>

  <rect x="248" y="544" width="170" height="46" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1"/>
  <text x="333" y="563" text-anchor="middle" font-size="12" fill="#e8eaf0">MDM 托管</text>
  <text x="333" y="580" text-anchor="middle" font-size="9" fill="#8b90a8">macOS + Windows</text>

  <rect x="430" y="544" width="190" height="46" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1"/>
