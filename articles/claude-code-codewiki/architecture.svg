  <rect x="268" y="598" width="180" height="46" rx="6" fill="#13162a" stroke="#95e1a3" stroke-width="1"/>
  <text x="358" y="617" text-anchor="middle" font-size="12" fill="#e8eaf0">devcontainer</text>
  <text x="358" y="634" text-anchor="middle" font-size="9" fill="#8b90a8">firewall 网络隔离</text>

