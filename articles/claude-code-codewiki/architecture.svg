  <text x="525" y="580" text-anchor="middle" font-size="9" fill="#8b90a8">strict / lax / bash-sandbox</text>

  <!-- row 2 -->
  <rect x="56" y="598" width="200" height="46" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1"/>
  <text x="156" y="617" text-anchor="middle" font-size="12" fill="#e8eaf0">CI workflows</text>
