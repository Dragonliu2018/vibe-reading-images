<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowstart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#b388ff"/>
    </marker>
    <marker id="arrowend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b388ff"/>
    </marker>
  </defs>
  <rect width="860" height="460" fill="#0b0d14"/>

  <text x="430" y="28" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">模块依赖关系</text>

  <!-- TS region -->
  <rect x="40" y="48" width="420" height="384" fill="none" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 3" rx="6"/>
  <text x="54" y="66" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="11">TypeScript</text>
  <!-- Rust region -->
  <rect x="520" y="48" width="300" height="384" fill="none" stroke="#b388ff" stroke-width="1" stroke-dasharray="4 3" rx="6"/>
  <text x="816" y="66" text-anchor="end" fill="#b388ff" font-family="system-ui, sans-serif" font-size="11">Rust</text>
  <!-- napi channel -->
  <rect x="460" y="48" width="60" height="384" fill="#0f1220" stroke="#9aa3c7" stroke-width="1" stroke-dasharray="3 2" rx="4"/>
  <text x="490" y="430" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10">napi FFI</text>

  <!-- api-gateway -->
  <rect x="200" y="70" width="180" height="44" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="290" y="88" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">api-gateway</text>
  <text x="290" y="104" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="9">REST / GraphQL / SQL / WS</text>

  <!-- server-core -->
  <rect x="200" y="150" width="180" height="44" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="290" y="168" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">server-core</text>
  <text x="290" y="184" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="9">装配 · Context · 调度</text>

  <!-- schema-compiler -->
  <rect x="50" y="240" width="170" height="44" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="135" y="258" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">schema-compiler</text>
  <text x="135" y="274" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="9">语义编译 · SQL 生成</text>

  <!-- query-orchestrator -->
  <rect x="240" y="240" width="170" height="44" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="325" y="258" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">query-orchestrator</text>
  <text x="325" y="274" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="9">缓存 · 预聚合 · 队列</text>

  <!-- drivers -->
  <rect x="140" y="350" width="170" height="40" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="225" y="367" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">29 数据源驱动</text>
  <text x="225" y="381" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="9">Postgres / Snowflake / ...</text>

  <!-- CubeSQL/Tesseract -->
  <rect x="540" y="150" width="220" height="44" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="650" y="168" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CubeSQL &amp; Tesseract</text>
  <text x="650" y="184" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="9">pg-wire · 原生 SQL 规划器</text>

  <!-- CubeStore -->
  <rect x="540" y="240" width="220" height="44" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="650" y="258" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CubeStore</text>
  <text x="650" y="274" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="9">分布式 OLAP 存储</text>

  <!-- Arrow 1: api-gateway -> server-core -->
  <path d="M290,114 L290,150" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="298" y="136" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="9">装配</text>

  <!-- Arrow 2: server-core -> schema-compiler -->
  <path d="M250,194 L170,240" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow 3: server-core -> query-orchestrator -->
  <path d="M330,194 L350,240" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow 4: schema-compiler <-> CubeSQL/Tesseract (napi bidirectional, routed above api-gateway to avoid Arrow 1 crossing) -->
  <path d="M135,240 L135,60 L650,60 L650,150" stroke="#b388ff" stroke-width="1.5" fill="none" marker-start="url(#arrowstart)" marker-end="url(#arrowend)"/>
  <text x="392" y="54" text-anchor="middle" fill="#b388ff" font-family="system-ui, sans-serif" font-size="9">napi · CubeEvaluator 回调</text>

  <!-- Arrow 5: query-orchestrator -> CubeStore (WS) -->
  <path d="M410,270 L540,270" stroke="#b388ff" stroke-width="1.5" fill="none" marker-end="url(#arrowend)" stroke-dasharray="4 2"/>
  <text x="475" y="264" text-anchor="middle" fill="#b388ff" font-family="system-ui, sans-serif" font-size="9">WS</text>

  <!-- Arrow 6: query-orchestrator -> drivers -->
  <path d="M300,284 L235,350" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow 7: CubeSQL -> query-orchestrator (napi callback sqlApiLoad, routed to right edge upper segment to avoid Arrow 3/5 crossing) -->
  <path d="M650,194 L650,225 L410,225 L410,250" stroke="#b388ff" stroke-width="1.5" fill="none" marker-end="url(#arrowend)" stroke-dasharray="4 2"/>
  <text x="530" y="219" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="8">sqlApiLoad 回调</text>

  <!-- Legend -->
  <rect x="540" y="330" width="220" height="60" rx="6" fill="#0f1220" stroke="#2a2e45" stroke-width="1"/>
  <text x="554" y="348" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">图例</text>
  <line x1="554" y1="358" x2="584" y2="358" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="592" y="362" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="9">TS 内部依赖</text>
  <line x1="554" y1="376" x2="584" y2="376" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrowend)"/>
  <text x="592" y="380" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="9">跨语言 napi / WS</text>
</svg>
