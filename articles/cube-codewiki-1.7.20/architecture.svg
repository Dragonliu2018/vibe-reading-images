<svg xmlns="http://www.w3.org/2000/svg" width="860" height="680" viewBox="0 0 860 680">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowdown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6488"/>
    </marker>
  </defs>
  <rect width="860" height="680" fill="#0b0d14"/>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Cube.js 分层架构（v1.7.20）</text>
  <text x="430" y="50" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="12">TS 语义层 + Rust SQL/存储 双引擎</text>

  <!-- TS / Rust boundary label -->
  <rect x="430" y="70" width="380" height="560" fill="none" stroke="#b388ff" stroke-width="1" stroke-dasharray="4 3" rx="6"/>
  <text x="820" y="86" text-anchor="end" fill="#b388ff" font-family="system-ui, sans-serif" font-size="11">Rust 原生层</text>
  <rect x="50" y="70" width="380" height="560" fill="none" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 3" rx="6"/>
  <text x="60" y="86" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="11">TypeScript 层</text>

  <!-- Layer 1: API Gateway -->
  <text x="84" y="110" text-anchor="end" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">接口层</text>
  <rect x="90" y="100" width="140" height="46" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="160" y="120" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12">REST / GraphQL</text>
  <text x="160" y="137" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="10">/load · /graphql</text>
  <rect x="250" y="100" width="140" height="46" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="320" y="120" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12">SQL pg-wire</text>
  <text x="320" y="137" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="10">psql / BI 工具</text>
  <rect x="460" y="100" width="160" height="46" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="540" y="120" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12">WebSocket 订阅</text>
  <text x="540" y="137" text-anchor="middle" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="10">轮询 + 增量推送</text>

  <!-- arrow L1 -> L2 -->
  <path d="M300,146 L300,188" stroke="#5a6488" stroke-width="1.5" fill="none" marker-end="url(#arrowdown)"/>

  <!-- Layer 2: Server Core -->
  <text x="84" y="200" text-anchor="end" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">编排层</text>
  <rect x="90" y="190" width="530" height="56" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="355" y="212" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Server Core</text>
  <text x="355" y="232" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="11">CompilerApi · OrchestratorApi · RefreshScheduler · DriverResolvers · Context 贯穿</text>

  <!-- arrow L2 -> L3 / L4 -->
  <path d="M250,246 L250,288" stroke="#5a6488" stroke-width="1.5" fill="none" marker-end="url(#arrowdown)"/>
  <path d="M460,246 L460,288" stroke="#5a6488" stroke-width="1.5" fill="none" marker-end="url(#arrowdown)"/>

  <!-- Layer 3: Schema Compiler -->
  <text x="84" y="300" text-anchor="end" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">语义层</text>
  <rect x="90" y="290" width="300" height="66" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="240" y="312" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Schema Compiler</text>
  <text x="240" y="330" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10">CubeEvaluator · JoinGraph · PreAggregations 匹配</text>
  <text x="240" y="348" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10">V8 沙箱 · 4 阶段编译 · adapter 模板方法</text>
  <rect x="460" y="290" width="160" height="66" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="540" y="312" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Tesseract</text>
  <text x="540" y="330" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10">原生 SQL 规划器</text>
  <text x="540" y="348" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10">CubeQuery → 下推 SQL</text>

  <!-- napi bridge arrow between schema-compiler and tesseract -->
  <path d="M390,323 L460,323" stroke="#b388ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="3 2"/>
  <text x="425" y="316" text-anchor="middle" fill="#b388ff" font-family="system-ui, sans-serif" font-size="9">napi</text>

  <!-- Layer 4: Query Orchestrator -->
  <text x="84" y="390" text-anchor="end" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="12" font-weight="600">执行层</text>
  <rect x="90" y="380" width="530" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="355" y="402" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Query Orchestrator</text>
  <text x="355" y="422" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="11">QueryCache · PreAggregationLoader · QueryQueue · 三层缓存 · ContinueWait 轮询</text>

  <!-- arrow L4 -> L5 -->
  <path d="M250,436 L250,478" stroke="#5a6488" stroke-width="1.5" fill="none" marker-end="url(#arrowdown)"/>
  <path d="M350,436 L350,478" stroke="#5a6488" stroke-width="1.5" fill="none" marker-end="url(#arrowdown)"/>

  <!-- Layer 5: Storage -->
  <text x="84" y="490" text-anchor="end" fill="#b388ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">存储层</text>
  <rect x="90" y="480" width="180" height="66" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="180" y="502" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">CubeStore</text>
  <text x="180" y="520" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10">Rust OLAP · 列式 Parquet</text>
  <text x="180" y="538" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10">分区 · 集群 · 预聚合存储</text>
  <rect x="290" y="480" width="120" height="66" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="350" y="502" text-anchor="middle" fill="#e8eaf0" font-family="system-ui, sans-serif" font-size="12">29 数据源驱动</text>
  <text x="350" y="520" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10">Postgres / Snowflake</text>
  <text x="350" y="538" text-anchor="middle" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="10">BigQuery / ClickHouse ...</text>

  <!-- CubeStore is Rust, drivers are TS -->
  <text x="180" y="560" text-anchor="middle" fill="#b388ff" font-family="system-ui, sans-serif" font-size="9">Rust</text>
  <text x="350" y="560" text-anchor="middle" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="9">TS</text>

  <!-- Legend -->
  <rect x="90" y="580" width="530" height="76" rx="6" fill="#0f1220" stroke="#2a2e45" stroke-width="1"/>
  <text x="104" y="600" fill="#9aa3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">架构要点</text>
  <text x="104" y="618" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="10">• 语义层单一定义，四协议（REST/GraphQL/SQL/WS）统一汇聚到 load() 管道</text>
  <text x="104" y="634" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="10">• TS 语义编译 + Rust SQL 规划/存储 双引擎，napi FFI 桥接，零序列化同进程调用</text>
  <text x="104" y="650" fill="#7a86b3" font-family="system-ui, sans-serif" font-size="10">• 三层缓存（内存 LRU → CubeStore → 预聚合表）+ 双层版本号（content/structure）匹配</text>
</svg>
