<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="430" fill="#0b0d14"/>

  <text x="390" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#e8ecff">LLVM 核心模块依赖关系</text>

  <!-- IR -->
  <rect x="335" y="63" width="150" height="54" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="410" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#6c8ef5">IR 中间表示</text>
  <text x="410" y="104" text-anchor="middle" font-size="11" fill="#9aa3c7">Module · Function</text>

  <!-- Pass/Analysis -->
  <rect x="335" y="158" width="150" height="54" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="179" text-anchor="middle" font-size="14" font-weight="700" fill="#f9ca24">Pass 管理与分析</text>
  <text x="410" y="199" text-anchor="middle" font-size="11" fill="#9aa3c7">PassBuilder</text>

  <!-- CodeGen -->
  <rect x="335" y="253" width="150" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="410" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#ff6b9d">CodeGen 后端</text>
  <text x="410" y="294" text-anchor="middle" font-size="11" fill="#9aa3c7">SelectionDAG · RegAlloc</text>

  <!-- Transforms -->
  <rect x="85" y="253" width="150" height="54" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="160" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#f9ca24">Transforms 优化</text>
  <text x="160" y="294" text-anchor="middle" font-size="11" fill="#9aa3c7">InstCombine · Vectorize</text>

  <!-- Target -->
  <rect x="580" y="158" width="150" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="655" y="179" text-anchor="middle" font-size="14" font-weight="700" fill="#ff6b9d">Target 目标描述</text>
  <text x="655" y="199" text-anchor="middle" font-size="11" fill="#9aa3c7">TableGen · 后端</text>

  <!-- MC -->
  <rect x="580" y="253" width="150" height="54" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="655" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#4ecdc4">MC 机器码层</text>
  <text x="655" y="294" text-anchor="middle" font-size="11" fill="#9aa3c7">MCStreamer · Assembler</text>

  <!-- Support foundation bar -->
  <rect x="40" y="360" width="700" height="46" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="390" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#b388ff">基础设施 Support / ADT</text>
  <text x="390" y="398" text-anchor="middle" font-size="11" fill="#9aa3c7">SmallVector · StringRef · APInt · DenseMap · Error · raw_ostream（所有模块依赖）</text>

  <!-- Arrows: A -> B means A depends on B -->
  <!-- Pass/Analysis -> IR (vertical, same column) -->
  <path d="M410,158 L410,121" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="420" y="142" text-anchor="start" font-size="11" fill="#7a86b3">依赖</text>

  <!-- CodeGen -> Pass/Analysis (vertical, same column) -->
  <path d="M410,253 L410,216" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="420" y="237" text-anchor="start" font-size="11" fill="#7a86b3">机器 pass</text>

  <!-- Transforms -> Pass/Analysis (up then right into Pass left edge) -->
  <path d="M160,253 L160,185 L332,185" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="246" y="178" text-anchor="middle" font-size="11" fill="#7a86b3" paint-order="stroke" stroke="#0b0d14" stroke-width="3">查询分析</text>

  <!-- CodeGen -> Target (exit right edge at y=260, up in clear gap x=525, right to Target left) -->
  <path d="M485,260 L525,260 L525,185 L577,185" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="535" y="222" text-anchor="start" font-size="11" fill="#7a86b3" paint-order="stroke" stroke="#0b0d14" stroke-width="3">查询目标</text>

  <!-- CodeGen -> MC (right, same row) -->
  <path d="M485,280 L577,280" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="531" y="273" text-anchor="middle" font-size="11" fill="#7a86b3" paint-order="stroke" stroke="#0b0d14" stroke-width="3">发射机器码</text>

  <!-- Target -> MC (down, same column) -->
  <path d="M655,212 L655,250" stroke="#7a86b3" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="665" y="235" text-anchor="start" font-size="11" fill="#7a86b3" paint-order="stroke" stroke="#0b0d14" stroke-width="3">目标描述</text>

  <text x="390" y="424" text-anchor="middle" font-size="11" fill="#9aa3c7">箭头 A→B 表示 A 依赖 B · IR 被 Transforms/CodeGen/Target/MC 共同操作</text>
</svg>
