<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
  </defs>

  <rect width="880" height="510" fill="#0b0d14"/>

  <text x="440" y="26" text-anchor="middle" fill="#e6e6f0" font-size="17" font-weight="600">PIPO 两阶段 Decode 数据流</text>

  <!-- Prefill band -->
  <rect x="40" y="50" width="800" height="110" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.55"/>
  <text x="50" y="68" fill="#4ecdc4" font-size="11" font-weight="600">Prefill（extend）</text>
  <!-- prefill nodes: 5 nodes w=130 at x=79,227,375,523,671, y=80 h=46 -->
  <rect x="79" y="86" width="130" height="50" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
  <text x="144" y="106" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">input_ids</text>
  <text x="144" y="124" text-anchor="middle" fill="#9aa3c7" font-size="10">[B, T]</text>
  <rect x="227" y="86" width="130" height="50" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
  <text x="292" y="106" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">embed+compress</text>
  <text x="292" y="124" text-anchor="middle" fill="#9aa3c7" font-size="10">[B, T/2, H]</text>
  <rect x="375" y="86" width="130" height="50" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
  <text x="440" y="106" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">backbone(32层)</text>
  <text x="440" y="124" text-anchor="middle" fill="#9aa3c7" font-size="10">[B, T/2, H]</text>
  <rect x="523" y="86" width="130" height="50" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
  <text x="588" y="106" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">lm_head→logits1</text>
  <text x="588" y="124" text-anchor="middle" fill="#9aa3c7" font-size="10">[B, T/2, V]</text>
  <rect x="671" y="86" width="130" height="50" rx="5" fill="#13162a" stroke="#4ecdc4" stroke-width="1.4"/>
  <text x="736" y="106" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">sample</text>
  <text x="736" y="124" text-anchor="middle" fill="#9aa3c7" font-size="10">token1 + PAD</text>
  <!-- arrows prefill -->
  <line x1="209" y1="111" x2="225" y2="111" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="357" y1="111" x2="373" y2="111" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="505" y1="111" x2="521" y2="111" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="653" y1="111" x2="669" y2="111" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- connector prefill -> phase1 -->
  <line x1="440" y1="160" x2="440" y2="186" stroke="#7a86b3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="450" y="178" fill="#9aa3c7" font-size="10">进入 decode 循环</text>

  <!-- Phase 1 band -->
  <rect x="40" y="186" width="800" height="110" rx="8" fill="none" stroke="#6c8ef5" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="50" y="204" fill="#6c8ef5" font-size="11" font-weight="600">Decode Phase 1（backbone，CUDA Graph）</text>
  <rect x="79" y="222" width="130" height="50" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
  <text x="144" y="242" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">input_ids_pair</text>
  <text x="144" y="260" text-anchor="middle" fill="#9aa3c7" font-size="10">[B, 2]</text>
  <rect x="227" y="222" width="130" height="50" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
  <text x="292" y="242" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">embed+compress</text>
  <text x="292" y="260" text-anchor="middle" fill="#9aa3c7" font-size="10">[B, 1, H]</text>
  <rect x="375" y="222" width="130" height="50" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
  <text x="440" y="242" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">backbone(graph)</text>
  <text x="440" y="260" text-anchor="middle" fill="#9aa3c7" font-size="10">hidden [B,1,H]·save</text>
  <rect x="523" y="222" width="130" height="50" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
  <text x="588" y="242" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">lm_head→logits1</text>
  <text x="588" y="260" text-anchor="middle" fill="#9aa3c7" font-size="10">[B, 1, V]</text>
  <rect x="671" y="222" width="130" height="50" rx="5" fill="#13162a" stroke="#6c8ef5" stroke-width="1.4"/>
  <text x="736" y="242" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">sample token1</text>
  <text x="736" y="260" text-anchor="middle" fill="#f9ca24" font-size="10">GPU→CPU sync</text>
  <line x1="209" y1="247" x2="225" y2="247" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="357" y1="247" x2="373" y2="247" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="505" y1="247" x2="521" y2="247" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="653" y1="247" x2="669" y2="247" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- connector phase1 -> phase2 -->
  <line x1="440" y1="296" x2="440" y2="322" stroke="#7a86b3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="450" y="314" fill="#9aa3c7" font-size="10">切 pipo_phase=2</text>

  <!-- Phase 2 band -->
  <rect x="40" y="322" width="800" height="110" rx="8" fill="none" stroke="#ff6b9d" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="50" y="340" fill="#ff6b9d" font-size="11" font-weight="600">Decode Phase 2（MTP + ConfidenceHead，无 graph）</text>
  <!-- 6 nodes w=120 at x=45,179,313,447,581,715, y=358 h=46 -->
  <rect x="45" y="358" width="120" height="50" rx="5" fill="#13162a" stroke="#ff6b9d" stroke-width="1.4"/>
  <text x="105" y="378" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">embed(token1)</text>
  <text x="105" y="396" text-anchor="middle" fill="#9aa3c7" font-size="10">+norm(hidden)</text>
  <rect x="179" y="358" width="120" height="50" rx="5" fill="#13162a" stroke="#ff6b9d" stroke-width="1.4"/>
  <text x="239" y="378" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">cat</text>
  <text x="239" y="396" text-anchor="middle" fill="#9aa3c7" font-size="10">[B, 1, 2H]</text>
  <rect x="313" y="358" width="120" height="50" rx="5" fill="#13162a" stroke="#ff6b9d" stroke-width="1.4"/>
  <text x="373" y="378" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">mtp_fc+mtp_block</text>
  <text x="373" y="396" text-anchor="middle" fill="#9aa3c7" font-size="10">mtp_hidden [B,1,H]</text>
  <rect x="447" y="358" width="120" height="50" rx="5" fill="#13162a" stroke="#ff6b9d" stroke-width="1.4"/>
  <text x="507" y="378" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">confidence_head</text>
  <text x="507" y="396" text-anchor="middle" fill="#9aa3c7" font-size="10">sigmoid→conf</text>
  <rect x="581" y="358" width="120" height="50" rx="5" fill="#13162a" stroke="#ff6b9d" stroke-width="1.4"/>
  <text x="641" y="378" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">lm_head→logits2</text>
  <text x="641" y="396" text-anchor="middle" fill="#9aa3c7" font-size="10">[B, 1, V]</text>
  <rect x="715" y="358" width="120" height="50" rx="5" fill="#13162a" stroke="#ff6b9d" stroke-width="1.4"/>
  <text x="775" y="378" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">sample token2</text>
  <text x="775" y="396" text-anchor="middle" fill="#9aa3c7" font-size="10">conf&lt;阈值→PAD</text>
  <line x1="165" y1="383" x2="177" y2="383" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="299" y1="383" x2="311" y2="383" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="433" y1="383" x2="445" y2="383" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="567" y1="383" x2="579" y2="383" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="701" y1="383" x2="713" y2="383" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- connector phase2 -> output -->
  <line x1="440" y1="432" x2="440" y2="452" stroke="#7a86b3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowy)"/>
  <text x="450" y="446" fill="#9aa3c7" font-size="10">gating</text>

  <!-- Output -->
  <rect x="340" y="452" width="200" height="46" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.6"/>
  <text x="440" y="481" text-anchor="middle" fill="#f9ca24" font-size="13" font-weight="600">输出 [token1, token2]</text>
</svg>
