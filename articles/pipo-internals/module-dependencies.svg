<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
  </defs>

  <rect width="880" height="580" fill="#0b0d14"/>

  <text x="440" y="26" text-anchor="middle" fill="#e6e6f0" font-size="17" font-weight="600">PIPO 模块依赖关系</text>

  <!-- Hub: Model -->
  <rect x="350" y="250" width="190" height="90" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="2"/>
  <text x="445" y="285" text-anchor="middle" fill="#e6e6f0" font-size="14" font-weight="700">PIPO 模型与组件</text>
  <text x="445" y="304" text-anchor="middle" fill="#9aa3c7" font-size="11">pipo/qwen3_5</text>
  <text x="445" y="322" text-anchor="middle" fill="#9aa3c7" font-size="11">Compressor·MTP·ConfHead</text>

  <!-- Eval (top) -->
  <rect x="335" y="50" width="220" height="65" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="445" y="78" text-anchor="middle" fill="#e6e6f0" font-size="13" font-weight="600">评测系统</text>
  <text x="445" y="97" text-anchor="middle" fill="#9aa3c7" font-size="11">sglang_eval + pipo/eval</text>

  <!-- SFT Trainer (upper-left) -->
  <rect x="60" y="140" width="200" height="65" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="160" y="168" text-anchor="middle" fill="#e6e6f0" font-size="13" font-weight="600">SFT 训练器</text>
  <text x="160" y="187" text-anchor="middle" fill="#9aa3c7" font-size="11">PIPOSeq2SeqTrainer+plugin</text>

  <!-- OPD Trainer (lower-left) -->
  <rect x="60" y="390" width="200" height="70" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="160" y="418" text-anchor="middle" fill="#e6e6f0" font-size="13" font-weight="600">OPD 训练器</text>
  <text x="160" y="437" text-anchor="middle" fill="#9aa3c7" font-size="11">PIPOGKDTrainer 蒸馏</text>

  <!-- SGLang Inference (upper-right) -->
  <rect x="620" y="140" width="200" height="70" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.5"/>
  <text x="720" y="168" text-anchor="middle" fill="#e6e6f0" font-size="13" font-weight="600">SGLang 推理后端</text>
  <text x="720" y="187" text-anchor="middle" fill="#9aa3c7" font-size="11">qwen3_5_pipo 两阶段 decode</text>

  <!-- Dataset (bottom) -->
  <rect x="335" y="480" width="220" height="65" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="445" y="508" text-anchor="middle" fill="#e6e6f0" font-size="13" font-weight="600">数据构建</text>
  <text x="445" y="527" text-anchor="middle" fill="#9aa3c7" font-size="11">pipo/dataset</text>

  <!-- Qwen3.5 + 9B teacher (external, lower-right) -->
  <rect x="620" y="390" width="200" height="70" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="720" y="418" text-anchor="middle" fill="#e6e6f0" font-size="13" font-weight="600">Qwen3.5 + 9B teacher</text>
  <text x="720" y="437" text-anchor="middle" fill="#9aa3c7" font-size="11">冻结基座 / 蒸馏教师</text>

  <!-- Arrows -->
  <!-- 1 Eval -> Hub (down) -->
  <line x1="445" y1="115" x2="445" y2="248" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="185" fill="#9aa3c7" font-size="11">PIPO 推理路径</text>

  <!-- 2 SFT -> Hub (orthogonal jog right+down) -->
  <path d="M260,172 L300,172 L300,268 L348,268" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="268" y="166" fill="#9aa3c7" font-size="11">model.forward</text>

  <!-- 3 OPD -> Hub (orthogonal jog right+up) -->
  <path d="M260,410 L305,410 L305,322 L348,322" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="268" y="404" fill="#9aa3c7" font-size="11">student fwd + conf head</text>

  <!-- 4 SGLang -> Hub (orthogonal jog left+down) -->
  <path d="M620,175 L585,175 L585,268 L542,268" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="169" text-anchor="end" fill="#9aa3c7" font-size="11">import compressor/ConfHead</text>

  <!-- 5 Dataset -> SFT (left corridor, up) -->
  <path d="M335,495 L30,495 L30,172 L58,172" fill="none" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <text x="40" y="335" fill="#ff6b9d" font-size="11" transform="rotate(-90 40 335)">SFT/RL 数据</text>

  <!-- 6 Dataset -> OPD (short up-left) -->
  <path d="M335,500 L300,500 L300,455 L260,455" fill="none" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <text x="305" y="492" fill="#ff6b9d" font-size="11">RL 数据</text>

  <!-- 7 OPD -> teacher (horizontal, below hub) -->
  <line x1="260" y1="440" x2="618" y2="440" stroke="#ff6b9d" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <text x="440" y="433" text-anchor="middle" fill="#ff6b9d" font-size="11">蒸馏 teacher</text>

  <!-- External framework annotations -->
  <text x="160" y="225" text-anchor="middle" fill="#6c8ef5" font-size="10" opacity="0.75">↳ swift_plugin 注册到 ms-swift TrainerFactory</text>
  <text x="720" y="225" text-anchor="middle" fill="#6c8ef5" font-size="10" opacity="0.75">↳ 扩展 SGLang (tp_worker/schedule_batch/cuda_graph)</text>
</svg>
