<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9ca24"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8ef5"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b9d"/>
    </marker>
  </defs>

  <rect width="880" height="580" fill="#0b0d14"/>

  <text x="440" y="26" text-anchor="middle" fill="#e6e6f0" font-size="17" font-weight="600">OPD 训练三阶段数据流</text>

  <!-- Stage 1 Rollout -->
  <rect x="30" y="44" width="820" height="78" rx="8" fill="none" stroke="#80c7ff" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="40" y="62" fill="#80c7ff" font-size="11" font-weight="600">Stage 1 · SGLang Rollout</text>
  <rect x="100" y="58" width="210" height="50" rx="5" fill="#13162a" stroke="#80c7ff" stroke-width="1.4"/>
  <text x="205" y="87" text-anchor="middle" fill="#e6e6f0" font-size="12" font-weight="600">prompt</text>
  <rect x="335" y="58" width="210" height="50" rx="5" fill="#13162a" stroke="#80c7ff" stroke-width="1.4"/>
  <text x="440" y="80" text-anchor="middle" fill="#e6e6f0" font-size="12" font-weight="600">SGLang force PIPO</text>
  <text x="440" y="97" text-anchor="middle" fill="#9aa3c7" font-size="10">disable radix cache</text>
  <rect x="570" y="58" width="210" height="50" rx="5" fill="#13162a" stroke="#80c7ff" stroke-width="1.4"/>
  <text x="675" y="87" text-anchor="middle" fill="#e6e6f0" font-size="12" font-weight="600">response_token_ids</text>
  <line x1="310" y1="83" x2="333" y2="83" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="545" y1="83" x2="568" y2="83" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- connector A->B -->
  <line x1="440" y1="122" x2="440" y2="136" stroke="#7a86b3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="450" y="133" fill="#9aa3c7" font-size="10">response 进入编码</text>

  <!-- Stage 2 Encode -->
  <rect x="30" y="138" width="820" height="96" rx="8" fill="none" stroke="#f9ca24" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="40" y="156" fill="#f9ca24" font-size="11" font-weight="600">Stage 2 · Batch 编码（_encode_with_rollout_response）</text>
  <rect x="76" y="168" width="170" height="58" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
  <text x="161" y="190" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">prompt-only encode</text>
  <text x="161" y="207" text-anchor="middle" fill="#9aa3c7" font-size="9">auto-append</text>
  <text x="161" y="219" text-anchor="middle" fill="#9aa3c7" font-size="9">response_prefix</text>
  <rect x="262" y="168" width="170" height="58" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
  <text x="347" y="190" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">parity PAD</text>
  <text x="347" y="207" text-anchor="middle" fill="#9aa3c7" font-size="9">奇数 prompt 补 PAD</text>
  <text x="347" y="219" text-anchor="middle" fill="#9aa3c7" font-size="9">对齐 SGLang</text>
  <rect x="448" y="168" width="170" height="58" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
  <text x="533" y="190" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">concat rollout ids</text>
  <text x="533" y="207" text-anchor="middle" fill="#9aa3c7" font-size="9">prompt + response</text>
  <text x="533" y="219" text-anchor="middle" fill="#9aa3c7" font-size="9">+ eos</text>
  <rect x="634" y="168" width="170" height="58" rx="5" fill="#13162a" stroke="#f9ca24" stroke-width="1.4"/>
  <text x="719" y="190" text-anchor="middle" fill="#e6e6f0" font-size="11" font-weight="600">input_ids [B,T]</text>
  <text x="719" y="207" text-anchor="middle" fill="#9aa3c7" font-size="9">labels [B,T]</text>
  <text x="719" y="219" text-anchor="middle" fill="#9aa3c7" font-size="9">T 偶数</text>
  <line x1="246" y1="197" x2="260" y2="197" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="432" y1="197" x2="446" y2="197" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="618" y1="197" x2="632" y2="197" stroke="#7a86b3" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 3 Loss -->
  <rect x="30" y="250" width="820" height="310" rx="8" fill="none" stroke="#ff6b9d" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="40" y="268" fill="#ff6b9d" font-size="11" font-weight="600">Stage 3 · Loss 计算 + Backward</text>

  <!-- connector B->C diverging -->
  <path d="M440,234 L440,250 L200,250 L200,284" fill="none" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M440,250 L680,250 L680,284" fill="none" stroke="#7a86b3" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="500" y="246" fill="#9aa3c7" font-size="10">input_ids / labels</text>

  <!-- Student node -->
  <rect x="60" y="286" width="280" height="86" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="200" y="308" text-anchor="middle" fill="#6c8ef5" font-size="12" font-weight="600">Student（压缩模式）</text>
  <text x="200" y="328" text-anchor="middle" fill="#9aa3c7" font-size="10">embed_pad_compress → backbone</text>
  <text x="200" y="345" text-anchor="middle" fill="#9aa3c7" font-size="10">backbone_hidden [B,L-1,H]</text>
  <text x="200" y="362" text-anchor="middle" fill="#9aa3c7" font-size="10">teacher-force token1 → mtp → mtp_hidden</text>

  <!-- Teacher node -->
  <rect x="540" y="286" width="280" height="86" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="680" y="308" text-anchor="middle" fill="#ff6b9d" font-size="12" font-weight="600">Teacher（PAD-compacted）</text>
  <text x="680" y="328" text-anchor="middle" fill="#9aa3c7" font-size="10">strip PAD (argsort + gather)</text>
  <text x="680" y="345" text-anchor="middle" fill="#9aa3c7" font-size="10">vanilla backbone → cumsum remap</text>
  <text x="680" y="362" text-anchor="middle" fill="#9aa3c7" font-size="10">teacher_hidden [B,T,H]</text>

  <!-- Student -> Merge -->
  <path d="M200,372 L200,386 L380,386 L380,396" fill="none" stroke="#6c8ef5" stroke-width="1.4" marker-end="url(#arrowb)"/>
  <!-- Teacher -> Merge -->
  <path d="M680,372 L680,386 L500,386 L500,396" fill="none" stroke="#ff6b9d" stroke-width="1.4" marker-end="url(#arrowp)"/>

  <!-- Merge node -->
  <rect x="290" y="396" width="300" height="70" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="440" y="420" text-anchor="middle" fill="#f9ca24" font-size="12" font-weight="600">chunked sampled-KL + conf BCE</text>
  <text x="440" y="440" text-anchor="middle" fill="#9aa3c7" font-size="10">log p_s(y) − log p_t(y)</text>
  <text x="440" y="456" text-anchor="middle" fill="#9aa3c7" font-size="10">target = min(1, p_t/p_s).detach()</text>

  <!-- Merge -> Backward -->
  <line x1="440" y1="466" x2="440" y2="484" stroke="#f9ca24" stroke-width="1.4" marker-end="url(#arrowy)"/>

  <!-- Backward node -->
  <rect x="310" y="486" width="260" height="60" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="440" y="510" text-anchor="middle" fill="#f9ca24" font-size="12" font-weight="600">micro-chunks (B=1) in-loop backward</text>
  <text x="440" y="530" text-anchor="middle" fill="#9aa3c7" font-size="10">ZeRO-2 grad 累积，不在循环内 flush</text>
</svg>
