  <rect x="640" y="475" width="200" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="740" y="496" text-anchor="middle" fill="#e6e6f0" font-size="13" font-weight="600">9B teacher</text>
  <text x="740" y="514" text-anchor="middle" fill="#9aa3c7" font-size="11">OPD 蒸馏教师</text>
