  <rect x="410" y="475" width="200" height="56" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="510" y="496" text-anchor="middle" fill="#e6e6f0" font-size="13" font-weight="600">Qwen3.5 冻结 backbone</text>
