<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540">
  <rect width="840" height="540" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .ipc { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <!-- Top: SpeculativeAlgorithm + registry -->
  <rect x="180" y="30" width="480" height="70" rx="8" fill="#1a1e2e" stroke="#ff6b9d" stroke-width="2"/>
  <text x="420" y="52" text-anchor="middle" class="label" fill="#ff6b9d">SpeculativeAlgorithm + spec_registry</text>
  <text x="420" y="70" text-anchor="middle" class="mod">spec_info.py:31 · 枚举 + @register 装饰器</text>
  <text x="420" y="86" text-anchor="middle" class="mod">EAGLE · EAGLE3 · DFLASH · DSPARK · NGRAM · FROZEN_KV_MTP · STANDALONE</text>

  <!-- Workers -->
  <text x="420" y="124" text-anchor="middle" class="label" fill="#8892a8">create_worker → 7 种 Worker（策略模式）</text>

  <rect x="20" y="140" width="180" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="110" y="160" text-anchor="middle" class="label" fill="#4ecdc4">EAGLEWorkerV2</text>
  <text x="110" y="176" text-anchor="middle" class="mod">独立 draft model</text>
  <text x="110" y="190" text-anchor="middle" class="mod">tree attention</text>

  <rect x="220" y="140" width="180" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="310" y="160" text-anchor="middle" class="label" fill="#4ecdc4">DFlashWorkerV2</text>
  <text x="310" y="176" text-anchor="middle" class="mod">block draft</text>
  <text x="310" y="190" text-anchor="middle" class="mod">从 hidden 物化 KV</text>

  <rect x="420" y="140" width="180" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="510" y="160" text-anchor="middle" class="label" fill="#4ecdc4">NGRAMWorker</text>
  <text x="510" y="176" text-anchor="middle" class="mod">无 draft model</text>
  <text x="510" y="190" text-anchor="middle" class="mod">CPU corpus 查找</text>

  <rect x="620" y="140" width="200" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="720" y="160" text-anchor="middle" class="label" fill="#4ecdc4">FrozenKVMTPWorkerV2</text>
  <text x="720" y="176" text-anchor="middle" class="mod">继承 EAGLEWorkerV2</text>
  <text x="720" y="190" text-anchor="middle" class="mod">只读 target KV</text>

  <path d="M 420 100 L 420 120 L 110 140" class="arrow" marker-end="url(#ah)" opacity="0.4"/>
  <path d="M 420 100 L 420 120 L 310 140" class="arrow" marker-end="url(#ah)" opacity="0.4"/>
  <path d="M 420 100 L 420 120 L 510 140" class="arrow" marker-end="url(#ah)" opacity="0.4"/>
  <path d="M 420 100 L 420 120 L 720 140" class="arrow" marker-end="url(#ah)" opacity="0.4"/>

  <!-- ABCs -->
  <rect x="180" y="230" width="480" height="80" rx="8" fill="#1a1e2e" stroke="#5a6075" stroke-width="1.5"/>
  <text x="420" y="252" text-anchor="middle" class="label" fill="#5a6075">ABC 层</text>
  <text x="420" y="270" text-anchor="middle" class="mod">BaseSpecWorker (base_spec_worker.py:147) — alloc/init lifecycle + 观察者 hook</text>
  <text x="420" y="286" text-anchor="middle" class="mod">EagleDraftWorkerBase (base_spec_worker.py:57) — draft() / draft_extend() @abstractmethod</text>
  <text x="420" y="302" text-anchor="middle" class="mod">SpecInput (spec_info.py:322) — is_draft_input / is_verify_input</text>

  <path d="M 110 200 L 110 215 L 420 230" class="arrow" marker-end="url(#ah)" opacity="0.3"/>
  <path d="M 310 200 L 310 215 L 420 230" class="arrow" marker-end="url(#ah)" opacity="0.3"/>
  <path d="M 510 200 L 510 215 L 420 230" class="arrow" marker-end="url(#ah)" opacity="0.3"/>
  <path d="M 720 200 L 720 215 L 420 230" class="arrow" marker-end="url(#ah)" opacity="0.3"/>

  <!-- Interaction with Scheduler + mem_cache + model_executor -->
  <text x="420" y="340" text-anchor="middle" class="label" fill="#8892a8">跨模块交互</text>

  <rect x="20" y="360" width="200" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="120" y="380" text-anchor="middle" class="label" fill="#4ecdc4">Scheduler</text>
  <text x="120" y="396" text-anchor="middle" class="mod">maybe_init_draft_worker</text>
  <text x="120" y="410" text-anchor="middle" class="mod">run_batch → forward</text>

  <rect x="320" y="360" width="200" height="60" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="420" y="380" text-anchor="middle" class="label" fill="#ff6b9d">mem_cache</text>
  <text x="420" y="396" text-anchor="middle" class="mod">draft KV pool</text>
  <text x="420" y="410" text-anchor="middle" class="mod">move_accept → target</text>

  <rect x="620" y="360" width="200" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="720" y="380" text-anchor="middle" class="label" fill="#f9ca24">model_executor</text>
  <text x="720" y="396" text-anchor="middle" class="mod">verify forward</text>
  <text x="720" y="410" text-anchor="middle" class="mod">复用 ModelRunner</text>

  <path d="M 220 390 L 320 390" class="ipc" marker-end="url(#ahp)"/>
  <text x="270" y="383" text-anchor="middle" class="lbl">draft KV</text>
  <path d="M 520 390 L 620 390" class="ipc" marker-end="url(#ahp)"/>
  <text x="570" y="383" text-anchor="middle" class="lbl">verify</text>

  <!-- FutureMap / overlap -->
  <rect x="180" y="450" width="480" height="50" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="420" y="470" text-anchor="middle" class="label" fill="#b388ff">FutureMap / on_publish — verify 与下一轮 prep 重叠</text>
  <text x="420" y="486" text-anchor="middle" class="mod">overlap_utils.py · WAR barrier · publish_ready event</text>

  <path d="M 420 310 L 420 360" class="arrow" marker-end="url(#ah)" opacity="0.3"/>
  <path d="M 420 420 L 420 450" class="arrow" marker-end="url(#ah)" opacity="0.3"/>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b9d"/>
    </marker>
  </defs>
</svg>