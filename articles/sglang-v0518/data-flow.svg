<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560">
  <rect width="840" height="560" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .dtype { font-family: system-ui, sans-serif; font-size: 9px; fill: #5a6885; font-style: italic; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .ipc { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <!-- Title -->
  <text x="420" y="24" text-anchor="middle" fill="#8892a8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">流式生成请求 — 端到端数据流</text>

  <!-- Row 1: Client + HTTP + TokenizerManager (main process) -->
  <rect x="20" y="45" width="120" height="55" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="80" y="68" text-anchor="middle" class="label" fill="#6c8ef5">Client</text>
  <text x="80" y="84" text-anchor="middle" class="mod">/v1/chat/completions</text>

  <rect x="180" y="45" width="160" height="55" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="260" y="68" text-anchor="middle" class="label" fill="#6c8ef5">HTTP Server</text>
  <text x="260" y="84" text-anchor="middle" class="mod">http_server.py</text>

  <rect x="380" y="45" width="200" height="55" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="480" y="68" text-anchor="middle" class="label" fill="#4ecdc4">TokenizerManager</text>
  <text x="480" y="84" text-anchor="middle" class="mod">generate_request · _tokenize</text>

  <!-- Arrows row 1 -->
  <path d="M 140 72 L 180 72" class="arrow" marker-end="url(#ah)"/>
  <text x="160" y="65" text-anchor="middle" class="dtype">GenerateReqInput</text>

  <path d="M 340 72 L 380 72" class="arrow" marker-end="url(#ah)"/>
  <text x="360" y="65" text-anchor="middle" class="dtype">ReqInput</text>

  <!-- ZMQ boundary line -->
  <line x1="600" y1="30" x2="600" y2="540" stroke="#2a3040" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="610" y="42" class="lbl" fill="#ff6b9d">ZMQ PUSH</text>

  <!-- Row 2: Scheduler (subprocess) -->
  <rect x="620" y="45" width="200" height="55" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="720" y="68" text-anchor="middle" class="label" fill="#4ecdc4">Scheduler</text>
  <text x="720" y="84" text-anchor="middle" class="mod">event_loop · recv_requests</text>

  <path d="M 580 72 L 620 72" class="ipc" marker-end="url(#ahp)"/>
  <text x="600" y="65" text-anchor="middle" class="dtype">TokenizedReq</text>

  <!-- Scheduler internal flow (vertical) -->
  <rect x="620" y="130" width="200" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="720" y="148" text-anchor="middle" class="label" fill="#4ecdc4">get_next_batch_to_run</text>
  <text x="720" y="164" text-anchor="middle" class="mod">SchedulePolicy · PrefillAdder</text>

  <path d="M 720 100 L 720 130" class="arrow" marker-end="url(#ah)"/>
  <text x="730" y="120" class="dtype">waiting→running</text>

  <rect x="620" y="200" width="200" height="45" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="720" y="218" text-anchor="middle" class="label" fill="#f9ca24">run_batch (GPU forward)</text>
  <text x="720" y="234" text-anchor="middle" class="mod">TpModelWorker → ModelRunner</text>

  <path d="M 720 175 L 720 200" class="arrow" marker-end="url(#ah)"/>
  <text x="730" y="192" class="dtype">ScheduleBatch</text>

  <!-- GPU execution box -->
  <rect x="620" y="270" width="200" height="55" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="720" y="290" text-anchor="middle" class="label" fill="#f9ca24">ForwardBatch.init_new</text>
  <text x="720" y="306" text-anchor="middle" class="mod">model.forward → sample</text>
  <text x="720" y="318" text-anchor="middle" class="mod">→ next_token_ids</text>

  <path d="M 720 245 L 720 270" class="arrow" marker-end="url(#ah)"/>

  <!-- process_batch_result -->
  <rect x="620" y="355" width="200" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="720" y="373" text-anchor="middle" class="label" fill="#4ecdc4">process_batch_result</text>
  <text x="720" y="389" text-anchor="middle" class="mod">output_streamer → ZMQ</text>

  <path d="M 720 325 L 720 355" class="arrow" marker-end="url(#ah)"/>
  <text x="730" y="345" class="dtype">BatchTokenIDOutput</text>

  <!-- ZMQ to Detokenizer (left side) -->
  <path d="M 620 378 L 480 378" class="ipc" marker-end="url(#ahp)"/>

  <!-- Detokenizer -->
  <rect x="280" y="355" width="200" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="380" y="373" text-anchor="middle" class="label" fill="#4ecdc4">DetokenizerManager</text>
  <text x="380" y="389" text-anchor="middle" class="mod">batch_decode · trim_stop</text>

  <!-- ZMQ back to main process -->
  <path d="M 280 378 L 180 378 L 180 300 L 480 300 L 480 100" class="ipc" marker-end="url(#ahp)" opacity="0.7"/>
  <text x="350" y="370" class="lbl">ZMQ</text>

  <!-- TokenizerManager response (back to client) -->
  <rect x="380" y="250" width="200" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="268" text-anchor="middle" class="label" fill="#4ecdc4">TokenizerManager</text>
  <text x="480" y="284" text-anchor="middle" class="mod">handle_loop · SSE yield</text>

  <path d="M 480 250 L 480 100" class="arrow" marker-end="url(#ah)" opacity="0.6"/>
  <text x="490" y="180" class="dtype">BatchStrOutput</text>

  <!-- Back to client -->
  <path d="M 380 72 L 340 72 L 340 120 L 140 120 L 140 100" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <text x="220" y="115" class="dtype">SSE chunk</text>

  <!-- mem_cache side box -->
  <rect x="20" y="200" width="160" height="55" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="100" y="220" text-anchor="middle" class="label" fill="#ff6b9d">mem_cache</text>
  <text x="100" y="236" text-anchor="middle" class="mod">RadixCache.match_prefix</text>
  <text x="100" y="250" text-anchor="middle" class="mod">insert · evict</text>

  <path d="M 620 155 L 180 230" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <text x="330" y="180" class="lbl">prefix match / insert</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b9d"/>
    </marker>
  </defs>
</svg>