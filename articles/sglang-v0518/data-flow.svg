<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <rect width="800" height="520" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .dtype { font-family: system-ui, sans-serif; font-size: 9px; fill: #5a6885; font-style: italic; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .ipc { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
    .proc { font-family: system-ui, sans-serif; font-size: 11px; fill: #5a6075; font-weight: 600; }
  </style>

  <text x="400" y="22" text-anchor="middle" fill="#8892a8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">流式生成请求 — 端到端数据流</text>

  <!-- Process boundary labels -->
  <text x="200" y="42" text-anchor="middle" class="proc">主进程</text>
  <text x="640" y="42" text-anchor="middle" class="proc">Scheduler 子进程</text>
  <line x1="420" y1="30" x2="420" y2="500" stroke="#2a3040" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Row 1: Client → HTTP → TokenizerManager || Scheduler recv -->
  <rect x="20" y="50" width="110" height="45" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="75" y="70" text-anchor="middle" class="label" fill="#6c8ef5">Client</text>
  <text x="75" y="84" text-anchor="middle" class="mod">/v1/chat/completions</text>

  <rect x="150" y="50" width="120" height="45" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="210" y="70" text-anchor="middle" class="label" fill="#6c8ef5">HTTP Server</text>
  <text x="210" y="84" text-anchor="middle" class="mod">http_server.py</text>

  <rect x="290" y="50" width="120" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="350" y="70" text-anchor="middle" class="label" fill="#4ecdc4">Tokenizer</text>
  <text x="350" y="84" text-anchor="middle" class="mod">generate_request</text>

  <rect x="440" y="50" width="180" height="45" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="530" y="70" text-anchor="middle" class="label" fill="#4ecdc4">Scheduler</text>
  <text x="530" y="84" text-anchor="middle" class="mod">event_loop · recv_requests</text>

  <!-- Arrows row 1 -->
  <path d="M 130 72 L 150 72" class="arrow" marker-end="url(#ah)"/>
  <path d="M 270 72 L 290 72" class="arrow" marker-end="url(#ah)"/>
  <text x="280" y="65" text-anchor="middle" class="dtype">ReqInput</text>
  <path d="M 410 72 L 440 72" class="ipc" marker-end="url(#ahp)"/>
  <text x="425" y="65" text-anchor="middle" class="dtype">ZMQ</text>

  <!-- Scheduler internal vertical chain (right side) -->
  <rect x="440" y="120" width="180" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="530" y="138" text-anchor="middle" class="label" fill="#4ecdc4">get_next_batch_to_run</text>
  <text x="530" y="153" text-anchor="middle" class="mod">SchedulePolicy · PrefillAdder</text>
  <path d="M 530 95 L 530 120" class="arrow" marker-end="url(#ah)"/>

  <rect x="440" y="185" width="180" height="42" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="530" y="203" text-anchor="middle" class="label" fill="#f9ca24">run_batch (GPU forward)</text>
  <text x="530" y="218" text-anchor="middle" class="mod">ModelRunner.forward → sample</text>
  <path d="M 530 162 L 530 185" class="arrow" marker-end="url(#ah)"/>

  <rect x="440" y="250" width="180" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="530" y="268" text-anchor="middle" class="label" fill="#4ecdc4">process_batch_result</text>
  <text x="530" y="283" text-anchor="middle" class="mod">output_streamer → ZMQ</text>
  <path d="M 530 227 L 530 250" class="arrow" marker-end="url(#ah)"/>
  <text x="540" y="242" class="dtype">BatchTokenIDOutput</text>

  <!-- ZMQ back to left side: Detokenizer -->
  <path d="M 440 271 L 350 271" class="ipc" marker-end="url(#ahp)"/>

  <rect x="220" y="250" width="130" height="42" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="285" y="268" text-anchor="middle" class="label" fill="#4ecdc4">Detokenizer</text>
  <text x="285" y="283" text-anchor="middle" class="mod">batch_decode · trim_stop</text>

  <!-- Detokenizer → TokenizerManager (ZMQ back up) -->
  <path d="M 220 271 L 180 271 L 180 120 L 350 120 L 350 95" class="ipc" marker-end="url(#ahp)" opacity="0.7"/>
  <text x="185" y="195" class="dtype" transform="rotate(-90 185 195)">BatchStrOutput</text>

  <!-- TokenizerManager → Client (SSE return) -->
  <path d="M 290 72 L 270 72 L 270 100 L 75 100 L 75 95" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <text x="170" y="95" text-anchor="middle" class="dtype">SSE chunk</text>

  <!-- mem_cache side box (bottom left) -->
  <rect x="40" y="185" width="150" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="115" y="205" text-anchor="middle" class="label" fill="#ff6b9d">mem_cache</text>
  <text x="115" y="221" text-anchor="middle" class="mod">match_prefix · insert · evict</text>

  <!-- Scheduler → mem_cache -->
  <path d="M 440 141 L 190 210" class="arrow" marker-end="url(#ah)" opacity="0.4"/>
  <text x="280" y="165" class="lbl">prefix match</text>

  <!-- Data type legend -->
  <rect x="640" y="120" width="150" height="100" rx="8" fill="none" stroke="#2a3040" stroke-width="1"/>
  <text x="715" y="138" text-anchor="middle" class="lbl" font-weight="600">数据结构演化</text>
  <text x="650" y="155" class="dtype">GenerateReqInput</text>
  <text x="650" y="170" class="dtype">→ TokenizedReqInput</text>
  <text x="650" y="185" class="dtype">→ Req → ScheduleBatch</text>
  <text x="650" y="200" class="dtype">→ ForwardBatch</text>
  <text x="650" y="215" class="dtype">→ BatchTokenIDOutput</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b9d"/>
    </marker>
  </defs>
</svg>