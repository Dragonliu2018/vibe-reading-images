<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450">
  <rect width="720" height="450" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .gpu { stroke: #f9ca24; stroke-width: 1.5; fill: none; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #5a6885; font-style: italic; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <text x="360" y="22" text-anchor="middle" fill="#8892a8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">event_loop_overlap — CPU/GPU 双流重叠</text>

  <!-- Step 1 -->
  <rect x="200" y="40" width="320" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="360" y="58" text-anchor="middle" class="label" fill="#4ecdc4">1. recv_requests · process_input_requests</text>
  <text x="360" y="73" text-anchor="middle" class="mod">ZMQ PULL → waiting_queue.append(req)</text>
  <path d="M 360 84 L 360 102" class="arrow" marker-end="url(#ah)"/>

  <!-- Step 2 -->
  <rect x="200" y="104" width="320" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="360" y="122" text-anchor="middle" class="label" fill="#4ecdc4">2. get_next_batch_to_run</text>
  <text x="360" y="137" text-anchor="middle" class="mod">SchedulePolicy.calc_priority · PrefillAdder 准入</text>
  <path d="M 360 148 L 360 166" class="arrow" marker-end="url(#ah)"/>

  <!-- Step 3: GPU forward -->
  <rect x="200" y="168" width="320" height="44" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="360" y="186" text-anchor="middle" class="label" fill="#f9ca24">3. run_batch (GPU forward)</text>
  <text x="360" y="201" text-anchor="middle" class="mod">TpModelWorker → ModelRunner.forward · sample</text>
  <path d="M 360 212 L 360 230" class="gpu" marker-end="url(#ahy)"/>

  <!-- Step 4: result_queue -->
  <rect x="200" y="232" width="320" height="40" rx="8" fill="#13162a" stroke="#5a6075" stroke-width="1.5"/>
  <text x="360" y="250" text-anchor="middle" class="label" fill="#5a6075">4. result_queue.append(batch.copy(), result)</text>
  <text x="360" y="265" text-anchor="middle" class="mod">延迟一步处理 · 张量隔离</text>
  <path d="M 360 272 L 360 290" class="arrow" marker-end="url(#ah)"/>

  <!-- Step 5: process prev result -->
  <rect x="200" y="292" width="320" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="360" y="310" text-anchor="middle" class="label" fill="#4ecdc4">5. process_batch_result (上一轮)</text>
  <text x="360" y="325" text-anchor="middle" class="mod">output_streamer → ZMQ → Detokenizer</text>

  <!-- Loop back arrow (left side) -->
  <path d="M 200 314 L 150 314 L 150 62 L 200 62" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <text x="140" y="190" class="dtype" transform="rotate(-90 140 190)">next iteration</text>

  <!-- Overlap annotations on the right -->
  <rect x="540" y="168" width="150" height="44" rx="8" fill="none" stroke="#f9ca24" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="615" y="186" text-anchor="middle" class="mod" fill="#f9ca24">GPU forward 启动</text>
  <text x="615" y="201" text-anchor="middle" class="mod" fill="#f9ca24">非阻塞</text>

  <rect x="540" y="292" width="150" height="44" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="615" y="310" text-anchor="middle" class="mod" fill="#4ecdc4">CPU 处理上一轮</text>
  <text x="615" y="325" text-anchor="middle" class="mod" fill="#4ecdc4">与 GPU 并行</text>

  <line x1="615" y1="212" x2="615" y2="292" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="625" y="255" class="dtype">overlap</text>

  <!-- mem_cache side (left, aligned with step 2) -->
  <rect x="20" y="104" width="150" height="44" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="95" y="122" text-anchor="middle" class="label" fill="#ff6b9d">mem_cache</text>
  <text x="95" y="137" text-anchor="middle" class="mod">match_prefix · insert</text>
  <path d="M 200 126 L 170 126" class="arrow" marker-end="url(#ah)" opacity="0.4"/>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahy" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f9ca24"/>
    </marker>
  </defs>
</svg>