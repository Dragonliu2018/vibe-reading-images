<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <rect width="820" height="500" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .gpu { stroke: #f9ca24; stroke-width: 1.5; fill: none; }
    .dtype { font-family: system-ui, sans-serif; font-size: 10px; fill: #5a6885; font-style: italic; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <text x="410" y="24" text-anchor="middle" fill="#8892a8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Scheduler event_loop_overlap — CPU/GPU 双流重叠</text>

  <!-- Step 1: recv + process -->
  <rect x="250" y="45" width="320" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="67" text-anchor="middle" class="label" fill="#4ecdc4">1. recv_requests · process_input_requests</text>
  <text x="410" y="83" text-anchor="middle" class="mod">ZMQ PULL → waiting_queue.append(req)</text>
  <path d="M 410 95 L 410 120" class="arrow" marker-end="url(#ah)"/>

  <!-- Step 2: get_next_batch -->
  <rect x="230" y="122" width="360" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="144" text-anchor="middle" class="label" fill="#4ecdc4">2. get_next_batch_to_run</text>
  <text x="410" y="160" text-anchor="middle" class="mod">SchedulePolicy.calc_priority · PrefillAdder 准入</text>
  <path d="M 410 172 L 410 197" class="arrow" marker-end="url(#ah)"/>

  <!-- Step 3: run_batch (GPU) -->
  <rect x="230" y="199" width="360" height="50" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="410" y="221" text-anchor="middle" class="label" fill="#f9ca24">3. run_batch (GPU forward)</text>
  <text x="410" y="237" text-anchor="middle" class="mod">TpModelWorker → ModelRunner.forward · sample</text>
  <path d="M 410 249 L 410 274" class="gpu" marker-end="url(#ahy)"/>

  <!-- Step 4: result_queue (暂存) -->
  <rect x="230" y="276" width="360" height="45" rx="8" fill="#13162a" stroke="#5a6075" stroke-width="1.5"/>
  <text x="410" y="295" text-anchor="middle" class="label" fill="#5a6075">4. result_queue.append(batch.copy(), result)</text>
  <text x="410" y="311" text-anchor="middle" class="mod">延迟一步处理 · batch.copy() 张量隔离</text>
  <path d="M 410 321 L 410 346" class="arrow" marker-end="url(#ah)"/>

  <!-- Step 5: process prev result (overlap) -->
  <rect x="230" y="348" width="360" height="50" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="410" y="370" text-anchor="middle" class="label" fill="#4ecdc4">5. process_batch_result (上一轮)</text>
  <text x="410" y="386" text-anchor="middle" class="mod">output_streamer → ZMQ → Detokenizer</text>
  <path d="M 230 373 L 170 373 L 170 70 L 250 70" class="arrow" marker-end="url(#ah)" opacity="0.6"/>
  <text x="175" y="220" class="dtype" transform="rotate(-90 175 220)">next iteration</text>

  <!-- overlap annotation: GPU side -->
  <rect x="610" y="199" width="190" height="50" rx="8" fill="none" stroke="#f9ca24" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="705" y="221" text-anchor="middle" class="mod" fill="#f9ca24">GPU forward 启动</text>
  <text x="705" y="237" text-anchor="middle" class="mod" fill="#f9ca24">非阻塞</text>

  <!-- overlap annotation: CPU side -->
  <rect x="610" y="348" width="190" height="50" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="705" y="370" text-anchor="middle" class="mod" fill="#4ecdc4">CPU 处理上一轮</text>
  <text x="705" y="386" text-anchor="middle" class="mod" fill="#4ecdc4">与 GPU 并行</text>

  <!-- overlap bracket line -->
  <line x1="705" y1="249" x2="705" y2="348" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="715" y="300" class="dtype">overlap</text>

  <!-- mem_cache side box -->
  <rect x="20" y="199" width="170" height="50" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="105" y="221" text-anchor="middle" class="label" fill="#ff6b9d">mem_cache</text>
  <text x="105" y="237" text-anchor="middle" class="mod">match_prefix · insert · evict</text>
  <path d="M 230 147 L 190 199 L 190 224" class="arrow" marker-end="url(#ah)" opacity="0.5"/>
  <text x="195" y="175" class="lbl">prefix match</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahy" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f9ca24"/>
    </marker>
  </defs>
</svg>