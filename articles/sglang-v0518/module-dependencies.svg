<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
  <rect width="760" height="470" fill="#0b0d14"/>
  <style>
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .mod { font-family: system-ui, sans-serif; font-size: 10px; fill: #a0aec0; }
    .arrow { stroke: #363b62; stroke-width: 1.5; fill: none; }
    .ipc { stroke: #ff6b9d; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .lbl { font-family: system-ui, sans-serif; font-size: 10px; fill: #7a85a3; }
  </style>

  <!-- Top row: Client → entrypoints → managers → speculative -->

  <!-- Client -->
  <rect x="20" y="40" width="120" height="50" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="80" y="60" text-anchor="middle" class="label" fill="#6c8ef5">Client</text>
  <text x="80" y="76" text-anchor="middle" class="mod">HTTP / OpenAI SDK</text>

  <!-- entrypoints -->
  <rect x="180" y="35" width="160" height="60" rx="8" fill="#13162a" stroke="#6c8ef5" stroke-width="1.5"/>
  <text x="260" y="55" text-anchor="middle" class="label" fill="#6c8ef5">entrypoints</text>
  <text x="260" y="71" text-anchor="middle" class="mod">Engine · HTTP Server</text>
  <text x="260" y="84" text-anchor="middle" class="mod">OpenAI/Anthropic API</text>

  <!-- managers -->
  <rect x="380" y="35" width="170" height="60" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="465" y="55" text-anchor="middle" class="label" fill="#4ecdc4">managers</text>
  <text x="465" y="71" text-anchor="middle" class="mod">Scheduler</text>
  <text x="465" y="84" text-anchor="middle" class="mod">TokenizerManager</text>

  <!-- speculative (top right) -->
  <rect x="590" y="35" width="150" height="60" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="665" y="55" text-anchor="middle" class="label" fill="#ff6b9d">speculative</text>
  <text x="665" y="71" text-anchor="middle" class="mod">EAGLE · DFlash</text>
  <text x="665" y="84" text-anchor="middle" class="mod">n-gram · spec_registry</text>

  <!-- Top row arrows -->
  <path d="M 140 65 L 180 65" class="arrow" marker-end="url(#ah)"/>
  <text x="160" y="58" text-anchor="middle" class="lbl">HTTP</text>

  <path d="M 340 65 L 380 65" class="ipc" marker-end="url(#ahp)"/>
  <text x="360" y="58" text-anchor="middle" class="lbl">ZMQ</text>

  <path d="M 550 65 L 590 65" class="ipc" marker-end="url(#ahp)"/>
  <text x="570" y="58" text-anchor="middle" class="lbl">draft→verify</text>

  <!-- Middle row: model_executor (center) -->

  <!-- model_executor -->
  <rect x="300" y="170" width="170" height="60" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.5"/>
  <text x="385" y="190" text-anchor="middle" class="label" fill="#f9ca24">model_executor</text>
  <text x="385" y="206" text-anchor="middle" class="mod">ModelRunner · ForwardBatch</text>
  <text x="385" y="219" text-anchor="middle" class="mod">CUDA Graph</text>

  <!-- managers → model_executor -->
  <path d="M 465 95 L 465 135 L 385 170" class="arrow" marker-end="url(#ah)"/>
  <text x="475" y="135" class="lbl">forward</text>

  <!-- speculative → model_executor (verify) -->
  <path d="M 665 95 L 665 135 L 470 170" class="arrow" marker-end="url(#ah)"/>
  <text x="580" y="135" class="lbl">verify forward</text>

  <!-- Bottom row: mem_cache (center) + models+layers (right) -->

  <!-- mem_cache -->
  <rect x="300" y="290" width="170" height="60" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.5"/>
  <text x="385" y="310" text-anchor="middle" class="label" fill="#ff6b9d">mem_cache</text>
  <text x="385" y="326" text-anchor="middle" class="mod">RadixCache</text>
  <text x="385" y="339" text-anchor="middle" class="mod">MemoryPool · Allocator</text>

  <!-- models + layers -->
  <rect x="540" y="290" width="180" height="60" rx="8" fill="#13162a" stroke="#b388ff" stroke-width="1.5"/>
  <text x="630" y="310" text-anchor="middle" class="label" fill="#b388ff">models + layers</text>
  <text x="630" y="326" text-anchor="middle" class="mod">Attention · MoE · Quant</text>
  <text x="630" y="339" text-anchor="middle" class="mod">model.forward</text>

  <!-- model_executor → mem_cache -->
  <path d="M 385 230 L 385 290" class="arrow" marker-end="url(#ah)"/>
  <text x="395" y="264" class="lbl">KV 读写</text>

  <!-- model_executor → models+layers -->
  <path d="M 470 200 L 630 290" class="arrow" marker-end="url(#ah)"/>
  <text x="555" y="240" class="lbl">model.forward</text>

  <!-- managers → mem_cache (prefix match) - left side vertical -->
  <path d="M 380 95 L 380 150 L 300 320" class="arrow" marker-end="url(#ah)" opacity="0.6"/>
  <text x="295" y="210" text-anchor="end" class="lbl">prefix match</text>

  <!-- speculative → mem_cache (draft KV) - right side -->
  <path d="M 665 95 L 665 250 L 470 320" class="ipc" marker-end="url(#ahp)" opacity="0.7"/>
  <text x="610" y="270" class="lbl">draft KV</text>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#363b62"/>
    </marker>
    <marker id="ahp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b9d"/>
    </marker>
  </defs>
</svg>