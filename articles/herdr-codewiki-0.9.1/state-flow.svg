<svg xmlns="http://www.w3.org/2000/svg" width="920" height="316" viewBox="0 0 920 316">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
    <marker id="arrowback" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="316" fill="#0b0d14"/>

  <!-- 机器 A：Agent 状态机 -->
  <text x="227" y="40" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Agent 状态机 · TerminalState 仲裁</text>
  <rect x="165" y="58" width="110" height="44" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="220" y="85" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Unknown</text>
  <rect x="30" y="170" width="105" height="44" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="82" y="197" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Idle</text>
  <rect x="175" y="170" width="105" height="44" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="227" y="197" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Working</text>
  <rect x="320" y="170" width="105" height="44" rx="8" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="372" y="197" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Blocked</text>

  <path d="M180,102 L108,170" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M220,102 L220,170" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M260,102 L332,170" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M135,192 L175,192" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrowback)"/>
  <path d="M280,192 L320,192" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrowback)"/>
  <path d="M82,214 C 82,258 372,258 372,214" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrowback)" opacity="0.75"/>
  <path d="M400,192 L445,192 L445,80 L275,80" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="72" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">进程退出</text>
  <text x="227" y="292" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">三源仲裁：进程探测 · 屏幕 manifest · hook 权威（hook 优先）</text>

  <!-- 机器 B：Endpoint 连接状态机 -->
  <text x="687" y="40" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Endpoint 连接状态机 · supervisor</text>
  <rect x="555" y="58" width="130" height="44" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="620" y="85" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Connected</text>
  <rect x="530" y="170" width="160" height="54" rx="8" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="610" y="192" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Reconnecting</text>
  <text x="610" y="210" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">指数退避 500ms → 120s</text>
  <rect x="740" y="170" width="140" height="54" rx="8" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="810" y="192" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Attention</text>
  <text x="810" y="210" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">停止自动重试</text>

  <path d="M580,102 L580,170" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="125" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">断连 / 超时</text>
  <path d="M655,170 L655,102" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="647" y="152" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">connect_once 成功</text>
  <path d="M690,197 L740,197" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="715" y="158" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">需人工干预</text>
  <path d="M810,224 L810,258 L610,258 L610,224" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="710" y="278" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">用户修复后重新连接（--remote / machine add）</text>
</svg>
