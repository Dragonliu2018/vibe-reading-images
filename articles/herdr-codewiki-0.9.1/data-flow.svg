<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="400" fill="#0b0d14"/>

  <text x="115" y="42" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">client 进程</text>
  <text x="690" y="42" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">server 进程（headless）</text>

  <!-- 顶行：输入路径 -->
  <rect x="30" y="80" width="170" height="64" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="115" y="108" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">stdin 字节 → 分帧</text>
  <text x="115" y="128" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">client/input.rs</text>
  <rect x="225" y="80" width="205" height="64" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="327" y="105" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">TerminalKey 解码</text>
  <text x="327" y="124" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">+ keybinding 路由</text>
  <text x="327" y="138" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">input/parse.rs</text>
  <rect x="490" y="80" width="180" height="64" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="580" y="108" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">重编码 VT 字节</text>
  <text x="580" y="128" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">server/pane_input.rs</text>
  <rect x="700" y="80" width="190" height="64" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="795" y="108" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">PTY Actor 写入</text>
  <text x="795" y="128" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">pty/actor/unix.rs</text>

  <!-- 中行：server 渲染 -->
  <rect x="490" y="195" width="180" height="60" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="580" y="219" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="middle">脏源合并 + delta 渲染</text>
  <text x="580" y="239" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">server/render_stream.rs</text>

  <!-- 底行：输出路径 -->
  <rect x="700" y="300" width="190" height="64" rx="6" fill="#13162a" stroke="#80c7ff" stroke-width="1.2"/>
  <text x="795" y="328" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">agent / shell 子进程</text>
  <text x="795" y="348" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">portable-pty</text>
  <rect x="490" y="300" width="180" height="64" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="580" y="328" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">终端仿真 cell 网格</text>
  <text x="580" y="348" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">ghostty/ · libghostty-vt</text>
  <rect x="225" y="300" width="205" height="64" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="327" y="325" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">还原 delta + 合成 chrome</text>
  <text x="327" y="344" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">（sidebar / tab bar）</text>
  <text x="327" y="358" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">surface_reuse.rs · compose</text>
  <rect x="30" y="300" width="170" height="64" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="115" y="328" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">ANSI 差分贴帧</text>
  <text x="115" y="348" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">protocol/render_ansi.rs</text>

  <!-- 箭头：输入路径 -->
  <path d="M200,112 L225,112" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M430,112 L490,112" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M670,112 L700,112" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M795,144 L795,300" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 箭头：子进程输出 → 仿真 → 渲染 -->
  <path d="M700,332 L670,332" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M580,300 L580,255" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 箭头：帧回流 client -->
  <path d="M490,225 L460,225 L460,332 L430,332" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M225,332 L200,332" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 跨 socket 标签 -->
  <text x="460" y="165" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">herdr-client.sock · ClientShellPaneInput（语义键）</text>
  <text x="470" y="285" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">PaneSurfacePatch（delta）</text>
  <text x="735" y="230" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">PTY 写入 / 输出</text>
</svg>
