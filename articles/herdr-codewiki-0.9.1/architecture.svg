  <text x="140" y="467" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">pane.rs · pane/</text>
  <rect x="256" y="426" width="200" height="54" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
