  <rect x="20" y="388" width="668" height="106" rx="8" fill="none" stroke="#ff6b9d" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
  <text x="36" y="412" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="14" font-weight="600">终端运行时层 · 每个 pane 一份</text>
  <rect x="40" y="426" width="200" height="54" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
