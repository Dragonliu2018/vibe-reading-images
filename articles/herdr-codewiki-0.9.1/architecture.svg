  <text x="115" y="95" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">client/</text>
  <rect x="202" y="54" width="150" height="54" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="277" y="76" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">CLI 子命令</text>
  <text x="277" y="95" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">cli/ · ipc.rs</text>
  <rect x="364" y="54" width="150" height="54" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
