  <text x="356" y="467" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">ghostty/ + libghostty-vt</text>
  <rect x="472" y="426" width="200" height="54" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="572" y="448" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">PTY Actor</text>
  <text x="572" y="467" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">pty/（专用线程）</text>

  <!-- 支撑层 -->
  <rect x="20" y="512" width="668" height="86" rx="8" fill="none" stroke="#b388ff" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
  <text x="36" y="534" fill="#b388ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">支撑层</text>
  <rect x="40" y="544" width="150" height="44" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="115" y="562" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="middle">Agent 检测与集成</text>
  <text x="115" y="579" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">detect/ · integration/</text>
  <rect x="202" y="544" width="150" height="44" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="277" y="562" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="middle">会话持久化</text>
  <text x="277" y="579" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">persist/ · session.rs</text>
  <rect x="364" y="544" width="150" height="44" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="439" y="562" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="middle">输入解码</text>
  <text x="439" y="579" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">input/ · raw_input.rs</text>
  <rect x="526" y="544" width="150" height="44" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="601" y="562" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="middle">配置与平台</text>
  <text x="601" y="579" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">config/ · platform/</text>

  <!-- 依赖方向箭头（右侧空白区） -->
  <text x="760" y="40" fill="#8892b0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">依赖方向</text>
  <text x="760" y="57" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">上层依赖下层</text>
  <path d="M760,72 L760,560" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
