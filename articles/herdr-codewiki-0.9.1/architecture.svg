  <text x="194" y="219" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">protocol/（herdr-client.sock）</text>
  <rect x="368" y="178" width="308" height="54" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
