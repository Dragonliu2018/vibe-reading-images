<svg xmlns="http://www.w3.org/2000/svg" width="820" height="616" viewBox="0 0 820 616">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="616" fill="#0b0d14"/>

  <!-- 接入层 -->
  <rect x="20" y="16" width="668" height="106" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
