  <text x="601" y="95" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">remote/ · endpoint/</text>

  <!-- 协议层 -->
  <rect x="20" y="140" width="668" height="106" rx="8" fill="none" stroke="#6c8ef5" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
