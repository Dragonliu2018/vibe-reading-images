  <text x="140" y="343" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">server/</text>
  <rect x="256" y="302" width="200" height="54" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
