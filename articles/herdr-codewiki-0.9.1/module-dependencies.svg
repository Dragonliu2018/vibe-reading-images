<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86b3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="580" fill="#0b0d14"/>

  <!-- 列标题 -->
  <text x="120" y="60" fill="#4ecdc4" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">客户端进程</text>
  <text x="340" y="60" fill="#6c8ef5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">协议</text>
  <text x="560" y="60" fill="#f9ca24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">server · 编排</text>
  <text x="780" y="60" fill="#ff6b9d" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">server · 终端</text>

  <!-- C1 客户端进程 -->
  <rect x="40" y="90" width="160" height="64" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="120" y="118" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">TUI 瘦客户端</text>
  <text x="120" y="138" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">client/</text>
  <rect x="40" y="230" width="160" height="64" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="120" y="258" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">远程联邦</text>
  <text x="120" y="278" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">remote/ · endpoint/</text>
  <rect x="40" y="350" width="160" height="64" rx="6" fill="#13162a" stroke="#4ecdc4" stroke-width="1.2"/>
  <text x="120" y="378" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">CLI 子命令</text>
  <text x="120" y="398" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">cli/ · ipc.rs</text>

  <!-- C2 协议 -->
  <rect x="260" y="90" width="160" height="64" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="340" y="118" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">wire 协议</text>
  <text x="340" y="138" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">protocol/</text>
  <rect x="260" y="230" width="160" height="64" rx="6" fill="#13162a" stroke="#6c8ef5" stroke-width="1.2"/>
  <text x="340" y="258" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Socket API</text>
  <text x="340" y="278" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">api/ · schema</text>

  <!-- C3 server 编排 -->
  <rect x="480" y="90" width="160" height="64" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="560" y="118" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">HeadlessServer</text>
  <text x="560" y="138" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">server/</text>
  <rect x="480" y="230" width="160" height="64" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="560" y="258" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">App 状态机</text>
  <text x="560" y="278" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">app/</text>
  <rect x="480" y="370" width="160" height="64" rx="6" fill="#13162a" stroke="#f9ca24" stroke-width="1.2"/>
  <text x="560" y="398" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">工作区与布局</text>
  <text x="560" y="418" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">workspace/ · layout.rs</text>

  <!-- C4 server 终端 -->
  <rect x="700" y="90" width="160" height="64" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="780" y="118" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">终端仿真</text>
  <text x="780" y="138" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">terminal/ · ghostty/ · pty/</text>
  <rect x="700" y="230" width="160" height="64" rx="6" fill="#13162a" stroke="#ff6b9d" stroke-width="1.2"/>
  <text x="780" y="258" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Pane 运行时</text>
  <text x="780" y="278" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">pane.rs · pane/</text>

  <!-- 底部支撑行 -->
  <rect x="40" y="470" width="160" height="64" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="120" y="498" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">会话持久化</text>
  <text x="120" y="518" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">persist/ · session.rs</text>
  <rect x="480" y="470" width="160" height="64" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="560" y="498" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">输入解码</text>
  <text x="560" y="518" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">input/ · raw_input.rs</text>
  <rect x="700" y="470" width="160" height="64" rx="6" fill="#13162a" stroke="#b388ff" stroke-width="1.2"/>
  <text x="780" y="498" fill="#e6e9f5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">检测与集成</text>
  <text x="780" y="518" fill="#8892b0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">detect/ · integration/</text>

  <!-- 箭头 -->
  <path d="M200,122 L260,122" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M120,154 L120,230" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M200,262 L330,154" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M200,382 L330,294" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M480,122 L420,122" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M420,262 L480,262" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,154 L560,230" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560,294 L560,370" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M640,262 L700,262" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M640,402 L700,262" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M780,230 L780,154" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M780,294 L780,470" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M710,294 L640,502" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M480,294 L120,470" fill="none" stroke="#7a86b3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 图例 -->
  <text x="880" y="566" fill="#8892b0" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">箭头方向 = import / 调用方向（源 → 目标）；客户端与 server 经 socket 通信，进程内共享同一二进制</text>
</svg>
